          } else if (this.coinPool.length < this.coinPoolLimit) {
            this.coinPool.push(body);
          }
        }
      }

      // Gestiona add el cuerpo dentro del flujo principal del juego.
      addBody(body) {
        body.isRemoved = false;
        this.updateBodyGravityProfile(body);
        this.bodies.push(body);

        if (body.kind === "asteroid") {
          this.asteroidBodies.push(body);
        } else if (body.kind === "planet") {
          this.planetBodies.push(body);
        } else if (body.kind === "scrap") {
          this.scrapBodies.push(body);
        }

        this.gridIsFresh = false;
        this.gravityGridIsFresh = false;

        if (this.onBodyAdded) {
          this.onBodyAdded(body);
        }

        return body;
      }

      // Gestiona remove el cuerpo dentro del flujo principal del juego.
      removeBody(body) {
        if (!body || body.isRemoved) return;

        if (typeof body.onRemoved === "function") {
          body.onRemoved();
        }

        body.isRemoved = true;
        this.hasRemovedBodies = true;
        this.gridIsFresh = false;
        this.gravityGridIsFresh = false;

        if (this.onBodyRemoved) {
          this.onBodyRemoved(body);
        }
      }

      // Gestiona cleanup removed bodies dentro del flujo principal del juego.
      cleanupRemovedBodies() {
        if (!this.hasRemovedBodies) return;

        const removedBodies = [];
        const compact = (list, collectRemoved = false) => {
          let writeIndex = 0;

          for (let readIndex = 0; readIndex < list.length; readIndex++) {
            const body = list[readIndex];
            if (body.isRemoved) {
              if (collectRemoved) {
                removedBodies.push(body);
              }
              continue;
            }
            list[writeIndex++] = body;
          }

          list.length = writeIndex;
        };

        compact(this.bodies, true);
        compact(this.asteroidBodies);
        compact(this.planetBodies);
        compact(this.scrapBodies);

        let gravityWriteIndex = 0;
        for (let gravityReadIndex = 0; gravityReadIndex < this.gravitySourceBodies.length; gravityReadIndex++) {
          const body = this.gravitySourceBodies[gravityReadIndex];
          if (body.isRemoved || !body._canExertGravity) {
            body._isGravitySourceListed = false;
            continue;
          }
          body._isGravitySourceListed = true;
          this.gravitySourceBodies[gravityWriteIndex++] = body;
        }
        this.gravitySourceBodies.length = gravityWriteIndex;

        for (let i = 0; i < removedBodies.length; i++) {
          this.recycleBody(removedBodies[i]);
        }

        this.hasRemovedBodies = false;
      }

      // Indica si la grid de colisiones actual necesita reconstruirse antes de otra consulta.
      ensureFreshGrid() {
        if (!this.gridIsFresh) {
          this.rebuildGrid();
        }
      }

      // Indica si la grid usada por la gravedad necesita reconstruirse antes de aplicarla.
      ensureFreshGravityGrid() {
        if (!this.gravityGridIsFresh) {
          this.rebuildGravityGrid();
        }
      }

      // Reconstruye la grid principal de colisiones a partir del estado actual de los cuerpos.
      rebuildGrid() {
        this.grid.clear();

        for (let i = 0; i < this.bodies.length; i++) {
          const body = this.bodies[i];
          if (body.isRemoved) continue;
          this.grid.insert(body);
        }

        this.gridIsFresh = true;
      }

      // Reconstruye la grid auxiliar centrada usada para consultas de gravedad.
      rebuildGravityGrid() {
        this.gravityGrid.clear();

        for (let i = 0; i < this.bodies.length; i++) {
          const body = this.bodies[i];
          if (body.isRemoved || !body.receivesGravity) continue;
          this.gravityGrid.insertByCenter(body);
        }

        this.gravityGridIsFresh = true;
      }

      // Gestiona cull transient bodies dentro del flujo principal del juego.
      cullTransientBodies() {
        for (let i = 0; i < this.bodies.length; i++) {
          const body = this.bodies[i];
          if (body.isRemoved || !body.shouldDespawn) continue;
          this.removeBody(body);
        }
      }

      // Actualiza el mercader rescue state usando el estado actual y los parametros recibidos.
      updateMerchantRescueState(player) {
        this.merchantRescueStationId = null;

        if (!player || player.isRemoved || !player.isAlive || !this.grid) {
          return;
        }

        const rescueFuelThreshold = this.merchantRescueFuelThreshold ?? 0.001;
        if (player.fuel > rescueFuelThreshold) {
          return;
        }

        let nearestStation = null;
        let bestDistSq = Infinity;
        const rescueRadius = this.merchantRescueRadius;
        const rescueRadiusSq = rescueRadius * rescueRadius;
        const stamp = this.gravityQueryStamp++;

        this.grid.forEachNearbyUnique(player.x, player.y, rescueRadius, stamp, (body) => {
          if (body.isRemoved || body.kind !== "station" || !body.isAlive) return;
          if (factionSystem.getDisposition(player.faction, body.faction) === "enemy") return;

          const distSq = distanceSquared(body.x, body.y, player.x, player.y);
          if (distSq > rescueRadiusSq || distSq >= bestDistSq) return;

          nearestStation = body;
          bestDistSq = distSq;
        });

        this.merchantRescueStationId = nearestStation?.id ?? null;
      }

      // Aplica la gravedad de las fuentes validas a los cuerpos afectados del mundo.
      applyGravity(dt) {
        if (!(dt > 0) || this.gravitySourceBodies.length === 0) {
          return;
        }

        const rows = this.gravityGrid.rows;
        const cellSize = this.gravityGrid.cellSize;
        const contactEpsilon = 0.5;

        for (let sourceIndex = 0; sourceIndex < this.gravitySourceBodies.length; sourceIndex++) {
          const source = this.gravitySourceBodies[sourceIndex];
          if (source.isRemoved || !source._canExertGravity) continue;

          const range = source.gravityRange;
          if (!(range > 0)) continue;

          const rangeSq = source.gravityRangeSq;
          const sourceX = source.x;
          const sourceY = source.y;
          const sourceContactRadius = source.colliderRadius + contactEpsilon;
          const strengthDt = source.gravityStrength * dt;
          const minCellX = Math.floor((sourceX - range) / cellSize);
          const maxCellX = Math.floor((sourceX + range) / cellSize);
          const minCellY = Math.floor((sourceY - range) / cellSize);
          const maxCellY = Math.floor((sourceY + range) / cellSize);

          for (let cy = minCellY; cy <= maxCellY; cy++) {
            const row = rows.get(cy);
            if (!row) continue;

            const cellMinY = cy * cellSize;
            const cellMaxY = cellMinY + cellSize;
            const nearestY = sourceY < cellMinY ? cellMinY : (sourceY > cellMaxY ? cellMaxY : sourceY);
            const dyToCell = sourceY - nearestY;
            const dyToCellSq = dyToCell * dyToCell;
            if (dyToCellSq > rangeSq) continue;

            for (let cx = minCellX; cx <= maxCellX; cx++) {
              const cellMinX = cx * cellSize;
              const cellMaxX = cellMinX + cellSize;
              const nearestX = sourceX < cellMinX ? cellMinX : (sourceX > cellMaxX ? cellMaxX : sourceX);
              const dxToCell = sourceX - nearestX;
              if (dxToCell * dxToCell + dyToCellSq > rangeSq) continue;

              const bucket = row.get(cx);
              if (!bucket) continue;

              for (let i = 0; i < bucket.length; i++) {
                const target = bucket[i];
                if (target === source || target.isRemoved) {
                  continue;
                }

                const dx = sourceX - target.x;
                const dy = sourceY - target.y;
                const distSq = dx * dx + dy * dy;
                if (distSq < 0.0001 || distSq > rangeSq) continue;

                const minDistance = sourceContactRadius + target.colliderRadius;
                if (distSq <= minDistance * minDistance) continue;

                const invDistance = 1 / Math.sqrt(distSq);
                const gravityFactor = (strengthDt * invDistance) / distSq;
                target.vx += dx * gravityFactor;
                target.vy += dy * gravityFactor;
              }
            }
          }
        }
      }

      // Gestiona resolve collisions dentro del flujo principal del juego.
      resolveCollisions() {
        let resolvedCount = 0;

        this.grid.forEachCollisionPair((a, b) => {
          if (a.isRemoved || b.isRemoved || a.isCollisionDisabled || b.isCollisionDisabled) return;

          if (this.resolveCircleCollision(a, b)) {
            resolvedCount++;
          }
        });

        return resolvedCount;
      }

      // Aplica las colisiones damage dentro de esta parte de la logica.
      applyCollisionDamage(ship, impactSpeed, threshold) {
        if (!ship || ship.isRemoved || !ship.isAlive) return;
        if (ship === playerShip && testCheats.isPlayerInvincible()) return;
        if (!(impactSpeed > threshold)) return;

        const excessSpeed = impactSpeed - threshold;
        const damage = Math.round(excessSpeed * this.collisionDamageFactor);
        if (!(damage > 0)) return;

        const cooldownWindow = 0.12;
        const alreadyCounted = ship.collisionDamageCooldown > 0 && impactSpeed <= ship.lastCollisionDamageSpeed + 0.5;
        if (alreadyCounted) return;

        ship.collisionDamageCooldown = cooldownWindow;
        ship.lastCollisionDamageSpeed = impactSpeed;
        this.damageBody(ship, damage, null);
      }

      // Devuelve la nave explosion visual scale calculado a partir del estado y los parametros recibidos.
      getShipExplosionVisualScale(ship) {
        const referenceRadius = 18;
        const shipRadius = Math.max(4, ship?.radius ?? referenceRadius);
        return clamp(Math.pow(shipRadius / referenceRadius, 0.55), 0.68, 1.38);
      }

      // Resuelve la destruccion completa de una nave y sus efectos secundarios.
      destroyShip(ship) {
        if (!ship || !ship.isAlive) return;

        const explosionScale = this.getShipExplosionVisualScale(ship);
        const explosionColor = ship.color ?? '#ffffff';

        ship.isAlive = false;
        ship.color = "#ff6666";
        ship.angularVelocity = 0;
        ship.refuelTimer = 0;

        const explosionSpeed = Math.max(34, Math.hypot(ship.vx, ship.vy) * 0.24 + 52) * (0.94 + explosionScale * 0.1);
        const explosionSpeedVariance = Math.max(20, (ship.radius ?? 12) * 1.55) * (0.92 + explosionScale * 0.12);
        const minimumExplosionSpeed = Math.max(18, explosionSpeed - explosionSpeedVariance);
        const explosionIgnoreDuration = Math.max(0.18, ((ship.radius ?? 12) + 2 + Math.max(0, (ship.radius ?? 12) * 0.22)) / minimumExplosionSpeed);

        this.particles?.emitExplosion({
          x: ship.x,
          y: ship.y,
          count: clamp(Math.round((ship.mass ?? 0) * 1.25 * explosionScale), 18, 140),
          minLifetime: 0.56,
          maxLifetime: 1.8,
          color: explosionColor,
          colorVariance: 18,
          speed: explosionSpeed,
          speedVariance: explosionSpeedVariance,
          baseVX: ship.vx ?? 0,
          baseVY: ship.vy ?? 0,
          radiusMin: Math.max(2.4, 3.8 * explosionScale),
          radiusMax: Math.max(5.6, Math.min(18.5, (Math.max(7.2, Math.min(14.5, (ship.radius ?? 12) * 0.52))) * explosionScale)),
          ignoreBodyId: ship.id,
          ignoreDuration: explosionIgnoreDuration
        });

        this.spawnScrapFragments(ship, Math.max(32, Math.hypot(ship.vx, ship.vy) * 0.22 + 28), clamp(Math.round((ship.mass ?? 0) / 3.8), 2, 12));

        if (ship.kind === "carrier" && typeof ship.handleCarrierDestroyed === "function") {
          ship.handleCarrierDestroyed();
          this.spawnBlueCoinBurst(ship, randomInt(1, 3));
        }

        if (ship.kind === "flea") {
          this.addBody(this.acquireCoinBody({
            x: ship.x,
            y: ship.y,
            vx: ship.vx + randomBetween(-14, 14),
            vy: ship.vy + randomBetween(-14, 14),
            angle: randomBetween(0, Math.PI * 2),
            angularVelocity: randomBetween(-2.5, 2.5),
            radius: 4.8,
            colliderRadius: 5.8,
            mass: 0.035,
            value: 1,
            isProcedural: false,
            isFieldBody: false
          }));
        }

        if (ship.kind === "wasp" || ship.kind === "dragonfly") {
          const isLargeHull = ship.hullClass === "large";
          const dropCount = ship.kind === "wasp"
            ? (isLargeHull ? randomInt(5, 8) : randomInt(2, 4))
            : (isLargeHull ? randomInt(7, 11) : randomInt(3, 5));
          for (let i = 0; i < dropCount; i++) {
            this.addBody(this.acquireCoinBody({
              x: ship.x + randomBetween(-ship.radius * 0.45, ship.radius * 0.45),
              y: ship.y + randomBetween(-ship.radius * 0.45, ship.radius * 0.45),
              vx: ship.vx + randomBetween(-36, 36),
              vy: ship.vy + randomBetween(-36, 36),
              angle: randomBetween(0, Math.PI * 2),
              angularVelocity: randomBetween(-4, 4),
              radius: isLargeHull ? 5.4 : 4.8,
              colliderRadius: isLargeHull ? 6.4 : 5.8,
              mass: isLargeHull ? 0.045 : 0.035,
              value: 1,
              isProcedural: false,
              isFieldBody: false
            }));
          }
        }

        if (ship.kind === "tarantula") {
          this.spawnBlueCoinBurst(ship, 1);
        }

        if (ship.kind === "ship") {
          this.isGameOver = true;
          return;
        }

        this.removeBody(ship);
      }

      // Gestiona damage el cuerpo dentro del flujo principal del juego.
      damageBody(body, amount, projectile = null) {
        if (!body || body.isRemoved || !(amount > 0)) return;
        if (body === playerShip && testCheats.isPlayerInvincible()) return;
        body.timeSinceLastDamage = 0;
        body.hp = Math.max(0, body.hp - amount);

        if (body.kind === "station" && projectile && projectile.faction && projectile.faction !== body.faction) {
          factionSystem.addRelation(projectile.faction, body.faction, -5);

          const sourceDistance = Math.hypot((projectile.originX ?? projectile.x) - body.x, (projectile.originY ?? projectile.y) - body.y);
          if (sourceDistance > body.weaponRange && typeof body.registerLongRangeHit === "function") {
            body.registerLongRangeHit(projectile);
          }
        }

        if ((body.kind === "wasp" || body.kind === "dragonfly") && projectile && projectile.faction && projectile.faction !== body.faction) {
          applyFactionHitConsequences(projectile.faction, body.faction, amount);
        }

        if (body.kind === "miner" && projectile && projectile.faction && projectile.faction !== body.faction) {
          factionSystem.addRelation(projectile.faction, body.faction, -6);

          const sourceDistance = Math.hypot((projectile.originX ?? projectile.x) - body.x, (projectile.originY ?? projectile.y) - body.y);
          if (sourceDistance > body.weaponRange && typeof body.registerLongRangeHit === "function") {
            body.registerLongRangeHit(projectile);
          }
        }

        if ((body.kind === "carrier" || body.kind === "interceptor") && projectile && projectile.faction && projectile.faction !== body.faction) {
          factionSystem.addRelation(projectile.faction, body.faction, body.kind === "carrier" ? -8 : -4);

          const sourceDistance = Math.hypot((projectile.originX ?? projectile.x) - body.x, (projectile.originY ?? projectile.y) - body.y);
          if (sourceDistance > (body.weaponRange ?? 0) && typeof body.registerLongRangeHit === "function") {
            body.registerLongRangeHit(projectile);
          }
        }

        if (body.kind === "tarantula" && projectile && projectile.faction && projectile.faction !== body.faction) {
          factionSystem.addRelation(projectile.faction, body.faction, -10);
        }

        if (body.hp <= 0) {
          if (body.kind === "scrap") {
            this.destroyScrap(body, projectile);
            return;
          }

          if (isShipLike(body)) {
            this.destroyShip(body);
          }
        }
      }

      resolveDirectionalVector(source, fallbackAngle = randomBetween(0, Math.PI * 2)) {
        if (source) {
          const vx = source.x ?? source.vx ?? 0;
          const vy = source.y ?? source.vy ?? 0;
          const speed = Math.hypot(vx, vy);

          if (speed > 0.0001) {
            return {
              x: vx / speed,
              y: vy / speed,
              angle: Math.atan2(vy, vx)
            };
          }

          if (typeof source.angle === "number") {
            return {
              x: Math.cos(source.angle),
              y: Math.sin(source.angle),
              angle: source.angle
            };
          }
        }

        return {
          x: Math.cos(fallbackAngle),
          y: Math.sin(fallbackAngle),
          angle: fallbackAngle
        };
      }

      // Devuelve el asteroide max subdivision count calculado a partir del estado y los parametros recibidos.
      getAsteroidMaxSubdivisionCount(radius) {
        if (!(radius > 0) || !(this.minAsteroidFragmentRadius > 0)) {
          return 0;
        }

        return Math.floor((radius * radius) / (this.minAsteroidFragmentRadius * this.minAsteroidFragmentRadius));
      }

      // Devuelve el asteroide fragment count calculado a partir del estado y los parametros recibidos.
      getAsteroidFragmentCount(radius, requestedSubdivisionCount) {
        const desiredCount = Math.max(2, Math.round(requestedSubdivisionCount));
        const maxAllowedCount = this.getAsteroidMaxSubdivisionCount(radius);

        if (maxAllowedCount < 2) {
          return 0;
        }

        return Math.min(desiredCount, maxAllowedCount);
      }

      // Devuelve el asteroide fragment radius calculado a partir del estado y los parametros recibidos.
      getAsteroidFragmentRadius(radius, subdivisionCount) {
        if (!(subdivisionCount > 0)) {
          return 0;
        }

        return radius / Math.sqrt(subdivisionCount);
      }

      // Devuelve el asteroide subdivision angles calculado a partir del estado y los parametros recibidos.
      getAsteroidSubdivisionAngles(fragmentCount, divisionAngle) {
        if (fragmentCount <= 1) {
          return [divisionAngle];
        }

        const totalArc = Math.min(
          Math.PI * 1.5,
          Math.max(Math.PI * 0.6, (fragmentCount - 1) * (Math.PI / 7.5))
        );
        const angleStep = totalArc / (fragmentCount - 1);
        const startAngle = divisionAngle - totalArc * 0.5;
        const angles = [];

        for (let i = 0; i < fragmentCount; i++) {
          angles.push(startAngle + angleStep * i);
        }

        return angles;
      }

      breakAsteroid(asteroid, {
        subdivisionCount = 2,
        ejectionSpeed = 0,
        divisionVector = null,
        coinSource = null,
        dropCoins = true
      } = {}) {
        if (!asteroid || asteroid.isRemoved) {
          return [];
        }

        const fragmentCount = this.getAsteroidFragmentCount(asteroid.radius, subdivisionCount);
        this.removeBody(asteroid);

        if (fragmentCount < 2) {
          this.emitAsteroidTerminalBreakParticles(asteroid, divisionVector);
          if (dropCoins) {
            this.spawnCoinFromAsteroid(asteroid, coinSource ?? divisionVector);
          }
          return [];
        }

        const childRadius = this.getAsteroidFragmentRadius(asteroid.radius, fragmentCount);
        if (childRadius < this.minAsteroidFragmentRadius) {
          this.emitAsteroidTerminalBreakParticles(asteroid, divisionVector);
          if (dropCoins) {
            this.spawnCoinFromAsteroid(asteroid, coinSource ?? divisionVector);
          }
          return [];
        }

        const direction = this.resolveDirectionalVector(divisionVector, asteroid.angle);
        const angles = this.getAsteroidSubdivisionAngles(fragmentCount, direction.angle);
        const density = asteroid.mass / Math.max(1, asteroid.radius * asteroid.radius);
        const childMass = Math.max(0.6, density * childRadius * childRadius);
        const childHp = getAsteroidMaxHpFromRadius(childRadius);
        const separationRadius = Math.max(
          childRadius * 1.15,
          childRadius / Math.max(0.16, Math.sin(Math.PI / fragmentCount))
        );
        const fragments = [];

        for (let i = 0; i < angles.length; i++) {
          const angle = angles[i];
          const dirX = Math.cos(angle);
          const dirY = Math.sin(angle);
          const offsetJitter = childRadius * 0.08;

          const childAsteroid = this.acquireAsteroidBody({
            x: asteroid.x + dirX * separationRadius + randomBetween(-offsetJitter, offsetJitter),
            y: asteroid.y + dirY * separationRadius + randomBetween(-offsetJitter, offsetJitter),
            vx: asteroid.vx + dirX * ejectionSpeed,
            vy: asteroid.vy + dirY * ejectionSpeed,
            radius: childRadius,
            mass: childMass,
            angle: randomBetween(0, Math.PI * 2),
            angularVelocity: asteroid.angularVelocity + randomBetween(-1.6, 1.6),
            color: asteroid.color,
            bounciness: 0.0,
            isProcedural: asteroid.isProcedural,
            isFieldBody: asteroid.isFieldBody,
            kind: "asteroid",
            hp: childHp,
            maxHp: childHp
          });
          this.addBody(childAsteroid);
          fragments.push(childAsteroid);
        }

        return fragments;
      }

      // Gestiona emit el asteroide terminal break particles dentro del flujo principal del juego.
      emitAsteroidTerminalBreakParticles(asteroid, source = null) {
        if (!asteroid) {
          return;
        }

        const direction = this.resolveDirectionalVector(source, asteroid.angle);
        const asteroidSpeed = Math.hypot(asteroid.vx ?? 0, asteroid.vy ?? 0);

        this.particles?.emitExplosion({
          x: asteroid.x,
          y: asteroid.y,
          count: clamp(Math.round((asteroid.radius ?? 0) * 1.35), 8, 22),
          minLifetime: 0.3,
          maxLifetime: 0.95,
          color: asteroid.color ?? '#c8c8c8',
          colorVariance: 20,
          speed: Math.max(20, asteroidSpeed * 0.18 + 24),
          speedVariance: Math.max(10, (asteroid.radius ?? 0) * 0.8),
          baseVX: (asteroid.vx ?? 0) + direction.x * 4,
          baseVY: (asteroid.vy ?? 0) + direction.y * 4,
          radiusMin: 1.8,
          radiusMax: Math.max(3.4, Math.min(6.8, (asteroid.radius ?? 0) * 0.42)),
          ignoreBodyId: asteroid.id,
          ignoreDuration: 0.05
        });
      }

      // Genera el objetivo de monedas from el asteroide usando la configuracion y el contexto actuales.
      spawnCoinFromAsteroid(asteroid, source = null) {
        const direction = this.resolveDirectionalVector(source);
        const dirX = direction.x;
        const dirY = direction.y;
        const coinCount = randomInt(1, 5);

        for (let i = 0; i < coinCount; i++) {
          const perpX = -dirY;
          const perpY = dirX;
          const lateralKick = randomBetween(-28, 28);
          const forwardKick = randomBetween(-8, 12);
          const coinRadius = clamp(asteroid.radius * 0.22, 4.2, 6.2);
          const coinMass = Math.min(
            Math.max(0.018, asteroid.mass * 0.0022),
            asteroid.mass * 0.08,
            0.05
          );

          this.addBody(this.acquireCoinBody({
            x: asteroid.x + perpX * randomBetween(-asteroid.radius * 0.25, asteroid.radius * 0.25),
            y: asteroid.y + perpY * randomBetween(-asteroid.radius * 0.25, asteroid.radius * 0.25),
            vx: asteroid.vx + perpX * lateralKick + dirX * forwardKick,
            vy: asteroid.vy + perpY * lateralKick + dirY * forwardKick,
            angle: randomBetween(0, Math.PI * 2),
            angularVelocity: randomBetween(-3.5, 3.5),
            radius: coinRadius,
            colliderRadius: coinRadius + 1,
            mass: coinMass,
            value: 1,
            isProcedural: false,
            isFieldBody: false
          }));
        }
      }

      // Genera el objetivo de monedas from el objetivo de chatarra usando la configuracion y el contexto actuales.
      spawnCoinFromScrap(scrap, source = null) {
        const direction = this.resolveDirectionalVector(source, scrap.angle);
        const perpX = -direction.y;
        const perpY = direction.x;

        this.addBody(this.acquireCoinBody({
          x: scrap.x + perpX * randomBetween(-scrap.radius * 0.25, scrap.radius * 0.25),
          y: scrap.y + perpY * randomBetween(-scrap.radius * 0.25, scrap.radius * 0.25),
          vx: scrap.vx + direction.x * randomBetween(8, 20) + perpX * randomBetween(-14, 14),
          vy: scrap.vy + direction.y * randomBetween(8, 20) + perpY * randomBetween(-14, 14),
          angle: randomBetween(0, Math.PI * 2),
          angularVelocity: randomBetween(-3.2, 3.2),
          radius: 4.6,
          colliderRadius: 5.6,
          mass: 0.03,
          value: 1,
          isProcedural: false,
          isFieldBody: false
        }));
      }

      // Genera blue el objetivo de monedas burst usando la configuracion y el contexto actuales.
      spawnBlueCoinBurst(source, count = 1) {
        if (!source || !(count > 0)) {
          return 0;
        }

        for (let i = 0; i < count; i++) {
          this.addBody(this.acquireBlueCoinBody({
            x: source.x + randomBetween(-(source.radius ?? 10) * 0.4, (source.radius ?? 10) * 0.4),
            y: source.y + randomBetween(-(source.radius ?? 10) * 0.4, (source.radius ?? 10) * 0.4),
            vx: (source.vx ?? 0) + randomBetween(-36, 36),
            vy: (source.vy ?? 0) + randomBetween(-36, 36),
            angle: randomBetween(0, Math.PI * 2),
            angularVelocity: randomBetween(-3.8, 3.8),
            isProcedural: false,
            isFieldBody: false
          }));
        }

        return count;
      }

      // Genera el objetivo de chatarra fragments usando la configuracion y el contexto actuales.
      spawnScrapFragments(source, ejectionSpeed = 0, fragmentCount = 1) {
        if (!source || !(fragmentCount > 0)) {
          return 0;
        }

        const count = Math.max(1, Math.round(fragmentCount));
        const baseDirection = this.resolveDirectionalVector(source, source.angle ?? 0);
        const baseAngle = baseDirection.angle + randomBetween(-0.18, 0.18);
        const procedural = !!source.isProcedural;
        const fieldBody = !!source.isFieldBody;

        for (let i = 0; i < count; i++) {
          const angle = baseAngle + (i / count) * Math.PI * 2 + randomBetween(-0.34, 0.34);
          const dirX = Math.cos(angle);
          const dirY = Math.sin(angle);
          const speed = ejectionSpeed * randomBetween(0.72, 1.18);
          const spawnRadius = Math.max(4, (source.radius ?? 12) * 0.28);

          this.addBody(new ScrapBody({
            x: source.x + dirX * randomBetween(0, spawnRadius),
            y: source.y + dirY * randomBetween(0, spawnRadius),
            vx: (source.vx ?? 0) + dirX * speed,
            vy: (source.vy ?? 0) + dirY * speed,
            angle: randomBetween(0, Math.PI * 2),
            angularVelocity: randomBetween(-4.5, 4.5),
            color: source.color ?? "#b9bccb",
            accentColor: "rgba(255,255,255,0.3)",
            shapeIndex: randomInt(0, 3),
            hp: randomInt(1, 5),
            maxHp: 5,
            isProcedural: procedural,
            isFieldBody: fieldBody
          }));
        }

        return count;
      }

      // Gestiona destroy el objetivo de chatarra dentro del flujo principal del juego.
      destroyScrap(scrap, source = null) {
        if (!scrap || scrap.isRemoved) return;
        this.removeBody(scrap);
        this.spawnCoinFromScrap(scrap, source);
      }

      // Gestiona collect el objetivo de chatarra dentro del flujo principal del juego.
      collectScrap(ship, scrap) {
        if (!ship || !ship.isAlive || !scrap || scrap.isRemoved) return;
        this.removeBody(scrap);
        if (ship.kind === "dragonfly" || ship.kind === "tarantula") {
          ship.hp = Math.min(ship.maxHp, ship.hp + 5);
        }
      }

      // Gestiona collect el objetivo de monedas dentro del flujo principal del juego.
      collectCoin(ship, coin) {
        if (!ship.isAlive) return;
        const value = Math.max(1, coin.value ?? 1);
        this.removeBody(coin);
        ship.credits += value;
        if (typeof ship.onCoinCollected === "function") {
          ship.onCoinCollected(value, coin);
        }
        if (ship.kind === "tarantula") {
          ship.hp = Math.min(ship.maxHp, ship.hp + value * 15);
        }
      }

      // Actualiza la nave el objetivo de monedas pickup usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      updateShipCoinPickup(dt) {
        if (!this.grid) {
          return;
        }

        for (let i = 0; i < this.bodies.length; i++) {
          const ship = this.bodies[i];
          if (ship.isRemoved || !isShipLike(ship) || !ship.isAlive) {
            continue;
          }

          const shipReach = ship.colliderRadius ?? ship.radius ?? 0;
          if (!(shipReach > 0)) {
            continue;
          }

          const stamp = this.gravityQueryStamp++;
          this.grid.forEachNearbyUnique(ship.x, ship.y, shipReach + 8, stamp, (coin) => {
            if (coin.isRemoved || coin.kind !== "coin") return;

            const reach = shipReach + (coin.colliderRadius ?? coin.radius ?? 0);
            const distSq = distanceSquared(ship.x, ship.y, coin.x, coin.y);

            if (distSq <= reach * reach) {
              this.collectCoin(ship, coin);
            }
          });
        }
      }

      // Gestiona la evasion de proyectiles el asteroide impact dentro del flujo principal del juego.
      handleProjectileAsteroidImpact(projectile, asteroid) {
        if (!projectile || projectile.isRemoved || projectile.hasImpacted) return;
        projectile.hasImpacted = true;
        projectile.isCollisionDisabled = true;
        this.removeBody(projectile);

        if (asteroid.isRemoved) return;

        this.damageBody(asteroid, projectile.damage ?? 1, projectile);
        if (asteroid.hp > 0 || asteroid.isRemoved) {
          return;
        }

        const projectileDirection = this.resolveDirectionalVector(projectile, projectile.angle);
        const requestedSubdivisionCount = randomInt(
          this.projectileAsteroidMinSubdivisions,
          this.projectileAsteroidMaxSubdivisions
        );

        this.breakAsteroid(asteroid, {
          subdivisionCount: requestedSubdivisionCount,
          ejectionSpeed: this.defaultAsteroidProjectileEjectionSpeed,
          divisionVector: {
            x: -projectileDirection.x,
            y: -projectileDirection.y
          },
          coinSource: projectile
        });
      }

      // Devuelve el asteroide las colisiones explosion chance calculado a partir del estado y los parametros recibidos.
      getAsteroidCollisionExplosionChance(impactSpeed) {
        const excessSpeed = impactSpeed - this.asteroidCollisionExplosionMinSpeed;
        if (!(excessSpeed > 0)) {
          return 0;
        }

        return clamp(
          excessSpeed * this.asteroidCollisionExplosionChancePerSpeed,
          0,
          1
        );
      }

      // Devuelve el asteroide las colisiones subdivision count calculado a partir del estado y los parametros recibidos.
      getAsteroidCollisionSubdivisionCount(radius) {
        const radiusT = clamp((radius - 13) / (40 - 13), 0, 1);
        const requestedCount = Math.round(
          lerp(
            this.asteroidCollisionMinSubdivisionCount,
            this.asteroidCollisionMaxSubdivisionCount,
            radiusT
          )
        );

        return clamp(
          requestedCount,
          this.asteroidCollisionMinSubdivisionCount,
          this.asteroidCollisionMaxSubdivisionCount
        );
      }

      // Devuelve el cuerpo linear momentum calculado a partir del estado y los parametros recibidos.
      getBodyLinearMomentum(body) {
        if (!body) {
          return { x: 0, y: 0 };
        }

        return {
          x: (body.mass ?? 0) * (body.vx ?? 0),
          y: (body.mass ?? 0) * (body.vy ?? 0)
        };
      }

      // Devuelve bodies linear momentum calculado a partir del estado y los parametros recibidos.
      getBodiesLinearMomentum(bodies) {
        let totalX = 0;
        let totalY = 0;

        if (!Array.isArray(bodies)) {
          return { x: 0, y: 0 };
        }

        for (let i = 0; i < bodies.length; i++) {
          const body = bodies[i];
          if (!body || body.isRemoved) {
            continue;
          }

          totalX += (body.mass ?? 0) * (body.vx ?? 0);
          totalY += (body.mass ?? 0) * (body.vy ?? 0);
        }

        return { x: totalX, y: totalY };
      }

      // Aplica linear momentum to el cuerpo dentro de esta parte de la logica.
      applyLinearMomentumToBody(body, momentumX, momentumY) {
        if (!body || body.isRemoved || !(body.mass > 0)) {
          return false;
        }

        body.vx += momentumX / body.mass;
        body.vy += momentumY / body.mass;
        return true;
      }

      // Gestiona explode el asteroide from las colisiones detailed dentro del flujo principal del juego.
      explodeAsteroidFromCollisionDetailed(asteroid, collider, impactSpeed, fallbackNormal = null, dropCoins = false) {
        if (!asteroid || asteroid.isRemoved || asteroid.kind !== "asteroid") {
          return {
            exploded: false,
            fragments: [],
            transferredMomentumX: 0,
            transferredMomentumY: 0
          };
        }

        const explosionChance = this.getAsteroidCollisionExplosionChance(impactSpeed);
        if (!(explosionChance > 0) || Math.random() >= explosionChance) {
          return {
            exploded: false,
            fragments: [],
            transferredMomentumX: 0,
            transferredMomentumY: 0
          };
        }

        const relativeVelocityX = asteroid.vx - (collider?.vx ?? 0);
        const relativeVelocityY = asteroid.vy - (collider?.vy ?? 0);
        let divisionVector = {
          x: -relativeVelocityX,
          y: -relativeVelocityY
        };

        if (Math.hypot(divisionVector.x, divisionVector.y) < 0.001 && fallbackNormal) {
          divisionVector = {
            x: fallbackNormal.x,
            y: fallbackNormal.y
          };
        }

        const originalMomentum = this.getBodyLinearMomentum(asteroid);
        const fragments = this.breakAsteroid(asteroid, {
          subdivisionCount: this.getAsteroidCollisionSubdivisionCount(asteroid.radius),
          ejectionSpeed: impactSpeed * randomBetween(
            this.asteroidCollisionMinEjectionFactor,
            this.asteroidCollisionMaxEjectionFactor
          ),
          divisionVector,
          coinSource: divisionVector,
          dropCoins
        });
        const fragmentMomentum = this.getBodiesLinearMomentum(fragments);

        return {
          exploded: true,
          fragments,
          transferredMomentumX: originalMomentum.x - fragmentMomentum.x,
          transferredMomentumY: originalMomentum.y - fragmentMomentum.y
        };
      }

      // Gestiona try explode el asteroide from las colisiones dentro del flujo principal del juego.
      tryExplodeAsteroidFromCollision(asteroid, collider, impactSpeed, fallbackNormal = null, dropCoins = false) {
        return this.explodeAsteroidFromCollisionDetailed(
          asteroid,
          collider,
          impactSpeed,
          fallbackNormal,
          dropCoins
        ).exploded;
      }

      // Devuelve el planeta las colisiones el asteroide count calculado a partir del estado y los parametros recibidos.
      getPlanetCollisionAsteroidCount(planetA, planetB) {
        const combinedRadius = (planetA?.radius ?? 0) + (planetB?.radius ?? 0);
        const radiusT = clamp((combinedRadius - 520) / (2400 - 520), 0, 1);
        const requestedCount = Math.round(lerp(
          this.planetCollisionMinAsteroidCount,
          this.planetCollisionMaxAsteroidCount,
          radiusT
        ));

        return clamp(
          requestedCount,
          this.planetCollisionMinAsteroidCount,
          this.planetCollisionMaxAsteroidCount
        );
      }

      buildExplosionFragments(totalArea, totalMass, fragmentCount, {
        minRadius = this.minAsteroidFragmentRadius,
        sizeVariance = 0
      } = {}) {
        const count = Math.max(0, Math.floor(fragmentCount));
        if (count < 1) {
          return [];
        }

        const variance = Math.max(0, sizeVariance);
        const weights = [];
        let totalWeight = 0;

        for (let i = 0; i < count; i++) {
          let weight = 1;
          if (variance > 0.0001) {
            const raw = 1 + randomBetween(-variance, variance);
            const minWeight = Math.max(0.18, 1 - variance * 0.92);
            const maxWeight = Math.max(minWeight + 0.05, 1 + variance * 1.08);
            weight = clamp(raw, minWeight, maxWeight);
          }
          weights.push(weight);
          totalWeight += weight;
        }

        return weights.map((weight) => {
          const share = totalWeight > 0 ? weight / totalWeight : 1 / count;
          const area = Math.max(1, totalArea * share);
          const radius = Math.max(minRadius, Math.sqrt(area));
          return {
            radius,
            mass: Math.max(12, totalMass * share),
            areaShare: share
          };
        }).sort((a, b) => b.radius - a.radius);
      }

      // Selecciona el planeta explosion source el planeta dentro de esta parte de la logica.
      choosePlanetExplosionSourcePlanet(sourcePlanets, centerX, centerY, angle) {
        if (!Array.isArray(sourcePlanets) || sourcePlanets.length === 0) {
          return null;
        }

        if (sourcePlanets.length === 1) {
          return sourcePlanets[0];
        }

        let bestPlanet = sourcePlanets[0];
        let bestScore = -Infinity;
        for (const planet of sourcePlanets) {
          const directionToPlanet = Math.atan2(planet.y - centerY, planet.x - centerX);
          const alignment = Math.cos(wrapAngle(angle - directionToPlanet));
          const sizeBias = (planet.radius ?? 0) * 0.00018;
          const score = alignment + sizeBias + randomBetween(-0.18, 0.18);
          if (score > bestScore) {
            bestScore = score;
            bestPlanet = planet;
          }
        }
        return bestPlanet;
      }

      // Gestiona sample el planeta explosion spawn dentro del flujo principal del juego.
      samplePlanetExplosionSpawn(sourcePlanet, fragmentRadius, preferredAngle) {
        const sourceAngle = preferredAngle + randomBetween(-0.95, 0.95);
        const maxInteriorOffset = Math.max(fragmentRadius * 1.08, sourcePlanet.radius - fragmentRadius * 1.08);
        const radialFactor = Math.sqrt(Math.random()) * randomBetween(0.18, 0.96);
        const interiorOffset = clamp(
          maxInteriorOffset * radialFactor,
          fragmentRadius * 0.7,
          maxInteriorOffset
        );
        return {
          x: sourcePlanet.x + Math.cos(sourceAngle) * interiorOffset,
          y: sourcePlanet.y + Math.sin(sourceAngle) * interiorOffset
        };
      }

      // Gestiona assign el planeta explosion fragments to sources dentro del flujo principal del juego.
      assignPlanetExplosionFragmentsToSources(sourcePlanets, fragments) {
        const targets = sourcePlanets.map((planet) => Math.max(1, planet.radius * planet.radius));
        const totalTarget = targets.reduce((sum, value) => sum + value, 0) || 1;
        const totalFragmentArea = fragments.reduce((sum, fragment) => sum + fragment.radius * fragment.radius, 0) || 1;
        const areaBudgets = targets.map((value) => totalFragmentArea * (value / totalTarget));
        const assignedAreas = sourcePlanets.map(() => 0);
        return fragments.map((fragment) => {
          let bestIndex = 0;
          let bestScore = Infinity;
          const fragmentArea = fragment.radius * fragment.radius;
          for (let i = 0; i < sourcePlanets.length; i++) {
            const planet = sourcePlanets[i];
            const budget = Math.max(fragmentArea, areaBudgets[i]);
            const fillScore = assignedAreas[i] / budget;
            const sizePenalty = fragment.radius > planet.radius * 0.58 ? 4 : 0;
            const score = fillScore + sizePenalty + i * 0.015;
            if (score < bestScore) {
              bestScore = score;
              bestIndex = i;
            }
          }
          assignedAreas[bestIndex] += fragmentArea;
          return sourcePlanets[bestIndex];
        });
      }

      // Gestiona sample packed el planeta explosion spawn dentro del flujo principal del juego.
      samplePackedPlanetExplosionSpawn(sourcePlanet, fragmentRadius, preferredAngle, existingPlacements) {
        const usableRadius = Math.max(fragmentRadius * 1.15, sourcePlanet.radius - fragmentRadius * 1.08);
        const placements = Array.isArray(existingPlacements) ? existingPlacements : [];
        let bestCandidate = null;
        let bestScore = -Infinity;
        const attemptCount = 56;

        for (let attempt = 0; attempt < attemptCount; attempt++) {
          const angleJitter = attempt < 18 ? randomBetween(-1.2, 1.2) : randomBetween(-Math.PI, Math.PI);
          const angle = preferredAngle + angleJitter;
          const radialBias = attempt < 18 ? randomBetween(0.08, 0.94) : Math.sqrt(Math.random());
          const radius = usableRadius * radialBias;
          const x = sourcePlanet.x + Math.cos(angle) * radius;
          const y = sourcePlanet.y + Math.sin(angle) * radius;

          let minClearance = usableRadius - radius;
          for (const placement of placements) {
            const dx = x - placement.x;
            const dy = y - placement.y;
            const clearance = Math.hypot(dx, dy) - (fragmentRadius + placement.radius) * 1.05;
            if (clearance < minClearance) {
              minClearance = clearance;
            }
          }

          const directionBonus = Math.cos(wrapAngle(angle - preferredAngle)) * usableRadius * 0.14;
          const score = minClearance + directionBonus;
          if (score > bestScore) {
            bestScore = score;
            bestCandidate = { x, y };
          }
          if (minClearance >= 0) {
            return { x, y };
          }
        }

        if (bestCandidate) {
          return bestCandidate;
        }

        const fallbackRadius = clamp(usableRadius * 0.32, fragmentRadius * 0.5, usableRadius);
        return {
          x: sourcePlanet.x + Math.cos(preferredAngle) * fallbackRadius,
          y: sourcePlanet.y + Math.sin(preferredAngle) * fallbackRadius
        };
      }

      // Gestiona explode planets into asteroids dentro del flujo principal del juego.
      explodePlanetsIntoAsteroids(planetA, planetB, impactSpeed, fallbackNormal = null) {
        if (!planetA || !planetB || planetA.isRemoved || planetB.isRemoved) {
          return false;
        }

        const totalMass = Math.max(1, planetA.mass + planetB.mass);
        const totalArea = Math.max(1, planetA.radius * planetA.radius + planetB.radius * planetB.radius);
        const fragmentCount = this.getPlanetCollisionAsteroidCount(planetA, planetB);
        const generatedArea = totalArea * this.planetCollisionAsteroidAreaFraction;
        const generatedMass = totalMass * this.planetCollisionAsteroidMassFraction;
        const centerX = (planetA.x * planetA.mass + planetB.x * planetB.mass) / totalMass;
        const centerY = (planetA.y * planetA.mass + planetB.y * planetB.mass) / totalMass;

        let divisionVector = {
          x: planetA.vx - planetB.vx,
          y: planetA.vy - planetB.vy
        };

        if (Math.hypot(divisionVector.x, divisionVector.y) < 0.001 && fallbackNormal) {
          divisionVector = {
            x: fallbackNormal.x,
            y: fallbackNormal.y
          };
        }

        const direction = this.resolveDirectionalVector(divisionVector);
        const fragments = this.buildExplosionFragments(generatedArea, generatedMass, fragmentCount, {
          minRadius: this.minAsteroidFragmentRadius * 1.55,
          sizeVariance: this.planetCollisionAsteroidSizeVariance
        });
        const largestRadius = fragments[0]?.radius ?? this.minAsteroidFragmentRadius;
        const combinedPlanetRadius = Math.sqrt(totalArea);
        const escapeReferenceRadius = Math.max(combinedPlanetRadius * 0.62, largestRadius * 2.6);
        const escapeSpeed = Math.sqrt((2 * this.G * generatedMass) / Math.max(escapeReferenceRadius, largestRadius * 2));
        const baseEjectionSpeed = Math.max(impactSpeed * 0.06, escapeSpeed * 0.18);
        const angleSeed = direction.angle + randomBetween(-0.24, 0.24);
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));
        const procedural = !!(planetA.isProcedural || planetB.isProcedural);
        const fieldBody = !!(planetA.isFieldBody || planetB.isFieldBody);
        const sourcePlanets = [planetA, planetB].sort((a, b) => (b.radius ?? 0) - (a.radius ?? 0));
        const fragmentSources = this.assignPlanetExplosionFragmentsToSources(sourcePlanets, fragments);
        const placements = new Map(sourcePlanets.map((planet) => [planet, []]));
        const globalPlacements = [];

        this.removeBody(planetA);
        this.removeBody(planetB);

        for (let i = 0; i < fragments.length; i++) {
          const fragment = fragments[i];
          const sourcePlanet = fragmentSources[i] ?? sourcePlanets[0];
          const planetPlacements = placements.get(sourcePlanet) ?? [];
          const angle = angleSeed + i * goldenAngle + randomBetween(-0.42, 0.42);
          const sourceDirection = Math.atan2(sourcePlanet.y - centerY, sourcePlanet.x - centerX);
          const preferredAngle = sourceDirection + wrapAngle(angle - angleSeed) * 0.55;
          const spawn = this.samplePackedPlanetExplosionSpawn(sourcePlanet, fragment.radius, preferredAngle, globalPlacements);
          const localOutward = this.resolveDirectionalVector({
            x: spawn.x - sourcePlanet.x,
            y: spawn.y - sourcePlanet.y
          }, preferredAngle);
          const outwardFromCenter = this.resolveDirectionalVector({
            x: spawn.x - centerX,
            y: spawn.y - centerY
          }, preferredAngle);
          const sourceVelocityDir = this.resolveDirectionalVector({
            x: sourcePlanet.vx,
            y: sourcePlanet.vy
          }, preferredAngle);
          const tangentSign = Math.sign(sourceVelocityDir.x * (-localOutward.y) + sourceVelocityDir.y * localOutward.x) || (Math.random() < 0.5 ? -1 : 1);
          const tangentialX = -localOutward.y * tangentSign;
          const tangentialY = localOutward.x * tangentSign;
          const outward = this.resolveDirectionalVector({
            x: localOutward.x * 1.18 + outwardFromCenter.x * 0.36 + tangentialX * randomBetween(0.06, 0.24) + sourceVelocityDir.x * 0.28,
            y: localOutward.y * 1.18 + outwardFromCenter.y * 0.36 + tangentialY * randomBetween(0.06, 0.24) + sourceVelocityDir.y * 0.28
          }, preferredAngle);
          const speed = baseEjectionSpeed * randomBetween(0.55, 0.95);
          const hp = getAsteroidMaxHpFromRadius(fragment.radius);

          planetPlacements.push({ x: spawn.x, y: spawn.y, radius: fragment.radius });
          placements.set(sourcePlanet, planetPlacements);
          globalPlacements.push({ x: spawn.x, y: spawn.y, radius: fragment.radius });

          this.addBody(this.acquireAsteroidBody({
            x: spawn.x,
            y: spawn.y,
            vx: sourcePlanet.vx + outward.x * speed,
            vy: sourcePlanet.vy + outward.y * speed,
            radius: fragment.radius,
            mass: fragment.mass,
            angle: randomBetween(0, Math.PI * 2),
            angularVelocity: randomBetween(-0.55, 0.55),
            color: randomColor({
              minSaturation: 55,
              maxSaturation: 100,
              minLightness: 45,
              maxLightness: 72
            }),
            bounciness: 0.0,
            isProcedural: procedural,
            isFieldBody: fieldBody,
            kind: "asteroid",
            hp,
            maxHp: hp
          }));
        }

        return true;
      }

      // Gestiona start el asteroide el planeta absorption dentro del flujo principal del juego.
      startAsteroidPlanetAbsorption(asteroid, planet) {
        if (!asteroid || asteroid.isRemoved || asteroid.kind !== "asteroid" || asteroid.absorptionState) {
          return false;
        }

        if (!planet || planet.isRemoved || planet.kind !== "planet") {
          return false;
        }

        const dx = asteroid.x - planet.x;
        const dy = asteroid.y - planet.y;
        const distance = Math.max(0.0001, Math.hypot(dx, dy));
        const startRadius = asteroid.radius;
        const startMass = Math.max(0, asteroid.mass);

        asteroid.absorptionState = {
          planet,
          elapsed: 0,
          duration: this.asteroidPlanetAbsorptionAnimationDuration,
          startDistance: distance,
          startAngle: Math.atan2(dy, dx),
          startRadius,
          startMass
        };
        asteroid.planetContactTimer = 0;
        asteroid.planetContactId = planet.id;
        asteroid.touchingPlanetCandidate = null;
        asteroid.touchingPlanetDistSq = Infinity;
        asteroid.vx = planet.vx;
        asteroid.vy = planet.vy;
        asteroid.angularVelocity *= 0.35;
        asteroid.exertsGravity = false;
        asteroid.receivesGravity = false;
        asteroid.isCollisionDisabled = true;
        asteroid.mass = 0;
        asteroid.colliderRadius = 0;
        asteroid.renderOpacity = 1;
        this.updateBodyGravityProfile(asteroid);

        if (typeof planet.absorbAsteroidMass === "function") {
          planet.absorbAsteroidMass(startMass, startRadius);
        } else {
          planet.mass += startMass;
        }
        this.updateBodyGravityProfile(planet);
        return true;
      }

      // Actualiza el asteroide el planeta absorption usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      updateAsteroidPlanetAbsorption(dt) {
        const asteroids = this.asteroidBodies;
        const planets = this.planetBodies;
        const padding = this.asteroidPlanetAbsorptionContactPadding;

        for (let i = 0; i < asteroids.length; i++) {
          const asteroid = asteroids[i];
          if (asteroid.isRemoved) continue;

          const state = asteroid.absorptionState;
          if (state) {
            const planet = state.planet;
            if (!planet || planet.isRemoved) {
              this.removeBody(asteroid);
              continue;
            }

            state.elapsed += dt;
            const t = clamp(state.elapsed / Math.max(0.0001, state.duration), 0, 1);
            const eased = 1 - Math.pow(1 - t, 3);
            const swirl = (1 - eased) * 0.18 * Math.sin(state.elapsed * 10 + asteroid.id * 0.37);
            const angle = state.startAngle + swirl;
            const targetDistance = Math.max(planet.radius * 0.14, planet.radius - state.startRadius * 0.3);
            const distance = lerp(state.startDistance, targetDistance, eased);

            asteroid.x = planet.x + Math.cos(angle) * distance;
            asteroid.y = planet.y + Math.sin(angle) * distance;
            asteroid.vx = planet.vx;
            asteroid.vy = planet.vy;
            asteroid.angle += (asteroid.angularVelocity + 2.6 * (1 - eased)) * dt;
            asteroid.radius = Math.max(0.2, lerp(state.startRadius, state.startRadius * 0.08, eased));
            asteroid.colliderRadius = 0;
            asteroid.renderOpacity = clamp(1 - eased * 0.94, 0.04, 1);

            if (t >= 1) {
              this.removeBody(asteroid);
            }
            continue;
          }

          let nearestPlanet = null;
          let nearestDistSq = Infinity;

          for (let j = 0; j < planets.length; j++) {
            const planet = planets[j];
            if (planet.isRemoved) continue;

            const contactRange = asteroid.radius + planet.radius + padding;
            const distSq = distanceSquared(asteroid.x, asteroid.y, planet.x, planet.y);
            if (distSq <= contactRange * contactRange && distSq < nearestDistSq) {
              nearestPlanet = planet;
              nearestDistSq = distSq;
            }
          }

          if (nearestPlanet) {
            if (asteroid.planetContactId === nearestPlanet.id) {
              asteroid.planetContactTimer = (asteroid.planetContactTimer ?? 0) + dt;
            } else {
              asteroid.planetContactId = nearestPlanet.id;
              asteroid.planetContactTimer = dt;
            }

            if (asteroid.planetContactTimer >= this.asteroidPlanetAbsorptionContactDelay) {
              this.startAsteroidPlanetAbsorption(asteroid, nearestPlanet);
            }
          } else {
            asteroid.planetContactTimer = 0;
            asteroid.planetContactId = 0;
          }
        }
      }

      // Gestiona special las colisiones dentro del flujo principal del juego.
      handleSpecialCollision(a, b) {
        if (a.kind === "coin" || b.kind === "coin") {
          const coin = a.kind === "coin" ? a : b;
          const other = a.kind === "coin" ? b : a;

          if (isShipLike(other)) {
            this.collectCoin(other, coin);
            return true;
          }
        }

        if (a.kind === "scrap" || b.kind === "scrap") {
          const scrap = a.kind === "scrap" ? a : b;
          const other = a.kind === "scrap" ? b : a;

          if (isShipLike(other) && isScrapCollectorShip(other)) {
            this.collectScrap(other, scrap);
            return true;
          }
        }

        if (a.kind === "interceptor" || b.kind === "interceptor") {
          const interceptor = a.kind === "interceptor" ? a : b;
          const other = a.kind === "interceptor" ? b : a;

          if (other.kind === "carrier" && interceptor.canDockWith?.(other)) {
            other.recoverInterceptor(interceptor);
            return true;
          }
        }

        const aIsProjectile = a.kind === "projectile";
        const bIsProjectile = b.kind === "projectile";

        if (!aIsProjectile && !bIsProjectile) {
          return false;
        }

        if (aIsProjectile && bIsProjectile) {
          return true;
        }

        const projectile = aIsProjectile ? a : b;
        const other = aIsProjectile ? b : a;

        if (projectile.isRemoved || projectile.hasImpacted) {
          return true;
        }

        if (other === projectile.owner) {
          return true;
        }

        if (other.kind === "asteroid") {
          this.handleProjectileAsteroidImpact(projectile, other);
          return true;
        }

        if (other.kind === "scrap") {
          this.removeBody(projectile);
          this.damageBody(other, projectile.damage ?? 1, projectile);
          return true;
        }

        if (isShipLike(other)) {
          this.removeBody(projectile);
          this.damageBody(other, projectile.damage ?? 1, projectile);
          return true;
        }

        if (other.kind === "planet") {
          this.removeBody(projectile);
          return true;
        }

        return true;
      }

      // Gestiona resolve circle las colisiones dentro del flujo principal del juego.
      resolveCircleCollision(a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const distSq = dx * dx + dy * dy;
        const minDist = a.colliderRadius + b.colliderRadius;

        if (distSq >= minDist * minDist) return false;

        if (this.handleSpecialCollision(a, b)) {
          return true;
        }

        let distance = Math.sqrt(distSq);
        let nx = 1;
        let ny = 0;

        if (distance > 0.000001) {
          nx = dx / distance;
          ny = dy / distance;
        } else {
          distance = 0;
        }

        const invMassA = a.inverseMass;
        const invMassB = b.inverseMass;
        const invMassSum = invMassA + invMassB;

        if (invMassSum <= 0) return false;

        const penetration = minDist - distance;
        const slop = 0.01;
        const percent = 0.85;
        const correctionMagnitude = Math.max(penetration - slop, 0) * percent / invMassSum;

        if (correctionMagnitude > 0) {
          a.x -= nx * correctionMagnitude * invMassA;
          a.y -= ny * correctionMagnitude * invMassA;
          b.x += nx * correctionMagnitude * invMassB;
          b.y += ny * correctionMagnitude * invMassB;
        }

        const rvx = b.vx - a.vx;
        const rvy = b.vy - a.vy;
        const velAlongNormal = rvx * nx + rvy * ny;
        const impactSpeed = -velAlongNormal;

        if (a.kind === "planet" && b.kind === "planet") {
          return this.explodePlanetsIntoAsteroids(a, b, impactSpeed, { x: -nx, y: -ny });
        }

        if (isShipLike(a) && (b.kind === "asteroid" || b.kind === "planet")) {
          const crashSpeedThreshold = a.getCrashSpeedThreshold
            ? a.getCrashSpeedThreshold(this.shipCrashSpeed)
            : this.shipCrashSpeed;

          this.applyCollisionDamage(a, impactSpeed, crashSpeedThreshold);
        }

        if (isShipLike(b) && (a.kind === "asteroid" || a.kind === "planet")) {
          const crashSpeedThreshold = b.getCrashSpeedThreshold
            ? b.getCrashSpeedThreshold(this.shipCrashSpeed)
            : this.shipCrashSpeed;

          this.applyCollisionDamage(b, impactSpeed, crashSpeedThreshold);
        }

        if (impactSpeed > this.asteroidCollisionExplosionMinSpeed) {
          let exploded = false;

          if (a.kind === "asteroid" && b.kind === "asteroid") {
            const massA = Math.max(0.0001, a.mass ?? 0);
            const massB = Math.max(0.0001, b.mass ?? 0);

            if (massA >= massB * 4) {
              const explosionB = this.explodeAsteroidFromCollisionDetailed(b, a, impactSpeed, { x: nx, y: ny }, false);
              exploded = explosionB.exploded || exploded;

              if (explosionB.exploded) {
                this.applyLinearMomentumToBody(a, explosionB.transferredMomentumX, explosionB.transferredMomentumY);
              }
            } else if (massB >= massA * 4) {
              const explosionA = this.explodeAsteroidFromCollisionDetailed(a, b, impactSpeed, { x: -nx, y: -ny }, false);
              exploded = explosionA.exploded || exploded;

              if (explosionA.exploded) {
                this.applyLinearMomentumToBody(b, explosionA.transferredMomentumX, explosionA.transferredMomentumY);
              }
            } else {
              const explosionA = this.explodeAsteroidFromCollisionDetailed(a, b, impactSpeed, { x: -nx, y: -ny }, false);
              const explosionB = this.explodeAsteroidFromCollisionDetailed(b, a, impactSpeed, { x: nx, y: ny }, false);
              exploded = explosionA.exploded || explosionB.exploded || exploded;

              if (explosionA.exploded && !explosionB.exploded) {
                this.applyLinearMomentumToBody(b, explosionA.transferredMomentumX, explosionA.transferredMomentumY);
              } else if (explosionB.exploded && !explosionA.exploded) {
                this.applyLinearMomentumToBody(a, explosionB.transferredMomentumX, explosionB.transferredMomentumY);
              }
            }
          } else {
            if (a.kind === "asteroid" && b.kind === "planet") {
              exploded = this.tryExplodeAsteroidFromCollision(a, b, impactSpeed, { x: -nx, y: -ny }, false) || exploded;
            }

            if (b.kind === "asteroid" && a.kind === "planet") {
              exploded = this.tryExplodeAsteroidFromCollision(b, a, impactSpeed, { x: nx, y: ny }, false) || exploded;
            }
          }

          if (exploded) {
            return true;
          }
        }

        if (velAlongNormal > 0) return true;

        const restitution = Math.min(a.bounciness, b.bounciness);
        const impulseMagnitude = -(1 + restitution) * velAlongNormal / invMassSum;

        const impulseX = impulseMagnitude * nx;
        const impulseY = impulseMagnitude * ny;

        a.vx -= impulseX * invMassA;
        a.vy -= impulseY * invMassA;
        b.vx += impulseX * invMassB;
        b.vy += impulseY * invMassB;

        const newRvx = b.vx - a.vx;
        const newRvy = b.vy - a.vy;
        const residualNormalSpeed = newRvx * nx + newRvy * ny;

        if (residualNormalSpeed < 0) {
          const cancelMagnitude = -residualNormalSpeed / invMassSum;
          const cancelX = cancelMagnitude * nx;
          const cancelY = cancelMagnitude * ny;

          a.vx -= cancelX * invMassA;
          a.vy -= cancelY * invMassA;
          b.vx += cancelX * invMassB;
          b.vy += cancelY * invMassB;
        }

        return true;
      }

      // Gestiona step dentro del flujo principal del juego. Usa dt como delta de tiempo del frame.
      step(dt) {
        this.cleanupRemovedBodies();
        this.ensureFreshGrid();
        this.ensureFreshGravityGrid();
        this.aiTickId += 1;
        this.updateMerchantRescueState(playerShip);
        this.applyGravity(dt);

        for (let i = 0; i < this.bodies.length; i++) {
          const body = this.bodies[i];
          if (body.isRemoved) continue;
          body.update(dt);
        }

        this.gridIsFresh = false;
        this.gravityGridIsFresh = false;
        this.cullTransientBodies();
        this.cleanupRemovedBodies();
        this.rebuildGrid();
        let collisions = this.resolveCollisions();

        for (let pass = 1; pass < this.maxCollisionPasses && collisions > 0; pass++) {
          this.gridIsFresh = false;
          this.cleanupRemovedBodies();
          this.rebuildGrid();
          collisions = this.resolveCollisions();
        }

        this.cleanupRemovedBodies();
        this.updateAsteroidPlanetAbsorption(dt);
        this.gridIsFresh = false;
        this.cleanupRemovedBodies();
        this.rebuildGrid();
        this.particles.update(dt);
      }

      // Actualiza el estado interno usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      update(dt) {
        this.lastMerchantRefusalTimer = Math.max(0, this.lastMerchantRefusalTimer - dt);
        let remaining = dt;

        while (remaining > 0 && !this.isGameOver) {
          const stepDt = Math.min(remaining, this.maxSubstep);
          this.step(stepDt);
          remaining -= stepDt;
        }

        this.cleanupRemovedBodies();
        this.ensureFreshGrid();
      }

      // Dibuja el estado interno en el contexto de render correspondiente.
      draw(ctx, camera, width, height) {
        const margin = 120;
        const left = camera.x - margin;
        const right = camera.x + width + margin;
        const top = camera.y - margin;
        const bottom = camera.y + height + margin;

        this.particles.draw(ctx, camera, width, height);

        for (let i = 0; i < this.bodies.length; i++) {
          const body = this.bodies[i];
          if (body.isRemoved) continue;

          if (
            body.x + body.radius < left ||
            body.x - body.radius > right ||
            body.y + body.radius < top ||
            body.y - body.radius > bottom
          ) {
            continue;
          }

          body.draw(ctx, camera);
        }
      }
    }

    class ProceduralField {
      // Inicializa la instancia de ProceduralField con las opciones y el estado base necesarios.
      constructor(world, player) {
        this.world = world;
        this.player = player;

        this.spawnRadius = 7200;
        this.despawnRadius = 8200;

        this.targetProceduralBodies = 138;
        this.maxProceduralBodies = 182;
        this.initialBodyCount = this.targetProceduralBodies;
        this.targetHostCount = 1;
        this.targetStationCount = 9;
        this.targetFleaCount = 32;
        this.targetWaspCount = 44;
        this.targetDragonflyCount = 16;
        this.targetMinerCount = 7;
        this.targetTarantulaCount = 2;
        this.targetCarrierCount = 2;
        this.merchantEscortPerStation = 2;
        this.merchantEscortSpawnCooldown = 0;
        this.merchantEscortSpawnInterval = 8.5;
        this.fleaSpawnCooldown = 0;
        this.fleaSpawnInterval = 9.5;
        this.waspSpawnCooldown = 0;
        this.waspSpawnInterval = 11.5;
        this.dragonflySpawnCooldown = 0;
        this.dragonflySpawnInterval = 14.5;
        this.minerSpawnCooldown = 0;
        this.minerSpawnInterval = 12.5;
        this.carrierSpawnCooldown = 0;
        this.carrierSpawnInterval = 26.0;
        this.tarantulaSpawnCooldown = 0;
        this.tarantulaSpawnInterval = 34.0;
        this.nextSchoolId = 1;
        this.spawnsEnabled = true;

        this.spawnStep = ((Math.PI * this.spawnRadius) / (2 * this.targetProceduralBodies)) * 0.75;
        this.maxSpawnPerFrame = 26;

        this.lastPlayerX = player.x;
        this.lastPlayerY = player.y;
        this.spawnAccumulator = 0;
        this.proceduralCount = 0;
        this.stationCount = 0;
        this.merchantEscortCount = 0;
        this.fleaCount = 0;
        this.waspCount = 0;
        this.dragonflyCount = 0;
        this.minerCount = 0;
        this.carrierCount = 0;
        this.tarantulaCount = 0;

        this.world.onBodyAdded = (body) => {
          if (body.isFieldBody) {
            this.proceduralCount++;
          }

          if (body.isFieldBody && body.kind === "station") {
            this.stationCount++;
          }

          if (body.isFieldBody && body.kind === "merchantEscort") {
            this.merchantEscortCount++;
          }

          if (body.isFieldBody && body.kind === "flea") {
            this.fleaCount++;
          }

          if (body.isFieldBody && body.kind === "wasp") {
            this.waspCount++;
          }

          if (body.isFieldBody && body.kind === "dragonfly") {
            this.dragonflyCount++;
          }

          if (body.isFieldBody && body.kind === "miner") {
            this.minerCount++;
          }

          if (body.isFieldBody && body.kind === "carrier") {
            this.carrierCount++;
          }

          if (body.isFieldBody && body.kind === "tarantula") {
            this.tarantulaCount++;
          }
        };

        this.world.onBodyRemoved = (body) => {
          if (body.isFieldBody) {
            this.proceduralCount = Math.max(0, this.proceduralCount - 1);
          }

          if (body.isFieldBody && body.kind === "station") {
            this.stationCount = Math.max(0, this.stationCount - 1);
          }

          if (body.isFieldBody && body.kind === "merchantEscort") {
            this.merchantEscortCount = Math.max(0, this.merchantEscortCount - 1);
          }

          if (body.isFieldBody && body.kind === "flea") {
            this.fleaCount = Math.max(0, this.fleaCount - 1);

          if (body.isFieldBody && body.kind === "dragonfly") {

          }

          if (body.isFieldBody && body.kind === "carrier") {
            this.carrierCount = Math.max(0, this.carrierCount - 1);

          if (body.isFieldBody && body.kind === "tarantula") {

          }
        };

      // Indica si place el cuerpo cumple la condicion esperada para esta logica.
      canPlaceBody(x, y, spec, extraGap = 0) {
        for (let i = 0; i < this.world.bodies.length; i++) {
          const body = this.world.bodies[i];
          if (body.isRemoved) continue;

          const minDistance = body.colliderRadius + spec.radius + spec.placementGap + extraGap;

          if (distanceSquared(x, y, body.x, body.y) < minDistance * minDistance) {
            return false;
          }
        }

        return true;

      // Gestiona build el cuerpo dentro del flujo principal del juego.
      buildBody(x, y, spec) {

          mass: spec.mass,

          color: spec.color,
          bounciness: 0.0,
          isProcedural: true,
          isFieldBody: true,
          kind: spec.type,
          receivesGravity: spec.receivesGravity,
          exertsGravity: spec.exertsGravity
        };

        if (spec.type === "planet") {
          return new PlanetBody(baseOptions);

      // Gestiona collect el planeta hosts dentro del flujo principal del juego.
      collectPlanetHosts() {
        const hosts = [];

        for (let i = 0; i < this.world.bodies.length; i++) {
          const body = this.world.bodies[i];
          if (body.isRemoved) continue;

          if (body.kind === "planet") {
            hosts.push(body);
          }
        }

        return hosts;
      }

      // Gestiona collect el mercader stations dentro del flujo principal del juego.
      collectMerchantStations() {
        const stations = [];

        for (let i = 0; i < this.world.bodies.length; i++) {
          const body = this.world.bodies[i];
          if (body.isRemoved || body.kind !== "station" || !body.isAlive) continue;
          if (body.faction !== "Mercader Ambulante") continue;
          stations.push(body);
        }

        return stations;
      }

      // Gestiona count orbiters around el planeta anfitrion dentro del flujo principal del juego.
      countOrbitersAroundHost(host) {
        let count = 0;

        for (let i = 0; i < this.world.bodies.length; i++) {
          const body = this.world.bodies[i];
          if (body.isRemoved || body.kind !== "asteroid") continue;
          if (body.orbitHost === host) {
            count++;
          }
        }

        return count;
      }

      // Indica si place orbiter around el planeta anfitrion cumple la condicion esperada para esta logica.
      canPlaceOrbiterAroundHost(host, x, y, spec, orbitalRadius, extraGap = 0) {
        const minDistanceFromHost = host.radius + spec.radius + 20;
        if (distanceSquared(x, y, host.x, host.y) < minDistanceFromHost * minDistanceFromHost) {
          return false;
        }

        for (let i = 0; i < this.world.bodies.length; i++) {
          const body = this.world.bodies[i];
          if (body.isRemoved) continue;

          const minDistance = body.colliderRadius + spec.radius + spec.placementGap + extraGap;
          if (distanceSquared(x, y, body.x, body.y) < minDistance * minDistance) {
            return false;
          }

          if (body.kind === "asteroid" && body.orbitHost === host) {
            const bodyOrbitalRadius = body.orbitBandRadius ?? Math.hypot(body.x - host.x, body.y - host.y);
            const radialGap = Math.abs(bodyOrbitalRadius - orbitalRadius);
            const requiredRadialGap = body.radius + spec.radius + 26;
            if (radialGap < requiredRadialGap) {
              return false;
            }
          }
        }

        return true;
      }

      // Genera scattered el cuerpo usando la configuracion y el contexto actuales.
      spawnScatteredBody(planetChance, minDistanceFromPlayer = 700) {
        for (let attempt = 0; attempt < 50; attempt++) {
          const spec = this.createRandomBodySpec(planetChance);
          const angle = randomBetween(0, Math.PI * 2);
          const distance = Math.sqrt(Math.random()) * (this.spawnRadius - 240);

          if (distance < minDistanceFromPlayer) continue;

          const x = this.player.x + Math.cos(angle) * distance;
          const y = this.player.y + Math.sin(angle) * distance;

          if (!this.canPlaceBody(x, y, spec, 12)) continue;

          this.registerProceduralBody(this.buildBody(x, y, spec));
          return true;
        }

        return false;
      }

      // Genera orbiter around el planeta anfitrion usando la configuracion y el contexto actuales.
      spawnOrbiterAroundHost(host) {
        if (!host) {
          return false;
        }

        const existingOrbiters = this.countOrbitersAroundHost(host);
        const maxOrbitersForHost = Math.max(12, Math.floor(host.radius / 35));
        if (existingOrbiters >= maxOrbitersForHost) {
          return false;
        }

        const flowDirection = host.orbiterFlowDirection ?? (Math.random() < 0.5 ? -1 : 1);
        host.orbiterFlowDirection = flowDirection;

        for (let attempt = 0; attempt < 25; attempt++) {
          const spec = this.createAsteroidSpec();
          spec.placementGap = 22;

          const angle = randomBetween(0, Math.PI * 2);
          const orbitalRadius = host.radius + randomBetween(180, 460);
          const x = host.x + Math.cos(angle) * orbitalRadius;
          const y = host.y + Math.sin(angle) * orbitalRadius;

          if (distanceSquared(x, y, this.player.x, this.player.y) > (this.spawnRadius - 120) * (this.spawnRadius - 120)) {
            continue;
          }

          if (distanceSquared(x, y, this.player.x, this.player.y) < 520 * 520) {
            continue;
          }

          const tangentAngle = angle + flowDirection * Math.PI * 0.5 + randomBetween(-0.04, 0.04);
          const orbitSpeed = Math.sqrt((this.world.G * host.mass) / orbitalRadius) * randomBetween(0.96, 1.03);

          spec.vx = host.vx + Math.cos(tangentAngle) * orbitSpeed + randomBetween(-1.5, 1.5);
          spec.vy = host.vy + Math.sin(tangentAngle) * orbitSpeed + randomBetween(-1.5, 1.5);
          spec.angle = randomBetween(0, Math.PI * 2);
          spec.angularVelocity = randomBetween(-0.75, 0.75);
          spec.hostPlanet = host;
          spec.orbitBandRadius = orbitalRadius;

          if (!this.canPlaceOrbiterAroundHost(host, x, y, spec, orbitalRadius, 10)) continue;

          this.registerProceduralBody(this.buildBody(x, y, spec));
          return true;
        }

        return false;
      }

      // Genera station around el planeta anfitrion usando la configuracion y el contexto actuales.
      spawnStationAroundHost(host, minDistanceFromPlayer = 900, preferredAngle = null) {
        if (!host) {
          return false;
        }

        if (StationShip.isPlanetReservedByOther(host)) {
          return false;
        }

        for (let attempt = 0; attempt < 28; attempt++) {
          const spec = this.createStationSpec();
          const angle = preferredAngle ?? randomBetween(0, Math.PI * 2);

        const wingSize = Math.min(this.merchantEscortPerStation, remainingCapacity, remainingTarget);

              const lateralSign = i % 2 === 0 ? 1 : -1;

              const ringRadius = station.radius + 54 + i * 18 + randomBetween(0, 10);

      // Gestiona despawn far bodies dentro del flujo principal del juego.
      despawnFarBodies() {
        const maxDistanceSq = this.despawnRadius * this.despawnRadius;

        for (let i = this.world.bodies.length - 1; i >= 0; i--) {
          const body = this.world.bodies[i];
          if (body === this.player || body.isRemoved) continue;

          if (distanceSquared(body.x, body.y, this.player.x, this.player.y) > maxDistanceSq) {
            this.world.removeBody(body);
          }
        }

        this.world.cleanupRemovedBodies();
      }

      // Actualiza el estado interno usando el estado actual y los parametros recibidos.
      update(dt = 1 / 60) {
        this.despawnFarBodies();

        const dx = this.player.x - this.lastPlayerX;
        const dy = this.player.y - this.lastPlayerY;
        const movedDistance = Math.hypot(dx, dy);
        let movementAngle = randomBetween(0, Math.PI * 2);

        if (!this.spawnsEnabled) {
          this.spawnAccumulator = 0;
          this.lastPlayerX = this.player.x;
          this.lastPlayerY = this.player.y;
          return;
        }

        if (movedDistance > 0.01) {
          this.spawnAccumulator += movedDistance;
          movementAngle = Math.atan2(dy, dx);
          let spawnedThisFrame = 0;

          while (
            this.spawnAccumulator >= this.spawnStep &&
            spawnedThisFrame < this.maxSpawnPerFrame &&
            this.getProceduralCount() < this.maxProceduralBodies
          ) {
            const spawned = this.spawnBodyOnMovement(movementAngle);

            if (!spawned) {
              this.spawnAccumulator = Math.min(this.spawnAccumulator, this.spawnStep);
              break;
            }

            this.spawnAccumulator -= this.spawnStep;
            spawnedThisFrame++;
          }

          let catchUpBudget = Math.min(
            this.maxSpawnPerFrame - spawnedThisFrame,
            Math.max(0, this.targetProceduralBodies - this.getProceduralCount())
          );

          while (catchUpBudget > 0 && this.getProceduralCount() < this.maxProceduralBodies) {
            if (!this.spawnBodyOnMovement(movementAngle)) break;
            spawnedThisFrame++;
            catchUpBudget--;
          }
        }

        if (this.stationCount < this.targetStationCount) {
          let stationBudget = Math.min(2, this.targetStationCount - this.stationCount);

          while (stationBudget > 0 && this.getProceduralCount() < this.maxProceduralBodies) {
            const spawned = movedDistance > 0.01
              ? this.spawnStationOnMovement(movementAngle)
              : this.spawnScatteredStation(900);

            if (!spawned) break;
            stationBudget--;
          }
        }

        this.fleaSpawnCooldown = Math.max(0, this.fleaSpawnCooldown - dt);

        this.carrierSpawnCooldown = Math.max(0, this.carrierSpawnCooldown - dt);
        this.tarantulaSpawnCooldown = Math.max(0, this.tarantulaSpawnCooldown - dt);

        const movingSpawnAngle = movedDistance > 0.01 ? movementAngle : null;

        const carrierDeficit = Math.max(0, this.targetCarrierCount - this.carrierCount);
        if (
          carrierDeficit > 0 &&
          this.getProceduralCount() < this.maxProceduralBodies &&
          this.carrierSpawnCooldown <= 0
        ) {
          if (this.spawnScatteredCarrier(1450)) {
            const remainingCarrierDeficit = Math.max(0, this.targetCarrierCount - this.carrierCount);
            this.carrierSpawnCooldown = remainingCarrierDeficit > 0 ? this.carrierSpawnInterval * 0.5 : this.carrierSpawnInterval;
          }

        const merchantEscortDeficit = Math.max(0, this.getTargetMerchantEscortCount() - this.merchantEscortCount);
        if (
          merchantEscortDeficit > 0 &&
          this.getProceduralCount() < this.maxProceduralBodies &&
          this.merchantEscortSpawnCooldown <= 0
        ) {
          let escortBurstBudget = merchantEscortDeficit >= this.merchantEscortPerStation * 4 ? 2 : 1;

            escortBurstBudget > 0 &&

          ) {
            if (!this.spawnMerchantEscortWing(860)) break;
            spawnedEscortBursts++;
            escortBurstBudget--;
          }

            const remainingEscortDeficit = Math.max(0, this.getTargetMerchantEscortCount() - this.merchantEscortCount);
            this.merchantEscortSpawnCooldown = remainingEscortDeficit > this.merchantEscortPerStation * 2
              ? this.merchantEscortSpawnInterval * 0.32

        if (
          fleaDeficit >= 8 &&
          this.getProceduralCount() < this.maxProceduralBodies &&
          this.fleaSpawnCooldown <= 0
        ) {
          let fleaBurstBudget = fleaDeficit >= 16 ? 2 : 1;
