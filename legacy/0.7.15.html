class FactionHarmonyState {
  constructor(profiles) {
    this.profiles = profiles;
    this.states = new Map();
  }

  getState(factionName) {
    const safeFaction = this.profiles[factionName] ? factionName : "jugador";
    let state = this.states.get(safeFaction);
    if (!state) {
      state = {
        factionName: safeFaction,
        time: 0,
        stepIndex: 0
      };
      this.states.set(safeFaction, state);
    }
    return state;
  }

  update(dt, enabled = true) {
    if (!(dt > 0)) {
      return;
    }

    for (const factionName of Object.keys(this.profiles)) {
      const profile = this.profiles[factionName];
      const state = this.getState(factionName);
      if (!enabled) {
        continue;
      }

      const stepDuration = Math.max(0.2, profile.stepDuration ?? 2);
      state.time += dt;
      const nextStep = Math.floor(state.time / stepDuration);
      state.stepIndex = ((nextStep % profile.progression.length) + profile.progression.length) % profile.progression.length;
    }
  }

  getCurrentHarmony(factionName) {
    const profile = getFactionAudioProfile(factionName);
    const state = this.getState(factionName);
    const progression = profile.progression ?? [[0, 4, 7]];
    const chord = progression[state.stepIndex % progression.length] ?? progression[0];
    return {
      factionName: state.factionName,
      rootMidi: profile.rootMidi ?? 57,
      chord,
      stepIndex: state.stepIndex
    };
  }

  getToneWeights(eventType, interval) {
    const degree = ((interval % 12) + 12) % 12;
    if (eventType === "shot") {
      if (degree === 0) return 0.85;
      if (degree === 7) return 1.15;
      if (degree === 10 || degree === 11) return 1.0;
      return 1.05;
    }

    if (eventType === "thruster") {
      if (degree === 0) return 1.2;
      if (degree === 7 || degree === 5) return 0.95;
      return 0.8;
    }

    if (eventType === "turn" || eventType === "coin") {
      if (degree === 0) return 0.7;
      if (degree === 7 || degree === 11 || degree === 10 || degree === 9) return 1.2;
      return 1;
    }

    if (eventType === "impact" || eventType === "destruction" || eventType === "collision") {
      if (degree === 0) return 1.35;
      if (degree === 7 || degree === 5) return 1.05;
      return 0.72;
    }

    return 1;
  }

  pickNote(factionName, options = {}) {
    const harmony = this.getCurrentHarmony(factionName);
    const kind = options.emitterKind ?? "default";
    const eventType = options.eventType ?? "shot";
    const registerName = options.register ?? getRegisterRule(kind, eventType, "mid");
    const octaves = AUDIO_NOTE_REGISTER_PRESETS[registerName] ?? AUDIO_NOTE_REGISTER_PRESETS.mid;
    const candidates = [];

    for (let i = 0; i < harmony.chord.length; i++) {
      const interval = harmony.chord[i];
      const toneWeight = this.getToneWeights(eventType, interval);
      for (let j = 0; j < octaves.length; j++) {
        const octave = octaves[j];
        const registerBias = 1 - Math.abs(j - (octaves.length - 1) * 0.5) * 0.15;
        candidates.push({
          value: harmony.rootMidi + interval + octave,
          weight: Math.max(0.01, toneWeight * registerBias)
        });
      }
    }

    return weightedChoice(candidates, harmony.rootMidi);
  }
}

class BiomeHarmonyState {
  constructor(profiles) {
    this.profiles = profiles;
    this.states = new Map();
  }

  getState(biomeId) {
    const safeBiome = this.profiles[biomeId] ? biomeId : "black";
    let state = this.states.get(safeBiome);
    if (!state) {
      state = {
        biomeId: safeBiome,
        time: 0,
        stepIndex: 0
      };
      this.states.set(safeBiome, state);
    }
    return state;
  }

  update(dt, enabled = true, tension = 0) {
    if (!(dt > 0)) {
      return;
    }

    const safeTension = clamp(Number.isFinite(tension) ? tension : 0, 0, 1);
    const tensionSpeedMultiplier = 1 + safeTension * 1.85;

    for (const biomeId of Object.keys(this.profiles)) {
      const profile = this.profiles[biomeId];
      const state = this.getState(biomeId);
      if (!enabled) {
        continue;
      }

      const progression = profile.ambientProgression ?? [[0, 7, 12, 16]];
      const stepDuration = Math.max(0.35, profile.stepDuration ?? 4);
      state.time += dt * tensionSpeedMultiplier;
      const nextStep = Math.floor(state.time / stepDuration);
      state.stepIndex = ((nextStep % progression.length) + progression.length) % progression.length;
    }
  }

  getCurrentHarmony(biomeId) {
    const profile = getBiomeAudioProfile(biomeId);
    const state = this.getState(profile.id ?? biomeId ?? "black");
    const progression = profile.ambientProgression ?? [[0, 7, 12, 16]];
    const chord = progression[state.stepIndex % progression.length] ?? progression[0];
    const audibleRootMidi = profile.ambientChordRootMidi ?? ((profile.ambientRootMidi ?? 36) + 12);
    return {
      biomeId: state.biomeId,
      rootMidi: audibleRootMidi,
      chord,
      stepIndex: state.stepIndex
    };
  }
}

class AudioSynthEngine {
  constructor() {
    this.context = null;
    this.masterGain = null;
    this.factionBus = null;
    this.physicsBus = null;
    this.uiBus = null;
    this.ambientBus = null;
    this.compressor = null;
    this.noiseBuffer = null;
    this.distortionCurveCache = new Map();
  }

  createContext() {
    const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextCtor) {
      return null;
    }

    try {
      return new AudioContextCtor();
    } catch (error) {
      return null;
    }
  }

  ensureStarted() {
    if (!this.context) {
      this.context = this.createContext();
      if (!this.context) {
        return false;
      }
      this.buildGraph();
    }

    if (this.context.state === "suspended") {
      this.context.resume().catch(() => {});
    }

    return true;
  }

  isReady() {
    return !!this.context;
  }

  buildGraph() {
    const ctx = this.context;
    this.masterGain = ctx.createGain();
    this.masterGain.gain.value = 0.18;

    this.factionBus = ctx.createGain();
    this.factionBus.gain.value = 1;
    this.physicsBus = ctx.createGain();
    this.physicsBus.gain.value = 0.94;
    this.uiBus = ctx.createGain();
    this.uiBus.gain.value = 1.05;
    this.ambientBus = ctx.createGain();
    this.ambientBus.gain.value = 0.62;

    this.compressor = ctx.createDynamicsCompressor();
    this.compressor.threshold.value = -18;
    this.compressor.knee.value = 18;
    this.compressor.ratio.value = 6;
    this.compressor.attack.value = 0.003;
    this.compressor.release.value = 0.2;

    this.factionBus.connect(this.masterGain);
    this.physicsBus.connect(this.masterGain);
    this.uiBus.connect(this.masterGain);
    this.ambientBus.connect(this.masterGain);
    this.masterGain.connect(this.compressor);
    this.compressor.connect(ctx.destination);

    this.noiseBuffer = this.createWhiteNoiseBuffer(2.2);
  }

  createWhiteNoiseBuffer(duration = 2) {
    const ctx = this.context;
    const frameCount = Math.max(1, Math.floor(ctx.sampleRate * duration));
    const buffer = ctx.createBuffer(1, frameCount, ctx.sampleRate);
    const channel = buffer.getChannelData(0);
    for (let i = 0; i < frameCount; i++) {
      channel[i] = Math.random() * 2 - 1;
    }
    return buffer;
  }

  getBus(category = "faction") {
    if (category === "ui") return this.uiBus;
    if (category === "physics") return this.physicsBus;
    if (category === "ambient") return this.ambientBus;
    return this.factionBus;
  }

  createOutputChain(category = "faction", pan = 0) {
    const ctx = this.context;
    const input = ctx.createGain();
    let tail = input;
    let panner = null;

    if (typeof ctx.createStereoPanner === "function") {
      panner = ctx.createStereoPanner();
      panner.pan.value = clamp(pan, -1, 1);
      tail.connect(panner);
      tail = panner;
    }

    tail.connect(this.getBus(category));

    return {
      input,
      disconnect() {
        try {
          input.disconnect();
        } catch (error) {}
        if (panner) {
          try {
            panner.disconnect();
          } catch (error) {}
        }
      }
    };
  }

  applyEnvelope(param, now, {
    attack = 0.004,
    peak = 1,
    decay = 0.05,
    sustainLevel = 0.35,
    duration = 0.12,
    release = 0.05
  } = {}) {
    const safePeak = Math.max(0, Number.isFinite(peak) ? peak : 0);
    const minValue = getAudioEnvelopeFloor(safePeak);
    const peakValue = Math.max(minValue, safePeak);
    const sustainValue = Math.max(minValue, safePeak * Math.max(0.01, sustainLevel));
    const start = Math.max(now, now + attack);
    const stop = now + Math.max(0.02, duration);
    const sustainStart = Math.min(stop, now + Math.max(0.001, attack) + Math.max(0.001, decay));
    const sustainEnd = Math.max(sustainStart, stop - Math.max(0.002, release));
    const silentAt = stop + AUDIO_FINAL_ZERO_FADE;

    param.cancelScheduledValues(now);
    param.setValueAtTime(minValue, now);
    param.linearRampToValueAtTime(peakValue, start);
    param.exponentialRampToValueAtTime(sustainValue, sustainStart);
    param.setValueAtTime(sustainValue, sustainEnd);
    param.exponentialRampToValueAtTime(minValue, stop);
    param.linearRampToValueAtTime(0, silentAt);
    return silentAt;
  }

  getDistortionCurve(amount = 0) {
    const safeAmount = clamp(amount, 0, 1);
    const key = Math.round(safeAmount * 1000);
    if (this.distortionCurveCache.has(key)) {
      return this.distortionCurveCache.get(key);
    }

    const sampleCount = 2048;
    const curve = new Float32Array(sampleCount);
    const k = 5 + safeAmount * 280;
    for (let i = 0; i < sampleCount; i++) {
      const x = (i * 2) / sampleCount - 1;
      curve[i] = ((1 + k) * x) / (1 + k * Math.abs(x));
    }

    this.distortionCurveCache.set(key, curve);
    return curve;
  }

  playOscillator({
    category = "faction",
    wave = "sine",
    frequency = 440,
    startTime = null,
    duration = 0.12,
    pan = 0,
    peakGain = 0.1,
    attack = 0.003,
    decay = 0.05,
    sustainLevel = 0.24,
    release = 0.05,
    filterType = null,
    filterFrequency = 1200,
    filterQ = 1,
    distortion = 0,
    detune = 0,
    startFrequency = null,
    endFrequency = null
  } = {}) {
    if (!this.context || !shouldRenderAudioGain(peakGain)) {
      return 0;
    }

    const ctx = this.context;
    const now = startTime ?? ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const output = this.createOutputChain(category, pan);
    let tail = gain;
    let filter = null;
    let shaper = null;

    osc.type = wave;
    osc.frequency.setValueAtTime(Math.max(20, startFrequency ?? frequency), now);
    if (typeof detune === "number" && detune !== 0) {
      osc.detune.setValueAtTime(detune, now);
    }
    if (Number.isFinite(endFrequency) && endFrequency > 20 && Math.abs(endFrequency - (startFrequency ?? frequency)) > 0.01) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFrequency), now + Math.max(0.01, duration * 0.82));
    }

    if (filterType) {
      filter = ctx.createBiquadFilter();
      filter.type = filterType;
      filter.frequency.setValueAtTime(Math.max(40, filterFrequency), now);
      filter.Q.setValueAtTime(Math.max(0.0001, filterQ), now);
      tail.connect(filter);
      tail = filter;
    }

    if (distortion > 0.001) {
      shaper = ctx.createWaveShaper();
      shaper.curve = this.getDistortionCurve(distortion);
      shaper.oversample = "2x";
      tail.connect(shaper);
      tail = shaper;
    }

    tail.connect(output.input);
    const envelopeEndTime = this.applyEnvelope(gain.gain, now, {
      attack,
      peak: peakGain,
      decay,
      sustainLevel,
      duration,
      release
    });
    const outputFadeDuration = getAudioOutputSafetyFadeDuration({
      frequency,
      startFrequency: startFrequency ?? frequency,
      endFrequency: endFrequency ?? frequency,
      filterFrequency,
      filterQ,
      distortion
    });
    const outputSilentTime = scheduleAudioOutputSafetyFade(output.input.gain, now, envelopeEndTime, outputFadeDuration);
    const sourceStopTime = outputSilentTime + AUDIO_SOURCE_STOP_PADDING;
    const disconnectPadding = getAudioTailPadding({ filterQ, distortion });
    osc.connect(gain);
    osc.start(now);
    osc.stop(sourceStopTime);
    osc.onended = () => {
      window.setTimeout(() => {
        try {
          osc.disconnect();
        } catch (error) {}
        try {
          gain.disconnect();
        } catch (error) {}
        if (filter) {
          try {
            filter.disconnect();
          } catch (error) {}
        }
        if (shaper) {
          try {
            shaper.disconnect();
          } catch (error) {}
        }
        output.disconnect();
      }, Math.max(0, disconnectPadding * 1000));
    };
    return sourceStopTime + disconnectPadding;
  }

  playNoiseBurst({
    category = "physics",
    startTime = null,
    duration = 0.12,
    pan = 0,
    peakGain = 0.08,
    attack = 0.002,
    decay = 0.04,
    sustainLevel = 0.18,
    release = 0.05,
    filterType = "bandpass",
    filterFrequency = 1600,
    filterQ = 1.2,
    distortion = 0
  } = {}) {
    if (!this.context || !this.noiseBuffer || !shouldRenderAudioGain(peakGain)) {
      return 0;
    }

    const ctx = this.context;
    const now = startTime ?? ctx.currentTime;
    const source = ctx.createBufferSource();
    source.buffer = this.noiseBuffer;
    const gain = ctx.createGain();
    const output = this.createOutputChain(category, pan);
    let tail = gain;
    let filter = null;
    let shaper = null;

    if (filterType) {
      filter = ctx.createBiquadFilter();
      filter.type = filterType;
      filter.frequency.setValueAtTime(Math.max(40, filterFrequency), now);
      filter.Q.setValueAtTime(Math.max(0.0001, filterQ), now);
      tail.connect(filter);
      tail = filter;
    }

    if (distortion > 0.001) {
      shaper = ctx.createWaveShaper();
      shaper.curve = this.getDistortionCurve(distortion);
      shaper.oversample = "2x";
      tail.connect(shaper);
      tail = shaper;
    }

    tail.connect(output.input);
    const envelopeEndTime = this.applyEnvelope(gain.gain, now, {
      attack,
      peak: peakGain,
      decay,
      sustainLevel,
      duration,
      release
    });
    const outputFadeDuration = getAudioOutputSafetyFadeDuration({
      filterFrequency,
      filterQ,
      distortion
    });
    const outputSilentTime = scheduleAudioOutputSafetyFade(output.input.gain, now, envelopeEndTime, outputFadeDuration);
    const sourceStopTime = outputSilentTime + AUDIO_SOURCE_STOP_PADDING;
    const disconnectPadding = getAudioTailPadding({ filterQ, distortion });
    source.connect(gain);
    source.start(now);
    source.stop(sourceStopTime);
    source.onended = () => {
      window.setTimeout(() => {
        try {
          source.disconnect();
        } catch (error) {}
        try {
          gain.disconnect();
        } catch (error) {}
        if (filter) {
          try {
            filter.disconnect();
          } catch (error) {}
        }
        if (shaper) {
          try {
            shaper.disconnect();
          } catch (error) {}
        }
        output.disconnect();
      }, Math.max(0, disconnectPadding * 1000));
    };
    return sourceStopTime + disconnectPadding;
  }
}

class AudioAmbientLayer {
  constructor(engine) {
    this.engine = engine;
    this.started = false;
    this.noiseSource = null;
    this.noiseFilter = null;
    this.noiseGain = null;
    this.toneA = null;
    this.toneB = null;
    this.toneC = null;
    this.toneD = null;
    this.toneAGain = null;
    this.toneBGain = null;
    this.toneCGain = null;
    this.toneDGain = null;
    this.output = null;
    this.hasInitializedFrequencies = false;
  }

  ensureStarted() {
    if (this.started || !this.engine.ensureStarted()) {
      return this.started;
    }

    const ctx = this.engine.context;
    this.output = this.engine.createOutputChain("ambient", 0);
    this.noiseSource = ctx.createBufferSource();
    this.noiseSource.buffer = this.engine.noiseBuffer;
    this.noiseSource.loop = true;
    this.noiseFilter = ctx.createBiquadFilter();
    this.noiseFilter.type = "bandpass";
    this.noiseGain = ctx.createGain();
    this.noiseGain.gain.value = 0.0001;
    this.noiseSource.connect(this.noiseFilter);
    this.noiseFilter.connect(this.noiseGain);
    this.noiseGain.connect(this.output.input);

    this.toneA = ctx.createOscillator();
    this.toneA.type = "sine";
    this.toneAGain = ctx.createGain();
    this.toneAGain.gain.value = 0.0001;
    this.toneA.connect(this.toneAGain);
    this.toneAGain.connect(this.output.input);

    this.toneB = ctx.createOscillator();
    this.toneB.type = "triangle";
    this.toneBGain = ctx.createGain();
    this.toneBGain.gain.value = 0.0001;
    this.toneB.connect(this.toneBGain);
    this.toneBGain.connect(this.output.input);

    this.toneC = ctx.createOscillator();
    this.toneC.type = "sine";
    this.toneCGain = ctx.createGain();
    this.toneCGain.gain.value = 0.0001;
    this.toneC.connect(this.toneCGain);
    this.toneCGain.connect(this.output.input);

    this.toneD = ctx.createOscillator();
    this.toneD.type = "triangle";
    this.toneDGain = ctx.createGain();
    this.toneDGain.gain.value = 0.0001;
    this.toneD.connect(this.toneDGain);
    this.toneDGain.connect(this.output.input);

    this.noiseSource.start();
    this.toneA.start();
    this.toneB.start();
    this.toneC.start();
    this.toneD.start();
    this.started = true;
    return true;
  }

  silence() {
    if (!this.started || !this.engine?.context) {
      return;
    }
    const now = this.engine.context.currentTime;
    this.noiseGain?.gain?.setTargetAtTime(0.0001, now, 0.08);
    this.toneAGain?.gain?.setTargetAtTime(0.0001, now, 0.08);
    this.toneBGain?.gain?.setTargetAtTime(0.0001, now, 0.08);
    this.toneCGain?.gain?.setTargetAtTime(0.0001, now, 0.08);
    this.toneDGain?.gain?.setTargetAtTime(0.0001, now, 0.08);
  }

  getAmbientChordMidiNotes(biomeProfile, harmony) {
    const rootMidi = harmony?.rootMidi ?? biomeProfile?.ambientChordRootMidi ?? ((biomeProfile?.ambientRootMidi ?? 36) + 12);
    const chord = Array.isArray(harmony?.chord) && harmony.chord.length > 0
      ? harmony.chord
      : (biomeProfile?.ambientProgression?.[0] ?? biomeProfile?.ambientIntervals ?? [0, 7, 12, 16]);
    const first = chord[0] ?? 0;
    const second = chord[1] ?? 7;
    const third = chord[2] ?? 12;
    const fourth = chord[3] ?? (third + 4);
    return [rootMidi + first, rootMidi + second, rootMidi + third, rootMidi + fourth];
  }

  initializeFrequenciesIfNeeded(now, toneAFrequency, toneBFrequency, toneCFrequency, toneDFrequency, noiseFilterFrequency, filterQ) {
    if (this.hasInitializedFrequencies) {
      return;
    }

    this.toneA.frequency.setValueAtTime(toneAFrequency, now);
    this.toneB.frequency.setValueAtTime(toneBFrequency, now);
    this.toneC.frequency.setValueAtTime(toneCFrequency, now);
    this.toneD.frequency.setValueAtTime(toneDFrequency, now);
    this.noiseFilter.frequency.setValueAtTime(noiseFilterFrequency, now);
    this.noiseFilter.Q.setValueAtTime(filterQ, now);
    this.hasInitializedFrequencies = true;
  }

  update(biomeProfile, timeSeconds = 0, harmony = null, tension = 0, activityDucking = 0) {
    if (!this.ensureStarted() || !biomeProfile) {
      return;
    }

    const ctx = this.engine.context;
    const now = ctx.currentTime;
    const safeTension = clamp(Number.isFinite(tension) ? tension : 0, 0, 1);
    const safeDucking = clamp(Number.isFinite(activityDucking) ? activityDucking : 0, 0, 1);
    const lfoDepth = biomeProfile.lfoDepth * (0.78 + safeTension * 1.25);
    const lfo = 1 + Math.sin(timeSeconds * biomeProfile.lfoRate * Math.PI * 2) * lfoDepth;
    const pulseRate = biomeProfile.ambientPulseRate ?? (0.045 + (biomeProfile.stepDuration ?? 4) * 0.0015);
    const pulsePhase = biomeProfile.ambientPulsePhase ?? 0;
    const rawPulse = 0.5 + 0.5 * Math.sin((timeSeconds * pulseRate + pulsePhase) * Math.PI * 2);
    const shapedPulse = Math.pow(clamp(rawPulse, 0, 1), 2.85 - safeTension * 0.55);
    const pulsePeak = 0.54;
    const pulseFloor = 0.012 + safeTension * 0.14;
    const pulseEnvelope = pulseFloor + shapedPulse * Math.max(0.001, pulsePeak - pulseFloor);
    const chordNotes = this.getAmbientChordMidiNotes(biomeProfile, harmony);
    const toneAFrequency = midiToFrequency(chordNotes[0]);
    const toneBFrequency = midiToFrequency(chordNotes[1]);
    const toneCFrequency = midiToFrequency(chordNotes[2]);
    const toneDFrequency = midiToFrequency(chordNotes[3]);
    const shimmer = 0.0015 + safeTension * 0.0075;
    const toneBDetune = 1 + Math.sin(timeSeconds * (biomeProfile.lfoRate * 1.7 + 0.03)) * shimmer;
    const toneCDetune = 1 + Math.sin(timeSeconds * (biomeProfile.lfoRate * 2.3 + 0.07)) * shimmer * 0.82;
    const toneDDetune = 1 + Math.sin(timeSeconds * (biomeProfile.lfoRate * 2.9 + 0.11)) * shimmer * 0.58;
    const brightness = 0.76 + safeTension * 0.76;
    const toneGain = biomeProfile.ambientToneGain * 0.74 * pulseEnvelope;
    const noiseGain = biomeProfile.ambientNoiseGain * 0.68 * pulseEnvelope;
    const activityDuckingGain = 1 - safeDucking * 0.48;
    const outputGain = 0.78 * activityDuckingGain;
    const noiseFilterFrequency = Math.max(40, biomeProfile.ambientNoiseFilter * lfo * brightness);
    const filterQ = Math.max(0.1, biomeProfile.physicsResonance * (0.34 + safeTension * 0.32));

    this.initializeFrequenciesIfNeeded(now, toneAFrequency, toneBFrequency, toneCFrequency, toneDFrequency, noiseFilterFrequency, filterQ);

    this.noiseFilter.frequency.setTargetAtTime(noiseFilterFrequency, now, 0.36);
    this.noiseFilter.Q.setTargetAtTime(filterQ, now, 0.36);
    this.noiseGain.gain.setTargetAtTime(Math.max(0.0001, noiseGain), now, 0.48);
    this.output?.input?.gain?.setTargetAtTime(outputGain, now, 0.42);

    this.toneA.frequency.setTargetAtTime(toneAFrequency, now, 0.16);
    this.toneAGain.gain.setTargetAtTime(Math.max(0.0001, toneGain * 0.7), now, 0.46);
    this.toneB.frequency.setTargetAtTime(toneBFrequency * toneBDetune, now, 0.18);
    this.toneBGain.gain.setTargetAtTime(Math.max(0.0001, toneGain * 0.56), now, 0.46);
    this.toneC.frequency.setTargetAtTime(toneCFrequency * toneCDetune, now, 0.2);
    this.toneCGain.gain.setTargetAtTime(Math.max(0.0001, toneGain * 0.42), now, 0.46);
    this.toneD.frequency.setTargetAtTime(toneDFrequency * toneDDetune, now, 0.22);
    this.toneDGain.gain.setTargetAtTime(Math.max(0.0001, toneGain * 0.32), now, 0.46);
  }
}

class AsteroidsAudioDirector {
  constructor(options = {}) {
    this.world = options.world ?? null;
    this.player = options.player ?? null;
    this.proceduralField = options.proceduralField ?? null;
    this.engine = new AudioSynthEngine();
    this.harmony = new FactionHarmonyState(FACTION_AUDIO_PROFILES);
    this.biomeHarmony = new BiomeHarmonyState(BIOME_AUDIO_PROFILES);
    this.ambient = new AudioAmbientLayer(this.engine);
    this.ambientTension = 0;
    this.ambientSustainedTension = 0;
    this.ambientTargetTension = 0;
    this.ambientBaseTension = 0;
    this.ambientConditionTension = 0;
    this.ambientThreatTension = 0;
    this.ambientImpulseTension = 0;
    this.ambientThreatSummary = [];
    this.ambientEquilibriumSources = [];
    this.ambientTensionImpulseLog = [];
    this.forcedAmbientTensionEnabled = false;
    this.forcedAmbientTensionValue = 0;
    this.queue = [];
    this.activeVoiceUntil = [];
    this.entityCooldowns = new Map();
    this.stackCooldowns = new Map();
    this.bodyMotionState = new Map();
    this.projectileNearTensionIds = new Set();
    this.projectileVeryNearTensionIds = new Set();
    this.lastMotionCleanupAt = 0;
    this.maxVoiceLoad = 22;
    this.criticalVoiceReserve = 5;
    this.maxEventsPerFrame = 9;
    this.disabledAudioTags = new Set();
  }

  getNowSeconds() {
    return performance.now() * 0.001;
  }

  isAudioTagDisabled(tag) {
    return this.disabledAudioTags.has(tag);
  }

  isAudioTagEnabled(tag) {
    return !this.isAudioTagDisabled(tag);
  }

  setAudioTagEnabled(tag, enabled = true) {
    if (typeof tag !== "string" || tag.length === 0) {
      return;
    }
    if (enabled) {
      this.disabledAudioTags.delete(tag);
    } else {
      this.disabledAudioTags.add(tag);
    }
  }

  toggleAudioTag(tag) {
    if (this.isAudioTagDisabled(tag)) {
      this.disabledAudioTags.delete(tag);
      return true;
    }
    this.disabledAudioTags.add(tag);
    return false;
  }

  setAmbientTension(value) {
    this.ambientSustainedTension = clamp(Number.isFinite(value) ? value : this.ambientSustainedTension, 0, 1);
    this.ambientTension = this.getEffectiveAmbientTension();
    return this.ambientTension;
  }

  adjustAmbientTension(delta) {
    this.addAmbientTensionImpulse(delta ?? 0);
    return this.ambientTension;
  }

  getPlayerFactionName() {
    return this.player?.faction ?? "jugador";
  }

  getBiomeBaseTensionInfo(biomeState = null) {
    const resolvedBiomeState = biomeState ?? this.currentBiomeState();
    const biomeId = resolvedBiomeState?.id ?? "black";
    const biomeName = resolvedBiomeState?.name ?? getBiomeDisplayName(biomeId);
    const factionName = AUDIO_TENSION_BIOME_FACTION_RULES[biomeId];
    if (factionName && typeof factionSystem !== "undefined" && factionSystem?.getDisposition) {
      const disposition = factionSystem.getDisposition(this.getPlayerFactionName(), factionName);
      const amount = disposition === "enemy" ? 0.5 : 0;
      return {
        amount,
        label: amount > 0 ? `Bioma ${biomeName}: faccion ${factionName} enemiga` : `Bioma ${biomeName}: faccion ${factionName} no hostil`,
        detail: `base por relacion ${disposition}`,
        kind: "biome"
      };
    }
    const amount = AUDIO_TENSION_BASE_BY_BIOME[biomeId] ?? 0;
    return {
      amount,
      label: `Bioma ${biomeName}`,
      detail: amount > 0 ? "base natural del bioma" : "base natural en calma",
      kind: "biome"
    };
  }

  getBiomeBaseTension(biomeState = null) {
    return this.getBiomeBaseTensionInfo(biomeState).amount;
  }

  getThreatBaseTension(body) {
    const kind = getEmitterAudioKind(body);
    let base = AUDIO_TENSION_THREAT_BY_KIND[kind] ?? AUDIO_TENSION_THREAT_BY_KIND.default;
    if (body?.hullClass === "large" && kind !== "carrier" && kind !== "tarantula") {
      base += 0.04;
    }
    return base;
  }

  getThreatDistanceFactor(distance) {
    const range = Math.max(AUDIO_TENSION_THREAT_CLOSE_RANGE + 1, AUDIO_TENSION_THREAT_RANGE);
    const linear = clamp(1 - (distance - AUDIO_TENSION_THREAT_CLOSE_RANGE) / (range - AUDIO_TENSION_THREAT_CLOSE_RANGE), 0, 1);
    return Math.pow(linear, 1.35);
  }

  computeNearbyThreatTension() {
    const world = this.world;
    const player = this.player;
    if (!world || !player || !player.isAlive) {
      this.ambientThreatSummary = [];
      return 0;
    }

    let total = 0;
    const threats = [];
    const considerBody = (body) => {
      if (!body || body === player || body.isRemoved || body.isAlive === false || !isShipLike(body)) {
        return;
      }
      const factionName = body.faction;
      if (!factionName || typeof factionSystem === "undefined" || factionSystem.getDisposition(this.getPlayerFactionName(), factionName) !== "enemy") {
        return;
      }

      const dx = body.x - player.x;
      const dy = body.y - player.y;
      const distance = Math.hypot(dx, dy);
      if (!(distance <= AUDIO_TENSION_THREAT_RANGE)) {
        return;
      }

      const distanceFactor = this.getThreatDistanceFactor(distance);
      if (!(distanceFactor > 0)) {
        return;
      }

      const base = this.getThreatBaseTension(body);
      const contribution = base * distanceFactor;
      if (!(contribution > 0)) {
        return;
      }

      total += contribution;
      if (contribution >= 0.005) {
        threats.push({
          kind: getEmitterAudioKind(body),
          faction: factionName,
          distance,
          contribution
        });
      }
    };

    if (world.grid?.forEachNearbyUnique) {
      const stamp = world.gravityQueryStamp++;
      world.grid.forEachNearbyUnique(player.x, player.y, AUDIO_TENSION_THREAT_RANGE, stamp, considerBody);
    } else if (Array.isArray(world.bodies)) {
      for (let i = 0; i < world.bodies.length; i++) {
        considerBody(world.bodies[i]);
      }
    }

    threats.sort((a, b) => b.contribution - a.contribution);
    this.ambientThreatSummary = threats.slice(0, 30);
    return clamp(total, 0, AUDIO_TENSION_CONDITION_CAP);
  }

  computeAmbientTensionTarget(biomeState = null) {
    const baseInfo = this.getBiomeBaseTensionInfo(biomeState);
    const base = baseInfo.amount;
    const threat = this.computeNearbyThreatTension();
    const condition = clamp(threat, 0, AUDIO_TENSION_CONDITION_CAP);
    this.ambientBaseTension = base;
    this.ambientThreatTension = threat;
    this.ambientConditionTension = condition;
    this.ambientTargetTension = clamp(base + condition, 0, 1);

    const sources = [];
    if (base > 0.0001) {
      sources.push({
        amount: base,
        label: baseInfo.label,
        detail: baseInfo.detail,
        kind: baseInfo.kind
      });
    }

    for (let i = 0; i < this.ambientThreatSummary.length; i++) {
      const threatInfo = this.ambientThreatSummary[i];
      if (!(threatInfo.contribution > 0.0001)) continue;
      sources.push({
        amount: threatInfo.contribution,
        label: `${getBodyDisplayName(threatInfo.kind)} enemigo cerca`,
        detail: `${threatInfo.faction ?? "faccion desconocida"} · ${Math.round(threatInfo.distance ?? 0)}u`,
        kind: "threat"
      });
    }

    sources.sort((a, b) => b.amount - a.amount);
    this.ambientEquilibriumSources = sources;
    return this.ambientTargetTension;
  }

  getTensionImpulseLabel(label, detail = "") {
    return {
      label: typeof label === "string" && label.length > 0 ? label : "Impulso de tension",
      detail: typeof detail === "string" ? detail : ""
    };
  }

  recordAmbientTensionImpulse(amount, label = "Impulso de tension", detail = "") {
    if (!Number.isFinite(amount)) {
      return;
    }
    const safeAmount = Math.max(0, amount);
    const resolved = this.getTensionImpulseLabel(label, detail);
    this.ambientTensionImpulseLog.unshift({
      amount: safeAmount,
      label: resolved.label,
      detail: resolved.detail,
      time: this.world?.time ?? this.getNowSeconds()
    });
    if (this.ambientTensionImpulseLog.length > 100) {
      this.ambientTensionImpulseLog.length = 100;
    }
  }

  addAmbientTensionImpulse(amount, label = "Impulso de tension", detail = "") {
    if (!Number.isFinite(amount) || amount < 0) {
      return this.ambientImpulseTension;
    }
    const previousImpulse = this.ambientImpulseTension;
    if (amount > 0) {
      this.ambientImpulseTension = clamp(this.ambientImpulseTension + amount, 0, AUDIO_TENSION_IMPULSE_CAP);
    }
    const applied = Math.max(0, this.ambientImpulseTension - previousImpulse);
    this.recordAmbientTensionImpulse(applied, label, detail);
    this.ambientTension = this.getEffectiveAmbientTension();
    return this.ambientImpulseTension;
  }

  getTensionEventDistanceFactor(event) {
    if (!event || event.isUi || !this.player) {
      return 1;
    }
    const x = Number.isFinite(event.x) ? event.x : event.emitter?.x ?? event.subject?.x ?? event.target?.x;
    const y = Number.isFinite(event.y) ? event.y : event.emitter?.y ?? event.subject?.y ?? event.target?.y;
    if (!Number.isFinite(x) || !Number.isFinite(y)) {
      return 1;
    }
    const distance = Math.hypot(x - this.player.x, y - this.player.y);
    return this.getThreatDistanceFactor(distance);
  }

  registerAmbientTensionEvent(event) {
    if (!event || !event.type) {
      return;
    }

    const distanceFactor = this.getTensionEventDistanceFactor(event);
    if (!(distanceFactor > 0)) {
      return;
    }

    if (event.type === "shot") {
      const shotCount = Math.max(1, event.stackCount ?? 1);
      const isPlayerShot = event.emitter === this.player;
      const amount = isPlayerShot ? 0 : clamp(0.012 * shotCount * distanceFactor, 0.002, 0.035);
      const source = isPlayerShot ? "del jugador" : (event.faction ? `de ${event.faction}` : "externo");
      const detailPrefix = isPlayerShot ? "no incrementa tension" : `${shotCount} proyectil(es)`;
      this.addAmbientTensionImpulse(amount, `Disparo ${source}`, `${detailPrefix} · cercania ${Math.round(distanceFactor * 100)}%`);
      return;
    }

    if (event.type === "shipDestroyed") {
      const kind = getEmitterAudioKind(event.subject ?? event.emitter);
      let amount = 0.15;
      if (kind === "carrier" || kind === "tarantula") {
        amount = 0.25;
      } else if (event.subject?.hullClass === "large") {
        amount = 0.2;
      } else if (kind === "flea" || kind === "interceptor") {
        amount = 0.08;
      }
      this.addAmbientTensionImpulse(amount * distanceFactor, "Nave explota", `${getBodyDisplayName(kind)} · cercania ${Math.round(distanceFactor * 100)}%`);
    }
  }

  shouldProjectileAffectPlayerTension(projectile) {
    if (!projectile || projectile.isRemoved || projectile.kind !== "projectile") {
      return false;
    }
    return projectile.owner !== this.player;
  }

  registerProjectileNearMissTension(projectile, distanceSq) {
    if (!this.shouldProjectileAffectPlayerTension(projectile) || !Number.isFinite(distanceSq)) {
      return;
    }

    const projectileId = projectile.id;
    if (projectileId == null) {
      return;
    }

    const veryNearRangeSq = AUDIO_TENSION_PROJECTILE_VERY_NEAR_RANGE * AUDIO_TENSION_PROJECTILE_VERY_NEAR_RANGE;
    const nearRangeSq = AUDIO_TENSION_PROJECTILE_NEAR_RANGE * AUDIO_TENSION_PROJECTILE_NEAR_RANGE;

    if (distanceSq <= veryNearRangeSq && !this.projectileVeryNearTensionIds.has(projectileId)) {
      this.projectileVeryNearTensionIds.add(projectileId);
      this.projectileNearTensionIds.add(projectileId);
      this.addAmbientTensionImpulse(AUDIO_TENSION_PROJECTILE_VERY_NEAR_IMPULSE, "Disparo pasa muy cerca", `${Math.round(Math.sqrt(distanceSq))}u del jugador`);
      return;
    }

    if (distanceSq <= nearRangeSq && !this.projectileNearTensionIds.has(projectileId)) {
      this.projectileNearTensionIds.add(projectileId);
      this.addAmbientTensionImpulse(AUDIO_TENSION_PROJECTILE_NEAR_IMPULSE, "Disparo pasa cerca", `${Math.round(Math.sqrt(distanceSq))}u del jugador`);
    }
  }

  captureProjectileNearMissTension() {
    const world = this.world;
    const player = this.player;
    if (!world || !player || !player.isAlive) {
      return;
    }

    const range = AUDIO_TENSION_PROJECTILE_NEAR_RANGE;
    const rangeSq = range * range;
    const considerProjectile = (projectile) => {
      if (!this.shouldProjectileAffectPlayerTension(projectile)) {
        return;
      }
      const dx = projectile.x - player.x;
      const dy = projectile.y - player.y;
      const distanceSq = dx * dx + dy * dy;
      if (distanceSq <= rangeSq) {
        this.registerProjectileNearMissTension(projectile, distanceSq);
      }
    };

    if (world.grid?.forEachNearbyUnique) {
      const stamp = world.gravityQueryStamp++;
      world.grid.forEachNearbyUnique(player.x, player.y, range, stamp, considerProjectile);
    } else if (Array.isArray(world.bodies)) {
      for (let i = 0; i < world.bodies.length; i++) {
        considerProjectile(world.bodies[i]);
      }
    }
  }

  setForcedAmbientTensionEnabled(enabled) {
    this.forcedAmbientTensionEnabled = !!enabled;
    if (this.forcedAmbientTensionEnabled) {
      this.ambientSustainedTension = clamp(this.forcedAmbientTensionValue ?? 0, 0, 1);
      this.ambientImpulseTension = 0;
      this.ambientTension = this.getEffectiveAmbientTension();
    }
    return this.forcedAmbientTensionEnabled;
  }

  setForcedAmbientTensionValue(value) {
    this.forcedAmbientTensionValue = clamp(Number.isFinite(value) ? value : 0, 0, 1);
    if (this.forcedAmbientTensionEnabled) {
      this.ambientSustainedTension = this.forcedAmbientTensionValue;
      this.ambientImpulseTension = 0;
      this.ambientTension = this.getEffectiveAmbientTension();
    }
    return this.forcedAmbientTensionValue;
  }

  toggleForcedAmbientTension() {
    return this.setForcedAmbientTensionEnabled(!this.forcedAmbientTensionEnabled);
  }

  updateAmbientTension(dt, biomeState = null, simulationActive = true) {
    const target = this.computeAmbientTensionTarget(biomeState);
    if (this.forcedAmbientTensionEnabled) {
      this.ambientSustainedTension = clamp(this.forcedAmbientTensionValue ?? 0, 0, 1);
      this.ambientImpulseTension = 0;
      this.ambientTension = this.getEffectiveAmbientTension();
      return this.ambientTension;
    }
    if (simulationActive && dt > 0) {
      const rate = target > this.ambientSustainedTension ? AUDIO_TENSION_RISE_RATE : AUDIO_TENSION_FALL_RATE;
      this.ambientSustainedTension = moveTowardValue(this.ambientSustainedTension, target, rate * dt);
      this.ambientImpulseTension = moveTowardValue(this.ambientImpulseTension, 0, AUDIO_TENSION_IMPULSE_DECAY_RATE * dt);
    }
    this.ambientTension = this.getEffectiveAmbientTension();
    return this.ambientTension;
  }

  getEffectiveAmbientTension() {
    if (this.forcedAmbientTensionEnabled) {
      return clamp(this.forcedAmbientTensionValue ?? 0, 0, 1);
    }
    return clamp((this.ambientSustainedTension ?? 0) + (this.ambientImpulseTension ?? 0), 0, 1);
  }

  getAmbientTensionDebugInfo() {
    return {
      current: this.ambientTension ?? 0,
      sustained: this.ambientSustainedTension ?? 0,
      target: this.ambientTargetTension ?? 0,
      base: this.ambientBaseTension ?? 0,
      conditions: this.ambientConditionTension ?? 0,
      threat: this.ambientThreatTension ?? 0,
      impulse: this.ambientImpulseTension ?? 0,
      forced: !!this.forcedAmbientTensionEnabled,
      forcedValue: this.forcedAmbientTensionValue ?? 0,
      threats: this.ambientThreatSummary ?? [],
      equilibriumSources: this.ambientEquilibriumSources ?? [],
      impulseLog: this.ambientTensionImpulseLog ?? []
    };
  }

  areAudioTagsEnabled(tags) {
    if (!tags) {
      return true;
    }
    for (const tag of tags) {
      if (this.disabledAudioTags.has(tag)) {
        return false;
      }
    }
    return true;
  }

  shouldAllowAudioEvent(event) {
    return this.areAudioTagsEnabled(getAudioEventTags(event));
  }

  handleUserGesture() {
    if (!this.engine.ensureStarted()) {
      return false;
    }
    this.ambient.ensureStarted();
    return true;
  }

  setRuntimeContext(world, player, proceduralField) {
    this.world = world ?? this.world;
    this.player = player ?? this.player;
    this.proceduralField = proceduralField ?? this.proceduralField;
  }

  currentBiomeState(fallbackX = null, fallbackY = null) {
    if (this.proceduralField?.getCurrentBiomeState) {
      return this.proceduralField.getCurrentBiomeState();
    }
    const x = Number.isFinite(fallbackX) ? fallbackX : (this.player?.x ?? 0);
    const y = Number.isFinite(fallbackY) ? fallbackY : (this.player?.y ?? 0);
    return getBiomeStateAtWorld(x, y);
  }

  getBiomeProfileForEvent(event) {
    if (event?.biomeState) {
      return getBiomeAudioProfile(event.biomeState.id);
    }
    if (Number.isFinite(event?.x) && Number.isFinite(event?.y)) {
      return getBiomeAudioProfile(getBiomeStateAtWorld(event.x, event.y).id);
    }
    return getBiomeAudioProfile(this.currentBiomeState().id);
  }

  getSpatialMix(event, customRange = null) {
    const player = this.player;
    if (!player || event?.isUi) {
      return { gain: 1, pan: 0, distance: 0, distanceFactor: 1 };
    }

    const x = Number.isFinite(event?.x) ? event.x : event?.emitter?.x;
    const y = Number.isFinite(event?.y) ? event.y : event?.emitter?.y;
    if (!Number.isFinite(x) || !Number.isFinite(y)) {
      return { gain: 1, pan: 0, distance: 0, distanceFactor: 1 };
    }

    const dx = x - player.x;
    const dy = y - player.y;
    const distance = Math.hypot(dx, dy);
    const range = Math.max(180, customRange ?? AUDIO_EVENT_RANGE[event?.type] ?? 1600);
    const distanceFactor = clamp(1 - distance / range, 0, 1);
    return {
      gain: Math.pow(distanceFactor, 1.25),
      pan: clamp(dx / Math.max(180, range * 0.5), -1, 1),
      distance,
      distanceFactor
    };
  }

  computeEventScore(event) {
    const base = AUDIO_EVENT_IMPORTANCE[event.type] ?? 1.4;
    const intensity = clamp(event.intensity ?? 1, 0.25, 8);
    const spatial = this.getSpatialMix(event);
    const priorityBoost = event.priority ?? 0;
    const stackCount = Math.max(1, event.stackCount ?? 1);
    let score = base * intensity * (event.isUi ? 1 : (0.15 + spatial.distanceFactor * 1.45)) + priorityBoost;
    if (event.emitter === this.player || event.subject === this.player || event.target === this.player || event.counterpart === this.player) {
      score += 2.4;
    }
    if (stackCount > 1) {
      const stackWeight = event.type === "physicalCollision" || event.type === "asteroidBroken" || event.type === "projectileImpact" ? 0.72 : 0.44;
      score += Math.min(1.6, Math.log2(stackCount) * stackWeight);
    }
    return score;
  }

  getEventVoiceCost(event) {
    if (!event) {
      return 1;
    }
    if (event.type === "coinCollected") {
      return event.isBlueCoin ? 5 : 1;
    }
    return AUDIO_EVENT_VOICE_COST[event.type] ?? 1;
  }

  getEventFrameBudget(event) {
    if (!event) {
      return 1;
    }
    if (event.type === "shot" && event.emitter === this.player) {
      return 4;
    }
    if (event.type === "projectileImpact" && event.target === this.player) {
      return 4;
    }
    return AUDIO_EVENT_FRAME_BUDGET[event.type] ?? 1;
  }

  getActiveVoiceLoad() {
    return this.activeVoiceUntil.length;
  }

  isProtectedEvent(event, score = null) {
    if (!event) {
      return false;
    }
    if (event.isUi) {
      return true;
    }
    if (event.emitter === this.player || event.subject === this.player || event.target === this.player || event.counterpart === this.player) {
      return true;
    }
    const resolvedScore = score ?? this.computeEventScore(event);
    return event.type === "planetDestroyed" || event.type === "shipDestroyed" || resolvedScore >= 4.6;
  }

  getStackCellSize(event) {
    if (!event) {
      return 180;
    }
    if (event.type === "physicalCollision") {
      const subjectKind = getEmitterAudioKind(event.subject);
      const counterpartKind = getEmitterAudioKind(event.counterpart);
      return subjectKind === "planet" || counterpartKind === "planet" ? 240 : 160;
    }
    if (event.type === "projectileImpact") {
      return getEmitterAudioKind(event.target) === "planet" ? 180 : 120;
    }
    if (event.type === "asteroidBroken") {
      return 160;
    }
    if (event.type === "shipDestroyed") {
      return 200;
    }
    if (event.type === "asteroidAbsorbed") {
      return 200;
    }
    if (event.type === "planetDestroyed") {
      return 320;
    }
    if (event.type === "coinCollected") {
      return 100;
    }
    if (event.type === "scrapDestroyed") {
      return 120;
    }
    return 180;
  }

  getEventStackCellKey(event, cellSize = null) {
    const x = Number.isFinite(event?.x) ? event.x : (event?.emitter?.x ?? event?.subject?.x ?? event?.target?.x ?? 0);
    const y = Number.isFinite(event?.y) ? event.y : (event?.emitter?.y ?? event?.subject?.y ?? event?.target?.y ?? 0);
    const safeCellSize = Math.max(40, cellSize ?? this.getStackCellSize(event));
    return `${Math.floor(x / safeCellSize)}:${Math.floor(y / safeCellSize)}`;
  }

  getEventStackKey(event) {
    if (!event || event.isUi) {
      return null;
    }

    const type = event.type;
    const faction = event.faction ?? event.emitter?.faction ?? "neutral";
    const emitterKind = getEmitterAudioKind(event.emitter ?? event.subject);

    if (type === "thruster" || type === "turn") {
      return `${type}:${event.emitter?.id ?? "global"}`;
    }

    if (type === "shot") {
      if (event.emitter === this.player) {
        return `shot:player:${event.emitter?.id ?? 0}`;
      }
      if (event.emitter?.id != null) {
        return `shot:${event.emitter.id}`;
      }
      return `shot:${faction}:${emitterKind}:${this.getEventStackCellKey(event, 240)}`;
    }

    if (type === "coinCollected") {
      return `${type}:${event.emitter?.id ?? (event.isUi ? "ui" : "global")}:${event.isBlueCoin ? "blue" : "gold"}`;
    }

    if (type === "scrapCollected") {
      return `${type}:${event.emitter?.id ?? "global"}`;
    }

    const cellKey = this.getEventStackCellKey(event);

    if (type === "physicalCollision") {
      const subjectKind = getEmitterAudioKind(event.subject);
      const counterpartKind = getEmitterAudioKind(event.counterpart);
      const pairKey = [subjectKind, counterpartKind].sort().join(">");
      const perspectiveKey = subjectKind === counterpartKind ? subjectKind : `${subjectKind}->${counterpartKind}`;
      return `${type}:${pairKey}:${perspectiveKey}:${cellKey}`;
    }

    if (type === "projectileImpact") {
      return `${type}:${faction}:${getEmitterAudioKind(event.target)}:${cellKey}`;
    }

    if (type === "asteroidBroken") {
      return `${type}:${event.terminal ? 1 : 0}:${cellKey}`;
    }

    if (type === "shipDestroyed") {
      return `${type}:${faction}:${getEmitterAudioKind(event.subject)}:${cellKey}`;
    }

    if (type === "planetDestroyed") {
      return `${type}:${cellKey}`;
    }

    if (type === "asteroidAbsorbed") {
      return `${type}:${event.target?.id ?? cellKey}`;
    }

    if (type === "scrapDestroyed") {
      return `${type}:${cellKey}`;
    }

    return `${type}:${cellKey}`;
  }

  preferStackEventCandidate(current, incoming) {
    if (this.isProtectedEvent(incoming) && !this.isProtectedEvent(current)) {
      return true;
    }
    const currentSpatial = this.getSpatialMix(current);
    const incomingSpatial = this.getSpatialMix(incoming);
    const currentWeight = (current.priority ?? 0) + currentSpatial.distanceFactor * 2 + (current.intensity ?? 1) * 0.5;
    const incomingWeight = (incoming.priority ?? 0) + incomingSpatial.distanceFactor * 2 + (incoming.intensity ?? 1) * 0.5;
    return incomingWeight > currentWeight;
  }

  combineEventIntensity(type, maxIntensity, totalIntensity, stackCount) {
    const safeCount = Math.max(1, stackCount ?? 1);
    const dominant = Math.max(0.25, maxIntensity ?? 1);
    const total = Math.max(dominant, totalIntensity ?? dominant);
    const combined = dominant + Math.log2(safeCount) * 0.32 + Math.max(0, total - dominant) * 0.12;
    let cap = 6.4;

    if (type === "planetDestroyed") {
      cap = 9;
    } else if (type === "shipDestroyed") {
      cap = 7.8;
    } else if (type === "coinCollected") {
      cap = 4.5;
    }

    return clamp(combined, 0.25, cap);
  }

  mergeQueuedEvents(events) {
    const merged = [];
    const stackMap = new Map();

    for (let i = 0; i < events.length; i++) {
      const event = events[i];
      const stackKey = this.getEventStackKey(event);
      const initialCount = Math.max(1, event.stackCount ?? 1);
      const initialIntensity = Math.max(0.25, event.intensity ?? 1);

      if (!stackKey) {
        merged.push({
          ...event,
          stackCount: initialCount,
          intensity: initialIntensity,
          intensityTotal: initialIntensity,
          maxStackIntensity: initialIntensity
        });
        continue;
      }

      const existing = stackMap.get(stackKey);
      if (!existing) {
        const clone = {
          ...event,
          stackCount: initialCount,
          intensity: initialIntensity,
          intensityTotal: initialIntensity,
          maxStackIntensity: initialIntensity
        };
        stackMap.set(stackKey, clone);
        merged.push(clone);
        continue;
      }

      existing.stackCount = Math.max(1, (existing.stackCount ?? 1) + initialCount);
      existing.intensityTotal = (existing.intensityTotal ?? Math.max(0.25, existing.intensity ?? 1)) + initialIntensity;
      existing.maxStackIntensity = Math.max(existing.maxStackIntensity ?? Math.max(0.25, existing.intensity ?? 1), initialIntensity);
      existing.priority = Math.max(existing.priority ?? 0, event.priority ?? 0);
      existing.terminal = !!(existing.terminal || event.terminal);
      existing.isBlueCoin = !!(existing.isBlueCoin || event.isBlueCoin);
      existing.isUi = !!(existing.isUi || event.isUi);
      existing.fragmentCount = Math.max(existing.fragmentCount ?? 0, event.fragmentCount ?? 0);
      existing.impactSpeed = Math.max(existing.impactSpeed ?? 0, event.impactSpeed ?? 0);
      if (event.normal && !existing.normal) {
        existing.normal = event.normal;
      }

      if (this.preferStackEventCandidate(existing, event)) {
        const preserved = {
          stackCount: existing.stackCount,
          intensityTotal: existing.intensityTotal,
          maxStackIntensity: existing.maxStackIntensity,
          priority: existing.priority,
          terminal: existing.terminal,
          isBlueCoin: existing.isBlueCoin,
          isUi: existing.isUi,
          fragmentCount: existing.fragmentCount,
          impactSpeed: existing.impactSpeed,
          normal: existing.normal
        };
        Object.assign(existing, event);
        existing.stackCount = preserved.stackCount;
        existing.intensityTotal = preserved.intensityTotal;
        existing.maxStackIntensity = preserved.maxStackIntensity;
        existing.priority = preserved.priority;
        existing.terminal = preserved.terminal;
        existing.isBlueCoin = preserved.isBlueCoin;
        existing.isUi = preserved.isUi;
        existing.fragmentCount = preserved.fragmentCount;
        existing.impactSpeed = preserved.impactSpeed;
        existing.normal = preserved.normal;
      }

      existing.intensity = this.combineEventIntensity(existing.type, existing.maxStackIntensity, existing.intensityTotal, existing.stackCount);
    }

    return merged;
  }

  getEventStackCooldown(event, score = null) {
    if (!event) {
      return 0.06;
    }

    const stackCount = Math.max(1, event.stackCount ?? 1);
    const resolvedScore = score ?? this.computeEventScore(event);

    if (event.type === "shot") {
      return event.emitter === this.player ? 0.04 : 0.06;
    }
    if (event.type === "projectileImpact") {
      return getEmitterAudioKind(event.target) === "planet" ? 0.12 : 0.07;
    }
    if (event.type === "physicalCollision") {
      const subjectKind = getEmitterAudioKind(event.subject);
      const counterpartKind = getEmitterAudioKind(event.counterpart);
      const involvesPlanet = subjectKind === "planet" || counterpartKind === "planet";
      return involvesPlanet ? 0.18 : 0.1 + Math.min(0.08, (stackCount - 1) * 0.015);
    }
    if (event.type === "asteroidBroken") {
      return event.terminal ? 0.12 : 0.08;
    }
    if (event.type === "asteroidAbsorbed") {
      return 0.16;
    }
    if (event.type === "shipDestroyed") {
      return 0.18;
    }
    if (event.type === "planetDestroyed") {
      return 0.5;
    }
    if (event.type === "coinCollected") {
      return event.isBlueCoin ? 0.1 : 0.05;
    }
    if (event.type === "scrapCollected") {
      return 0.07;
    }
    if (event.type === "scrapDestroyed") {
      return 0.08;
    }
    if (event.type === "thruster") {
      return 0.02;
    }
    if (event.type === "turn") {
      return 0.03;
    }

    return resolvedScore >= 4.6 ? 0.1 : 0.06;
  }

  compactQueue(events) {
    const merged = this.mergeQueuedEvents(events);
    if (merged.length === 0) {
      return merged;
    }

    const compacted = [];
    const now = this.getNowSeconds();

    for (let i = 0; i < merged.length; i++) {
      const event = merged[i];
      const stackKey = this.getEventStackKey(event);
      if (!stackKey) {
        compacted.push(event);
        continue;
      }

      const cooldownKey = `stack:${stackKey}`;
      const score = this.computeEventScore(event);
      const expiresAt = this.stackCooldowns.get(cooldownKey) ?? 0;
      if (expiresAt > now) {
        continue;
      }

      this.stackCooldowns.set(cooldownKey, now + this.getEventStackCooldown(event, score));
      compacted.push(event);
    }

    return compacted;
  }

  pruneVoices(now = null) {
    if (!this.engine.isReady()) {
      this.activeVoiceUntil.length = 0;
      return;
    }
    const currentTime = now ?? this.engine.context.currentTime;
    this.activeVoiceUntil = this.activeVoiceUntil.filter((endTime) => endTime > currentTime);
  }

  registerVoice(endTime, voiceCost = 1) {
    if (!(endTime > 0)) {
      return;
    }
    const safeCost = Math.max(1, Math.round(voiceCost ?? 1));
    for (let i = 0; i < safeCost; i++) {
      this.activeVoiceUntil.push(endTime);
    }
  }

  canPassCooldown(key, duration) {
    const now = this.getNowSeconds();
    const expiresAt = this.entityCooldowns.get(key) ?? 0;
    if (expiresAt > now) {
      return false;
    }
    this.entityCooldowns.set(key, now + Math.max(0.01, duration));
    return true;
  }

  enqueue(type, payload = {}) {
    const event = {
      type,
      intensity: 1,
      ...payload
    };
    this.registerAmbientTensionEvent(event);
    if (!this.shouldAllowAudioEvent(event)) {
      return;
    }
    this.queue.push(event);
  }

  onShot(ship, options = {}) {
    if (!ship || ship.isRemoved || !ship.isAlive) {
      return;
    }
    this.enqueue("shot", {
      emitter: ship,
      subject: ship,
      faction: ship.faction ?? "jugador",
      x: ship.x,
      y: ship.y,
      intensity: clamp((ship.projectileDamage ?? 1) * 0.35 + (options.shotCount ?? ship.projectilesPerShot ?? 1) * 0.2 + (ship.hullClass === "large" ? 0.45 : 0), 0.8, 4.4)
    });
  }

  onThruster(ship, ax, ay, dt) {
    if (!ship || ship.isRemoved || !ship.isAlive || !(dt > 0)) {
      return;
    }

    const accelMagnitude = Math.hypot(ax ?? 0, ay ?? 0);
    const threshold = Math.max(36, (ship.maxAcceleration ?? ship.thrustPower ?? 120) * 0.12);
    if (accelMagnitude < threshold) {
      return;
    }

    const key = `${ship.id}:thruster`;
    const interval = clamp(0.18 - accelMagnitude / Math.max(180, (ship.maxAcceleration ?? ship.thrustPower ?? 180) * 1.8) * 0.08, 0.06, 0.18);
    if (!this.canPassCooldown(key, interval)) {
      return;
    }

    this.enqueue("thruster", {
      emitter: ship,
      subject: ship,
      faction: ship.faction ?? "jugador",
      x: ship.x,
      y: ship.y,
      intensity: clamp(accelMagnitude / Math.max(80, ship.maxAcceleration ?? ship.thrustPower ?? 160), 0.35, 2.2)
    });
  }

  onTurnDetected(ship, angularSpeed, angularAccel = 0) {
    if (!ship || ship.isRemoved || !ship.isAlive) {
      return;
    }

    const threshold = ship === this.player ? 0.4 : 0.7;
    if (angularSpeed < threshold && angularAccel < 3.2) {
      return;
    }

    const key = `${ship.id}:turn`;
    const cooldown = clamp(0.22 - angularSpeed * 0.015, 0.08, 0.22);
    if (!this.canPassCooldown(key, cooldown)) {
      return;
    }

    this.enqueue("turn", {
      emitter: ship,
      subject: ship,
      faction: ship.faction ?? "jugador",
      x: ship.x,
      y: ship.y,
      intensity: clamp(angularSpeed * 0.55 + angularAccel * 0.08, 0.35, 2.1)
    });
  }

  onProjectileImpact(projectile, target) {
    if (!projectile || projectile.isRemoved) {
      return;
    }

    const x = Number.isFinite(projectile.x) ? projectile.x : target?.x;
    const y = Number.isFinite(projectile.y) ? projectile.y : target?.y;
    this.enqueue("projectileImpact", {
      emitter: projectile.owner ?? projectile,
      projectile,
      target,
      faction: projectile.faction ?? projectile.owner?.faction ?? null,
      x,
      y,
      intensity: clamp((projectile.damage ?? 1) * 0.5 + ((target?.radius ?? 8) / 24), 0.5, 3.8)
    });
  }

  onShipDestroyed(ship) {
    if (!ship) {
      return;
    }
    this.enqueue("shipDestroyed", {
      emitter: ship,
      subject: ship,
      faction: ship.faction ?? null,
      x: ship.x,
      y: ship.y,
      intensity: clamp((ship.mass ?? 12) / 10 + (ship.hullClass === "large" ? 0.9 : 0), 1.1, 7.5)
    });
  }

  onPhysicalCollision(a, b, impactSpeed, normal = null) {
    if (!(impactSpeed > 12) || !a || !b) {
      return;
    }

    const keyBase = a.id < b.id ? `${a.id}:${b.id}` : `${b.id}:${a.id}`;
    if (!this.canPassCooldown(`collision:${keyBase}`, 0.08)) {
      return;
    }

    this.enqueue("physicalCollision", {
      emitter: a,
      subject: a,
      counterpart: b,
      x: a.x,
      y: a.y,
      impactSpeed,
      normal,
      intensity: clamp(impactSpeed / 95 + (a.radius ?? 8) / 40, 0.35, 4.6)
    });

    this.enqueue("physicalCollision", {
      emitter: b,
      subject: b,
      counterpart: a,
      x: b.x,
      y: b.y,
      impactSpeed,
      normal,
      intensity: clamp(impactSpeed / 95 + (b.radius ?? 8) / 40, 0.35, 4.6)
    });
  }

  onAsteroidBroken(asteroid, options = {}) {
    if (!asteroid) {
      return;
    }
    this.enqueue("asteroidBroken", {
      emitter: asteroid,
      subject: asteroid,
      x: asteroid.x,
      y: asteroid.y,
      terminal: !!options.terminal,
      intensity: clamp((asteroid.radius ?? 12) / 14 + ((options.fragmentCount ?? 0) > 1 ? 0.35 : 0), 0.6, 4.2)
    });
  }

  onAsteroidAbsorbed(asteroid, planet) {
    if (!asteroid || !planet) {
      return;
    }
    this.enqueue("asteroidAbsorbed", {
      emitter: planet,
      subject: asteroid,
      target: planet,
      x: asteroid.x,
      y: asteroid.y,
      intensity: clamp((asteroid.radius ?? 12) / 14 + (planet.radius ?? 40) / 240, 0.9, 4.2)
    });
  }

  onPlanetDestroyed(planetA, planetB, impactSpeed = 0) {
    if (!planetA || !planetB) {
      return;
    }
    this.enqueue("planetDestroyed", {
      emitter: planetA,
      subject: planetA,
      target: planetB,
      x: (planetA.x + planetB.x) * 0.5,
      y: (planetA.y + planetB.y) * 0.5,
      intensity: clamp((planetA.radius + planetB.radius) / 90 + impactSpeed / 120, 2.2, 8)
    });
  }

  onCoinCollected(ship, coin, value = 1) {
    if (!ship || !coin) {
      return;
    }
    this.enqueue("coinCollected", {
      emitter: ship,
      subject: coin,
      x: coin.x,
      y: coin.y,
      isBlueCoin: !!coin.isBlueCoin,
      isUi: ship === this.player,
      intensity: clamp((coin.isBlueCoin ? 2.2 : 0.9) + value * 0.02, 0.8, 4)
    });
  }

  onScrapCollected(ship, scrap) {
    if (!ship || !scrap) {
      return;
    }
    this.enqueue("scrapCollected", {
      emitter: ship,
      subject: scrap,
      x: scrap.x,
      y: scrap.y,
      intensity: clamp((scrap.radius ?? 6) / 8, 0.6, 2.2)
    });
  }

  onScrapDestroyed(scrap) {
    if (!scrap) {
      return;
    }
    this.enqueue("scrapDestroyed", {
      emitter: scrap,
      subject: scrap,
      x: scrap.x,
      y: scrap.y,
      intensity: clamp((scrap.radius ?? 6) / 7, 0.6, 2.4)
    });
  }

  onMenuOpen(menuType = "menu") {
    this.enqueue("menuOpen", {
      isUi: true,
      menuType,
      intensity: 1
    });
  }

  onMenuClose(menuType = "menu") {
    this.enqueue("menuClose", {
      isUi: true,
      menuType,
      intensity: 0.92
    });
  }

  onPurchase(entry = null) {
    this.enqueue("purchase", {
      isUi: true,
      entry,
      intensity: clamp(((entry?.cost ?? 0) / 40) + 1, 1, 4)
    });
  }

  onUiError(reason = "error") {
    if (!this.canPassCooldown(`uiError:${reason}`, 0.14)) {
      return;
    }
    this.enqueue("uiError", {
      isUi: true,
      reason,
      intensity: 1
    });
  }

  onInterceptorLaunch(carrier, interceptor) {
    if (!carrier) {
      return;
    }
    this.enqueue("interceptorLaunch", {
      emitter: carrier,
      subject: interceptor ?? carrier,
      faction: carrier.faction ?? "Portanaves",
      x: carrier.x,
      y: carrier.y,
      intensity: clamp((carrier.radius ?? 26) / 22, 1, 3.4)
    });
  }

  captureMotionEvents(dt, suppressEmit = false) {
    const world = this.world;
    const player = this.player;
    if (!world || !player || !(dt > 0)) {
      return;
    }

    const playerRangeSq = 1400 * 1400;
    const nextState = new Map();

    for (let i = 0; i < world.bodies.length; i++) {
      const body = world.bodies[i];
      if (!body || body.isRemoved || !isShipLike(body) || body.isAlive === false) {
        continue;
      }

      const dx = body.x - player.x;
      const dy = body.y - player.y;
      if (body !== player && dx * dx + dy * dy > playerRangeSq) {
        continue;
      }

      const previous = this.bodyMotionState.get(body.id);
      let angularSpeed = 0;
      if (previous) {
        angularSpeed = Math.abs(wrapAngle(body.angle - previous.angle)) / Math.max(1e-4, dt);
        const angularAccel = Math.abs(angularSpeed - previous.angularSpeed) / Math.max(1e-4, dt);
        if (!suppressEmit) {
          this.onTurnDetected(body, angularSpeed, angularAccel);
        }
      }

      nextState.set(body.id, {
        angle: body.angle,
        angularSpeed
      });
    }

    this.bodyMotionState = nextState;
  }

  cleanupMotionState() {
    const now = this.getNowSeconds();
    if (now - this.lastMotionCleanupAt < 0.5) {
      return;
    }
    this.lastMotionCleanupAt = now;

    for (const [key, expiresAt] of this.entityCooldowns.entries()) {
      if (expiresAt <= now) {
        this.entityCooldowns.delete(key);
      }
    }

    for (const [key, expiresAt] of this.stackCooldowns.entries()) {
      if (expiresAt <= now) {
        this.stackCooldowns.delete(key);
      }
    }

    if (this.projectileNearTensionIds.size > 0 || this.projectileVeryNearTensionIds.size > 0) {
      const activeProjectileIds = new Set();
      const bodies = this.world?.bodies;
      if (Array.isArray(bodies)) {
        for (let i = 0; i < bodies.length; i++) {
          const body = bodies[i];
          if (body && !body.isRemoved && body.kind === "projectile") {
            activeProjectileIds.add(body.id);
          }
        }
      }

      for (const projectileId of this.projectileNearTensionIds) {
        if (!activeProjectileIds.has(projectileId)) {
          this.projectileNearTensionIds.delete(projectileId);
        }
      }
      for (const projectileId of this.projectileVeryNearTensionIds) {
        if (!activeProjectileIds.has(projectileId)) {
          this.projectileVeryNearTensionIds.delete(projectileId);
        }
      }
    }
  }

  buildBiomeUiNotes(pattern = "menu") {
    const biomeProfile = getBiomeAudioProfile(this.currentBiomeState().id);
    const root = biomeProfile.uiRootMidi;
    const intervals = biomeProfile.uiIntervals ?? [0, 7, 12];

    if (pattern === "purchase") {
      return [root + intervals[0], root + intervals[1], root + intervals[2], root + intervals[1]];
    }
    if (pattern === "close") {
      return [root + intervals[1], root + intervals[0]];
    }
    if (pattern === "error") {
      return [root + 1, root - 5];
    }
    if (pattern === "blueCoin") {
      return [root + intervals[0], root + intervals[1], root + intervals[2], root + intervals[2] + 5];
    }
    if (pattern === "coin") {
      return [root + intervals[1]];
    }
    return [root + intervals[0], root + intervals[2]];
  }

  renderShot(event, spatial, factionProfile) {
    const emitterKind = getEmitterAudioKind(event.emitter);
    const noteMidi = this.harmony.pickNote(event.faction, { eventType: "shot", emitterKind });
    const frequency = midiToFrequency(noteMidi);
    const brightness = factionProfile.brightness ?? 1;
    const duration = clamp(0.08 + event.intensity * 0.016, 0.08, 0.18);
    const endA = this.engine.playOscillator({
      category: "faction",
      wave: factionProfile.toneWave,
      frequency,
      startFrequency: frequency * (1.28 + (factionProfile.flutter ?? 0)),
      endFrequency: frequency,
      duration,
      pan: spatial.pan,
      peakGain: 0.05 * brightness * spatial.gain,
      attack: 0.002,
      decay: 0.04,
      sustainLevel: 0.18,
      release: 0.04,
      filterType: "bandpass",
      filterFrequency: Math.max(120, factionProfile.shotFilter * brightness),
      filterQ: 1.2 + event.intensity * 0.12,
      distortion: factionProfile.distortion ?? 0
    });
    const endB = this.engine.playNoiseBurst({
      category: "faction",
      duration: duration * 0.78,
      pan: spatial.pan,
      peakGain: 0.038 * (factionProfile.shotNoiseMix ?? 0.2) * event.intensity * spatial.gain,
      attack: 0.001,
      decay: 0.03,
      sustainLevel: 0.12,
      release: 0.03,
      filterType: "bandpass",
      filterFrequency: Math.max(180, factionProfile.shotNoiseFilter * brightness),
      filterQ: 1.4,
      distortion: Math.max(0, (factionProfile.distortion ?? 0) * 0.7)
    });
    return Math.max(endA, endB);
  }

  renderThruster(event, spatial, factionProfile) {
    const emitterKind = getEmitterAudioKind(event.emitter);
    const noteMidi = this.harmony.pickNote(event.faction, { eventType: "thruster", emitterKind });
    const frequency = midiToFrequency(noteMidi);
    const duration = clamp(0.09 + event.intensity * 0.04, 0.09, 0.22);
    const endA = this.engine.playNoiseBurst({
      category: "faction",
      duration,
      pan: spatial.pan,
      peakGain: 0.026 * event.intensity * spatial.gain,
      attack: 0.002,
      decay: duration * 0.45,
      sustainLevel: 0.1,
      release: duration * 0.3,
      filterType: "bandpass",
      filterFrequency: Math.max(120, factionProfile.thrusterFilter * (0.85 + event.intensity * 0.08)),
      filterQ: 0.9 + event.intensity * 0.22,
      distortion: Math.max(0, (factionProfile.distortion ?? 0) * 0.65)
    });
    const endB = this.engine.playOscillator({
      category: "faction",
      wave: factionProfile.accentWave,
      frequency,
      startFrequency: frequency * 0.92,
      endFrequency: frequency * 0.74,
      duration: duration * 0.92,
      pan: spatial.pan,
      peakGain: 0.02 * spatial.gain,
      attack: 0.006,
      decay: duration * 0.4,
      sustainLevel: 0.14,
      release: duration * 0.34,
      filterType: "lowpass",
      filterFrequency: Math.max(80, factionProfile.thrusterFilter * 0.72),
      filterQ: 0.5,
      distortion: Math.max(0, (factionProfile.distortion ?? 0) * 0.45)
    });
    return Math.max(endA, endB);
  }

  renderTurn(event, spatial, factionProfile) {
    const emitterKind = getEmitterAudioKind(event.emitter);
    const noteMidi = this.harmony.pickNote(event.faction, { eventType: "turn", emitterKind });
    const frequency = midiToFrequency(noteMidi);
    return this.engine.playOscillator({
      category: "faction",
      wave: factionProfile.accentWave,
      frequency,
      startFrequency: frequency * 1.08,
      endFrequency: frequency * 0.96,
      duration: clamp(0.06 + event.intensity * 0.025, 0.06, 0.14),
      pan: spatial.pan,
      peakGain: 0.018 * spatial.gain,
      attack: 0.002,
      decay: 0.04,
      sustainLevel: 0.18,
      release: 0.03,
      filterType: "bandpass",
      filterFrequency: Math.max(220, factionProfile.turnFilter),
      filterQ: 1.8,
      distortion: Math.max(0, (factionProfile.distortion ?? 0) * 0.3)
    });
  }

  resolveImpactTonality(event, factionProfile) {
    const target = event.target;
    if (event.faction) {
      return {
        frequency: midiToFrequency(this.harmony.pickNote(event.faction, { eventType: "impact", emitterKind: getEmitterAudioKind(target) })),
        filterFrequency: Math.max(180, factionProfile.impactFilter)
      };
    }

    const biomeProfile = this.getBiomeProfileForEvent(event);
    return {
      frequency: midiToFrequency((biomeProfile.uiRootMidi ?? 60) - 12),
      filterFrequency: biomeProfile.physicsFilter
    };
  }

  renderProjectileImpact(event, spatial, factionProfile) {
    const tonality = this.resolveImpactTonality(event, factionProfile);
    const targetKind = getEmitterAudioKind(event.target);
    const impactSharpness = targetKind === "planet" ? 0.55 : targetKind === "scrap" ? 1.35 : 1;
    const duration = clamp(0.06 + event.intensity * 0.025, 0.06, 0.18);
    const endA = this.engine.playNoiseBurst({
      category: event.target?.kind === "planet" ? "physics" : "faction",
      duration,
      pan: spatial.pan,
      peakGain: 0.032 * event.intensity * spatial.gain,
      attack: 0.001,
      decay: duration * 0.36,
      sustainLevel: 0.1,
      release: duration * 0.3,
      filterType: "bandpass",
      filterFrequency: Math.max(140, tonality.filterFrequency * impactSharpness),
      filterQ: targetKind === "scrap" ? 2.3 : 1.4,
      distortion: targetKind === "tarantula" ? 0.16 : 0.08
    });
    const endB = this.engine.playOscillator({
      category: event.target?.kind === "planet" ? "physics" : "faction",
      wave: targetKind === "scrap" ? "square" : "triangle",
      frequency: tonality.frequency,
      startFrequency: tonality.frequency * 1.18,
      endFrequency: tonality.frequency * (targetKind === "planet" ? 0.68 : 0.88),
      duration: duration * 0.92,
      pan: spatial.pan,
      peakGain: 0.016 * spatial.gain,
      attack: 0.001,
      decay: duration * 0.32,
      sustainLevel: 0.12,
      release: duration * 0.3,
      filterType: "bandpass",
      filterFrequency: Math.max(120, tonality.filterFrequency),
      filterQ: targetKind === "planet" ? 0.9 : 1.5,
      distortion: targetKind === "planet" ? 0.12 : 0.06
    });
    return Math.max(endA, endB);
  }

  renderShipDestroyed(event, spatial, factionProfile) {
    const kind = getEmitterAudioKind(event.subject);
    const noteMidi = this.harmony.pickNote(event.faction ?? "jugador", { eventType: "destruction", emitterKind: kind });
    const frequency = midiToFrequency(noteMidi);
    const duration = clamp(0.32 + event.intensity * 0.08, 0.32, 0.95);
    const endA = this.engine.playNoiseBurst({
      category: "faction",
      duration,
      pan: spatial.pan,
      peakGain: 0.055 * event.intensity * spatial.gain,
      attack: 0.002,
      decay: duration * 0.45,
      sustainLevel: 0.12,
      release: duration * 0.36,
      filterType: "bandpass",
      filterFrequency: Math.max(120, factionProfile.impactFilter * 0.78),
      filterQ: 1.05,
      distortion: Math.max(0.08, factionProfile.distortion ?? 0)
    });
    const endB = this.engine.playOscillator({
      category: "faction",
      wave: kind === "carrier" || kind === "tarantula" ? "sawtooth" : factionProfile.toneWave,
      frequency,
      startFrequency: frequency * 0.72,
      endFrequency: frequency * 0.35,
      duration,
      pan: spatial.pan,
      peakGain: 0.028 * event.intensity * spatial.gain,
      attack: 0.004,
      decay: duration * 0.4,
      sustainLevel: 0.12,
      release: duration * 0.4,
      filterType: "lowpass",
      filterFrequency: Math.max(80, factionProfile.impactFilter * 0.65),
      filterQ: 0.7,
      distortion: Math.max(0.08, factionProfile.distortion ?? 0)
    });
    return Math.max(endA, endB);
  }

  renderCollision(event, spatial, biomeProfile) {
    const subject = event.subject;
    const profile = getBodyCollisionAudioBase(subject);
    const bodyKind = getEmitterAudioKind(subject);
    const subjectRadius = Math.max(4, subject?.radius ?? 8);
    const frequencyBase = bodyKind === "planet"
      ? midiToFrequency((biomeProfile.ambientRootMidi ?? 34) - 12)
      : Math.max(50, profile.baseFilter * (12 / subjectRadius));
    const duration = clamp(profile.duration + event.intensity * 0.02, profile.duration, profile.duration * 1.6);
    const endA = this.engine.playNoiseBurst({
      category: "physics",
      duration,
      pan: spatial.pan,
      peakGain: profile.noiseGain * event.intensity * spatial.gain,
      attack: 0.001,
      decay: duration * 0.35,
      sustainLevel: 0.1,
      release: duration * 0.4,
      filterType: "bandpass",
      filterFrequency: Math.max(90, biomeProfile.physicsFilter * 0.6 + profile.baseFilter * 0.4),
      filterQ: biomeProfile.physicsResonance * 0.62,
      distortion: bodyKind === "scrap" || bodyKind === "tarantula" ? 0.16 : 0.08
    });
    const endB = this.engine.playOscillator({
      category: "physics",
      wave: profile.wave,
      frequency: frequencyBase,
      startFrequency: Math.max(30, frequencyBase * 1.15),
      endFrequency: Math.max(24, frequencyBase * 0.7),
      duration: duration * 0.94,
      pan: spatial.pan,
      peakGain: profile.baseGain * spatial.gain,
      attack: 0.001,
      decay: duration * 0.3,
      sustainLevel: 0.1,
      release: duration * 0.35,
      filterType: "bandpass",
      filterFrequency: Math.max(90, biomeProfile.physicsFilter * 0.55 + profile.baseFilter * 0.45),
      filterQ: bodyKind === "coin" || bodyKind === "blueCoin" ? 3.4 : 1.2,
      distortion: bodyKind === "planet" ? 0.2 : 0.08
    });
    return Math.max(endA, endB);
  }

  renderAsteroidBroken(event, spatial, biomeProfile) {
    const duration = event.terminal ? 0.22 : 0.16;
    const endA = this.engine.playNoiseBurst({
      category: "physics",
      duration: duration + event.intensity * 0.04,
      pan: spatial.pan,
      peakGain: 0.04 * event.intensity * spatial.gain,
      attack: 0.001,
      decay: 0.08,
      sustainLevel: 0.08,
      release: 0.08,
      filterType: "bandpass",
      filterFrequency: Math.max(100, biomeProfile.physicsFilter * 0.58),
      filterQ: biomeProfile.physicsResonance * 0.72,
