            this.asteroidCollisionMinEjectionFactor,
            this.asteroidCollisionMaxEjectionFactor
          ),
          divisionVector,
          coinSource: divisionVector,
          dropCoins
        });
        const fragmentMomentum = this.getBodiesLinearMomentum(fragments);

        return {
          exploded: true,
          fragments,
          transferredMomentumX: originalMomentum.x - fragmentMomentum.x,
          transferredMomentumY: originalMomentum.y - fragmentMomentum.y
        };
      }

      // Gestiona try explode el asteroide from las colisiones dentro del flujo principal del juego.
      tryExplodeAsteroidFromCollision(asteroid, collider, impactSpeed, fallbackNormal = null, dropCoins = false) {
        return this.explodeAsteroidFromCollisionDetailed(
          asteroid,
          collider,
          impactSpeed,
          fallbackNormal,
          dropCoins
        ).exploded;
      }

      // Devuelve el planeta las colisiones el asteroide count calculado a partir del estado y los parametros recibidos.
      getPlanetCollisionAsteroidCount(planetA, planetB) {
        const combinedRadius = (planetA?.radius ?? 0) + (planetB?.radius ?? 0);
        const radiusT = clamp((combinedRadius - 520) / (2400 - 520), 0, 1);
        const requestedCount = Math.round(lerp(
          this.planetCollisionMinAsteroidCount,
          this.planetCollisionMaxAsteroidCount,
          radiusT
        ));

        return clamp(
          requestedCount,
          this.planetCollisionMinAsteroidCount,
          this.planetCollisionMaxAsteroidCount
        );
      }

      buildExplosionFragments(totalArea, totalMass, fragmentCount, {
        minRadius = this.minAsteroidFragmentRadius,
        sizeVariance = 0
      } = {}) {
        const count = Math.max(0, Math.floor(fragmentCount));
        if (count < 1) {
          return [];
        }

        const variance = Math.max(0, sizeVariance);
        const weights = [];
        let totalWeight = 0;

        for (let i = 0; i < count; i++) {
          let weight = 1;
          if (variance > 0.0001) {
            const raw = 1 + randomBetween(-variance, variance);
            const minWeight = Math.max(0.18, 1 - variance * 0.92);
            const maxWeight = Math.max(minWeight + 0.05, 1 + variance * 1.08);
            weight = clamp(raw, minWeight, maxWeight);
          }
          weights.push(weight);
          totalWeight += weight;
        }

        return weights.map((weight) => {
          const share = totalWeight > 0 ? weight / totalWeight : 1 / count;
          const area = Math.max(1, totalArea * share);
          const radius = Math.max(minRadius, Math.sqrt(area));
          return {
            radius,
            mass: Math.max(12, totalMass * share),
            areaShare: share
          };
        }).sort((a, b) => b.radius - a.radius);
      }

      // Selecciona el planeta explosion source el planeta dentro de esta parte de la logica.
      choosePlanetExplosionSourcePlanet(sourcePlanets, centerX, centerY, angle) {
        if (!Array.isArray(sourcePlanets) || sourcePlanets.length === 0) {
          return null;
        }

        if (sourcePlanets.length === 1) {
          return sourcePlanets[0];
        }

        let bestPlanet = sourcePlanets[0];
        let bestScore = -Infinity;
        for (const planet of sourcePlanets) {
          const directionToPlanet = Math.atan2(planet.y - centerY, planet.x - centerX);
          const alignment = Math.cos(wrapAngle(angle - directionToPlanet));
          const sizeBias = (planet.radius ?? 0) * 0.00018;
          const score = alignment + sizeBias + randomBetween(-0.18, 0.18);
          if (score > bestScore) {
            bestScore = score;
            bestPlanet = planet;
          }
        }
        return bestPlanet;
      }

      // Gestiona sample el planeta explosion spawn dentro del flujo principal del juego.
      samplePlanetExplosionSpawn(sourcePlanet, fragmentRadius, preferredAngle) {
        const sourceAngle = preferredAngle + randomBetween(-0.95, 0.95);
        const maxInteriorOffset = Math.max(fragmentRadius * 1.08, sourcePlanet.radius - fragmentRadius * 1.08);
        const radialFactor = Math.sqrt(Math.random()) * randomBetween(0.18, 0.96);
        const interiorOffset = clamp(
          maxInteriorOffset * radialFactor,
          fragmentRadius * 0.7,
          maxInteriorOffset
        );
        return {
          x: sourcePlanet.x + Math.cos(sourceAngle) * interiorOffset,
          y: sourcePlanet.y + Math.sin(sourceAngle) * interiorOffset
        };
      }

      // Gestiona assign el planeta explosion fragments to sources dentro del flujo principal del juego.
      assignPlanetExplosionFragmentsToSources(sourcePlanets, fragments) {
        const targets = sourcePlanets.map((planet) => Math.max(1, planet.radius * planet.radius));
        const totalTarget = targets.reduce((sum, value) => sum + value, 0) || 1;
        const totalFragmentArea = fragments.reduce((sum, fragment) => sum + fragment.radius * fragment.radius, 0) || 1;
        const areaBudgets = targets.map((value) => totalFragmentArea * (value / totalTarget));
        const assignedAreas = sourcePlanets.map(() => 0);
        return fragments.map((fragment) => {
          let bestIndex = 0;
          let bestScore = Infinity;
          const fragmentArea = fragment.radius * fragment.radius;
          for (let i = 0; i < sourcePlanets.length; i++) {
            const planet = sourcePlanets[i];
            const budget = Math.max(fragmentArea, areaBudgets[i]);
            const fillScore = assignedAreas[i] / budget;
            const sizePenalty = fragment.radius > planet.radius * 0.58 ? 4 : 0;
            const score = fillScore + sizePenalty + i * 0.015;
            if (score < bestScore) {
              bestScore = score;
              bestIndex = i;
            }
          }
          assignedAreas[bestIndex] += fragmentArea;
          return sourcePlanets[bestIndex];
        });
      }

      // Gestiona sample packed el planeta explosion spawn dentro del flujo principal del juego.
      samplePackedPlanetExplosionSpawn(sourcePlanet, fragmentRadius, preferredAngle, existingPlacements) {
        const usableRadius = Math.max(fragmentRadius * 1.15, sourcePlanet.radius - fragmentRadius * 1.08);
        const placements = Array.isArray(existingPlacements) ? existingPlacements : [];
        let bestCandidate = null;
        let bestScore = -Infinity;
        const attemptCount = 56;

        for (let attempt = 0; attempt < attemptCount; attempt++) {
          const angleJitter = attempt < 18 ? randomBetween(-1.2, 1.2) : randomBetween(-Math.PI, Math.PI);
          const angle = preferredAngle + angleJitter;
          const radialBias = attempt < 18 ? randomBetween(0.08, 0.94) : Math.sqrt(Math.random());
          const radius = usableRadius * radialBias;
          const x = sourcePlanet.x + Math.cos(angle) * radius;
          const y = sourcePlanet.y + Math.sin(angle) * radius;

          let minClearance = usableRadius - radius;
          for (const placement of placements) {
            const dx = x - placement.x;
            const dy = y - placement.y;
            const clearance = Math.hypot(dx, dy) - (fragmentRadius + placement.radius) * 1.05;
            if (clearance < minClearance) {
              minClearance = clearance;
            }
          }

          const directionBonus = Math.cos(wrapAngle(angle - preferredAngle)) * usableRadius * 0.14;
          const score = minClearance + directionBonus;
          if (score > bestScore) {
            bestScore = score;
            bestCandidate = { x, y };
          }
          if (minClearance >= 0) {
            return { x, y };
          }
        }

        if (bestCandidate) {
          return bestCandidate;
        }

        const fallbackRadius = clamp(usableRadius * 0.32, fragmentRadius * 0.5, usableRadius);
        return {
          x: sourcePlanet.x + Math.cos(preferredAngle) * fallbackRadius,
          y: sourcePlanet.y + Math.sin(preferredAngle) * fallbackRadius
        };
      }

      // Gestiona explode planets into asteroids dentro del flujo principal del juego.
      explodePlanetsIntoAsteroids(planetA, planetB, impactSpeed, fallbackNormal = null) {
        if (!planetA || !planetB || planetA.isRemoved || planetB.isRemoved) {
          return false;
        }

        audioDirector.onPlanetDestroyed(planetA, planetB, impactSpeed);

        const totalMass = Math.max(1, planetA.mass + planetB.mass);
        const totalArea = Math.max(1, planetA.radius * planetA.radius + planetB.radius * planetB.radius);
        const fragmentCount = this.getPlanetCollisionAsteroidCount(planetA, planetB);
        const generatedArea = totalArea * this.planetCollisionAsteroidAreaFraction;
        const generatedMass = totalMass * this.planetCollisionAsteroidMassFraction;
        const centerX = (planetA.x * planetA.mass + planetB.x * planetB.mass) / totalMass;
        const centerY = (planetA.y * planetA.mass + planetB.y * planetB.mass) / totalMass;

        let divisionVector = {
          x: planetA.vx - planetB.vx,
          y: planetA.vy - planetB.vy
        };

        if (Math.hypot(divisionVector.x, divisionVector.y) < 0.001 && fallbackNormal) {
          divisionVector = {
            x: fallbackNormal.x,
            y: fallbackNormal.y
          };
        }

        const direction = this.resolveDirectionalVector(divisionVector);
        const fragments = this.buildExplosionFragments(generatedArea, generatedMass, fragmentCount, {
          minRadius: this.minAsteroidFragmentRadius * 1.55,
          sizeVariance: this.planetCollisionAsteroidSizeVariance
        });
        const largestRadius = fragments[0]?.radius ?? this.minAsteroidFragmentRadius;
        const combinedPlanetRadius = Math.sqrt(totalArea);
        const escapeReferenceRadius = Math.max(combinedPlanetRadius * 0.62, largestRadius * 2.6);
        const escapeSpeed = Math.sqrt((2 * this.G * generatedMass) / Math.max(escapeReferenceRadius, largestRadius * 2));
        const baseEjectionSpeed = Math.max(impactSpeed * 0.06, escapeSpeed * 0.18);
        const angleSeed = direction.angle + randomBetween(-0.24, 0.24);
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));
        const procedural = !!(planetA.isProcedural || planetB.isProcedural);
        const fieldBody = !!(planetA.isFieldBody || planetB.isFieldBody);
        const sourcePlanets = [planetA, planetB].sort((a, b) => (b.radius ?? 0) - (a.radius ?? 0));
        const fragmentSources = this.assignPlanetExplosionFragmentsToSources(sourcePlanets, fragments);
        const placements = new Map(sourcePlanets.map((planet) => [planet, []]));
        const globalPlacements = [];

        this.removeBody(planetA);
        this.removeBody(planetB);

        for (let i = 0; i < fragments.length; i++) {
          const fragment = fragments[i];
          const sourcePlanet = fragmentSources[i] ?? sourcePlanets[0];
          const planetPlacements = placements.get(sourcePlanet) ?? [];
          const angle = angleSeed + i * goldenAngle + randomBetween(-0.42, 0.42);
          const sourceDirection = Math.atan2(sourcePlanet.y - centerY, sourcePlanet.x - centerX);
          const preferredAngle = sourceDirection + wrapAngle(angle - angleSeed) * 0.55;
          const spawn = this.samplePackedPlanetExplosionSpawn(sourcePlanet, fragment.radius, preferredAngle, globalPlacements);
          const localOutward = this.resolveDirectionalVector({
            x: spawn.x - sourcePlanet.x,
            y: spawn.y - sourcePlanet.y
          }, preferredAngle);
          const outwardFromCenter = this.resolveDirectionalVector({
            x: spawn.x - centerX,
            y: spawn.y - centerY
          }, preferredAngle);
          const sourceVelocityDir = this.resolveDirectionalVector({
            x: sourcePlanet.vx,
            y: sourcePlanet.vy
          }, preferredAngle);
          const tangentSign = Math.sign(sourceVelocityDir.x * (-localOutward.y) + sourceVelocityDir.y * localOutward.x) || (Math.random() < 0.5 ? -1 : 1);
          const tangentialX = -localOutward.y * tangentSign;
          const tangentialY = localOutward.x * tangentSign;
          const outward = this.resolveDirectionalVector({
            x: localOutward.x * 1.18 + outwardFromCenter.x * 0.36 + tangentialX * randomBetween(0.06, 0.24) + sourceVelocityDir.x * 0.28,
            y: localOutward.y * 1.18 + outwardFromCenter.y * 0.36 + tangentialY * randomBetween(0.06, 0.24) + sourceVelocityDir.y * 0.28
          }, preferredAngle);
          const speed = baseEjectionSpeed * randomBetween(0.55, 0.95);
          const hp = getAsteroidMaxHpFromRadius(fragment.radius);

          planetPlacements.push({ x: spawn.x, y: spawn.y, radius: fragment.radius });
          placements.set(sourcePlanet, planetPlacements);
          globalPlacements.push({ x: spawn.x, y: spawn.y, radius: fragment.radius });

          this.addBody(this.acquireAsteroidBody({
            x: spawn.x,
            y: spawn.y,
            vx: sourcePlanet.vx + outward.x * speed,
            vy: sourcePlanet.vy + outward.y * speed,
            radius: fragment.radius,
            mass: fragment.mass,
            angle: randomBetween(0, Math.PI * 2),
            angularVelocity: randomBetween(-0.55, 0.55),
            color: randomColor({
              minSaturation: 55,
              maxSaturation: 100,
              minLightness: 45,
              maxLightness: 72
            }),
            bounciness: 0.0,
            isProcedural: procedural,
            isFieldBody: fieldBody,
            kind: "asteroid",
            hp,
            maxHp: hp
          }));
        }

        return true;
      }

      // Gestiona start el asteroide el planeta absorption dentro del flujo principal del juego.
      startAsteroidPlanetAbsorption(asteroid, planet) {
        if (!asteroid || asteroid.isRemoved || asteroid.kind !== "asteroid" || asteroid.absorptionState) {
          return false;
        }

        if (!planet || planet.isRemoved || planet.kind !== "planet") {
          return false;
        }

        const dx = asteroid.x - planet.x;
        const dy = asteroid.y - planet.y;
        const distance = Math.max(0.0001, Math.hypot(dx, dy));
        const startRadius = asteroid.radius;
        const startMass = Math.max(0, asteroid.mass);

        asteroid.absorptionState = {
          planet,
          elapsed: 0,
          duration: this.asteroidPlanetAbsorptionAnimationDuration,
          startDistance: distance,
          startAngle: Math.atan2(dy, dx),
          startRadius,
          startMass
        };
        asteroid.planetContactTimer = 0;
        asteroid.planetContactId = planet.id;
        asteroid.touchingPlanetCandidate = null;
        asteroid.touchingPlanetDistSq = Infinity;
        asteroid.vx = planet.vx;
        asteroid.vy = planet.vy;
        asteroid.angularVelocity *= 0.35;
        asteroid.exertsGravity = false;
        asteroid.receivesGravity = false;
        asteroid.isCollisionDisabled = true;
        asteroid.mass = 0;
        asteroid.colliderRadius = 0;
        asteroid.renderOpacity = 1;
        this.updateBodyGravityProfile(asteroid);

        if (typeof planet.absorbAsteroidMass === "function") {
          planet.absorbAsteroidMass(startMass, startRadius);
        } else {
          planet.mass += startMass;
        }
        this.updateBodyGravityProfile(planet);
        audioDirector.onAsteroidAbsorbed(asteroid, planet);
        return true;
      }

      // Actualiza el asteroide el planeta absorption usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      updateAsteroidPlanetAbsorption(dt) {
        const asteroids = this.asteroidBodies;
        const planets = this.planetBodies;
        const padding = this.asteroidPlanetAbsorptionContactPadding;

        for (let i = 0; i < asteroids.length; i++) {
          const asteroid = asteroids[i];
          if (asteroid.isRemoved) continue;

          const state = asteroid.absorptionState;
          if (state) {
            const planet = state.planet;
            if (!planet || planet.isRemoved) {
              this.removeBody(asteroid);
              continue;
            }

            state.elapsed += dt;
            const t = clamp(state.elapsed / Math.max(0.0001, state.duration), 0, 1);
            const eased = 1 - Math.pow(1 - t, 3);
            const swirl = (1 - eased) * 0.18 * Math.sin(state.elapsed * 10 + asteroid.id * 0.37);
            const angle = state.startAngle + swirl;
            const targetDistance = Math.max(planet.radius * 0.14, planet.radius - state.startRadius * 0.3);
            const distance = lerp(state.startDistance, targetDistance, eased);

            asteroid.x = planet.x + Math.cos(angle) * distance;
            asteroid.y = planet.y + Math.sin(angle) * distance;
            asteroid.vx = planet.vx;
            asteroid.vy = planet.vy;
            asteroid.angle += (asteroid.angularVelocity + 2.6 * (1 - eased)) * dt;
            asteroid.radius = Math.max(0.2, lerp(state.startRadius, state.startRadius * 0.08, eased));
            asteroid.colliderRadius = 0;
            asteroid.renderOpacity = clamp(1 - eased * 0.94, 0.04, 1);

            if (t >= 1) {
              this.removeBody(asteroid);
            }
            continue;
          }

          let nearestPlanet = null;
          let nearestDistSq = Infinity;

          for (let j = 0; j < planets.length; j++) {
            const planet = planets[j];
            if (planet.isRemoved) continue;

            const contactRange = asteroid.radius + planet.radius + padding;
            const distSq = distanceSquared(asteroid.x, asteroid.y, planet.x, planet.y);
            if (distSq <= contactRange * contactRange && distSq < nearestDistSq) {
              nearestPlanet = planet;
              nearestDistSq = distSq;
            }
          }

          if (nearestPlanet) {
            if (asteroid.planetContactId === nearestPlanet.id) {
              asteroid.planetContactTimer = (asteroid.planetContactTimer ?? 0) + dt;
            } else {
              asteroid.planetContactId = nearestPlanet.id;
              asteroid.planetContactTimer = dt;
            }

            if (asteroid.planetContactTimer >= this.asteroidPlanetAbsorptionContactDelay) {
              this.startAsteroidPlanetAbsorption(asteroid, nearestPlanet);
            }
          } else {
            asteroid.planetContactTimer = 0;
            asteroid.planetContactId = 0;
          }
        }
      }

      // Gestiona special las colisiones dentro del flujo principal del juego.
      handleSpecialCollision(a, b) {
        if (isCoinLike(a) || isCoinLike(b)) {
          const coin = isCoinLike(a) ? a : b;
          const other = isCoinLike(a) ? b : a;

          if (isShipLike(other)) {
            this.collectCoin(other, coin);
            return true;
          }
        }

        if (a.kind === "scrap" || b.kind === "scrap") {
          const scrap = a.kind === "scrap" ? a : b;
          const other = a.kind === "scrap" ? b : a;

          if (isShipLike(other) && isScrapCollectorShip(other)) {
            this.collectScrap(other, scrap);
            return true;
          }
        }

        if (a.kind === "interceptor" || b.kind === "interceptor") {
          const interceptor = a.kind === "interceptor" ? a : b;
          const other = a.kind === "interceptor" ? b : a;

          if (other.kind === "carrier" && interceptor.canDockWith?.(other)) {
            other.recoverInterceptor(interceptor);
            return true;
          }
        }

        const aIsProjectile = a.kind === "projectile";
        const bIsProjectile = b.kind === "projectile";

        if (!aIsProjectile && !bIsProjectile) {
          return false;
        }

        if (aIsProjectile && bIsProjectile) {
          return true;
        }

        const projectile = aIsProjectile ? a : b;
        const other = aIsProjectile ? b : a;

        if (projectile.isRemoved || projectile.hasImpacted) {
          return true;
        }

        if (other === projectile.owner) {
          return true;
        }

        if (other.kind === "asteroid") {
          this.handleProjectileAsteroidImpact(projectile, other);
          return true;
        }

        if (other.kind === "scrap") {
          this.removeBody(projectile);
          audioDirector.onProjectileImpact(projectile, other);
          this.damageBody(other, projectile.damage ?? 1, projectile);
          return true;
        }

        if (isShipLike(other)) {
          this.removeBody(projectile);
          audioDirector.onProjectileImpact(projectile, other);
          this.damageBody(other, projectile.damage ?? 1, projectile);
          return true;
        }

        if (other.kind === "planet") {
          audioDirector.onProjectileImpact(projectile, other);
          this.removeBody(projectile);
          return true;
        }

        return true;
      }

      // Gestiona resolve circle las colisiones dentro del flujo principal del juego.
      resolveCircleCollision(a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const distSq = dx * dx + dy * dy;
        const minDist = a.colliderRadius + b.colliderRadius;

        if (distSq >= minDist * minDist) return false;

        if (this.handleSpecialCollision(a, b)) {
          return true;
        }

        let distance = Math.sqrt(distSq);
        let nx = 1;
        let ny = 0;

        if (distance > 0.000001) {
          nx = dx / distance;
          ny = dy / distance;
        } else {
          distance = 0;
        }

        const invMassA = a.inverseMass;
        const invMassB = b.inverseMass;
        const invMassSum = invMassA + invMassB;

        if (invMassSum <= 0) return false;

        const penetration = minDist - distance;
        const slop = 0.01;
        const percent = 0.85;
        const correctionMagnitude = Math.max(penetration - slop, 0) * percent / invMassSum;

        if (correctionMagnitude > 0) {
          a.x -= nx * correctionMagnitude * invMassA;
          a.y -= ny * correctionMagnitude * invMassA;
          b.x += nx * correctionMagnitude * invMassB;
          b.y += ny * correctionMagnitude * invMassB;
        }

        const rvx = b.vx - a.vx;
        const rvy = b.vy - a.vy;
        const velAlongNormal = rvx * nx + rvy * ny;
        const impactSpeed = -velAlongNormal;

        if (impactSpeed > 12) {
          audioDirector.onPhysicalCollision(a, b, impactSpeed, { x: nx, y: ny });
        }

        if (a.kind === "planet" && b.kind === "planet") {
          return this.explodePlanetsIntoAsteroids(a, b, impactSpeed, { x: -nx, y: -ny });
        }

        if (isShipLike(a) && (b.kind === "asteroid" || b.kind === "planet")) {
          const crashSpeedThreshold = a.getCrashSpeedThreshold
            ? a.getCrashSpeedThreshold(this.shipCrashSpeed)
            : this.shipCrashSpeed;

          this.applyCollisionDamage(a, impactSpeed, crashSpeedThreshold);
        }

        if (isShipLike(b) && (a.kind === "asteroid" || a.kind === "planet")) {
          const crashSpeedThreshold = b.getCrashSpeedThreshold
            ? b.getCrashSpeedThreshold(this.shipCrashSpeed)
            : this.shipCrashSpeed;

          this.applyCollisionDamage(b, impactSpeed, crashSpeedThreshold);
        }

        if (impactSpeed > this.asteroidCollisionExplosionMinSpeed) {
          let exploded = false;

          if (a.kind === "asteroid" && b.kind === "asteroid") {
            const massA = Math.max(0.0001, a.mass ?? 0);
            const massB = Math.max(0.0001, b.mass ?? 0);

            if (massA >= massB * 4) {
              const explosionB = this.explodeAsteroidFromCollisionDetailed(b, a, impactSpeed, { x: nx, y: ny }, false);
              exploded = explosionB.exploded || exploded;

              if (explosionB.exploded) {
                this.applyLinearMomentumToBody(a, explosionB.transferredMomentumX, explosionB.transferredMomentumY);
              }
            } else if (massB >= massA * 4) {
              const explosionA = this.explodeAsteroidFromCollisionDetailed(a, b, impactSpeed, { x: -nx, y: -ny }, false);
              exploded = explosionA.exploded || exploded;

              if (explosionA.exploded) {
                this.applyLinearMomentumToBody(b, explosionA.transferredMomentumX, explosionA.transferredMomentumY);
              }
            } else {
              const explosionA = this.explodeAsteroidFromCollisionDetailed(a, b, impactSpeed, { x: -nx, y: -ny }, false);
              const explosionB = this.explodeAsteroidFromCollisionDetailed(b, a, impactSpeed, { x: nx, y: ny }, false);
              exploded = explosionA.exploded || explosionB.exploded || exploded;

              if (explosionA.exploded && !explosionB.exploded) {
                this.applyLinearMomentumToBody(b, explosionA.transferredMomentumX, explosionA.transferredMomentumY);
              } else if (explosionB.exploded && !explosionA.exploded) {
                this.applyLinearMomentumToBody(a, explosionB.transferredMomentumX, explosionB.transferredMomentumY);
              }
            }
          } else {
            if (a.kind === "asteroid" && b.kind === "planet") {
              exploded = this.tryExplodeAsteroidFromCollision(a, b, impactSpeed, { x: -nx, y: -ny }, false) || exploded;
            }

            if (b.kind === "asteroid" && a.kind === "planet") {
              exploded = this.tryExplodeAsteroidFromCollision(b, a, impactSpeed, { x: nx, y: ny }, false) || exploded;
            }
          }

          if (exploded) {
            return true;
          }
        }

        if (velAlongNormal > 0) return true;

        const restitution = Math.min(a.bounciness, b.bounciness);
        const impulseMagnitude = -(1 + restitution) * velAlongNormal / invMassSum;

        const impulseX = impulseMagnitude * nx;
        const impulseY = impulseMagnitude * ny;

        a.vx -= impulseX * invMassA;
        a.vy -= impulseY * invMassA;
        b.vx += impulseX * invMassB;
        b.vy += impulseY * invMassB;

        const newRvx = b.vx - a.vx;
        const newRvy = b.vy - a.vy;
        const residualNormalSpeed = newRvx * nx + newRvy * ny;

        if (residualNormalSpeed < 0) {
          const cancelMagnitude = -residualNormalSpeed / invMassSum;
          const cancelX = cancelMagnitude * nx;
          const cancelY = cancelMagnitude * ny;

          a.vx -= cancelX * invMassA;
          a.vy -= cancelY * invMassA;
          b.vx += cancelX * invMassB;
          b.vy += cancelY * invMassB;
        }

        return true;
      }

      // Gestiona step dentro del flujo principal del juego. Usa dt como delta de tiempo del frame.
      step(dt) {
        this.cleanupRemovedBodies();
        this.ensureFreshGrid();
        this.ensureFreshGravityGrid();
        this.aiTickId += 1;
        this.updateMerchantRescueState(playerShip);
        this.applyGravity(dt);

        for (let i = 0; i < this.bodies.length; i++) {
          const body = this.bodies[i];
          if (body.isRemoved) continue;
          body.update(dt);
        }

        this.gridIsFresh = false;
        this.gravityGridIsFresh = false;
        this.cullTransientBodies();
        this.cleanupRemovedBodies();
        this.rebuildGrid();
        let collisions = this.resolveCollisions();

        for (let pass = 1; pass < this.maxCollisionPasses && collisions > 0; pass++) {
          this.gridIsFresh = false;
          this.cleanupRemovedBodies();
          this.rebuildGrid();
          collisions = this.resolveCollisions();
        }

        this.cleanupRemovedBodies();
        this.updateAsteroidPlanetAbsorption(dt);
        this.gridIsFresh = false;
        this.cleanupRemovedBodies();
        this.rebuildGrid();
        this.particles.update(dt);
      }

      // Actualiza el estado interno usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      update(dt) {
        this.lastMerchantRefusalTimer = Math.max(0, this.lastMerchantRefusalTimer - dt);
        let remaining = dt;

        while (remaining > 0 && !this.isGameOver) {
          const stepDt = Math.min(remaining, this.maxSubstep);
          this.step(stepDt);
          remaining -= stepDt;
        }

        this.cleanupRemovedBodies();
        this.ensureFreshGrid();
      }

      // Dibuja el estado interno en el contexto de render correspondiente.
      draw(ctx, camera, width, height) {
        const margin = 120;
        const left = camera.x - margin;
        const right = camera.x + width + margin;
        const top = camera.y - margin;
        const bottom = camera.y + height + margin;

        this.particles.draw(ctx, camera, width, height);

        for (let i = 0; i < this.bodies.length; i++) {
          const body = this.bodies[i];
          if (body.isRemoved) continue;

          if (
            body.x + body.radius < left ||
            body.x - body.radius > right ||
            body.y + body.radius < top ||
            body.y - body.radius > bottom
          ) {
            continue;
          }

          body.draw(ctx, camera);
        }
      }
    }

    function sampleSpawnRange(range, fallback = 0) {
      if (Array.isArray(range)) {
        const min = Number.isFinite(range[0]) ? range[0] : fallback;
        const max = Number.isFinite(range[1]) ? range[1] : min;
        return randomBetween(Math.min(min, max), Math.max(min, max));
      }
      return Number.isFinite(range) ? range : fallback;
    }

    function computeSpawnSceneIntensityBlend(intensity) {
      return clamp((intensity - 0.72) / 0.76, 0, 1);
    }

    function chooseWeightedSpawnEntry(entries) {
      let totalWeight = 0;
      for (let i = 0; i < entries.length; i++) {
        totalWeight += Math.max(0, entries[i].weight ?? 0);
      }
      if (!(totalWeight > 0)) {
        return null;
      }
      let roll = Math.random() * totalWeight;
      for (let i = 0; i < entries.length; i++) {
        const weight = Math.max(0, entries[i].weight ?? 0);
        if (weight <= 0) continue;
        roll -= weight;
        if (roll <= 0) {
          return entries[i];
        }
      }
      return entries[entries.length - 1] ?? null;
    }

    function computeSpawnAsteroidMass(radius, densityScale = 1) {
      const safeRadius = Math.max(6, radius);
      const baseMass = randomBetween(10, 24);
      const sizeFactor = Math.max(0.55, Math.pow(safeRadius / 24, 1.45));
      return Math.max(6, baseMass * sizeFactor * Math.max(0.25, densityScale));
    }

    function computeSpawnPlanetMass(radius, densityScale = 1) {
      const safeRadius = Math.max(80, radius);
      const base = randomBetween(416, 1118);
      return Math.max(520, base * Math.pow(safeRadius / 76, 2) * 1.9 * Math.max(0.25, densityScale));
    }

    function defineBiomeSceneEntry(clusterId, weight, targetActive, maxActive, options = {}) {
      return {
        clusterId,
        weight,
        targetActive,
        maxActive,
        intensityRange: options.intensityRange ?? [0.85, 1.15],
        minDistanceFromPlayer: options.minDistanceFromPlayer,
        maxDistanceFromPlayer: options.maxDistanceFromPlayer,
        params: options.params ?? {},
        layer: options.layer ?? null,
        minBudget: options.minBudget ?? null
      };
    }

    function computeSpawnSceneSeparationFactor(layerA, layerB) {
      if (layerA === "landmark" || layerB === "landmark") {
        return 0.92;
      }
      if (layerA === layerB) {
        return layerA === "terrain" ? 0.58 : 0.74;
      }
      if (layerA === "terrain" || layerB === "terrain") {
        return 0.4;
      }
      if (layerA === "apex" || layerB === "apex") {
        return 0.6;
      }
      return 0.54;
    }

        this.fleaCount = 0;
        this.waspCount = 0;
        this.dragonflyCount = 0;
        this.minerCount = 0;
        this.carrierCount = 0;
        this.tarantulaCount = 0;

        this.entityFactories = this.createEntityFactories();
        this.clusterDefinitions = this.createClusterDefinitions();
        this.biomeEcology = this.createBiomeEcology();

        this.world.onBodyAdded = (body) => {
          if (body.isFieldBody) {
            this.proceduralCount++;
          }
          if (!body.isFieldBody) {
            return;
          }
          if (body.kind === "station") this.stationCount++;
          if (body.kind === "merchantEscort") this.merchantEscortCount++;
          if (body.kind === "flea") this.fleaCount++;
          if (body.kind === "wasp") this.waspCount++;
          if (body.kind === "dragonfly") this.dragonflyCount++;
          if (body.kind === "miner") this.minerCount++;
          if (body.kind === "carrier") this.carrierCount++;
          if (body.kind === "tarantula") this.tarantulaCount++;
        };

        this.world.onBodyRemoved = (body) => {
          if (body.isFieldBody) {
            this.proceduralCount = Math.max(0, this.proceduralCount - 1);
          }
          if (body.isFieldBody && body.kind === "station") this.stationCount = Math.max(0, this.stationCount - 1);
          if (body.isFieldBody && body.kind === "merchantEscort") this.merchantEscortCount = Math.max(0, this.merchantEscortCount - 1);
          if (body.isFieldBody && body.kind === "flea") this.fleaCount = Math.max(0, this.fleaCount - 1);
          if (body.isFieldBody && body.kind === "wasp") this.waspCount = Math.max(0, this.waspCount - 1);
          if (body.isFieldBody && body.kind === "dragonfly") this.dragonflyCount = Math.max(0, this.dragonflyCount - 1);
          if (body.isFieldBody && body.kind === "miner") this.minerCount = Math.max(0, this.minerCount - 1);
          if (body.isFieldBody && body.kind === "carrier") this.carrierCount = Math.max(0, this.carrierCount - 1);
          if (body.isFieldBody && body.kind === "tarantula") this.tarantulaCount = Math.max(0, this.tarantulaCount - 1);

          const sceneId = body?._spawnSceneId;
          if (sceneId == null) {
            return;
          }
          const scene = this.activeSceneLookup.get(sceneId);
          if (!scene) {
            return;
          }
          if (scene.bodyIds.delete(body.id)) {
            scene.activeBodyCount = Math.max(0, scene.activeBodyCount - 1);
          }
        };
      }

        this.currentBiomeState = getBiomeStateAtWorld(this.player.x, this.player.y);

      getDesiredBodyBudget() {
        const ecology = this.getBiomeEcology(this.getCurrentBiomeState().id);
        return clamp(Math.round(this.baseBodyBudget * (ecology.bodyBudgetMultiplier ?? 1)), 96, this.maxProceduralBodies);
      }

      getDesiredSceneBudget() {
        const ecology = this.getBiomeEcology(this.getCurrentBiomeState().id);
        return clamp(Math.round(this.baseSceneBudget * (ecology.sceneBudgetMultiplier ?? 1)), 8, this.maxSceneBudget);

      getActiveSceneCount() {

      getClusterSceneCount(clusterId, biomeId = null) {
        let count = 0;
        for (let i = 0; i < this.activeScenes.length; i++) {
          const scene = this.activeScenes[i];
          if (scene.clusterId !== clusterId) continue;
          if (biomeId && scene.biomeId !== biomeId) continue;
          count++;
        }
        return count;

        };
        let maxAsteroidRadius = 0;
        for (let i = 0; i < this.world.bodies.length; i++) {
          const body = this.world.bodies[i];
          if (body.isRemoved || !body.isFieldBody) continue;
          if (body.kind === "planet") bodyCounts.planets++;
          if (body.kind === "asteroid") {
            bodyCounts.asteroids++;
            maxAsteroidRadius = Math.max(maxAsteroidRadius, body.radius ?? 0);
            if ((body.radius ?? 0) >= 42) bodyCounts.largeAsteroids++;
            if ((body.radius ?? 0) >= 74) bodyCounts.giantAsteroids++;
          }
          if (body.kind === "scrap") bodyCounts.scrap++;
          if (isCoinLike(body)) {
            bodyCounts.coins++;
            if (body.isBlueCoin) bodyCounts.blueCoins++;
          }
        }
        const clusterCounts = {};
        for (let i = 0; i < this.activeScenes.length; i++) {
          const scene = this.activeScenes[i];
          clusterCounts[scene.clusterId] = (clusterCounts[scene.clusterId] ?? 0) + 1;
        }
        return {
          version: this.spawnVersion,
          currentBiome: this.getCurrentBiomeState().id,
          desiredBodyBudget: this.getDesiredBodyBudget(),
          desiredSceneBudget: this.getDesiredSceneBudget(),
          activeScenes: this.getActiveSceneCount(),
          clusterCounts,
          bodyCounts,
          maxAsteroidRadius
        };

        });

        });

          anchorVY,

        });

        });

      buildBody(x, y, spec) {
        const baseOptions = {
          x,
          y,
          vx: spec.vx ?? 0,
          vy: spec.vy ?? 0,

          exertsGravity: spec.exertsGravity ?? true,

          maxHp: spec.maxHp,
          faction: spec.faction
        };

        if (spec.type === "planet") {
          return new PlanetBody(baseOptions);
        }

        if (spec.type === "station") {
          return new StationShip({
            ...baseOptions,
            aiWorld: this.world,
            aiPlayer: this.player,
            orbitDirection: spec.orbitDirection,
            preferredPlanetOffset: spec.preferredPlanetOffset,

          });

            ...baseOptions,
            aiWorld: this.world,
            aiPlayer: this.player,
            hullClass: spec.hullClass,
            squadId: spec.squadId,

            maxCruiseSpeed: spec.maxCruiseSpeed,
            maxAcceleration: spec.maxAcceleration,
            orbitDirection: spec.orbitDirection,
            coinSenseRadius: spec.coinSenseRadius,
            scrapSenseRadius: spec.scrapSenseRadius,
            squadSenseRadius: spec.squadSenseRadius,
            preferredSquadRadius: spec.preferredSquadRadius,
            squadPhase: spec.squadPhase,
            faction: spec.faction ?? "Avispas"
          });
        }
