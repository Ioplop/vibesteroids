    // Dibuja el panel de depuracion de tags de audio.
    function drawAudioDebugMenu() {
      if (!audioDebugMenuState.isOpen || !testCheats.testMode) return;

      const rows = buildAudioDebugRows();
      const panelWidth = Math.min(580, Math.max(410, canvas.width * 0.39));
      const panelHeight = Math.min(canvas.height - 28, Math.max(360, canvas.height - 28));
      const panelX = 14;
      const panelY = 14;
      const headerHeight = 84;
      const footerHeight = 28;
      const contentX = panelX + 14;
      const contentY = panelY + headerHeight;
      const contentW = panelWidth - 28;
      const contentH = panelHeight - headerHeight - footerHeight;
      const sectionHeight = 28;
      const rowHeight = 34;
      const controlHeight = 68;
      const getRowHeight = (row) => row.kind === "section" ? sectionHeight : row.kind === "control" ? controlHeight : rowHeight;
      const totalHeight = rows.reduce((sum, row) => sum + getRowHeight(row), 0);

      audioDebugMenuState.panelBounds = { x: panelX, y: panelY, w: panelWidth, h: panelHeight };
      audioDebugMenuState.viewport = { x: contentX, y: contentY, w: contentW, h: contentH };
      audioDebugMenuState.maxScroll = Math.max(0, totalHeight - contentH);
      clampMenuScroll(audioDebugMenuState);
      audioDebugMenuState.buttons = [];

      ctx.save();
      ctx.fillStyle = 'rgba(5, 8, 14, 0.91)';
      ctx.fillRect(panelX, panelY, panelWidth, panelHeight);
      ctx.strokeStyle = 'rgba(125, 220, 255, 0.38)';
      ctx.lineWidth = 2;
      ctx.strokeRect(panelX, panelY, panelWidth, panelHeight);

      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillStyle = 'white';
      ctx.font = 'bold 22px monospace';
      ctx.fillText('AUDIO DEBUG', panelX + 16, panelY + 14);
      ctx.font = '13px monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.72)';
      ctx.fillText('D/B cierra · click alterna tags · cualquier tag deshabilitado silencia el evento', panelX + 16, panelY + 44);
      ctx.fillStyle = 'rgba(255,210,120,0.9)';
      const tensionInfo = audioDirector.getAmbientTensionDebugInfo?.() ?? { current: audioDirector.ambientTension ?? 0, target: 0, impulse: 0 };
      ctx.fillText(`${audioDirector.disabledAudioTags.size} tags deshabilitados · tension ${Math.round(tensionInfo.current * 100)}% · equilibrio ${Math.round(tensionInfo.target * 100)}%`, panelX + 16, panelY + 64);

      ctx.save();
      ctx.beginPath();
      ctx.rect(contentX, contentY, contentW, contentH);
      ctx.clip();

      let y = contentY - audioDebugMenuState.scrollOffset;
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const h = getRowHeight(row);
        if (y + h >= contentY && y <= contentY + contentH) {
          if (row.kind === "section") {
            ctx.fillStyle = 'rgba(125, 220, 255, 0.16)';
            ctx.fillRect(contentX, y + 4, contentW, h - 8);
            ctx.font = 'bold 13px monospace';
            ctx.fillStyle = 'rgba(170,230,255,0.95)';
            ctx.fillText(row.label, contentX + 10, y + 8);
          } else if (row.kind === "control" && row.control === "ambientTension") {
            const info = audioDirector.getAmbientTensionDebugInfo?.() ?? { current: audioDirector.ambientTension ?? 0, target: 0, base: 0, conditions: 0, impulse: 0 };
            const tension = clamp(info.current ?? 0, 0, 1);
            const target = clamp(info.target ?? 0, 0, 1);
            const sustained = clamp(info.sustained ?? 0, 0, 1);
            const impulse = clamp(info.impulse ?? 0, 0, 1);
            ctx.fillStyle = 'rgba(255,255,255,0.055)';
            ctx.fillRect(contentX, y + 2, contentW, h - 4);
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.strokeRect(contentX, y + 2, contentW, h - 4);

            ctx.font = 'bold 14px monospace';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`${row.label}: ${Math.round(tension * 100)}%`, contentX + 10, y + 7);
            ctx.font = '11px monospace';
            ctx.fillStyle = 'rgba(255,255,255,0.58)';
            ctx.fillText(`equilibrio ${Math.round(target * 100)}% · base ${Math.round((info.base ?? 0) * 100)}% · amenazas ${Math.round((info.conditions ?? 0) * 100)}% · impulso +${Math.round(impulse * 100)}%`, contentX + 10, y + 25);

            const barX = contentX + 10;
            const barY = y + 45;
            const barW = contentW - 20;
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.fillRect(barX, barY, barW, 6);
            ctx.fillStyle = 'rgba(125,220,255,0.78)';
            ctx.fillRect(barX, barY, barW * tension, 6);
            ctx.fillStyle = 'rgba(255,210,120,0.6)';
            ctx.fillRect(barX, barY + 8, barW * sustained, 4);
            ctx.fillStyle = 'rgba(255,120,120,0.72)';
            ctx.fillRect(barX + barW * sustained, barY + 8, Math.max(1, barW * Math.min(impulse, 1 - sustained)), 4);
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fillRect(barX + barW * target - 1, barY - 2, 2, 16);
          } else {
            const disabled = audioDirector.isAudioTagDisabled(row.tag);
            const button = { x: contentX, y: y + 2, w: contentW, h: h - 4, tag: row.tag };
            const buttonIndex = audioDebugMenuState.buttons.length;
            audioDebugMenuState.buttons.push(button);
            const hovered = audioDebugMenuState.hoverIndex === buttonIndex;

            ctx.fillStyle = disabled
              ? (hovered ? 'rgba(255,110,110,0.28)' : 'rgba(255,110,110,0.18)')
              : (hovered ? 'rgba(255,255,255,0.13)' : 'rgba(255,255,255,0.055)');
            ctx.fillRect(button.x, button.y, button.w, button.h);
            ctx.strokeStyle = disabled ? 'rgba(255,120,120,0.42)' : 'rgba(255,255,255,0.08)';
            ctx.strokeRect(button.x, button.y, button.w, button.h);

            ctx.font = 'bold 14px monospace';
            ctx.fillStyle = disabled ? '#ff9a9a' : '#ffffff';
            ctx.fillText(disabled ? 'OFF' : 'ON', contentX + 10, y + 9);

            ctx.font = '14px monospace';
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fillText(row.label, contentX + 64, y + 6);

            ctx.font = '11px monospace';
            ctx.fillStyle = 'rgba(255,255,255,0.52)';
            ctx.fillText(row.detail || row.tag, contentX + 64, y + 22);
          }
        }
        y += h;
      }
      ctx.restore();

      drawVerticalScrollbar(panelX + panelWidth - 16, contentY, contentH, totalHeight, audioDebugMenuState.scrollOffset, 'rgba(125, 220, 255, 0.95)');

      ctx.fillStyle = 'rgba(255,255,255,0.56)';
      ctx.font = '12px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('Tension automatica: bioma + amenazas cercanas + impulsos de combate. Los tags filtran eventos desde el director.', panelX + panelWidth * 0.5, panelY + panelHeight - 19);
      ctx.restore();
    }

    // Dibuja el panel de diagnostico de tension ambiental.
    function drawAudioTensionDebugMenu() {
      if (!audioTensionDebugMenuState.isOpen || !testCheats.testMode) return;

      const info = audioDirector.getAmbientTensionDebugInfo?.() ?? { current: 0, target: 0, equilibriumSources: [], impulseLog: [] };
      const equilibriumSources = info.equilibriumSources ?? [];
      const rawImpulseLog = info.impulseLog ?? [];
      const showOnlyPositive = !!audioTensionDebugMenuState.showOnlyPositiveImpulses;
      const impulseLog = showOnlyPositive ? rawImpulseLog.filter((entry) => (entry.amount ?? 0) > 0.0001) : rawImpulseLog;
      const panelWidth = Math.min(720, Math.max(520, canvas.width * 0.46));
      const panelHeight = Math.min(canvas.height - 28, Math.max(420, canvas.height - 28));
      const panelX = canvas.width - panelWidth - 14;
      const panelY = 14;
      const headerHeight = 122;
      const footerHeight = 28;
      const contentX = panelX + 14;
      const contentY = panelY + headerHeight;
      const contentW = panelWidth - 28;
      const contentH = panelHeight - headerHeight - footerHeight;
      const sectionHeight = 28;
      const rowHeight = 30;

      const rows = [];
      rows.push({ kind: "section", label: "EQUILIBRIO ACTIVO" });
      if (equilibriumSources.length === 0) {
        rows.push({ kind: "empty", label: "Sin fuentes activas de equilibrio", detail: "la tension quiere volver a calma" });
      } else {
        for (let i = 0; i < equilibriumSources.length; i++) {
          rows.push({ kind: "source", ...equilibriumSources[i] });
        }
      }
      rows.push({ kind: "section", label: showOnlyPositive ? "ULTIMOS IMPULSOS > 0%" : "ULTIMOS 100 IMPULSOS" });
      if (impulseLog.length === 0) {
        rows.push({ kind: "empty", label: showOnlyPositive ? "Sin impulsos mayores que 0%" : "Sin impulsos recientes", detail: "disparos, casi impactos y muertes apareceran aqui" });
      } else {
        for (let i = 0; i < impulseLog.length; i++) {
          rows.push({ kind: "impulse", ...impulseLog[i] });
        }
      }

      const getRowHeight = (row) => row.kind === "section" ? sectionHeight : rowHeight;
      const totalHeight = rows.reduce((sum, row) => sum + getRowHeight(row), 0);
      audioTensionDebugMenuState.panelBounds = { x: panelX, y: panelY, w: panelWidth, h: panelHeight };
      audioTensionDebugMenuState.viewport = { x: contentX, y: contentY, w: contentW, h: contentH };
      audioTensionDebugMenuState.maxScroll = Math.max(0, totalHeight - contentH);
      clampMenuScroll(audioTensionDebugMenuState);

      ctx.save();
      ctx.fillStyle = 'rgba(7, 6, 12, 0.92)';
      ctx.fillRect(panelX, panelY, panelWidth, panelHeight);
      ctx.strokeStyle = 'rgba(255, 190, 115, 0.45)';
      ctx.lineWidth = 2;
      ctx.strokeRect(panelX, panelY, panelWidth, panelHeight);

      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillStyle = 'white';
      ctx.font = 'bold 22px monospace';
      ctx.fillText('TENSION DEBUG', panelX + 16, panelY + 14);
      ctx.font = '13px monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.72)';
      ctx.fillText('A cierra · fuentes de equilibrio + historial de impulsos recientes · click filtra > 0%', panelX + 16, panelY + 44);
      ctx.fillStyle = 'rgba(255,210,120,0.95)';
      ctx.fillText(`actual ${Math.round((info.current ?? 0) * 100)}% · equilibrio ${Math.round((info.target ?? 0) * 100)}% · impulso +${Math.round((info.impulse ?? 0) * 100)}%`, panelX + 16, panelY + 66);

      const barX = panelX + 16;
      const barY = panelY + 84;
      const barW = panelWidth - 32;
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(barX, barY, barW, 6);
      ctx.fillStyle = 'rgba(255,190,115,0.84)';
      ctx.fillRect(barX, barY, barW * clamp(info.current ?? 0, 0, 1), 6);
      ctx.fillStyle = 'rgba(125,220,255,0.85)';
      ctx.fillRect(barX + barW * clamp(info.target ?? 0, 0, 1) - 1, barY - 3, 2, 12);

      const checkboxX = panelX + 16;
      const checkboxY = panelY + 102;
      const checkboxSize = 13;
      audioTensionDebugMenuState.checkboxBounds = { x: checkboxX - 4, y: checkboxY - 4, w: 250, h: 22 };
      ctx.fillStyle = audioTensionDebugMenuState.checkboxHover ? 'rgba(255,190,115,0.18)' : 'rgba(255,255,255,0.06)';
      ctx.fillRect(checkboxX - 4, checkboxY - 4, 250, 22);
      ctx.strokeStyle = showOnlyPositive ? 'rgba(255,190,115,0.95)' : 'rgba(255,255,255,0.45)';
      ctx.strokeRect(checkboxX, checkboxY, checkboxSize, checkboxSize);
      if (showOnlyPositive) {
        ctx.fillStyle = 'rgba(255,190,115,0.95)';
        ctx.fillRect(checkboxX + 3, checkboxY + 3, checkboxSize - 6, checkboxSize - 6);
      }
      ctx.font = '12px monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.82)';
      ctx.fillText('solo eventos que sumaron > 0%', checkboxX + 22, checkboxY - 1);

      ctx.save();
      ctx.beginPath();
      ctx.rect(contentX, contentY, contentW, contentH);
      ctx.clip();

      let y = contentY - audioTensionDebugMenuState.scrollOffset;
      const formatAmount = (amount) => `${amount >= 0 ? '+' : ''}${(amount * 100).toFixed(amount < 0.01 ? 1 : 0)}%`;
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const h = getRowHeight(row);
        if (y + h >= contentY && y <= contentY + contentH) {
          if (row.kind === "section") {
            ctx.fillStyle = 'rgba(255,190,115,0.16)';
            ctx.fillRect(contentX, y + 4, contentW, h - 8);
            ctx.font = 'bold 13px monospace';
            ctx.fillStyle = 'rgba(255,220,170,0.95)';
            ctx.fillText(row.label, contentX + 10, y + 8);
          } else {
            const isImpulse = row.kind === "impulse";
            ctx.fillStyle = isImpulse ? 'rgba(255,255,255,0.055)' : 'rgba(125,220,255,0.06)';
            ctx.fillRect(contentX, y + 2, contentW, h - 4);
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.strokeRect(contentX, y + 2, contentW, h - 4);

            ctx.font = 'bold 13px monospace';
            ctx.fillStyle = row.kind === "empty" ? 'rgba(255,255,255,0.45)' : (isImpulse ? '#ffcf8a' : '#8fe5ff');
            const amountText = row.kind === "empty" ? '—' : formatAmount(row.amount ?? 0);
            ctx.fillText(amountText, contentX + 10, y + 7);

            ctx.font = '13px monospace';
            ctx.fillStyle = row.kind === "empty" ? 'rgba(255,255,255,0.48)' : 'rgba(255,255,255,0.92)';
            ctx.fillText(row.label ?? '', contentX + 78, y + 5);

            ctx.font = '11px monospace';
            ctx.fillStyle = 'rgba(255,255,255,0.52)';
            ctx.fillText(row.detail ?? '', contentX + 78, y + 19);
          }
        }
        y += h;
      }
      ctx.restore();

      drawVerticalScrollbar(panelX + panelWidth - 16, contentY, contentH, totalHeight, audioTensionDebugMenuState.scrollOffset, 'rgba(255,190,115,0.95)');

      ctx.fillStyle = 'rgba(255,255,255,0.56)';
      ctx.font = '12px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('Equilibrio = base de bioma + amenazas activas. Impulsos = eventos discretos que elevan tension temporalmente.', panelX + panelWidth * 0.5, panelY + panelHeight - 19);
      ctx.restore();
    }

    // Dibuja la faccion overlay en el contexto de render correspondiente.

    // Dibuja shop overlay en el contexto de render correspondiente.
    function drawShopOverlay() {
      if (!shopState.isOpen) return;

      const panelWidth = Math.min(820, canvas.width - 40);
      const rowHeight = 62;
      const rowGap = 14;
      const entryCount = Math.max(1, shopState.entries.length);
      const desiredPanelHeight = 240 + entryCount * (rowHeight + rowGap);
      const panelHeight = Math.min(desiredPanelHeight, canvas.height - 40);
      const panelX = (canvas.width - panelWidth) * 0.5;
      const panelY = (canvas.height - panelHeight) * 0.5;

      const listX = panelX + 26;
      const listY = panelY + 188;
      const rowWidth = panelWidth - 66;
      const footerHeight = 28;
      const listViewportHeight = Math.max(72, panelHeight - (listY - panelY) - footerHeight);
      const totalListHeight = entryCount * rowHeight + Math.max(0, entryCount - 1) * rowGap;
      shopState.viewport = { x: listX, y: listY, w: rowWidth, h: listViewportHeight };
      shopState.maxScroll = Math.max(0, totalListHeight - listViewportHeight);
      clampMenuScroll(shopState);

      ctx.save();
      ctx.fillStyle = "rgba(0, 0, 0, 0.78)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(10, 18, 25, 0.94)";
      ctx.fillRect(panelX, panelY, panelWidth, panelHeight);
      ctx.strokeStyle = "rgba(125, 220, 255, 0.55)";
      ctx.lineWidth = 2;
      ctx.strokeRect(panelX, panelY, panelWidth, panelHeight);

      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillStyle = "#7ddcff";
      ctx.font = "bold 30px monospace";
      ctx.fillText("MERCADER AMBULANTE", panelX + 26, panelY + 24);

      ctx.font = "16px monospace";
      ctx.fillStyle = "white";
      ctx.fillText("La simulacion esta en pausa. Compra recursos y mejoras con creditos.", panelX + 26, panelY + 68);
      ctx.fillText("Haz clic o pulsa 1-8. E o ESC para salir.", panelX + 26, panelY + 92);

      ctx.textAlign = "right";
      ctx.fillStyle = "#ffd45a";
      ctx.fillText(`creditos: ${Math.trunc(playerShip.credits)}`, panelX + panelWidth - 26, panelY + 32);
      ctx.textAlign = "left";

      ctx.fillStyle = "rgba(255,255,255,0.82)";
      ctx.fillText(
        `arma ${Math.round(playerShip.projectileSpeed)} vel. | ${playerShip.fireRate.toFixed(2)}/s | ${playerShip.projectilesPerShot} balas/disparo | daño ${playerShip.projectileDamage}`,
        panelX + 26,
        panelY + 126
      );
      ctx.fillText(
        `casco ${playerShip.getCrashSpeedThreshold(world.shipCrashSpeed).toFixed(0)} choque | ${Math.floor(playerShip.maxAmmo)} mun. | ${playerShip.maxFuel.toFixed(0)} s combustible | empuje ${playerShip.thrustPower.toFixed(0)}`,
        panelX + 26,
        panelY + 150
      );

      shopState.buttons = [];

      ctx.save();
      ctx.beginPath();
      ctx.rect(listX, listY, rowWidth, listViewportHeight);
      ctx.clip();

      for (let i = 0; i < shopState.entries.length; i++) {
        const entry = shopState.entries[i];
        const rowY = listY - shopState.scrollOffset + i * (rowHeight + rowGap);
        const affordable = playerShip.credits >= entry.cost;
        const hovered = shopState.hoverIndex === i;
        const available = entry.available !== false;
        const isService = entry.kind === "service";

        if (rowY + rowHeight < listY || rowY > listY + listViewportHeight) {
          continue;
        }

        if (available && affordable) {
          ctx.fillStyle = isService ? "rgba(24, 52, 74, 0.9)" : "rgba(28, 58, 38, 0.9)";
        } else if (!available) {
          ctx.fillStyle = "rgba(34, 34, 40, 0.9)";
        } else {
          ctx.fillStyle = "rgba(56, 24, 24, 0.9)";
        }
        ctx.fillRect(listX, rowY, rowWidth, rowHeight);
        ctx.strokeStyle = hovered ? "rgba(255,255,255,0.9)" : "rgba(255,255,255,0.18)";
        ctx.lineWidth = hovered ? 2 : 1;
        ctx.strokeRect(listX, rowY, rowWidth, rowHeight);

        ctx.textAlign = "left";
        ctx.fillStyle = isService ? "#7ddcff" : "white";
        ctx.font = "bold 18px monospace";
        ctx.fillText(`${i + 1}. ${entry.title}`, listX + 16, rowY + 10);
        ctx.font = "15px monospace";
        ctx.fillStyle = "rgba(255,255,255,0.85)";
        ctx.fillText(entry.description, listX + 16, rowY + 36);

        ctx.textAlign = "right";
        ctx.fillStyle = entry.cost <= 0 ? "#9dff9d" : "#ffd45a";
        ctx.font = "bold 18px monospace";
        ctx.fillText(entry.cost <= 0 ? "gratis" : `${entry.cost} cr`, listX + rowWidth - 16, rowY + 10);
        ctx.font = "14px monospace";
        if (!available) {
          ctx.fillStyle = "rgba(255,255,255,0.45)";
          ctx.fillText("completo", listX + rowWidth - 16, rowY + 38);
        } else {
          ctx.fillStyle = affordable ? "#bfffbf" : "#ffb2b2";
          ctx.fillText(affordable ? "comprar" : "faltan creditos", listX + rowWidth - 16, rowY + 38);
        }

        shopState.buttons.push({
          index: i,
          x: listX,
          y: rowY,
          w: rowWidth,
          h: rowHeight
        });
      }

      ctx.restore();
      drawVerticalScrollbar(panelX + panelWidth - 18, listY, listViewportHeight, totalListHeight, shopState.scrollOffset, "rgba(125, 220, 255, 0.95)");

      if (shopState.maxScroll > 0) {
        ctx.textAlign = "right";
        ctx.font = "14px monospace";
        ctx.fillStyle = "rgba(255,255,255,0.65)";
        ctx.fillText("rueda / flechas para desplazar", panelX + panelWidth - 26, panelY + panelHeight - 18);
      }

      ctx.restore();
    }

    // Dibuja game over overlay en el contexto de render correspondiente.
    function drawGameOverOverlay() {
      if (playerShip.isAlive) return;

      ctx.save();
      ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Dibuja el estado interno en el contexto de render correspondiente.
    function draw() {
      drawBackground();
      drawStars();

      if (world.showGrid) {
        world.grid.draw(ctx, camera, canvas.width, canvas.height);
      }

      world.draw(ctx, camera, canvas.width, canvas.height);
      drawBrakeLockIndicator();
      drawHUD();
      drawAudioTensionDebugOverlay();
      drawAudioChordOverlay();
      drawAudioDebugMenu();
      drawAudioTensionDebugMenu();
      drawCheatMenu();
      drawDiagnosticsOverlay();
      drawFactionOverlay();
      drawShopOverlay();
      drawPauseOverlay();
      drawGameOverOverlay();
    }

    let lastTime = performance.now();

    // Gestiona tick simulation dentro del flujo principal del juego. Usa dt como delta de tiempo del frame.
    function tickSimulation(dt) {
      world.update(dt);

      if (!world.isGameOver) {
        testCheats.update(dt);
        factionSystem.update(dt);
        updateTarantulaDiplomacy(dt);
        updateCoinMagnet(dt);
        world.updateShipCoinPickup(dt);
        updatePlanetResupply(dt);
        updatePlayerWeapons(dt);
        updateNpcWeapons(dt);
        proceduralField.update(dt);
      }

      if (world.isGameOver && shopState.isOpen) {
        closeShop();
      }
    }

    // Gestiona game loop dentro del flujo principal del juego.
    function gameLoop(currentTime) {
      const rawDt = Math.max(1 / 240, (currentTime - lastTime) / 1000);
      lastTime = currentTime;

      performanceMonitor.frameDtMs = rawDt * 1000;
      performanceMonitor.smoothedFrameDt += (rawDt - performanceMonitor.smoothedFrameDt) * performanceMonitor.smoothing;
      performanceMonitor.fps = 1 / Math.max(1e-6, performanceMonitor.smoothedFrameDt);

      let dt = clamp(rawDt, 0, 0.05);
      const simulationActive = !world.isGameOver && !isSimulationPaused();

      if (simulationActive) {
        tickSimulation(dt);
      }

      const currentBiomeState = proceduralField?.getCurrentBiomeState?.() ?? getBiomeStateAtWorld(playerShip.x, playerShip.y);
      audioDirector.update(dt, {
        world,
        player: playerShip,
        proceduralField,
        biomeState: currentBiomeState,
        simulationActive
      });

      updateCamera(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    window.__game = {
      world,
      playerShip,
      proceduralField,
      shopState,
      factionSystem,
      factionMenuState,
      diagnosticsMenuState,
      audioChordOverlayState,
      audioDebugMenuState,
      audioTensionDebugMenuState,
      performanceMonitor,
      keys,
      testCheats,
      findNearbyStation,
      openShop,
      closeShop,
      attemptPurchaseEntry,
      fireProjectile,
      updateNpcWeapons,
      tickSimulation,
      audioDirector,
      // Devuelve counts calculado a partir del estado y los parametros recibidos.
      getCounts() {
        const countsByKind = {};
        for (const body of world.bodies) {
          countsByKind[body.kind] = (countsByKind[body.kind] ?? 0) + 1;
        }

        return {
          total: world.bodies.length,
          procedural: proceduralField.getProceduralCount(),
          stations: proceduralField.getStationCount(),
          merchantEscorts: proceduralField.getMerchantEscortCount(),
          fleas: proceduralField.getFleaCount(),
          wasps: proceduralField.getWaspCount(),
          dragonflies: proceduralField.getDragonflyCount(),
          miners: proceduralField.getMinerCount(),
          carriers: proceduralField.getCarrierCount(),
          tarantulas: proceduralField.getTarantulaCount(),
          ammo: playerShip.ammo,
          fuel: playerShip.fuel,
          credits: playerShip.credits,
          crashThreshold: playerShip.getCrashSpeedThreshold(world.shipCrashSpeed),
          kinds: countsByKind
        };
      }
    };

    updatePlanetResupply(0);
    updateCamera(1 / 60);
    updateMouseWorld();
    canvas.style.cursor = "crosshair";
    requestAnimationFrame(gameLoop);
  
  </script>
</body>
</html>
