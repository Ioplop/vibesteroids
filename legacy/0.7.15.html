          return new DragonflyShip({
            ...baseOptions,
            aiWorld: this.world,
            aiPlayer: this.player,
            hullClass: spec.hullClass,
            squadId: spec.squadId,
            squadCruiseSpeed: spec.squadCruiseSpeed,
            maxCruiseSpeed: spec.maxCruiseSpeed,
            maxAcceleration: spec.maxAcceleration,
            orbitDirection: spec.orbitDirection,
            coinSenseRadius: spec.coinSenseRadius,
            scrapSenseRadius: spec.scrapSenseRadius,
            squadSenseRadius: spec.squadSenseRadius,
            preferredSquadRadius: spec.preferredSquadRadius,
            squadPhase: spec.squadPhase,
            faction: spec.faction ?? "Lib\u00e9lulas"
          });
        }

        if (spec.type === "miner") {
          return new MinerShip({
            ...baseOptions,
            aiWorld: this.world,
            aiPlayer: this.player,
            maxCruiseSpeed: spec.maxCruiseSpeed,
            maxThrustAcceleration: spec.maxThrustAcceleration,
            maxPlanetMatchAcceleration: spec.maxPlanetMatchAcceleration,
            coinSenseRadius: spec.coinSenseRadius,
            scrapSenseRadius: spec.scrapSenseRadius,
            asteroidApproachDistance: spec.asteroidApproachDistance,
            enemyStandoffDistance: spec.enemyStandoffDistance,
            wanderAngle: spec.wanderAngle,
            faction: spec.faction ?? "Mineros"
          });
        }

        if (spec.type === "carrier") {
          return new CarrierShip({
            ...baseOptions,
            aiWorld: this.world,
            aiPlayer: this.player,
            coinSenseRadius: spec.coinSenseRadius,
            scrapSenseRadius: spec.scrapSenseRadius,
            asteroidApproachDistance: spec.asteroidApproachDistance,
            enemyStandoffDistance: spec.enemyStandoffDistance,
            interceptorDefenseRadius: spec.interceptorDefenseRadius,
            interceptorInventory: spec.interceptorInventory,
            maxInterceptorInventory: spec.maxInterceptorInventory,
            wanderAngle: spec.wanderAngle,
            faction: spec.faction ?? "Portanaves"
          });
        }

        if (spec.type === "tarantula") {
          return new TarantulaShip({
            ...baseOptions,
            aiWorld: this.world,
            aiPlayer: this.player,
            maxCruiseSpeed: spec.maxCruiseSpeed,
            maxAcceleration: spec.maxAcceleration,
            enemySenseRadius: spec.enemySenseRadius,
            weaponRange: spec.weaponRange,
            coinSenseRadius: spec.coinSenseRadius,
            scrapSenseRadius: spec.scrapSenseRadius,
            chaseCommitRange: spec.chaseCommitRange,
            closeOrbitDistance: spec.closeOrbitDistance,
            wanderAngle: spec.wanderAngle,
            faction: spec.faction ?? "Tar\u00e1ntulas"
          });
        }

        if (spec.type === "asteroid") {
          const hp = spec.hp ?? getAsteroidMaxHpFromRadius(spec.radius ?? 13);
          const asteroid = this.world.acquireAsteroidBody({
            ...baseOptions,
            hp,
            maxHp: spec.maxHp ?? hp
          });
          asteroid.orbitHost = spec.hostPlanet ?? null;
          asteroid.orbitBandRadius = spec.orbitBandRadius ?? null;
          return asteroid;
        }

        if (spec.type === "scrap") {
          return new ScrapBody({
            ...baseOptions,
            hp: spec.hp ?? randomInt(1, 4),
            maxHp: spec.maxHp ?? Math.max(1, spec.hp ?? randomInt(1, 4)),
            shapeIndex: spec.shapeIndex,
            accentColor: spec.accentColor
          });
        }

        if (spec.type === "coin") {
          return this.world.acquireCoinBody({
            ...baseOptions,
            kind: "coin",
            value: spec.value ?? 1,
            maxLifetime: spec.maxLifetime ?? 18
          });
        }

        if (spec.type === "blueCoin") {
          return this.world.acquireBlueCoinBody({
            ...baseOptions,
            kind: "coin",
            value: spec.value ?? 100,
            maxLifetime: spec.maxLifetime ?? 28
          });
        }

        return new PhysicalBody(baseOptions);
      }

      registerProceduralBody(body, scene = null) {
        if (scene) {
          body._spawnSceneId = scene.id;
          body._spawnClusterId = scene.clusterId;
          body._spawnBiomeId = scene.biomeId;
          scene.activeBodyCount += 1;
          scene.bodyIds.add(body.id);
        }
        return this.world.addBody(body);
      }

      removeBodies(bodies = []) {
        for (let i = 0; i < bodies.length; i++) {
          const body = bodies[i];
          if (!body || body.isRemoved) continue;
          this.world.removeBody(body);
        }
        this.world.cleanupRemovedBodies();
      }

      cleanupSceneRegistry() {
        const kept = [];
        this.activeSceneCounts.clear();
        for (let i = 0; i < this.activeScenes.length; i++) {
          const scene = this.activeScenes[i];
          if (!scene || scene.activeBodyCount <= 0) {
            this.activeSceneLookup.delete(scene?.id);
            continue;
          }
          const maxSceneDistance = this.despawnRadius + scene.radius + 240;
          if (distanceSquared(scene.x, scene.y, this.player.x, this.player.y) > maxSceneDistance * maxSceneDistance) {
            this.activeSceneLookup.delete(scene.id);
            continue;
          }
          kept.push(scene);
          this.activeSceneCounts.set(scene.entryId, (this.activeSceneCounts.get(scene.entryId) ?? 0) + 1);
        }
        this.activeScenes = kept;
      }

      despawnFarBodies() {
        const maxDistanceSq = this.despawnRadius * this.despawnRadius;
        for (let i = this.world.bodies.length - 1; i >= 0; i--) {
          const body = this.world.bodies[i];
          if (body === this.player || body.isRemoved) continue;
          if (distanceSquared(body.x, body.y, this.player.x, this.player.y) > maxDistanceSq) {
            this.world.removeBody(body);
          }
        }
        this.world.cleanupRemovedBodies();
      }

      canPlaceBody(x, y, spec, extraGap = 0) {
        for (let i = 0; i < this.world.bodies.length; i++) {
          const body = this.world.bodies[i];
          if (body.isRemoved) continue;
          const minDistance = body.colliderRadius + (spec.colliderRadius ?? spec.radius) + (spec.placementGap ?? 0) + extraGap;
          if (distanceSquared(x, y, body.x, body.y) < minDistance * minDistance) {
            return false;
          }
        }
        return true;
      }

      isPlacementFarEnoughFromPlayer(x, y, spec, minPlayerDistance = 0) {
        if (!(minPlayerDistance > 0)) {
          return true;
        }
        const required = minPlayerDistance + (spec.colliderRadius ?? spec.radius ?? 0);
        return distanceSquared(x, y, this.player.x, this.player.y) >= required * required;
      }

      canPlacePlacementSet(placements, extraGap = 0, pairGapScale = 0.2) {
        for (let i = 0; i < placements.length; i++) {
          const placement = placements[i];
          const spec = placement.spec;
          const minPlayerDistance = placement.minPlayerDistance ?? 0;
          if (!this.isPlacementFarEnoughFromPlayer(placement.x, placement.y, spec, minPlayerDistance)) {
            return false;
          }
          if (!this.canPlaceBody(placement.x, placement.y, spec, (placement.extraGap ?? 0) + extraGap)) {
            return false;
          }
          for (let j = 0; j < i; j++) {
            const other = placements[j];
            const gap = (((spec.placementGap ?? 0) + (other.spec.placementGap ?? 0)) * 0.5 * pairGapScale) + extraGap;
            const minDistance = (spec.colliderRadius ?? spec.radius) + (other.spec.colliderRadius ?? other.spec.radius) + gap;
            if (distanceSquared(placement.x, placement.y, other.x, other.y) < minDistance * minDistance) {
              return false;
            }
          }
        }
        return true;
      }

      spawnPlacementGroup(scene, placements, options = {}) {
        if (!placements || placements.length <= 0) {
          return [];
        }
        const extraGap = options.extraGap ?? 0;
        const pairGapScale = options.pairGapScale ?? 0.2;
        if (!this.canPlacePlacementSet(placements, extraGap, pairGapScale)) {
          return [];
        }
        const bodies = [];
        for (let i = 0; i < placements.length; i++) {
          const placement = placements[i];
          const body = this.registerProceduralBody(this.buildBody(placement.x, placement.y, placement.spec), scene);
          bodies.push(body);
        }
        return bodies;
      }

      spawnScatterSceneBodies(scene, desiredCount, createPlacement, options = {}) {
        const created = [];
        const maxAttemptsPerBody = options.maxAttemptsPerBody ?? 16;
        for (let index = 0; index < desiredCount; index++) {
          let placed = false;
          for (let attempt = 0; attempt < maxAttemptsPerBody; attempt++) {
            const placement = createPlacement(index, attempt, created);
            if (!placement || !placement.spec) {
              continue;
            }
            const spec = placement.spec;
            const minPlayerDistance = placement.minPlayerDistance ?? options.minPlayerDistance ?? 0;
            const extraGap = placement.extraGap ?? options.extraGap ?? 0;
            if (!this.isPlacementFarEnoughFromPlayer(placement.x, placement.y, spec, minPlayerDistance)) {
              continue;
            }
            if (!this.canPlaceBody(placement.x, placement.y, spec, extraGap)) {
              continue;
            }
            const body = this.registerProceduralBody(this.buildBody(placement.x, placement.y, spec), scene);
            created.push(body);
            placed = true;
            break;
          }
          if (!placed && options.stopOnFailure) {
            break;
          }
        }
        return created;
      }

      getSpecPlacementRadius(spec) {
        return spec?.colliderRadius ?? spec?.radius ?? 0;
      }

      getFormationJitterAmount(spec, options = {}, referenceSpacing = 0) {
        const requestedJitter = Math.max(0, options.jitter ?? 8);
        if (!(requestedJitter > 0)) {
          return 0;
        }
        const radius = this.getSpecPlacementRadius(spec);
        const spacingLimit = referenceSpacing > 0 ? referenceSpacing * 0.18 : requestedJitter;
        const radiusLimit = Math.max(0, radius * 0.35);
        return Math.min(requestedJitter, spacingLimit, radiusLimit);
      }

      buildLinearFormationPlacements(specs, centerX, centerY, options = {}, shared = {}) {
        const placements = [];
        const dirX = shared.dirX ?? 1;
        const dirY = shared.dirY ?? 0;
        const sideX = shared.sideX ?? 0;
        const sideY = shared.sideY ?? 1;
        const spacing = Math.max(0, options.spacing ?? 24);
        const rowSpacing = Math.max(0, options.rowSpacing ?? Math.max(16, spacing * 0.72));
        const unitsPerRow = Math.max(1, Math.round(options.unitsPerRow ?? 2));
        let forwardOffset = 0;
        let previousRowMaxRadius = 0;

        for (let rowStart = 0; rowStart < specs.length; rowStart += unitsPerRow) {
          const rowSpecs = specs.slice(rowStart, rowStart + unitsPerRow);
          const rowRadii = rowSpecs.map((spec) => this.getSpecPlacementRadius(spec));
          const rowMaxRadius = rowRadii.reduce((maxValue, value) => Math.max(maxValue, value), 0);
          if (rowStart > 0) {
            forwardOffset += previousRowMaxRadius + rowMaxRadius + rowSpacing;
          }

          const lateralCenters = [];
          if (rowSpecs.length > 0) {
            const rowWidth = rowRadii.reduce((total, radius, index) => {
              if (index === 0) {
                return radius * 2;
              }
              return total + rowRadii[index - 1] + radius + spacing;
            }, 0);
            let lateralCursor = -rowWidth * 0.5 + rowRadii[0];
            lateralCenters.push(lateralCursor);
            for (let i = 1; i < rowSpecs.length; i++) {
              lateralCursor += rowRadii[i - 1] + rowRadii[i] + spacing;
              lateralCenters.push(lateralCursor);
            }
          }

          for (let i = 0; i < rowSpecs.length; i++) {
            const spec = rowSpecs[i];
            const lateral = lateralCenters[i] ?? 0;
            const jitter = this.getFormationJitterAmount(spec, options, spacing);
            const forwardJitter = jitter * 0.5;
            const x = centerX + sideX * lateral - dirX * forwardOffset + sideX * randomBetween(-jitter, jitter) - dirX * randomBetween(-forwardJitter, forwardJitter);
            const y = centerY + sideY * lateral - dirY * forwardOffset + sideY * randomBetween(-jitter, jitter) - dirY * randomBetween(-forwardJitter, forwardJitter);
            placements.push({
              x,
              y,
              spec,
              minPlayerDistance: options.minPlayerDistance ?? 0,
              extraGap: options.extraGap ?? 0
            });
          }

          previousRowMaxRadius = rowMaxRadius;
        }

        return placements;
      }

      buildRingFormationPlacements(specs, centerX, centerY, options = {}, shared = {}) {
        const placements = [];
        if (specs.length <= 0) {
          return placements;
        }
        const spacing = Math.max(0, options.spacing ?? 24);
        const desiredRingRadius = Math.max(20, options.ringRadius ?? Math.max(20, spacing * 1.1));
        const phase = options.phase ?? randomBetween(-0.2, 0.2);
        const radii = specs.map((spec) => this.getSpecPlacementRadius(spec));
        let requiredCircumference = 0;
        for (let i = 0; i < specs.length; i++) {
          const nextRadius = radii[(i + 1) % specs.length];
          requiredCircumference += radii[i] + nextRadius + spacing;
        }
        const effectiveRingRadius = Math.max(desiredRingRadius, requiredCircumference / (Math.PI * 2));
        let angleCursor = phase;

        for (let i = 0; i < specs.length; i++) {
          const spec = specs[i];
          const jitter = this.getFormationJitterAmount(spec, options, spacing);
          const radialJitter = Math.min(jitter * 0.6, Math.max(0, radii[i] * 0.25));
          const tangentJitter = jitter > 0 ? randomBetween(-jitter, jitter) / Math.max(1, effectiveRingRadius) : 0;
          const angle = angleCursor + tangentJitter;
          const radius = effectiveRingRadius + randomBetween(-radialJitter, radialJitter);
          placements.push({
            x: centerX + Math.cos(angle) * radius,
            y: centerY + Math.sin(angle) * radius,
            spec,
            minPlayerDistance: options.minPlayerDistance ?? 0,
            extraGap: options.extraGap ?? 0
          });
          if (i < specs.length - 1) {
            angleCursor += (radii[i] + radii[i + 1] + spacing) / Math.max(1, effectiveRingRadius);
          }
        }

        return placements;
      }

      buildFormationPlacements(count, createSpecForIndex, centerX, centerY, options = {}) {
        const layout = options.layout ?? "line";
        const travelAngle = options.travelAngle ?? randomBetween(0, Math.PI * 2);
        const travelSpeed = options.anchorSpeed ?? sampleSpawnRange(options.travelSpeedRange, 120);
        const anchorVX = options.anchorVX ?? Math.cos(travelAngle) * travelSpeed;
        const anchorVY = options.anchorVY ?? Math.sin(travelAngle) * travelSpeed;
        const dirX = Math.cos(travelAngle);
        const dirY = Math.sin(travelAngle);
        const sideX = -dirY;
        const sideY = dirX;
        const shared = {
          travelAngle,
          anchorVX,
          anchorVY,
          dirX,
          dirY,
          sideX,
          sideY
        };
        const specs = [];

        for (let i = 0; i < count; i++) {
          const spec = createSpecForIndex(i, shared);
          if (spec) {
            specs.push(spec);
          }
        }

        if (layout === "ring") {
          return this.buildRingFormationPlacements(specs, centerX, centerY, options, shared);
        }

        return this.buildLinearFormationPlacements(specs, centerX, centerY, options, shared);
      }

      spawnFormationGroup(scene, count, createSpecForIndex, centerX, centerY, options = {}) {
        const placements = this.buildFormationPlacements(count, createSpecForIndex, centerX, centerY, options);
        return this.spawnPlacementGroup(scene, placements, { extraGap: options.extraGap ?? 0, pairGapScale: options.pairGapScale ?? 0.18 });
      }

      spawnPatrolGroup(scene, kind, count, centerX, centerY, options = {}) {
        let remainingLargeCount = Math.max(0, Math.round(options.largeCount ?? 0));
        const groupId = options.groupId ?? this.nextSchoolId++;
        return this.spawnFormationGroup(
          scene,
          count,
          (index, shared) => {
            if (kind === "flea") {
              return this.createFleaSpec(groupId, shared.anchorVX, shared.anchorVY, {
                angle: shared.travelAngle + randomBetween(-0.18, 0.18)
              });
            }
            const largeChance = options.largeChance ?? 0;
            const wantsLarge = remainingLargeCount > 0 || Math.random() < largeChance;
            if (wantsLarge) {
              remainingLargeCount = Math.max(0, remainingLargeCount - 1);
            }
            if (kind === "wasp") {
              return this.createWaspSpec(groupId, wantsLarge ? "large" : "small", shared.anchorVX, shared.anchorVY, {
                angle: shared.travelAngle + randomBetween(-0.16, 0.16)
              });
            }
            if (kind === "dragonfly") {
              return this.createDragonflySpec(groupId, wantsLarge ? "large" : "small", shared.anchorVX, shared.anchorVY, {
                angle: shared.travelAngle + randomBetween(-0.16, 0.16)
              });
            }
            return null;
          },
          centerX,
          centerY,
          options
        );
      }

      spawnConvoyGroup(scene, centerX, centerY, options = {}) {
        const escortCount = Math.max(0, Math.round(options.escortCount ?? 2));
        const minEscortCount = Math.max(0, Math.round(options.minEscortCount ?? 1));
        const travelAngle = options.travelAngle ?? randomBetween(0, Math.PI * 2);
        const travelSpeed = options.anchorSpeed ?? sampleSpawnRange(options.travelSpeedRange, 40);
        const vx = options.vx ?? Math.cos(travelAngle) * travelSpeed;
        const vy = options.vy ?? Math.sin(travelAngle) * travelSpeed;
        const stationSpec = this.createStationSpec({
          vx,
          vy,
          angle: travelAngle,
          maxCruiseSpeed: Math.max(34, travelSpeed + randomBetween(4, 10)),
          hostPlanet: options.hostPlanet ?? null
        });
        if (!this.isPlacementFarEnoughFromPlayer(centerX, centerY, stationSpec, options.minPlayerDistance ?? 0)) {
          return { station: null, escorts: [] };
        }
        if (!this.canPlaceBody(centerX, centerY, stationSpec, options.extraGap ?? 0)) {
          return { station: null, escorts: [] };
        }
        const station = this.registerProceduralBody(this.buildBody(centerX, centerY, stationSpec), scene);
        const escortPlacements = [];
        const dirX = Math.cos(travelAngle);
        const dirY = Math.sin(travelAngle);
        const sideX = -dirY;
        const sideY = dirX;
        const baseBack = station.radius + 48;
        for (let i = 0; i < escortCount; i++) {
          const row = Math.floor(i / 2);
          const side = i % 2 === 0 ? 1 : -1;
          const offsetX = -dirX * (baseBack + row * 18) + sideX * (56 + row * 10) * side;
          const offsetY = -dirY * (baseBack + row * 18) + sideY * (56 + row * 10) * side;
          const spec = this.createMerchantEscortSpec(station.vx, station.vy, station.color, {
            assignedMerchantId: station.id,
            squadId: station.id,
            angle: travelAngle + randomBetween(-0.12, 0.12)
          });
          escortPlacements.push({
            x: centerX + offsetX + randomBetween(-8, 8),
            y: centerY + offsetY + randomBetween(-8, 8),
            spec,
            minPlayerDistance: options.minPlayerDistance ?? 0,
            extraGap: options.extraGap ?? 0
          });
        }
        const escorts = this.spawnPlacementGroup(scene, escortPlacements, { extraGap: options.extraGap ?? 0 });
        if (escorts.length < minEscortCount) {
          this.removeBodies([station, ...escorts]);
          scene.activeBodyCount = 0;
          scene.bodyIds.clear();
          return { station: null, escorts: [] };
        }
        return { station, escorts };
      }

      spawnOrbitingMerchantScene(scene, host, options = {}) {
        if (!host || host.isRemoved) {
          return { station: null, escorts: [] };
        }
        if (StationShip.isPlanetReservedByOther(host)) {
          return { station: null, escorts: [] };
        }
        const angle = options.angle ?? randomBetween(0, Math.PI * 2);
        const stationSpec = this.createStationSpec({ hostPlanet: host });
        const orbitalRadius = host.radius + stationSpec.preferredPlanetOffset + randomBetween(-18, 28);
        const x = host.x + Math.cos(angle) * orbitalRadius;
        const y = host.y + Math.sin(angle) * orbitalRadius;
        const tangentAngle = angle + stationSpec.orbitDirection * Math.PI * 0.5;
        const orbitSpeed = Math.sqrt((this.world.G * host.mass) / Math.max(orbitalRadius, host.radius + 20)) * randomBetween(0.86, 0.99);
        return this.spawnConvoyGroup(scene, x, y, {
          escortCount: options.escortCount ?? 2,
          minEscortCount: options.minEscortCount ?? 1,
          travelAngle: tangentAngle,
          vx: host.vx + Math.cos(tangentAngle) * orbitSpeed,
          vy: host.vy + Math.sin(tangentAngle) * orbitSpeed,
          minPlayerDistance: options.minPlayerDistance ?? 1500,
          hostPlanet: host,
          extraGap: options.extraGap ?? 12
        });
      }

      spawnAsteroidFieldBodies(scene, centerX, centerY, options = {}) {
        const count = Math.max(0, Math.round(options.count ?? 0));
        const fieldRadius = Math.max(40, options.fieldRadius ?? 320);
        const driftAngle = options.driftAngle ?? randomBetween(0, Math.PI * 2);
        const driftSpeed = options.driftSpeed ?? sampleSpawnRange(options.driftSpeedRange, 12);
        const driftVX = Math.cos(driftAngle) * driftSpeed;
        const driftVY = Math.sin(driftAngle) * driftSpeed;
        const largeChance = clamp(options.largeChance ?? 0.18, 0, 1);
        const giantChance = clamp(options.giantChance ?? 0, 0, 1 - largeChance);
        const minPlayerDistance = options.minPlayerDistance ?? 0;
        const localSpeedMin = Array.isArray(options.localSpeedRange) ? options.localSpeedRange[0] : 0;
        const localSpeedMax = Array.isArray(options.localSpeedRange) ? options.localSpeedRange[1] : 20;
        return this.spawnScatterSceneBodies(
          scene,
          count,
          () => {
            const angle = randomBetween(0, Math.PI * 2);
            const radius = Math.sqrt(Math.random()) * fieldRadius;
            const templateRoll = Math.random();
            let templateId = "asteroid";
            if (templateRoll < giantChance) {
              templateId = "asteroidGiant";
            } else if (templateRoll < giantChance + largeChance) {
              templateId = "asteroidLarge";
            }
            const localAngle = randomBetween(0, Math.PI * 2);
            const localSpeed = randomBetween(localSpeedMin, localSpeedMax);
            const spec = this.createEntitySpec(templateId, {
              vx: driftVX + Math.cos(localAngle) * localSpeed,
              vy: driftVY + Math.sin(localAngle) * localSpeed,
              angle: randomBetween(0, Math.PI * 2),
              angularVelocity: randomBetween(-0.7, 0.7)
            });
            return {
              x: centerX + Math.cos(angle) * radius,
              y: centerY + Math.sin(angle) * radius,
              spec,
              minPlayerDistance,
              extraGap: options.extraGap ?? 0
            };
          },
          {
            maxAttemptsPerBody: options.maxAttemptsPerBody ?? 16,
            minPlayerDistance,
            extraGap: options.extraGap ?? 0
          }
        );
      }

      spawnOrbitingAsteroidBand(scene, host, count, options = {}) {
        const created = [];
        const flowDirection = options.flowDirection ?? (host.orbiterFlowDirection ?? (Math.random() < 0.5 ? -1 : 1));
        host.orbiterFlowDirection = flowDirection;
        const bandStart = options.bandStart ?? host.radius + 180;
        const bandEnd = Math.max(bandStart + 40, options.bandEnd ?? host.radius + 460);
        const largeChance = clamp(options.largeChance ?? 0.18, 0, 1);
        const giantChance = clamp(options.giantChance ?? 0, 0, 1 - largeChance);
        const minPlayerDistance = options.minPlayerDistance ?? 0;

        for (let i = 0; i < count; i++) {
          let body = null;
          for (let attempt = 0; attempt < 18; attempt++) {
            const angle = randomBetween(0, Math.PI * 2);
            const orbitalRadius = randomBetween(bandStart, bandEnd);
            const x = host.x + Math.cos(angle) * orbitalRadius;
            const y = host.y + Math.sin(angle) * orbitalRadius;
            if (!this.isPlacementFarEnoughFromPlayer(x, y, { radius: 8, colliderRadius: 8 }, minPlayerDistance)) {
              continue;
            }
            const templateRoll = Math.random();
            let templateId = "asteroid";
            if (templateRoll < giantChance) {
              templateId = "asteroidGiant";
            } else if (templateRoll < giantChance + largeChance) {
              templateId = "asteroidLarge";
            }
            const spec = this.createEntitySpec(templateId, {
              placementGap: 22,
              hostPlanet: host,
              orbitBandRadius: orbitalRadius
            });
            const tangentAngle = angle + flowDirection * Math.PI * 0.5 + randomBetween(-0.04, 0.04);
            const orbitSpeed = Math.sqrt((this.world.G * host.mass) / Math.max(orbitalRadius, host.radius + 28)) * randomBetween(0.95, 1.04);
            spec.vx = host.vx + Math.cos(tangentAngle) * orbitSpeed + randomBetween(-1.5, 1.5);
            spec.vy = host.vy + Math.sin(tangentAngle) * orbitSpeed + randomBetween(-1.5, 1.5);
            if (!this.canPlaceBody(x, y, spec, options.extraGap ?? 10)) {
              continue;
            }
            body = this.registerProceduralBody(this.buildBody(x, y, spec), scene);
            created.push(body);
            break;
          }
          if (!body && options.stopOnFailure) {
            break;
          }
        }

        return created;
      }

      spawnScrapScatter(scene, centerX, centerY, count, options = {}) {
        const fieldRadius = Math.max(20, options.fieldRadius ?? 180);
        const speedMin = Array.isArray(options.speedRange) ? options.speedRange[0] : 6;
        const speedMax = Array.isArray(options.speedRange) ? options.speedRange[1] : 28;
        return this.spawnScatterSceneBodies(
          scene,
          count,
          () => {
            const angle = randomBetween(0, Math.PI * 2);
            const radius = Math.sqrt(Math.random()) * fieldRadius;
            const speed = randomBetween(speedMin, speedMax);
            return {
              x: centerX + Math.cos(angle) * radius,
              y: centerY + Math.sin(angle) * radius,
              spec: this.createEntitySpec("scrap", {
                vx: Math.cos(angle) * speed + randomBetween(-6, 6),
                vy: Math.sin(angle) * speed + randomBetween(-6, 6)
              }),
              minPlayerDistance: options.minPlayerDistance ?? 0,
              extraGap: options.extraGap ?? 0
            };
          },
          {
            maxAttemptsPerBody: options.maxAttemptsPerBody ?? 14,
            minPlayerDistance: options.minPlayerDistance ?? 0,
            extraGap: options.extraGap ?? 0
          }
        );
      }

      spawnCoinScatter(scene, centerX, centerY, count, options = {}) {
        const fieldRadius = Math.max(16, options.fieldRadius ?? 160);
        const speedMin = Array.isArray(options.speedRange) ? options.speedRange[0] : 8;
        const speedMax = Array.isArray(options.speedRange) ? options.speedRange[1] : 26;
        const templateId = options.templateId ?? "coin";
        return this.spawnScatterSceneBodies(
          scene,
          count,
          () => {
            const angle = randomBetween(0, Math.PI * 2);
            const radius = Math.sqrt(Math.random()) * fieldRadius;
            const speed = randomBetween(speedMin, speedMax);
            return {
              x: centerX + Math.cos(angle) * radius,
              y: centerY + Math.sin(angle) * radius,
              spec: this.createEntitySpec(templateId, {
                vx: Math.cos(angle) * speed + randomBetween(-4, 4),
                vy: Math.sin(angle) * speed + randomBetween(-4, 4),
                maxLifetime: options.maxLifetime ?? (templateId === "blueCoin" ? 28 : 18)
              }),
              minPlayerDistance: options.minPlayerDistance ?? 0,
              extraGap: options.extraGap ?? 0
            };
          },
          {
            maxAttemptsPerBody: options.maxAttemptsPerBody ?? 12,
            minPlayerDistance: options.minPlayerDistance ?? 0,
            extraGap: options.extraGap ?? 0
          }
        );
      }

      createSceneRecord(entry, biomeState, x, y, radius, intensity) {
        return {
          id: this.nextSceneId++,
          entryId: entry.id,
          clusterId: entry.clusterId,
          biomeId: biomeState.id,
          x,
          y,
          radius,
          intensity,
          activeBodyCount: 0,
          bodyIds: new Set(),
          createdAt: this.time
        };
      }

      activateScene(scene) {
        if (!scene || scene.activeBodyCount <= 0) {
          return false;
        }
        this.activeScenes.push(scene);
        this.activeSceneLookup.set(scene.id, scene);
        this.activeSceneCounts.set(scene.entryId, (this.activeSceneCounts.get(scene.entryId) ?? 0) + 1);
        return true;
      }

      createSceneContext(scene, biomeState, entry, intensity) {
        const createdBodies = [];
        return {
          field: this,
          world: this.world,
          player: this.player,
          scene,
          biome: biomeState,
          entry,
          params: entry.params ?? {},
          intensity,
          createdBodies,
          getRemainingBodyBudget: () => Math.max(0, this.maxProceduralBodies - this.getProceduralCount()),
          placeTemplate: (templateId, x, y, overrides = {}, options = {}) => {
            const spec = this.createEntitySpec(templateId, overrides);
            if (!spec) return null;
            const minPlayerDistance = options.minPlayerDistance ?? 0;
            const extraGap = options.extraGap ?? 0;
            if (!this.isPlacementFarEnoughFromPlayer(x, y, spec, minPlayerDistance)) return null;
            if (!this.canPlaceBody(x, y, spec, extraGap)) return null;
            const body = this.registerProceduralBody(this.buildBody(x, y, spec), scene);
            createdBodies.push(body);
            return body;
          },
          spawnFormation: (centerX, centerY, count, createSpecForIndex, options = {}) => {
            const bodies = this.spawnFormationGroup(scene, count, createSpecForIndex, centerX, centerY, options);
            createdBodies.push(...bodies);
            return bodies;
          },
          spawnPatrol: (kind, count, centerX, centerY, options = {}) => {
            const bodies = this.spawnPatrolGroup(scene, kind, count, centerX, centerY, options);
            createdBodies.push(...bodies);
            return bodies;
          },
          spawnConvoy: (centerX, centerY, options = {}) => {
            const result = this.spawnConvoyGroup(scene, centerX, centerY, options);
            if (result.station) createdBodies.push(result.station);
            if (result.escorts.length > 0) createdBodies.push(...result.escorts);
            return result;
          },
          spawnOrbitingMerchant: (host, options = {}) => {
            const result = this.spawnOrbitingMerchantScene(scene, host, options);
            if (result.station) createdBodies.push(result.station);
            if (result.escorts.length > 0) createdBodies.push(...result.escorts);
            return result;
          },
          spawnAsteroidField: (centerX, centerY, options = {}) => {
            const bodies = this.spawnAsteroidFieldBodies(scene, centerX, centerY, options);
            createdBodies.push(...bodies);
            return bodies;
          },
          spawnOrbitingAsteroids: (host, count, options = {}) => {
            const bodies = this.spawnOrbitingAsteroidBand(scene, host, count, options);
            createdBodies.push(...bodies);
            return bodies;
          },
          spawnScrapScatter: (centerX, centerY, count, options = {}) => {
            const bodies = this.spawnScrapScatter(scene, centerX, centerY, count, options);
            createdBodies.push(...bodies);
            return bodies;
          },
          spawnCoinScatter: (centerX, centerY, count, options = {}) => {
            const bodies = this.spawnCoinScatter(scene, centerX, centerY, count, { ...options, templateId: "coin" });
            createdBodies.push(...bodies);
            return bodies;
          },
          spawnBlueCoinScatter: (centerX, centerY, count, options = {}) => {
            const bodies = this.spawnCoinScatter(scene, centerX, centerY, count, { ...options, templateId: "blueCoin" });
            createdBodies.push(...bodies);
            return bodies;
          },
          removeBodies: (bodies = []) => {
            this.removeBodies(bodies);
          },
          rollback: () => {
            this.removeBodies(createdBodies);
            scene.activeBodyCount = 0;
            scene.bodyIds.clear();
            createdBodies.length = 0;
          }
        };
      }

      getClusterSceneRadius(cluster, intensity) {
        const baseRadius = sampleSpawnRange(cluster.radiusRange, 420);
        return baseRadius * lerp(0.86, 1.16, computeSpawnSceneIntensityBlend(intensity));
      }

      canReserveScene(x, y, radius, layer) {
        for (let i = 0; i < this.activeScenes.length; i++) {
          const scene = this.activeScenes[i];
          const existingCluster = this.clusterDefinitions[scene.clusterId];
          const existingLayer = existingCluster?.layer ?? "activity";
          const factor = computeSpawnSceneSeparationFactor(layer, existingLayer);
          const minDistance = (radius + scene.radius) * factor;
          if (distanceSquared(x, y, scene.x, scene.y) < minDistance * minDistance) {
            return false;
          }
        }
        return true;
      }

      pickSpawnEntryForBiome(biomeState, distanceFromPlayer, remainingBudget) {
        const ecology = this.getBiomeEcology(biomeState.id);
        const candidates = [];

        for (let i = 0; i < ecology.entries.length; i++) {
          const entry = ecology.entries[i];
          const cluster = this.clusterDefinitions[entry.clusterId];
          if (!cluster) continue;
          const minDistance = entry.minDistanceFromPlayer ?? 0;
          const maxDistance = entry.maxDistanceFromPlayer ?? (this.spawnRadius - 120);
          if (distanceFromPlayer < minDistance || distanceFromPlayer > maxDistance) {
            continue;
          }
          const activeCount = this.activeSceneCounts.get(entry.id) ?? 0;
          if (activeCount >= entry.maxActive) {
            continue;
          }
          const minBudget = entry.minBudget ?? Math.max(1, Math.floor((cluster.estimatedBodies ?? 4) * 0.45));
          if (remainingBudget < minBudget) {
            continue;
          }
          let weight = Math.max(0, entry.weight ?? 0);
          if (!(weight > 0)) continue;
          if (activeCount < entry.targetActive) {
            weight *= 1 + (entry.targetActive - activeCount) * 0.95;
          } else {
            weight *= Math.max(0.15, 1 - (activeCount - entry.targetActive) * 0.35);
          }
          if ((cluster.layer ?? "activity") === "terrain" && this.activeScenes.length < this.getDesiredSceneBudget() * 0.65) {
            weight *= 1.12;
          }
          candidates.push({ entry, weight });
        }

        const chosen = chooseWeightedSpawnEntry(candidates);
        return chosen?.entry ?? null;
      }

      attemptSpawnScene(options = {}) {
        if (this.getProceduralCount() >= this.maxProceduralBodies) {
          return false;
        }

        const bootstrap = !!options.bootstrap;
        const movementAngle = Number.isFinite(options.movementAngle) ? options.movementAngle : null;
        const attempts = bootstrap ? 28 : 18;

        for (let attempt = 0; attempt < attempts; attempt++) {
          const useMovementBias = movementAngle != null && Math.random() < (bootstrap ? 0.38 : 0.72);
          const angle = useMovementBias
            ? movementAngle + randomBetween(-(bootstrap ? Math.PI : 1.15), bootstrap ? Math.PI : 1.15)
            : randomBetween(0, Math.PI * 2);
          const baseMinDistance = bootstrap ? 900 : 1050;
          const baseMaxDistance = this.spawnRadius - (bootstrap ? 540 : 220);
          const preferredDistance = useMovementBias
            ? this.spawnRadius - (bootstrap ? 860 : 420)
            : this.spawnRadius * (bootstrap ? 0.62 : 0.78);
          const distance = randomTriangular(baseMinDistance, baseMaxDistance, preferredDistance);
          let x = this.player.x + Math.cos(angle) * distance;
          let y = this.player.y + Math.sin(angle) * distance;
          const biomeState = this.getBiomeStateAt(x, y);
          const remainingBudget = this.maxProceduralBodies - this.getProceduralCount();
          const entry = this.pickSpawnEntryForBiome(biomeState, distance, remainingBudget);
          if (!entry) {
            continue;
          }
          const cluster = this.clusterDefinitions[entry.clusterId];
          if (!cluster) {
            continue;
          }
          const intensity = sampleSpawnRange(entry.intensityRange, 1);
          const sceneRadius = this.getClusterSceneRadius(cluster, intensity);
          const minDistance = entry.minDistanceFromPlayer ?? 0;
          const maxDistance = Math.min(entry.maxDistanceFromPlayer ?? (this.spawnRadius - 120), this.spawnRadius - sceneRadius - 120);
          if (!(maxDistance > minDistance + 40)) {
            continue;
          }
          const clampedDistance = clamp(distance, minDistance, maxDistance);
          x = this.player.x + Math.cos(angle) * clampedDistance;
          y = this.player.y + Math.sin(angle) * clampedDistance;
          const sceneLayer = entry.layer ?? cluster.layer ?? "activity";
          if (!this.canReserveScene(x, y, sceneRadius, sceneLayer)) {
            continue;
          }

          const scene = this.createSceneRecord(entry, biomeState, x, y, sceneRadius, intensity);
          const ctx = this.createSceneContext(scene, biomeState, entry, intensity);
          const success = !!cluster.spawn(ctx, x, y, intensity);
          if (!success || scene.activeBodyCount <= 0) {
            ctx.rollback();
            continue;
          }

          this.activateScene(scene);
          return true;
        }

        return false;
      }

      spawnInitialBodies() {
        this.refreshCurrentBiomeState();
        this.cleanupSceneRegistry();
        this.spawnAccumulator = 0;
        this.ambientSpawnTimer = 0;
        this.lastPlayerX = this.player.x;
        this.lastPlayerY = this.player.y;

        const desiredBodies = this.getDesiredBodyBudget();
        const desiredScenes = this.getDesiredSceneBudget();
        const softSceneCap = Math.min(this.maxSceneBudget, desiredScenes + 2);
        let attempts = 0;
        let consecutiveFailures = 0;

        while (
          attempts < this.bootstrapSpawnAttempts &&
          this.getProceduralCount() < desiredBodies &&
          this.getActiveSceneCount() < softSceneCap
        ) {
          const success = this.attemptSpawnScene({ bootstrap: true });
          attempts++;
          if (success) {
            consecutiveFailures = 0;
          } else {
            consecutiveFailures++;
            if (consecutiveFailures > 40 && this.getActiveSceneCount() >= Math.max(4, desiredScenes - 2)) {
              break;
            }
          }
        }
      }

      update(dt = 1 / 60) {
        this.time += dt;
        this.despawnFarBodies();
        this.cleanupSceneRegistry();
        this.refreshCurrentBiomeState();

        const dx = this.player.x - this.lastPlayerX;
        const dy = this.player.y - this.lastPlayerY;
        const movedDistance = Math.hypot(dx, dy);
        const movementAngle = movedDistance > 0.01 ? Math.atan2(dy, dx) : null;

        if (!this.spawnsEnabled) {
          this.spawnAccumulator = 0;
          this.ambientSpawnTimer = 0;
          this.lastPlayerX = this.player.x;
          this.lastPlayerY = this.player.y;
          return;
        }

        if (movedDistance > 0.01) {
          this.spawnAccumulator += movedDistance;
        }

        let movementBudget = Math.min(this.maxSceneSpawnPerUpdate, Math.floor(this.spawnAccumulator / this.spawnStep));
        if (movementBudget > 0) {
          let spawned = 0;
          while (
            movementBudget > 0 &&
            this.getProceduralCount() < this.maxProceduralBodies &&
            this.getActiveSceneCount() < this.maxSceneBudget
          ) {
            if (!this.attemptSpawnScene({ movementAngle, bootstrap: false })) {
              this.spawnAccumulator = Math.min(this.spawnAccumulator, this.spawnStep * 0.85);
              break;
            }
            spawned++;
            movementBudget--;
            this.spawnAccumulator = Math.max(0, this.spawnAccumulator - this.spawnStep);
          }
          if (spawned > 0) {
            this.ambientSpawnTimer = 0;
          }
        }

        const desiredBodies = this.getDesiredBodyBudget();
        const desiredScenes = this.getDesiredSceneBudget();
        const bodyDeficit = Math.max(0, desiredBodies - this.getProceduralCount());
        const sceneDeficit = Math.max(0, desiredScenes - this.getActiveSceneCount());

        this.ambientSpawnTimer += dt;
        if ((bodyDeficit > 0 || sceneDeficit > 0) && this.ambientSpawnTimer >= this.ambientSpawnInterval) {
          let catchUpBudget = 1;
          if (this.getProceduralCount() === 0) {
            catchUpBudget = 3;
          } else if (bodyDeficit > this.expectedBodiesPerScene * 1.25 || sceneDeficit >= 2) {
            catchUpBudget = 2;
          }
          while (
            catchUpBudget > 0 &&
            this.getProceduralCount() < this.maxProceduralBodies &&
            this.getActiveSceneCount() < this.maxSceneBudget
          ) {
            if (!this.attemptSpawnScene({ bootstrap: true, movementAngle })) {
              break;
            }
            catchUpBudget--;
          }
          this.ambientSpawnTimer = 0;
        }

        this.lastPlayerX = this.player.x;
        this.lastPlayerY = this.player.y;
      }
    }

    // Aplica la faccion el impacto consequences dentro de esta parte de la logica.
    function applyFactionHitConsequences(attackerFaction, targetFaction, damageAmount = 1) {
      if (!attackerFaction || !targetFaction || attackerFaction === targetFaction) {
        return;
      }

      const scaled = clamp((damageAmount || 1) * 5, 6, 18);
      const equilibriumScaled = scaled * 0.7;

      if (targetFaction === "Avispas") {
        factionSystem.addRelation(attackerFaction, "Avispas", -scaled);
        factionSystem.addEquilibrium(attackerFaction, "Avispas", -equilibriumScaled);
        factionSystem.addRelation(attackerFaction, "Libélulas", scaled);
        factionSystem.addEquilibrium(attackerFaction, "Libélulas", equilibriumScaled);
      } else if (targetFaction === "Libélulas") {
        factionSystem.addRelation(attackerFaction, "Libélulas", -scaled);
        factionSystem.addEquilibrium(attackerFaction, "Libélulas", -equilibriumScaled);
        factionSystem.addRelation(attackerFaction, "Avispas", scaled);
        factionSystem.addEquilibrium(attackerFaction, "Avispas", equilibriumScaled);
      }
    }

    // Devuelve shop definition by la tecla calculado a partir del estado y los parametros recibidos.
    function getShopDefinitionByKey(key) {
      return shopCatalog.find((definition) => definition.key === key) ?? null;
    }

    // Devuelve available shop definitions calculado a partir del estado y los parametros recibidos.
    function getAvailableShopDefinitions(excludeKeys = []) {
      const exclude = new Set(excludeKeys);

      return shopCatalog.filter((definition) => {
        if (exclude.has(definition.key)) {
          return false;
        }

        if (definition.isAvailable && !definition.isAvailable(playerShip)) {
          return false;
        }

        return true;
      });
    }

    // Indica si el mercader ally cumple la condicion esperada para esta logica.
    function isMerchantAlly(station) {
      return !!station && factionSystem.getDisposition(playerShip.faction, station.faction) === "ally";
    }

    // Gestiona build el mercader service entry dentro del flujo principal del juego.
    function buildMerchantServiceEntry(definition, station) {
      return {
        kind: "service",
        key: definition.key,
        title: definition.title,
        description: definition.getDescription(playerShip),
        cost: isMerchantAlly(station) ? 0 : definition.getCost(playerShip),
        available: !definition.isAvailable || definition.isAvailable(playerShip)
      };
    }

    // Gestiona refresh shop entries dentro del flujo principal del juego.
    function refreshShopEntries() {
      const services = merchantServiceCatalog.map((definition) => buildMerchantServiceEntry(definition, shopState.station));
      const upgrades = shopState.offers.map((offer) => {
        const definition = getShopDefinitionByKey(offer.key);
        const isAvailable = !!definition && (!definition.isAvailable || definition.isAvailable(playerShip));
        return {
          kind: "upgrade",
          ...offer,
          available: isAvailable
        };
      });
      shopState.entries = [...services, ...upgrades];
    }

    // Gestiona build shop offer dentro del flujo principal del juego.
    function buildShopOffer(definition) {
      return {
        key: definition.key,
        title: definition.title,
        description: definition.getDescription(playerShip),
        cost: definition.getCost(playerShip)
      };
    }

    // Gestiona generate shop offer keys dentro del flujo principal del juego.
    function generateShopOfferKeys(count = 5, excludeKeys = [], preventKey = null) {
      let availableDefinitions = getAvailableShopDefinitions(excludeKeys);
      if (preventKey) {
        const withoutPreventKey = availableDefinitions.filter((definition) => definition.key !== preventKey);
        if (withoutPreventKey.length > 0) {
          availableDefinitions = withoutPreventKey;
        }
      }
      shuffleInPlace(availableDefinitions);
      return availableDefinitions.slice(0, Math.min(count, availableDefinitions.length)).map((definition) => definition.key);
    }

    // Gestiona ensure station shop inventory dentro del flujo principal del juego.
    function ensureStationShopInventory(station, count = 5) {
      if (!station) {
        return [];
      }

      const desiredCount = Math.max(0, count);
      const existingKeys = Array.isArray(station.shopOfferKeys)
        ? station.shopOfferKeys.filter((key, index, array) => {
            if (array.indexOf(key) !== index) {
              return false;
            }
            const definition = getShopDefinitionByKey(key);
            if (!definition) {
              return false;
            }
            return !definition.isAvailable || definition.isAvailable(playerShip);
          })
        : [];

      const missingCount = Math.max(0, desiredCount - existingKeys.length);
      const replacementKeys = missingCount > 0 ? generateShopOfferKeys(missingCount, existingKeys) : [];
      station.shopOfferKeys = [...existingKeys, ...replacementKeys].slice(0, desiredCount);
      return station.shopOfferKeys;
    }

    // Gestiona build shop offers from keys dentro del flujo principal del juego.
    function buildShopOffersFromKeys(offerKeys = []) {
      return offerKeys.map((key) => {
        const definition = getShopDefinitionByKey(key);
        return definition ? buildShopOffer(definition) : null;
      }).filter(Boolean);
    }

    // Sincroniza shop offers dentro de esta parte de la logica.
    function syncShopOffers(targetCount = 5, rerollIndex = -1, preventKey = null) {
      if (!shopState.station) {
        shopState.offers = [];
        return shopState.offers;
      }

      const station = shopState.station;
      const desiredCount = Math.max(1, targetCount);
      const offerKeys = [...ensureStationShopInventory(station, desiredCount)];

      if (rerollIndex >= 0) {
        while (offerKeys.length <= rerollIndex) {
          offerKeys.push(null);
        }

        const usedKeys = offerKeys.filter((key, index) => index !== rerollIndex && key != null);
        const replacementKeys = generateShopOfferKeys(1, usedKeys, preventKey ?? offerKeys[rerollIndex] ?? null);
        if (replacementKeys.length > 0) {
          offerKeys[rerollIndex] = replacementKeys[0];
        }
      }

      station.shopOfferKeys = offerKeys.filter((key, index, array) => !!getShopDefinitionByKey(key) && array.indexOf(key) === index).slice(0, desiredCount);
      shopState.offers = buildShopOffersFromKeys(station.shopOfferKeys);
      return shopState.offers;
    }

    // Gestiona generate shop offers dentro del flujo principal del juego.
    function generateShopOffers(count = 5) {
      if (!shopState.station) {
        return [];
      }
      return buildShopOffersFromKeys(ensureStationShopInventory(shopState.station, count));
    }

    // Gestiona refresh shop offers dentro del flujo principal del juego.
    function refreshShopOffers() {
      syncShopOffers(shopState.offers.length || shopState.station?.shopOfferKeys?.length || 5);
      if (shopState.isOpen) {
        refreshShopEntries();
      }
    }

    // Gestiona reroll shop offer dentro del flujo principal del juego.
    function rerollShopOffer(index) {
      const currentOffer = shopState.offers[index] ?? null;
      syncShopOffers(Math.max(shopState.offers.length, shopState.station?.shopOfferKeys?.length || 1), index, currentOffer?.key ?? null);
    }

    // Gestiona find los elementos cercanos station dentro del flujo principal del juego.
    function findNearbyStation() {
      if (!world.grid) {
        return null;
      }

      let nearestStation = null;
      let bestDistSq = Infinity;
      const queryRadius = 220;
      const stamp = world.gravityQueryStamp++;

      world.grid.forEachNearbyUnique(playerShip.x, playerShip.y, queryRadius, stamp, (body) => {
        if (body.isRemoved || body.kind !== "station") return;

        const interactionRadius = body.interactionRadius ?? (body.radius + 120);
        const distSq = distanceSquared(body.x, body.y, playerShip.x, playerShip.y);

        if (distSq <= interactionRadius * interactionRadius && distSq < bestDistSq) {
          nearestStation = body;
          bestDistSq = distSq;
        }
      });

      return nearestStation;
    }

    // Gestiona pick el cuerpo under cursor dentro del flujo principal del juego.
    function pickBodyUnderCursor(options = {}) {
      if (!world.grid) {
        return null;
      }

      const includePlayer = options.includePlayer ?? false;
      const includeProjectiles = options.includeProjectiles ?? false;
      const includeCoins = options.includeCoins ?? false;
      const pickRadius = options.pickRadius ?? 28;
      let bestBody = null;
      let bestScore = Infinity;
      const stamp = world.gravityQueryStamp++;

      world.grid.forEachNearbyUnique(mouse.worldX, mouse.worldY, pickRadius, stamp, (body) => {
        if (body.isRemoved) {
          return;
        }
        if (!includePlayer && body === playerShip) {
          return;
        }
        if (!includeProjectiles && body.kind === "projectile") {
          return;
        }
        if (!includeCoins && isCoinLike(body)) {
          return;
        }

        const dx = mouse.worldX - body.x;
        const dy = mouse.worldY - body.y;
        const dist = Math.hypot(dx, dy);
        const allowed = body.radius + pickRadius;
        if (dist > allowed) {
          return;
        }

        const score = Math.max(0, dist - body.radius) - Math.min(body.radius, 32) * 0.12;
        if (score < bestScore) {
          bestScore = score;
          bestBody = body;
        }
      });

      return bestBody;
    }

    // Gestiona find el cuerpo under cursor dentro del flujo principal del juego.
    function findBodyUnderCursor() {
      return pickBodyUnderCursor();
    }

    // Gestiona find manipulable el cuerpo under cursor dentro del flujo principal del juego.
    function findManipulableBodyUnderCursor() {
      return pickBodyUnderCursor({ includePlayer: true, includeCoins: false, includeProjectiles: false, pickRadius: 34 });
    }

    // Gestiona open shop dentro del flujo principal del juego.
    function openShop(station) {
      if (!station || !playerShip.isAlive || world.isGameOver) {
        return;
      }

      if (factionSystem.getDisposition(playerShip.faction, station.faction) === "enemy") {
        world.lastMerchantRefusalTimer = 2.8;
        audioDirector.onUiError("merchant-refusal");
        return;
      }

      shopState.isOpen = true;
      shopState.station = station;
      shopState.offers = generateShopOffers(5);
      refreshShopEntries();
      shopState.buttons = [];
      shopState.hoverIndex = -1;
      resetMenuScroll(shopState);
      audioDirector.onMenuOpen("shop");
    }

    // Gestiona close shop dentro del flujo principal del juego.
    function closeShop() {
      const wasOpen = shopState.isOpen;
      shopState.isOpen = false;
      shopState.station = null;
      shopState.offers = [];
      shopState.entries = [];
      shopState.buttons = [];
      shopState.hoverIndex = -1;
      resetMenuScroll(shopState);
      canvas.style.cursor = "crosshair";
      if (wasOpen) {
        audioDirector.onMenuClose("shop");
      }
    }

    // Gestiona attempt purchase entry dentro del flujo principal del juego.
    function attemptPurchaseEntry(index) {
      if (!shopState.isOpen) return false;

      const entry = shopState.entries[index];
      if (!entry || entry.available === false) {
        audioDirector.onUiError("shop-unavailable");
        return false;
      }
      if (playerShip.credits < entry.cost) {
        audioDirector.onUiError("shop-insufficient-credits");
        return false;
      }

      if (entry.kind === "service") {
        const definition = merchantServiceCatalog.find((service) => service.key === entry.key);
        if (!definition) {
          audioDirector.onUiError("shop-invalid-entry");
          return false;
        }
        if (definition.isAvailable && !definition.isAvailable(playerShip)) {
          audioDirector.onUiError("shop-service-unavailable");
          return false;
        }

        playerShip.credits -= entry.cost;
        definition.apply(playerShip);
        refreshShopEntries();
        audioDirector.onPurchase(entry);
        return true;
      }

      const offerIndex = Math.max(0, index - merchantServiceCatalog.length);
      const offer = shopState.offers[offerIndex];
      if (!offer) {
        audioDirector.onUiError("shop-invalid-offer");
        return false;
      }

      const definition = getShopDefinitionByKey(offer.key);
      if (!definition) {
        audioDirector.onUiError("shop-invalid-definition");
        return false;
      }
      if (definition.isAvailable && !definition.isAvailable(playerShip)) {
        audioDirector.onUiError("shop-upgrade-unavailable");
        return false;
      }

      playerShip.credits -= offer.cost;
      definition.apply(playerShip);
      if (shopState.station?.faction && offer.cost > 0) {
        factionSystem.addRelation(playerShip.faction, shopState.station.faction, offer.cost / 10);
      }
      rerollShopOffer(offerIndex);
      refreshShopOffers();
      refreshShopEntries();
      audioDirector.onPurchase(offer);
      return true;
    }

    // Gestiona menu hotkeys dentro del flujo principal del juego.
    function handleMenuHotkeys(e) {
      if (e.code === "KeyC") {
        if (!testCheats.testMode) {
          return;
        }
        if (e.repeat) {
          e.preventDefault();
          return;
        }
        cheatMenuState.isOpen = !cheatMenuState.isOpen;
        cheatMenuState.hoverIndex = -1;
        cheatMenuState.sliderHoverIndex = -1;

        cheatMenuState.sliders = [];

          audioDirector.onMenuOpen("cheats");
        } else {
          audioDirector.onMenuClose("cheats");
        }
        e.preventDefault();
        return;
      }

      if (e.code === "KeyA") {
        if (!testCheats.testMode) {
          return;
        }
        if (e.repeat) {
          e.preventDefault();
          return;
        }
        audioTensionDebugMenuState.isOpen = !audioTensionDebugMenuState.isOpen;
        resetMenuScroll(audioTensionDebugMenuState);
        if (audioTensionDebugMenuState.isOpen) {
          audioDirector.onMenuOpen("tension-debug");
        } else {
          audioDirector.onMenuClose("tension-debug");
        }
        e.preventDefault();
        return;
      }

      if (e.code === "KeyD" || e.code === "KeyB") {
        if (!testCheats.testMode) {
          return;
        }
        if (e.repeat) {
          e.preventDefault();
          return;
        }
        audioDebugMenuState.isOpen = !audioDebugMenuState.isOpen;
        audioDebugMenuState.hoverIndex = -1;
        resetMenuScroll(audioDebugMenuState);
        if (audioDebugMenuState.isOpen) {
          audioDirector.onMenuOpen("audio-debug");
        } else {
          audioDirector.onMenuClose("audio-debug");
        }
        e.preventDefault();
        return;
      }

      if (cheatMenuState.isOpen && testCheats.testMode && e.key === "Escape") {
        cheatMenuState.isOpen = false;
        cheatMenuState.hoverIndex = -1;
        cheatMenuState.sliderHoverIndex = -1;
        cheatMenuState.draggingSliderKey = null;
        cheatMenuState.buttons = [];
        cheatMenuState.sliders = [];
        audioDirector.onMenuClose("cheats");
        e.preventDefault();
        return;
      }

      if (audioTensionDebugMenuState.isOpen && testCheats.testMode && e.key === "Escape") {
        audioTensionDebugMenuState.isOpen = false;
        resetMenuScroll(audioTensionDebugMenuState);
        audioDirector.onMenuClose("tension-debug");
        e.preventDefault();
        return;
      }

      if (audioDebugMenuState.isOpen && testCheats.testMode && e.key === "Escape") {
        audioDebugMenuState.isOpen = false;
        audioDebugMenuState.hoverIndex = -1;
        resetMenuScroll(audioDebugMenuState);
        audioDirector.onMenuClose("audio-debug");
        e.preventDefault();
        return;
      }

      if (e.code === "KeyS") {
        if (!testCheats.testMode) {
          return;
        }
        if (e.repeat) {
          e.preventDefault();
          return;
        }
        audioChordOverlayState.isOpen = !audioChordOverlayState.isOpen;
        if (audioChordOverlayState.isOpen) {
          audioDirector.onMenuOpen("diagnostics");
        } else {
          audioDirector.onMenuClose("diagnostics");
        }
        e.preventDefault();
        return;
      }

      if (e.code === "KeyP") {
        if (testCheats.testMode) {
          return;
        }
        if (!shopState.isOpen && !factionMenuState.isOpen && !diagnosticsMenuState.isOpen && !world.isGameOver) {
          pauseState.manual = !pauseState.manual;
        }
        e.preventDefault();
        return;
      }

      if (e.code === "Tab") {
        if (shopState.isOpen || factionMenuState.isOpen) {
          e.preventDefault();
          return;
        }
        diagnosticsMenuState.isOpen = !diagnosticsMenuState.isOpen;
        pauseState.manual = false;
        resetMenuScroll(diagnosticsMenuState);
        if (diagnosticsMenuState.isOpen) {
          audioDirector.onMenuOpen("diagnostics");
        } else {
          audioDirector.onMenuClose("diagnostics");
        }
        e.preventDefault();
        return;
      }

      if (e.code === "KeyQ") {
        if (shopState.isOpen || diagnosticsMenuState.isOpen) {
          e.preventDefault();
          return;
        }
        factionMenuState.isOpen = !factionMenuState.isOpen;
        if (factionMenuState.isOpen) {
          pauseState.manual = false;
          resetMenuScroll(factionMenuState);
          audioDirector.onMenuOpen("factions");
        } else {
          audioDirector.onMenuClose("factions");
        }
        e.preventDefault();
        return;
      }

      if (e.code === "KeyE") {
        if (diagnosticsMenuState.isOpen) {
          e.preventDefault();
          return;
        }
        if (shopState.isOpen) {
          closeShop();
        } else if (!factionMenuState.isOpen) {
          const station = findNearbyStation();
          if (station && playerShip.isAlive) {
            openShop(station);
          }
        }

        e.preventDefault();
        return;
      }

      if (diagnosticsMenuState.isOpen && (e.key === "Escape" || e.code === "Tab")) {
        diagnosticsMenuState.isOpen = false;
        resetMenuScroll(diagnosticsMenuState);
        audioDirector.onMenuClose("diagnostics");
        e.preventDefault();
        return;
      }

      if (factionMenuState.isOpen && (e.key === "Escape" || e.code === "KeyQ")) {
        factionMenuState.isOpen = false;
        resetMenuScroll(factionMenuState);
        audioDirector.onMenuClose("factions");
        e.preventDefault();
        return;
      }

      const activeScrollableMenu = getActiveScrollableMenu();
      if (activeScrollableMenu) {
        const lineStep = 52;
        const pageStep = Math.max(120, (activeScrollableMenu.viewport?.h || 0) - 48);
        if (e.key === "ArrowDown") {
          scrollMenu(activeScrollableMenu, lineStep);
          e.preventDefault();
          return;
        }
        if (e.key === "ArrowUp") {
          scrollMenu(activeScrollableMenu, -lineStep);
          e.preventDefault();
          return;
        }
        if (e.key === "PageDown") {
          scrollMenu(activeScrollableMenu, pageStep);
          e.preventDefault();
          return;
        }
        if (e.key === "PageUp") {
          scrollMenu(activeScrollableMenu, -pageStep);
          e.preventDefault();
          return;
        }
        if (e.key === "Home") {
          activeScrollableMenu.scrollOffset = 0;
          e.preventDefault();
          return;
        }
        if (e.key === "End") {
          activeScrollableMenu.scrollOffset = Math.max(0, activeScrollableMenu.maxScroll || 0);
          e.preventDefault();
          return;
        }
      }

      if (!shopState.isOpen) {
        return;
      }

      if (e.key === "Escape") {
        closeShop();
        e.preventDefault();
        return;
      }

      if (/^[1-8]$/.test(e.key)) {
        attemptPurchaseEntry(Number(e.key) - 1);
        e.preventDefault();
      }
    }

    // Devuelve el canvas pointer calculado a partir del estado y los parametros recibidos.
    function getCanvasPointer(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * (canvas.width / rect.width),
        y: (event.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    canvas.addEventListener("mousemove", (event) => {
      const pointer = getCanvasPointer(event);
      mouse.x = pointer.x;
      mouse.y = pointer.y;
      updateMouseWorld();

      const cheatHover = updateCheatMenuHover(pointer);
      const audioDebugHover = updateAudioDebugMenuHover(pointer);
      const audioTensionHover = updateAudioTensionDebugMenuHover(pointer);
      if (!shopState.isOpen) {
        const pointerHover = cheatHover >= 0 || cheatHover === -2 || !!cheatMenuState.draggingSliderKey || audioDebugHover >= 0 || audioTensionHover;
        const menuOpen = factionMenuState.isOpen || diagnosticsMenuState.isOpen || audioDebugMenuState.isOpen || audioTensionDebugMenuState.isOpen || cheatMenuState.isOpen;
        canvas.style.cursor = pointerHover ? "pointer" : (menuOpen ? "default" : "crosshair");
        return;
      }

      let hoverIndex = -1;

      for (let i = 0; i < shopState.buttons.length; i++) {
        const button = shopState.buttons[i];
        if (
          pointer.x >= button.x &&
          pointer.x <= button.x + button.w &&
          pointer.y >= button.y &&
          pointer.y <= button.y + button.h
        ) {
          hoverIndex = button.index;
          break;
        }
      }

      shopState.hoverIndex = hoverIndex;
      canvas.style.cursor = hoverIndex >= 0 ? "pointer" : "default";
    });

    canvas.addEventListener("mouseleave", () => {
      shopState.hoverIndex = -1;
      audioDebugMenuState.hoverIndex = -1;
      audioTensionDebugMenuState.checkboxHover = false;
      cheatMenuState.hoverIndex = -1;
      cheatMenuState.sliderHoverIndex = -1;
      cheatMenuState.draggingSliderKey = null;
      mouse.left = false;
      mouse.right = false;
      mouse.brakeLockTarget = null;
      canvas.style.cursor = "default";
    });

    canvas.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    canvas.addEventListener("wheel", (event) => {
      const activeScrollableMenu = getActiveScrollableMenu();
      if (!activeScrollableMenu) return;
      scrollMenu(activeScrollableMenu, event.deltaY);
      event.preventDefault();
    }, { passive: false });

    canvas.addEventListener("mousedown", (event) => {
      const pointer = getCanvasPointer(event);
      mouse.x = pointer.x;
      mouse.y = pointer.y;
      updateMouseWorld();

      if (event.button === 0 && handleCheatMenuPointerDown(pointer)) {
        event.preventDefault();
        return;
      }

      if (event.button === 0 && handleAudioTensionDebugMenuPointerDown(pointer)) {
        event.preventDefault();
        return;
      }

      if (event.button === 0 && handleAudioDebugMenuPointerDown(pointer)) {
        event.preventDefault();
        return;
      }

      if (!shopState.isOpen) {
        if (event.button === 0) {
          mouse.left = true;
          event.preventDefault();
        } else if (event.button === 2) {
          mouse.right = true;
          mouse.brakeLockTarget = findBodyUnderCursor();
          event.preventDefault();
        }
        return;
      }

      if (event.button !== 0) {
        event.preventDefault();
        return;
      }

      for (let i = 0; i < shopState.buttons.length; i++) {
        const button = shopState.buttons[i];
        if (
          pointer.x >= button.x &&
          pointer.x <= button.x + button.w &&
          pointer.y >= button.y &&
          pointer.y <= button.y + button.h
        ) {
          attemptPurchaseEntry(button.index);
          event.preventDefault();

        }
      }
    });

    window.addEventListener("mouseup", (event) => {
      if (event.button === 0) {
        mouse.left = false;
