          return { mode, target };
        }

        return { mode, target: null };
      }

      // Indica si el interceptor esta cargando monedas para devolver al carrier.
      hasCargo() {
        return (this.carriedCredits ?? 0) > 0;
      }

      // Indica si el interceptor quiere volver al carrier por dano, carga o por orden de retorno.
      shouldReturnHome() {
        return !this.abandoned && this.isHomeCarrierValid() && (this.returnSignal || this.hp < this.maxHp - 0.001 || this.hasCargo());
      }

      // Indica si el interceptor puede acoplarse al carrier indicado.
      canDockWith(carrier) {
        return carrier === this.homeCarrier && this.shouldReturnHome();
      }

      // Registra monedas recogidas para entregarlas al carrier mas tarde.
      handleCollectedCoin(value, coin = null) {
        if (this.abandoned || !this.isHomeCarrierValid()) {
          return false;
        }

        if (coin && typeof this.homeCarrier.releaseCoinReservation === "function") {
          this.homeCarrier.releaseCoinReservation(coin, this);
        }
        if (typeof this.homeCarrier.releaseCoinReservationsForInterceptor === "function") {
          this.homeCarrier.releaseCoinReservationsForInterceptor(this);
        }

        this.carriedCredits = Math.max(0, this.carriedCredits + Math.max(0, value || 0));
        return true;
      }

      // Transfiere al carrier las monedas que el interceptor venia cargando.
      transferCargoToCarrier(carrier) {
        if (carrier !== this.homeCarrier) {
          return 0;
        }

        const delivered = Math.max(0, this.carriedCredits ?? 0);
        this.carriedCredits = 0;

        if (delivered > 0) {
          carrier.credits += delivered;
          if (typeof carrier.onCoinCollected === "function") {
            carrier.onCoinCollected(delivered, null, this);
          }
        }

        return delivered;
      }

      // Marca al interceptor como abandonado para que se disperse y deje de pelear.
      markAbandoned(duration = 18) {
        if (this.homeCarrier && typeof this.homeCarrier.releaseCoinReservationsForInterceptor === "function") {
          this.homeCarrier.releaseCoinReservationsForInterceptor(this);
        }
        if (this.homeCarrier && typeof this.homeCarrier.releaseAsteroidReservationsForInterceptor === "function") {
          this.homeCarrier.releaseAsteroidReservationsForInterceptor(this);
        }
        this.abandoned = true;
        this.returnSignal = false;
        this.homeCarrier = null;
        this.combatTarget = null;
        this.combatDistance = Infinity;
        this.combatAimAngleRate = 0;
        this.abandonTimer = Math.max(this.abandonTimer, duration);
      }

      // Libera cualquier moneda que este interceptor tuviera reservada en su carrier.
      releaseCarrierCoinReservations() {
        if (this.homeCarrier && typeof this.homeCarrier.releaseCoinReservationsForInterceptor === "function") {
          this.homeCarrier.releaseCoinReservationsForInterceptor(this);
        }
      }

      // Libera cualquier asteroide que este interceptor tuviera reservado en su carrier.
      releaseCarrierAsteroidReservations() {
        if (this.homeCarrier && typeof this.homeCarrier.releaseAsteroidReservationsForInterceptor === "function") {
          this.homeCarrier.releaseAsteroidReservationsForInterceptor(this);
        }
      }

      // Pide al carrier un objetivo de mineria respetando su sistema de reservas.
      chooseMiningTarget() {
        if (!this.isHomeCarrierValid() || typeof this.homeCarrier.chooseMiningTargetForInterceptor !== "function") {
          return null;
        }
        return this.homeCarrier.chooseMiningTargetForInterceptor(this);
      }

      // Selecciona una moneda libre o ya reservada para este interceptor usando el registro del carrier.
      chooseCoinTarget() {
        if (!(this.coinSenseRadius > 0) || !this.isHomeCarrierValid()) {
          return null;
        }

        const carrier = this.homeCarrier;
        const currentReservation = typeof carrier.getReservedCoinForInterceptor === "function"
          ? carrier.getReservedCoinForInterceptor(this)
          : null;
        if (currentReservation && !currentReservation.isRemoved) {
          return currentReservation;
        }

        const coinSenseRadiusSq = this.coinSenseRadius * this.coinSenseRadius;
        const bodies = this.getPerceptionSnapshot().bodies;
        let bestCoin = null;
        let bestScore = Infinity;

        for (let i = 0; i < bodies.length; i++) {
          const body = bodies[i];
          if (!body || body.isRemoved || !isCoinLike(body)) {
            continue;
          }

          const dx = body.x - this.x;
          const dy = body.y - this.y;
          const distSq = dx * dx + dy * dy;
          if (!(distSq > 0) || distSq > coinSenseRadiusSq) {
            continue;
          }

          const owner = typeof carrier.getCoinReservationOwner === "function"
            ? carrier.getCoinReservationOwner(body)
            : null;
          if (owner && owner !== this) {
            continue;
          }

          const dist = Math.sqrt(distSq);
          const relSpeed = Math.hypot(body.vx - this.vx, body.vy - this.vy);
          const score = dist + relSpeed * 0.12 - Math.max(1, body.value ?? 1) * 16;
          if (score < bestScore) {
            bestScore = score;
            bestCoin = body;
          }
        }

        if (!bestCoin || typeof carrier.tryReserveCoin !== "function") {
          return null;
        }

        return carrier.tryReserveCoin(bestCoin, this);
      }

      // Actualiza los contactos prolongados con asteroides para habilitar un modo temporal de liberacion.
      updateAsteroidTrapState(dt) {
        const contactTimers = this._asteroidContactTimers instanceof Map
          ? this._asteroidContactTimers
          : new Map();
        this._asteroidContactTimers = contactTimers;

        const bodies = this.getPerceptionSnapshot().bodies;
        const touchedAsteroids = [];
        const contactPadding = 2.5;

        for (let i = 0; i < bodies.length; i++) {
          const body = bodies[i];
          if (!body || body.isRemoved || body.kind !== "asteroid") {
            continue;
          }

          const dx = body.x - this.x;
          const dy = body.y - this.y;
          const contactRange = this.colliderRadius + (body.colliderRadius ?? body.radius ?? 0) + contactPadding;
          if (dx * dx + dy * dy > contactRange * contactRange) {
            continue;
          }

          touchedAsteroids.push(body);
          contactTimers.set(body, (contactTimers.get(body) ?? 0) + dt);
        }

        for (const asteroid of [...contactTimers.keys()]) {
          if (!touchedAsteroids.includes(asteroid)) {
            contactTimers.delete(asteroid);
          }
        }

        const currentBreakoutTarget = this.breakoutAsteroid;
        if (currentBreakoutTarget && currentBreakoutTarget.isRemoved) {
          this.breakoutAsteroid = null;
        }

        if (this.breakoutAsteroid && touchedAsteroids.includes(this.breakoutAsteroid)) {
          return this.breakoutAsteroid;
        }

        let bestBreakoutAsteroid = null;
        let bestScore = Infinity;
        const carrier = this.isHomeCarrierValid() ? this.homeCarrier : null;

        for (let i = 0; i < touchedAsteroids.length; i++) {
          const asteroid = touchedAsteroids[i];
          const contactTime = contactTimers.get(asteroid) ?? 0;
          if (contactTime < this.asteroidTrapContactThreshold) {
            continue;
          }

          const referenceX = carrier ? carrier.x : this.x;
          const referenceY = carrier ? carrier.y : this.y;
          const distToCarrier = Math.hypot(asteroid.x - referenceX, asteroid.y - referenceY);
          const score = distToCarrier - Math.max(0, asteroid.radius ?? 0);
          if (score < bestScore) {
            bestScore = score;
            bestBreakoutAsteroid = asteroid;
          }
        }

        this.breakoutAsteroid = bestBreakoutAsteroid;
        return this.breakoutAsteroid;
      }

      // Indica si el interceptor debe entrar en modo de liberacion por contacto prolongado con asteroides.
      getBreakoutAsteroid(dt = 0) {
        if (!(dt > 0)) {
          return this.breakoutAsteroid && !this.breakoutAsteroid.isRemoved ? this.breakoutAsteroid : null;
        }
        return this.updateAsteroidTrapState(dt);
      }

      // Actualiza el piloto automatico usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      updateAutopilot(dt) {
        if (!this.aiWorld) {
          return;
        }

        if (!this.abandoned && !this.isHomeCarrierValid()) {
          this.markAbandoned(randomBetween(14, 22));
        }

        if (this.abandoned && this.abandonTimer > 0) {
          this.abandonTimer = Math.max(0, this.abandonTimer - dt);
          if (this.abandonTimer <= 0) {
            this.aiWorld.removeBody(this);
            return;
          }
        }

        const directive = this.getCarrierDirective();
        const breakoutAsteroid = this.abandoned ? null : this.getBreakoutAsteroid(dt);

        if (!this.abandoned && this.isHomeCarrierValid()) {
          this.returnSignal = directive.mode === "dock" || !!this.homeCarrier.interceptorReturnSignal;
        }

        if (this.abandoned || this.shouldReturnHome() || directive.mode !== "mine") {
          this.releaseCarrierCoinReservations();
          this.releaseCarrierAsteroidReservations();
        }

        const squad = this.computeSquadState();
        const avoid = this.computeHazardAvoidance();
        const dodge = this.computeProjectileDodge(1.12);
        let desiredVX = this.vx;
        let desiredVY = this.vy;
        let desiredAngle = this.angle;
        let desiredAngleRate = 0;
        let effectiveMaxSpeed = this.maxCruiseSpeed;

        if (this.abandoned) {
          if (Math.random() < dt * 0.72) {
            this.wanderAngle += randomBetween(-1.2, 1.2);
          }
          desiredVX = Math.cos(this.wanderAngle) * this.squadCruiseSpeed + squad.avgVX * 0.18;
          desiredVY = Math.sin(this.wanderAngle) * this.squadCruiseSpeed + squad.avgVY * 0.18;
          desiredAngle = Math.atan2(desiredVY, desiredVX);
          this.combatTarget = null;
          this.combatDistance = Infinity;
          this.combatAimAngleRate = 0;
        } else if (breakoutAsteroid) {
          const target = breakoutAsteroid;
          const dx = target.x - this.x;
          const dy = target.y - this.y;
          const dist = Math.max(0.001, Math.hypot(dx, dy));
          const nx = dx / dist;
          const ny = dy / dist;
          const tx = -ny * this.orbitDirection;
          const ty = nx * this.orbitDirection;
          const standoff = target.radius + 26;
          const approach = clamp((dist - standoff) * 1.65, -190, 170);
          desiredVX = target.vx + nx * approach + tx * 34;
          desiredVY = target.vy + ny * approach + ty * 34;
          desiredAngle = this.updateCombatAim(target);
          desiredAngleRate = this.combatAimAngleRate ?? 0;
          effectiveMaxSpeed = Math.max(this.maxCruiseSpeed * 0.72, Math.hypot(target.vx, target.vy) + 90);
        } else if (this.shouldReturnHome()) {
          const carrier = this.homeCarrier;
          const dx = carrier.x - this.x;
          const dy = carrier.y - this.y;
          const dist = Math.max(0.001, Math.hypot(dx, dy));
          const nx = dx / dist;
          const ny = dy / dist;
          const desiredDistance = Math.max(4, carrier.radius * 0.22);
          const approach = clamp((dist - desiredDistance) * 2.25, -40, 320);
          desiredVX = carrier.vx + nx * approach;
          desiredVY = carrier.vy + ny * approach;
          desiredAngle = Math.atan2(dy, dx);
          effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, Math.hypot(carrier.vx, carrier.vy) + 140);
          this.combatTarget = null;
          this.combatDistance = Infinity;
          this.combatAimAngleRate = 0;
        } else if (directive.mode === "attack" && directive.target) {
          const target = directive.target;
          const dx = target.x - this.x;
          const dy = target.y - this.y;
          const dist = Math.max(0.001, Math.hypot(dx, dy));
          const nx = dx / dist;
          const ny = dy / dist;
          const tx = -ny * this.orbitDirection;
          const ty = nx * this.orbitDirection;
          const standoff = target.radius + 26 + Math.abs(this.formationLane) * 3;
          const approach = clamp((dist - standoff) * 1.75, -220, 260);
          desiredVX = target.vx + nx * approach + tx * 165;
          desiredVY = target.vy + ny * approach + ty * 165;
          desiredAngle = this.updateCombatAim(target);
          desiredAngleRate = this.combatAimAngleRate ?? 0;
          effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, Math.hypot(target.vx, target.vy) + 165);
        } else if (directive.mode === "mine") {
          const coinTarget = this.hasCargo() ? null : this.chooseCoinTarget();
          const miningTarget = this.hasCargo() ? null : (this.chooseMiningTarget() ?? directive.target ?? null);
          if (coinTarget) {
            const dx = coinTarget.x - this.x;
            const dy = coinTarget.y - this.y;
            const dist = Math.max(0.001, Math.hypot(dx, dy));
            desiredVX = coinTarget.vx + (dx / dist) * clamp(dist * 3.0, 120, 380);
            desiredVY = coinTarget.vy + (dy / dist) * clamp(dist * 3.0, 120, 380);
            desiredAngle = Math.atan2(dy, dx);
            effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, Math.hypot(coinTarget.vx, coinTarget.vy) + 180);
            this.combatTarget = null;
            this.combatDistance = Infinity;
            this.combatAimAngleRate = 0;
          } else if (miningTarget) {
            const target = miningTarget;
            const dx = target.x - this.x;
            const dy = target.y - this.y;
            const dist = Math.max(0.001, Math.hypot(dx, dy));
            const nx = dx / dist;
            const ny = dy / dist;
            const tx = -ny * this.orbitDirection;
            const ty = nx * this.orbitDirection;
            const standoff = target.radius + 46 + Math.abs(this.formationLane) * 4;
            const approach = clamp((dist - standoff) * 1.9, -220, 280);
            desiredVX = target.vx + nx * approach + tx * 78;
            desiredVY = target.vy + ny * approach + ty * 78;
            desiredAngle = this.updateCombatAim(target);
            desiredAngleRate = this.combatAimAngleRate ?? 0;
            effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, Math.hypot(target.vx, target.vy) + 150);
          } else {
            const carrier = this.homeCarrier;
            const carrierSpeed = Math.hypot(carrier.vx, carrier.vy);
            const heading = carrierSpeed > 10 ? Math.atan2(carrier.vy, carrier.vx) : carrier.angle;
            const laneSign = (this.id % 2 === 0 ? 1 : -1) * this.orbitDirection;
            const sideOffset = laneSign * (carrier.radius * 0.78 + 20 + this.formationLane * 6);
            const backOffset = carrier.radius + 32 + Math.abs(this.formationLane) * 5;
            const desiredX = carrier.x - Math.cos(heading) * backOffset + Math.cos(heading + Math.PI * 0.5) * sideOffset;
            const desiredY = carrier.y - Math.sin(heading) * backOffset + Math.sin(heading + Math.PI * 0.5) * sideOffset;
            desiredVX = carrier.vx + (desiredX - this.x) * 2.6;
            desiredVY = carrier.vy + (desiredY - this.y) * 2.6;
            desiredAngle = Math.atan2(carrier.y - this.y, carrier.x - this.x);
            effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, carrierSpeed + 110);
            this.combatTarget = null;
            this.combatDistance = Infinity;
            this.combatAimAngleRate = 0;
          }
        } else {
          const carrier = this.homeCarrier;
          const carrierSpeed = Math.hypot(carrier.vx, carrier.vy);
          const heading = carrierSpeed > 10 ? Math.atan2(carrier.vy, carrier.vx) : carrier.angle;
          const laneSign = (this.id % 2 === 0 ? 1 : -1) * this.orbitDirection;
          const sideOffset = laneSign * (carrier.radius * 0.78 + 20 + this.formationLane * 6);
          const backOffset = carrier.radius + 32 + Math.abs(this.formationLane) * 5;
          const desiredX = carrier.x - Math.cos(heading) * backOffset + Math.cos(heading + Math.PI * 0.5) * sideOffset;
          const desiredY = carrier.y - Math.sin(heading) * backOffset + Math.sin(heading + Math.PI * 0.5) * sideOffset;
          desiredVX = carrier.vx + (desiredX - this.x) * 2.6;
          desiredVY = carrier.vy + (desiredY - this.y) * 2.6;
          desiredAngle = Math.atan2(carrier.y - this.y, carrier.x - this.x);
          effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, carrierSpeed + 110);
          this.combatTarget = null;
          this.combatDistance = Infinity;
          this.combatAimAngleRate = 0;
        }

        desiredVX += squad.x * 0.24 + avoid.x + dodge.x;
        desiredVY += squad.y * 0.24 + avoid.y + dodge.y;

        const steer = clampVectorMagnitude(
          (desiredVX - this.vx) * 3.8,
          (desiredVY - this.vy) * 3.8,
          this.maxAcceleration + avoid.extraAccel * 0.16
        );
        this.applyThrustAcceleration(steer.x, steer.y, dt, { intensityScale: 0.96, countRate: 12, angleVariance: 0.74, speed: 38, speedVariance: 18, spawnRadiusScale: 0.76, color: this.color, colorVariance: 14 });

        const velocity = clampVectorMagnitude(this.vx, this.vy, effectiveMaxSpeed);
        this.vx = velocity.x;
        this.vy = velocity.y;

        if (!this.combatTarget && Math.hypot(this.vx, this.vy) > 0.001) {
          desiredAngle = Math.atan2(this.vy, this.vx);
        }

        this.updateAimRotation(dt, desiredAngle, desiredAngleRate, this.combatTarget ? 5.0 : 4.4);
      }

      // Actualiza el estado interno usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      update(dt) {
        this.updateAutopilot(dt);
        super.update(dt);
      }

      // Dibuja el estado interno en el contexto de render correspondiente.
      draw(ctx, camera) {
        const sx = this.x - camera.x;
        const sy = this.y - camera.y;

        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(this.angle);
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 1.6;

        ctx.beginPath();
        ctx.moveTo(this.radius * 1.12, 0);
        ctx.lineTo(-this.radius * 0.6, -this.radius * 0.68);
        ctx.lineTo(-this.radius * 0.24, 0);
        ctx.lineTo(-this.radius * 0.6, this.radius * 0.68);
        ctx.closePath();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-this.radius * 0.18, -this.radius * 0.38);
        ctx.lineTo(this.radius * 0.32, 0);
        ctx.lineTo(-this.radius * 0.18, this.radius * 0.38);
        ctx.stroke();

        ctx.restore();
      }
    }

    class FleaShip extends Ship {

          receivesGravity: true,

          brakePower: 610,
          angularAccel: 0,
          angularBrakeAccel: 0,
          fireRate: 0,
          projectileSpeed: 0,
          projectileSpread: 0,
          projectilesPerShot: 0,

        });

        this.maxAcceleration = options.maxAcceleration ?? randomBetween(1250, 1650);
        this.enemySenseRadius = options.enemySenseRadius ?? 720;
        this.coinSenseRadius = options.coinSenseRadius ?? 420;
        this.scrapSenseRadius = options.scrapSenseRadius ?? 360;

        this.schoolSenseRadius = options.schoolSenseRadius ?? 360;
        this.preferredSchoolRadius = options.preferredSchoolRadius ?? 22;

        this.schoolPhase = options.schoolPhase ?? 0;

        this.targetEnemy = null;

      }

      // Consume el combustible dentro de esta parte de la logica. Usa dt como delta de tiempo del frame.
      consumeFuel(dt, rate = this.fuelBurnRate) {

      // Calcula y cachea la lectura compartida del enjambre de pulgas para reutilizarla dentro del mismo tick.
      getPerceptionSnapshot() {

        const cached = this._fleaPerceptionCache;
        if (cached && cached.refreshUntilTick >= frameId) {
          return cached;

        const maxRange = Math.max(1, this.enemySenseRadius, this.coinSenseRadius, this.scrapSenseRadius, this.projectileSenseRadius, this.schoolSenseRadius);
        const enemySenseRadiusSq = this.enemySenseRadius * this.enemySenseRadius;
        const coinSenseRadiusSq = this.coinSenseRadius * this.coinSenseRadius;
        const scrapSenseRadiusSq = this.scrapSenseRadius * this.scrapSenseRadius;
        const projectileSenseRadiusSq = this.projectileSenseRadius * this.projectileSenseRadius;
        const schoolSenseRadiusSq = this.schoolSenseRadius * this.schoolSenseRadius;

        let bestEnemy = null;
        let bestEnemyScore = Infinity;
        let bestCoin = null;
        let bestCoinScore = Infinity;

        let separationY = 0;
        let alignmentX = 0;
        let alignmentY = 0;

          }

          if (isCoinLike(body) && distSq <= coinSenseRadiusSq) {

            const score = dist + Math.hypot(body.vx - this.vx, body.vy - this.vy) * 0.2;
            if (score < bestCoinScore) {
              bestCoinScore = score;
              bestCoin = body;
            }
          }

          if (body.kind === "scrap" && distSq <= scrapSenseRadiusSq) {
            if (!dist) dist = Math.sqrt(distSq);
            const score = dist + Math.hypot(body.vx - this.vx, body.vy - this.vy) * 0.08;
            if (score < bestScrapScore) {
              bestScrapScore = score;
              bestScrap = body;
            }
          }

          if (distSq <= schoolSenseRadiusSq && body.kind === "flea" && body.faction === this.faction && body.schoolId === this.schoolId) {

            shellY += (dy / dist) * spacingError;
            if (dist < this.personalSpace) {
              const push = (this.personalSpace - dist) / this.personalSpace;
              separationX -= (dx / dist) * push * 520;
              separationY -= (dy / dist) * push * 520;
            }
          }

          if (body.kind === "projectile" && body.owner !== this && distSq <= projectileSenseRadiusSq && (!body.faction || this.getDispositionTo(body.faction) === "enemy")) {
            if (!dist) dist = Math.sqrt(distSq);
            const speedSq = body.vx * body.vx + body.vy * body.vy;
            if (speedSq > 1e-6) {
              const speed = Math.sqrt(speedSq);
              const dirX = body.vx / speed;
              const dirY = body.vy / speed;
              const toMeX = -dx / dist;
              const toMeY = -dy / dist;
              const closing = dirX * toMeX + dirY * toMeY;
              if (closing >= 0.55) {
                const side = Math.sign(dirX * toMeY - dirY * toMeX) || (this.id % 2 === 0 ? 1 : -1);
                const panic = (1 - dist / this.projectileSenseRadius) * (0.7 + closing * 0.7);
                dodgeX += -dirY * side * panic * 900 - dirX * panic * 260;
                dodgeY += dirX * side * panic * 900 - dirY * panic * 260;
              }
            }
          }
        });

        const schooling = count <= 1 ? {
          x: 0,
          y: 0,
          members: 1,
          centerX: this.x,
          centerY: this.y,
          avgVX: this.vx,
          avgVY: this.vy,
          compactness: 0
        } : (() => {
          const avgVX = (alignmentX + this.vx) / count;
          const avgVY = (alignmentY + this.vy) / count;
          const schoolCenterX = centerX / count;
          const schoolCenterY = centerY / count;
          const toCenterX = schoolCenterX - this.x;
          const toCenterY = schoolCenterY - this.y;
          const centerDist = Math.hypot(toCenterX, toCenterY);
          const compactness = clamp(1 - centerDist / Math.max(1, this.schoolSenseRadius), 0, 1);
          return {
            x: separationX + (avgVX - this.vx) * 1.8 + toCenterX * 1.25 + shellX * 0.32,
            y: separationY + (avgVY - this.vy) * 1.8 + toCenterY * 1.25 + shellY * 0.32,
            members: count,
            centerX: schoolCenterX,
            centerY: schoolCenterY,
            avgVX,
            avgVY,
            compactness
          };
        })();

        const snapshot = { frameId, refreshUntilTick: frameId + this.perceptionRefreshTicks, bestEnemy, bestCoin, bestScrap, schooling, dodge: { x: dodgeX, y: dodgeY } };
        this._fleaPerceptionCache = snapshot;
        return snapshot;
      }

      // Devuelve disposition to calculado a partir del estado y los parametros recibidos.
      getDispositionTo(factionName) {
        if (!factionSystem || !factionName) return "neutral";
        return factionSystem.getDisposition(this.faction, factionName);
      }

      // Selecciona el objetivo enemigo el objetivo dentro de esta parte de la logica.
      chooseEnemyTarget() {
        return this.getPerceptionSnapshot().bestEnemy;
      }

      // Selecciona el objetivo de monedas el objetivo dentro de esta parte de la logica.
      chooseCoinTarget() {
        return this.getPerceptionSnapshot().bestCoin;
      }

      // Selecciona el objetivo de chatarra el objetivo dentro de esta parte de la logica.
      chooseScrapTarget() {
        return this.getPerceptionSnapshot().bestScrap;
      }

      // Calcula la cohesion de grupo a partir del estado y los parametros disponibles.
      computeSchooling() {
        return this.getPerceptionSnapshot().schooling;
      }

      // Calcula la evasion de proyectiles la esquiva a partir del estado y los parametros disponibles.
      computeProjectileDodge() {
        return this.getPerceptionSnapshot().dodge;
      }

      // Actualiza el piloto automatico usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      updateAutopilot(dt) {
        if (!this.aiWorld) {
          return;
        }

        this.targetEnemy = this.chooseEnemyTarget();
        this.targetCoin = this.chooseCoinTarget();
        const targetScrap = this.targetEnemy || this.targetCoin ? null : this.chooseScrapTarget();

        const schooling = this.computeSchooling();
        const dodge = this.computeProjectileDodge();
        const dodgeStrength = Math.hypot(dodge.x, dodge.y);
        const isDodging = dodgeStrength > 120;
        let desiredVX = 0;
        let desiredVY = 0;
        let desiredAngle = this.angle;
        let effectiveMaxCruiseSpeed = this.maxCruiseSpeed;

        if (isDodging) {
          desiredVX = this.vx * 0.35 + schooling.avgVX * 0.35 + schooling.x * 0.9 + dodge.x * 1.35;
          desiredVY = this.vy * 0.35 + schooling.avgVY * 0.35 + schooling.y * 0.9 + dodge.y * 1.35;
          effectiveMaxCruiseSpeed = Math.max(this.maxCruiseSpeed, Math.hypot(this.vx, this.vy) + 280, dodgeStrength * 0.75);
          desiredAngle = Math.atan2(desiredVY, desiredVX);
        } else if (this.targetCoin && !this.targetCoin.isRemoved) {
          const coin = this.targetCoin;
          const dx = coin.x - this.x;
          const dy = coin.y - this.y;
          const dist = Math.max(0.001, Math.hypot(dx, dy));
          const accelBias = 1.25 + (1 - dist / this.coinSenseRadius) * 2.4;
          desiredVX = coin.vx + schooling.avgVX * 0.15 + (dx / dist) * 420 * accelBias;
          desiredVY = coin.vy + schooling.avgVY * 0.15 + (dy / dist) * 420 * accelBias;
          effectiveMaxCruiseSpeed = Math.max(this.maxCruiseSpeed, Math.hypot(coin.vx, coin.vy) + 420);
          desiredAngle = Math.atan2(dy, dx);
        } else if (this.targetEnemy && !this.targetEnemy.isRemoved && this.targetEnemy.isAlive) {
          const enemy = this.targetEnemy;
          const dx = enemy.x - this.x;
          const dy = enemy.y - this.y;
          const dist = Math.max(0.001, Math.hypot(dx, dy));
          const nx = dx / dist;
          const ny = dy / dist;
          const tx = -ny * this.orbitDirection;
          const ty = nx * this.orbitDirection;
          const laneOffset = ((this.id + this.schoolPhase) % 7 - 3) * 5;
          const orbitRadius = enemy.radius + 52 + laneOffset;
          const radiusError = dist - orbitRadius;
          const enemyForwardX = Math.cos(enemy.angle);
          const enemyForwardY = Math.sin(enemy.angle);
          const frontalDot = nx * enemyForwardX + ny * enemyForwardY;
          const avoidFront = Math.max(0, frontalDot);
          const behindBiasX = -enemyForwardX * avoidFront * 220;
          const behindBiasY = -enemyForwardY * avoidFront * 220;
          const schoolAnchorX = (schooling.centerX - this.x) * 1.15;
          const schoolAnchorY = (schooling.centerY - this.y) * 1.15;
          desiredVX = enemy.vx + schooling.avgVX * 0.18 + tx * 420 + nx * clamp(radiusError * 5.8, -280, 280) + behindBiasX + schoolAnchorX;
          desiredVY = enemy.vy + schooling.avgVY * 0.18 + ty * 420 + ny * clamp(radiusError * 5.8, -280, 280) + behindBiasY + schoolAnchorY;
          effectiveMaxCruiseSpeed = Math.max(this.maxCruiseSpeed, Math.hypot(enemy.vx, enemy.vy) + 440);
          desiredAngle = Math.atan2(desiredVY - enemy.vy, desiredVX - enemy.vx);
        } else if (targetScrap) {
          const scrap = targetScrap;
          const dx = scrap.x - this.x;
          const dy = scrap.y - this.y;
          const dist = Math.max(0.001, Math.hypot(dx, dy));
          const nx = dx / dist;
          const ny = dy / dist;
          const tx = -ny * this.orbitDirection;
          const ty = nx * this.orbitDirection;
          const orbitRadius = scrap.radius + 30 + ((this.id + this.schoolPhase) % 5 - 2) * 3;
          const radiusError = dist - orbitRadius;
          const schoolAnchorX = (schooling.centerX - this.x) * 1.05;
          const schoolAnchorY = (schooling.centerY - this.y) * 1.05;
          desiredVX = scrap.vx + schooling.avgVX * 0.28 + tx * 120 + nx * clamp(radiusError * 3.8, -120, 160) + schoolAnchorX;
          desiredVY = scrap.vy + schooling.avgVY * 0.28 + ty * 120 + ny * clamp(radiusError * 3.8, -120, 160) + schoolAnchorY;
          effectiveMaxCruiseSpeed = Math.max(this.maxCruiseSpeed, 230);
          desiredAngle = Math.atan2(desiredVY - scrap.vy, desiredVX - scrap.vx);
        } else {
          if (!this.wanderAngle || Math.random() < dt * 0.35) {
            this.wanderAngle += randomBetween(-0.28, 0.28);
          }

          const driftAngle = this.wanderAngle + Math.sin((this.aiWorld.time ?? 0) * 0.7 + this.schoolPhase) * 0.08;
          desiredVX = schooling.avgVX * 0.72 + Math.cos(driftAngle) * this.schoolCruiseSpeed + (schooling.centerX - this.x) * 1.35 + schooling.x * 1.45;
          desiredVY = schooling.avgVY * 0.72 + Math.sin(driftAngle) * this.schoolCruiseSpeed + (schooling.centerY - this.y) * 1.35 + schooling.y * 1.45;
          desiredAngle = Math.atan2(desiredVY, desiredVX);
        }

        desiredVX += schooling.x * 1.2 + dodge.x;
        desiredVY += schooling.y * 1.2 + dodge.y;

        const steer = clampVectorMagnitude(
          (desiredVX - this.vx) * 5.1,
          (desiredVY - this.vy) * 5.1,
          this.maxAcceleration
        );
        this.applyThrustAcceleration(steer.x, steer.y, dt, { intensityScale: 0.88, countRate: 11, angleVariance: 0.72, speed: 34, speedVariance: 16, spawnRadiusScale: 0.78, colorVariance: 22 });

        const velocity = clampVectorMagnitude(this.vx, this.vy, effectiveMaxCruiseSpeed);
        this.vx = velocity.x;
        this.vy = velocity.y;

        if (Math.hypot(this.vx, this.vy) > 0.001) {
          desiredAngle = Math.atan2(this.vy, this.vx);
        }

        this.angle += wrapAngle(desiredAngle - this.angle) * clamp(dt * 16.5, 0, 1);
        this.angularVelocity = 0;
      }

      // Actualiza el estado interno usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      update(dt) {
        this.updateAutopilot(dt);
        super.update(dt);
      }

      // Dibuja el estado interno en el contexto de render correspondiente.
      draw(ctx, camera) {
        const sx = this.x - camera.x;
        const sy = this.y - camera.y;

        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(this.angle);
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 1.5;

        ctx.beginPath();
        ctx.moveTo(this.radius * 1.1, 0);
        ctx.lineTo(-this.radius * 0.6, -this.radius * 0.55);
        ctx.lineTo(-this.radius * 0.18, 0);
        ctx.lineTo(-this.radius * 0.6, this.radius * 0.55);
        ctx.closePath();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-this.radius * 0.75, -this.radius * 0.85);
        ctx.lineTo(-this.radius * 0.18, -this.radius * 0.2);
        ctx.moveTo(-this.radius * 0.75, this.radius * 0.85);
        ctx.lineTo(-this.radius * 0.18, this.radius * 0.2);
        ctx.stroke();

        ctx.restore();
      }
    }

    class FactionSystem {
      // Inicializa la instancia de FactionSystem con las opciones y el estado base necesarios.
      constructor() {
        this.factions = new Map();
        this.pairs = new Map();
        this.defaultEquilibrium = 50;
        this.relaxRate = 0.004;
      }

      // Gestiona define la faccion dentro del flujo principal del juego.
      defineFaction(name, options = {}) {
        this.factions.set(name, {
          name,
          selfRelation: options.selfRelation ?? 100
        });
      }

      // Gestiona los pares la tecla dentro del flujo principal del juego.
      pairKey(a, b) {
        return a < b ? `${a}::${b}` : `${b}::${a}`;
      }

      // Gestiona ensure los pares dentro del flujo principal del juego.
      ensurePair(a, b) {
        const key = this.pairKey(a, b);
        if (!this.pairs.has(key)) {
          this.pairs.set(key, {
            relation: this.defaultEquilibrium,
            equilibrium: this.defaultEquilibrium
          });
        }
        return this.pairs.get(key);
      }

      // Actualiza los pares usando el estado actual y los parametros recibidos.
      setPair(a, b, relation, equilibrium = relation) {
        if (a === b) return;
        const pair = this.ensurePair(a, b);
        pair.relation = relation;
        pair.equilibrium = equilibrium;
      }

      // Devuelve relation calculado a partir del estado y los parametros recibidos.
      getRelation(a, b) {
        if (a === b) {
          return this.factions.get(a)?.selfRelation ?? 100;
        }
        return this.ensurePair(a, b).relation;
      }

      // Devuelve equilibrium calculado a partir del estado y los parametros recibidos.
      getEquilibrium(a, b) {
        if (a === b) {
          return this.factions.get(a)?.selfRelation ?? 100;
        }
        return this.ensurePair(a, b).equilibrium;
      }

      // Gestiona add relation dentro del flujo principal del juego.
      addRelation(a, b, delta) {
        if (!a || !b || a === b || !Number.isFinite(delta) || delta === 0) return;
        const pair = this.ensurePair(a, b);
        pair.relation = clamp(pair.relation + delta, 0, 100);
      }

      // Gestiona add equilibrium dentro del flujo principal del juego.
      addEquilibrium(a, b, delta) {
        if (!a || !b || a === b || !Number.isFinite(delta) || delta === 0) return;
        const pair = this.ensurePair(a, b);
        pair.equilibrium = clamp(pair.equilibrium + delta, 0, 100);
      }

      // Devuelve disposition calculado a partir del estado y los parametros recibidos.
      getDisposition(a, b) {
        const relation = this.getRelation(a, b);
        if ((a === "jugador" && b === "Mineros") || (a === "Mineros" && b === "jugador")) {
          return relation < 40 ? "enemy" : "neutral";
        }
        return getFactionDisposition(relation);
      }

      // Actualiza el estado interno usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      update(dt) {
        for (const pair of this.pairs.values()) {
          const delta = pair.equilibrium - pair.relation;
          if (Math.abs(delta) < 0.0001) continue;
          pair.relation = clamp(pair.relation + delta * this.relaxRate * dt, 0, 100);
        }
      }

      // Gestiona list for la faccion dentro del flujo principal del juego.
      listForFaction(name) {
        const result = [];
        for (const factionName of this.factions.keys()) {
          if (factionName === name) {
            continue;
          }
          result.push({
            name: factionName,
            relation: this.getRelation(name, factionName),
            equilibrium: this.getEquilibrium(name, factionName),
            disposition: this.getDisposition(name, factionName)
          });
        }
        return result.sort((a, b) => a.name.localeCompare(b.name, 'es'));
      }
    }

    class World {
      // Inicializa la instancia de World con las opciones y el estado base necesarios.
      constructor() {
        this.bodies = [];
        this.grid = new SpatialGrid(280);
        this.gravityGrid = new SpatialGrid(280);
        this.asteroidBodies = [];
        this.planetBodies = [];
        this.scrapBodies = [];
        this.particles = new ParticleSystem(this);
        this.projectilePool = [];
        this.asteroidPool = [];
        this.coinPool = [];
        this.blueCoinPool = [];
        this.projectilePoolLimit = 1600;
        this.asteroidPoolLimit = 1200;
        this.coinPoolLimit = 1200;
        this.blueCoinPoolLimit = 160;

        this.G = 156;
        this.minGravityAcceleration = 0.12;
        this.showGrid = false;

        this.maxSubstep = 1 / 60;
        this.maxCollisionPasses = 2;
        this.gravityQueryStamp = 1;
        this.aiTickId = 0;
        this.gravitySourceBodies = [];
        this.hasRemovedBodies = false;
        this.gridIsFresh = false;
        this.gravityGridIsFresh = false;
        this.onBodyAdded = null;
        this.onBodyRemoved = null;
        this.asteroidFragmentRadiusFactor = 0.68;
        this.minAsteroidFragmentRadius = 10;
        this.minAsteroidGravityRadius = this.minAsteroidFragmentRadius * 1.5;
        this.projectileAsteroidMinSubdivisions = 2;
        this.projectileAsteroidMaxSubdivisions = 4;
        this.defaultAsteroidProjectileEjectionSpeed = 6;
        this.asteroidCollisionExplosionMinSpeed = 80;
        this.asteroidCollisionExplosionGuaranteedSpeed = 130;
        this.asteroidCollisionExplosionChancePerSpeed = 0.02;
        this.asteroidCollisionMinSubdivisionCount = 3;
        this.asteroidCollisionMaxSubdivisionCount = 8;
        this.asteroidCollisionMinEjectionFactor = 0.5;
        this.asteroidCollisionMaxEjectionFactor = 0.8;
        this.planetCollisionMinAsteroidCount = 10;
        this.planetCollisionMaxAsteroidCount = 18;
        this.planetCollisionAsteroidAreaFraction = 0.34;
        this.planetCollisionAsteroidMassFraction = 0.2;
        this.planetCollisionEscapeSpeedFactor = 1.18;
        this.planetCollisionAsteroidSizeVariance = 0.58;
        this.asteroidPlanetAbsorptionContactDelay = 2.4;
        this.asteroidPlanetAbsorptionAnimationDuration = 1.15;
        this.asteroidPlanetAbsorptionContactPadding = 8;
        this.asteroidPlanetAbsorptionMaxPlanetQueryRadius = 2400;
        this.shipCrashSpeed = 80;
        this.collisionDamageFactor = 0.2;
        this.isGameOver = false;
        this.lastMerchantRefusalTimer = 0;
        this.merchantRescueStationId = null;
        this.merchantRescueRadius = 1000;
        this.merchantRescueFuelThreshold = 2;
      }

      // Indica si el cuerpo exert gravity cumple la condicion esperada para esta logica.
      canBodyExertGravity(body) {
        if (!body || !body.exertsGravity || body.mass <= 0) {
          return false;
        }

        if (body.kind === "asteroid" && body.radius < this.minAsteroidGravityRadius) {
          return false;
        }

        return true;
      }


      // Mantiene el listado de fuentes de gravedad sincronizado con el perfil del cuerpo.
      syncBodyGravitySourceMembership(body) {
        if (!body) {
          return;
        }

        const shouldBeListed = !!body._canExertGravity && !body.isRemoved;
        if (shouldBeListed) {
          if (!body._isGravitySourceListed) {
            this.gravitySourceBodies.push(body);
            body._isGravitySourceListed = true;
          }
          return;
        }

        body._isGravitySourceListed = false;
      }

      // Actualiza el perfil gravitatorio precalculado de un cuerpo para optimizar consultas.
      updateBodyGravityProfile(body) {
        body._canExertGravity = this.canBodyExertGravity(body);
        if (!body._canExertGravity) {
          body.gravityStrength = 0;
          body.gravityRange = 0;
          body.gravityRangeSq = 0;
          this.syncBodyGravitySourceMembership(body);
          return;
        }

        body.gravityStrength = this.G * body.mass;

        if (this.minGravityAcceleration <= 0) {
          body.gravityRange = Infinity;
          body.gravityRangeSq = Infinity;
          this.syncBodyGravitySourceMembership(body);
          return;
        }

        body.gravityRange = Math.sqrt(body.gravityStrength / this.minGravityAcceleration);
        body.gravityRangeSq = body.gravityRange * body.gravityRange;
        this.syncBodyGravitySourceMembership(body);
      }

      // Obtiene un proyectil desde el pool o crea uno nuevo si la cache esta vacia.
      acquireProjectileBody(options = {}) {
        const projectile = this.projectilePool.pop();
        if (projectile) {
          reinitializeProjectileBody(projectile, options);
          return projectile;
        }
        return new ProjectileBody(options);
      }

      // Obtiene un asteroide desde el pool o crea uno nuevo si la cache esta vacia.
      acquireAsteroidBody(options = {}) {
        const asteroid = this.asteroidPool.pop();
        if (asteroid) {
          reinitializeAsteroidBody(asteroid, options);
          return asteroid;
        }
        const freshAsteroid = new PhysicalBody({
          bounciness: 0.0,
          color: "white",
          kind: "asteroid",
          ...options
        });
        freshAsteroid.orbitHost = options.orbitHost ?? null;
        freshAsteroid.orbitBandRadius = options.orbitBandRadius ?? null;
        return freshAsteroid;
      }

      // Obtiene una moneda desde el pool o crea una nueva si la cache esta vacia.
      acquireCoinBody(options = {}) {
        const coin = this.coinPool.pop();
        if (coin) {
          reinitializeCoinBody(coin, options);
          return coin;
        }
        return new CoinBody(options);
      }

      // Obtiene una moneda azul desde el pool o crea una nueva si la cache esta vacia.
      acquireBlueCoinBody(options = {}) {
        const coin = this.blueCoinPool.pop();
        if (coin) {
          reinitializeBlueCoinBody(coin, options);
          return coin;
        }
        return new BlueCoinBody(options);
      }

      // Devuelve un cuerpo reutilizable a su pool correspondiente cuando deja de estar presente en el mundo.
      recycleBody(body) {
        if (!body) {
          return;
        }

        if (body.kind === "projectile") {
          body.owner = null;
          body.faction = null;
          if (this.projectilePool.length < this.projectilePoolLimit) {
            this.projectilePool.push(body);
          }
          return;
        }

        if (body.kind === "asteroid") {
          body.orbitHost = null;
          body.orbitBandRadius = null;
          body.absorptionState = null;
          body.touchingPlanetCandidate = null;
          if (this.asteroidPool.length < this.asteroidPoolLimit) {
            this.asteroidPool.push(body);
          }
          return;
        }

        if (isCoinLike(body)) {
          if (body.isBlueCoin) {
            if (this.blueCoinPool.length < this.blueCoinPoolLimit) {
              this.blueCoinPool.push(body);
            }
          } else if (this.coinPool.length < this.coinPoolLimit) {
            this.coinPool.push(body);
          }
        }
      }

      // Gestiona add el cuerpo dentro del flujo principal del juego.
      addBody(body) {
        body.isRemoved = false;
        this.updateBodyGravityProfile(body);
        this.bodies.push(body);

        if (body.kind === "asteroid") {
          this.asteroidBodies.push(body);
        } else if (body.kind === "planet") {
          this.planetBodies.push(body);
        } else if (body.kind === "scrap") {
          this.scrapBodies.push(body);
        }

        this.gridIsFresh = false;
        this.gravityGridIsFresh = false;

        if (this.onBodyAdded) {
          this.onBodyAdded(body);
        }

        return body;
      }

      // Gestiona remove el cuerpo dentro del flujo principal del juego.
      removeBody(body) {
        if (!body || body.isRemoved) return;

        if (typeof body.onRemoved === "function") {
          body.onRemoved();
        }

        body.isRemoved = true;
        this.hasRemovedBodies = true;
        this.gridIsFresh = false;
        this.gravityGridIsFresh = false;

        if (this.onBodyRemoved) {
          this.onBodyRemoved(body);
        }
      }

      // Gestiona cleanup removed bodies dentro del flujo principal del juego.
      cleanupRemovedBodies() {
        if (!this.hasRemovedBodies) return;

        const removedBodies = [];
        const compact = (list, collectRemoved = false) => {
          let writeIndex = 0;

          for (let readIndex = 0; readIndex < list.length; readIndex++) {
            const body = list[readIndex];
            if (body.isRemoved) {
              if (collectRemoved) {
                removedBodies.push(body);
              }
              continue;
            }
            list[writeIndex++] = body;
          }

          list.length = writeIndex;
        };

        compact(this.bodies, true);
        compact(this.asteroidBodies);
        compact(this.planetBodies);
        compact(this.scrapBodies);

        let gravityWriteIndex = 0;
        for (let gravityReadIndex = 0; gravityReadIndex < this.gravitySourceBodies.length; gravityReadIndex++) {
          const body = this.gravitySourceBodies[gravityReadIndex];
          if (body.isRemoved || !body._canExertGravity) {
            body._isGravitySourceListed = false;
            continue;
          }
          body._isGravitySourceListed = true;
          this.gravitySourceBodies[gravityWriteIndex++] = body;
        }
        this.gravitySourceBodies.length = gravityWriteIndex;

        for (let i = 0; i < removedBodies.length; i++) {
          this.recycleBody(removedBodies[i]);
        }

        this.hasRemovedBodies = false;
      }

      // Indica si la grid de colisiones actual necesita reconstruirse antes de otra consulta.
      ensureFreshGrid() {
        if (!this.gridIsFresh) {
          this.rebuildGrid();
        }
      }

      // Indica si la grid usada por la gravedad necesita reconstruirse antes de aplicarla.
      ensureFreshGravityGrid() {
        if (!this.gravityGridIsFresh) {
          this.rebuildGravityGrid();
        }
      }

      // Reconstruye la grid principal de colisiones a partir del estado actual de los cuerpos.
      rebuildGrid() {
        this.grid.clear();

        for (let i = 0; i < this.bodies.length; i++) {
          const body = this.bodies[i];
          if (body.isRemoved) continue;
          this.grid.insert(body);
        }

        this.gridIsFresh = true;
      }

      // Reconstruye la grid auxiliar centrada usada para consultas de gravedad.
      rebuildGravityGrid() {
        this.gravityGrid.clear();

        for (let i = 0; i < this.bodies.length; i++) {
          const body = this.bodies[i];
          if (body.isRemoved || !body.receivesGravity) continue;
          this.gravityGrid.insertByCenter(body);
        }

        this.gravityGridIsFresh = true;
      }

      // Gestiona cull transient bodies dentro del flujo principal del juego.
      cullTransientBodies() {
        for (let i = 0; i < this.bodies.length; i++) {
          const body = this.bodies[i];
          if (body.isRemoved || !body.shouldDespawn) continue;
          this.removeBody(body);
        }
      }

      // Actualiza el mercader rescue state usando el estado actual y los parametros recibidos.
      updateMerchantRescueState(player) {
        this.merchantRescueStationId = null;

        if (!player || player.isRemoved || !player.isAlive || !this.grid) {
          return;
        }

        const rescueFuelThreshold = this.merchantRescueFuelThreshold ?? 0.001;
        if (player.fuel > rescueFuelThreshold) {
          return;
        }

        let nearestStation = null;
        let bestDistSq = Infinity;
        const rescueRadius = this.merchantRescueRadius;
        const rescueRadiusSq = rescueRadius * rescueRadius;
        const stamp = this.gravityQueryStamp++;

        this.grid.forEachNearbyUnique(player.x, player.y, rescueRadius, stamp, (body) => {
          if (body.isRemoved || body.kind !== "station" || !body.isAlive) return;
          if (factionSystem.getDisposition(player.faction, body.faction) === "enemy") return;

          const distSq = distanceSquared(body.x, body.y, player.x, player.y);
          if (distSq > rescueRadiusSq || distSq >= bestDistSq) return;

          nearestStation = body;
          bestDistSq = distSq;
        });

        this.merchantRescueStationId = nearestStation?.id ?? null;
      }

      // Aplica la gravedad de las fuentes validas a los cuerpos afectados del mundo.
      applyGravity(dt) {
        if (!(dt > 0) || this.gravitySourceBodies.length === 0) {
          return;
        }

        const rows = this.gravityGrid.rows;
        const cellSize = this.gravityGrid.cellSize;
        const contactEpsilon = 0.5;

        for (let sourceIndex = 0; sourceIndex < this.gravitySourceBodies.length; sourceIndex++) {
          const source = this.gravitySourceBodies[sourceIndex];
          if (source.isRemoved || !source._canExertGravity) continue;

          const range = source.gravityRange;
          if (!(range > 0)) continue;

          const rangeSq = source.gravityRangeSq;
          const sourceX = source.x;
          const sourceY = source.y;
          const sourceContactRadius = source.colliderRadius + contactEpsilon;
          const strengthDt = source.gravityStrength * dt;
          const minCellX = Math.floor((sourceX - range) / cellSize);
          const maxCellX = Math.floor((sourceX + range) / cellSize);
          const minCellY = Math.floor((sourceY - range) / cellSize);
          const maxCellY = Math.floor((sourceY + range) / cellSize);

          for (let cy = minCellY; cy <= maxCellY; cy++) {
            const row = rows.get(cy);
            if (!row) continue;

            const cellMinY = cy * cellSize;
            const cellMaxY = cellMinY + cellSize;
            const nearestY = sourceY < cellMinY ? cellMinY : (sourceY > cellMaxY ? cellMaxY : sourceY);
            const dyToCell = sourceY - nearestY;
            const dyToCellSq = dyToCell * dyToCell;
            if (dyToCellSq > rangeSq) continue;

            for (let cx = minCellX; cx <= maxCellX; cx++) {
              const cellMinX = cx * cellSize;
              const cellMaxX = cellMinX + cellSize;
              const nearestX = sourceX < cellMinX ? cellMinX : (sourceX > cellMaxX ? cellMaxX : sourceX);
              const dxToCell = sourceX - nearestX;
              if (dxToCell * dxToCell + dyToCellSq > rangeSq) continue;

              const bucket = row.get(cx);
              if (!bucket) continue;

              for (let i = 0; i < bucket.length; i++) {
                const target = bucket[i];
                if (target === source || target.isRemoved) {
                  continue;
                }

                const dx = sourceX - target.x;
                const dy = sourceY - target.y;
                const distSq = dx * dx + dy * dy;
                if (distSq < 0.0001 || distSq > rangeSq) continue;

                const minDistance = sourceContactRadius + target.colliderRadius;
                if (distSq <= minDistance * minDistance) continue;

                const invDistance = 1 / Math.sqrt(distSq);
                const gravityFactor = (strengthDt * invDistance) / distSq;
                target.vx += dx * gravityFactor;
                target.vy += dy * gravityFactor;
              }
            }
          }
        }
      }

      // Gestiona resolve collisions dentro del flujo principal del juego.
      resolveCollisions() {
        let resolvedCount = 0;

        this.grid.forEachCollisionPair((a, b) => {
          if (a.isRemoved || b.isRemoved || a.isCollisionDisabled || b.isCollisionDisabled) return;

          if (this.resolveCircleCollision(a, b)) {
            resolvedCount++;
          }
        });

        return resolvedCount;
      }

      // Aplica las colisiones damage dentro de esta parte de la logica.
      applyCollisionDamage(ship, impactSpeed, threshold) {
        if (!ship || ship.isRemoved || !ship.isAlive) return;
        if (ship === playerShip && testCheats.isPlayerInvincible()) return;
        if (!(impactSpeed > threshold)) return;

        const excessSpeed = impactSpeed - threshold;
        const damage = Math.round(excessSpeed * this.collisionDamageFactor);
        if (!(damage > 0)) return;

        const cooldownWindow = 0.12;
        const alreadyCounted = ship.collisionDamageCooldown > 0 && impactSpeed <= ship.lastCollisionDamageSpeed + 0.5;
        if (alreadyCounted) return;

        ship.collisionDamageCooldown = cooldownWindow;
        ship.lastCollisionDamageSpeed = impactSpeed;
        this.damageBody(ship, damage, null);
      }

      // Devuelve la nave explosion visual scale calculado a partir del estado y los parametros recibidos.
      getShipExplosionVisualScale(ship) {
        const referenceRadius = 18;
        const shipRadius = Math.max(4, ship?.radius ?? referenceRadius);
        return clamp(Math.pow(shipRadius / referenceRadius, 0.55), 0.68, 1.38);
      }

      // Resuelve la destruccion completa de una nave y sus efectos secundarios.
      destroyShip(ship) {
        if (!ship || !ship.isAlive) return;

        audioDirector.onShipDestroyed(ship);
        const explosionScale = this.getShipExplosionVisualScale(ship);
        const explosionColor = ship.color ?? '#ffffff';

        ship.isAlive = false;
        ship.color = "#ff6666";
        ship.angularVelocity = 0;
        ship.refuelTimer = 0;

        const explosionSpeed = Math.max(34, Math.hypot(ship.vx, ship.vy) * 0.24 + 52) * (0.94 + explosionScale * 0.1);
        const explosionSpeedVariance = Math.max(20, (ship.radius ?? 12) * 1.55) * (0.92 + explosionScale * 0.12);
        const minimumExplosionSpeed = Math.max(18, explosionSpeed - explosionSpeedVariance);
        const explosionIgnoreDuration = Math.max(0.18, ((ship.radius ?? 12) + 2 + Math.max(0, (ship.radius ?? 12) * 0.22)) / minimumExplosionSpeed);

        this.particles?.emitExplosion({
          x: ship.x,
          y: ship.y,
          count: clamp(Math.round((ship.mass ?? 0) * 1.25 * explosionScale), 18, 140),
          minLifetime: 0.56,
          maxLifetime: 1.8,
          color: explosionColor,
          colorVariance: 18,
          speed: explosionSpeed,
          speedVariance: explosionSpeedVariance,
          baseVX: ship.vx ?? 0,
          baseVY: ship.vy ?? 0,
          radiusMin: Math.max(2.4, 3.8 * explosionScale),
          radiusMax: Math.max(5.6, Math.min(18.5, (Math.max(7.2, Math.min(14.5, (ship.radius ?? 12) * 0.52))) * explosionScale)),
          ignoreBodyId: ship.id,
          ignoreDuration: explosionIgnoreDuration
        });

        this.spawnScrapFragments(ship, Math.max(32, Math.hypot(ship.vx, ship.vy) * 0.22 + 28), clamp(Math.round((ship.mass ?? 0) / 3.8), 2, 12));

        if (ship.kind === "carrier" && typeof ship.handleCarrierDestroyed === "function") {
          ship.handleCarrierDestroyed();
          this.spawnBlueCoinBurst(ship, randomInt(1, 3));
        }

        if (ship.kind === "flea") {
          this.addBody(this.acquireCoinBody({
            x: ship.x,
            y: ship.y,
            vx: ship.vx + randomBetween(-14, 14),
            vy: ship.vy + randomBetween(-14, 14),
            angle: randomBetween(0, Math.PI * 2),
            angularVelocity: randomBetween(-2.5, 2.5),
            radius: 4.8,
            colliderRadius: 5.8,
            mass: 0.035,
            value: 1,
            isProcedural: false,
            isFieldBody: false
          }));
        }

        if (ship.kind === "wasp" || ship.kind === "dragonfly") {
          const isLargeHull = ship.hullClass === "large";
          const dropCount = ship.kind === "wasp"
            ? (isLargeHull ? randomInt(5, 8) : randomInt(2, 4))
            : (isLargeHull ? randomInt(7, 11) : randomInt(3, 5));
          for (let i = 0; i < dropCount; i++) {
            this.addBody(this.acquireCoinBody({
              x: ship.x + randomBetween(-ship.radius * 0.45, ship.radius * 0.45),
              y: ship.y + randomBetween(-ship.radius * 0.45, ship.radius * 0.45),
              vx: ship.vx + randomBetween(-36, 36),
              vy: ship.vy + randomBetween(-36, 36),
              angle: randomBetween(0, Math.PI * 2),
              angularVelocity: randomBetween(-4, 4),
              radius: isLargeHull ? 5.4 : 4.8,
              colliderRadius: isLargeHull ? 6.4 : 5.8,
              mass: isLargeHull ? 0.045 : 0.035,
              value: 1,
              isProcedural: false,
              isFieldBody: false
            }));
          }
        }

        if (ship.kind === "tarantula") {
          this.spawnBlueCoinBurst(ship, 1);
        }

        if (ship.kind === "ship") {
          this.isGameOver = true;
          return;
        }

        this.removeBody(ship);
      }

      // Gestiona damage el cuerpo dentro del flujo principal del juego.
      damageBody(body, amount, projectile = null) {
        if (!body || body.isRemoved || !(amount > 0)) return;
        if (body === playerShip && testCheats.isPlayerInvincible()) return;
        body.timeSinceLastDamage = 0;
        body.hp = Math.max(0, body.hp - amount);

        if (body.kind === "station" && projectile && projectile.faction && projectile.faction !== body.faction) {
          factionSystem.addRelation(projectile.faction, body.faction, -5);

          const sourceDistance = Math.hypot((projectile.originX ?? projectile.x) - body.x, (projectile.originY ?? projectile.y) - body.y);
          if (sourceDistance > body.weaponRange && typeof body.registerLongRangeHit === "function") {
            body.registerLongRangeHit(projectile);
          }
        }

        if ((body.kind === "wasp" || body.kind === "dragonfly") && projectile && projectile.faction && projectile.faction !== body.faction) {
          applyFactionHitConsequences(projectile.faction, body.faction, amount);
        }

        if (body.kind === "miner" && projectile && projectile.faction && projectile.faction !== body.faction) {
          factionSystem.addRelation(projectile.faction, body.faction, -6);

          const sourceDistance = Math.hypot((projectile.originX ?? projectile.x) - body.x, (projectile.originY ?? projectile.y) - body.y);
          if (sourceDistance > body.weaponRange && typeof body.registerLongRangeHit === "function") {
            body.registerLongRangeHit(projectile);
          }
        }

        if ((body.kind === "carrier" || body.kind === "interceptor") && projectile && projectile.faction && projectile.faction !== body.faction) {
          factionSystem.addRelation(projectile.faction, body.faction, body.kind === "carrier" ? -8 : -4);

          const sourceDistance = Math.hypot((projectile.originX ?? projectile.x) - body.x, (projectile.originY ?? projectile.y) - body.y);
          if (sourceDistance > (body.weaponRange ?? 0) && typeof body.registerLongRangeHit === "function") {
            body.registerLongRangeHit(projectile);
          }
        }

        if (body.kind === "tarantula" && projectile && projectile.faction && projectile.faction !== body.faction) {
          factionSystem.addRelation(projectile.faction, body.faction, -10);
        }

        if (body.hp <= 0) {
          if (body.kind === "scrap") {
            this.destroyScrap(body, projectile);
            return;
          }

          if (isShipLike(body)) {
            this.destroyShip(body);
          }
        }
      }

      resolveDirectionalVector(source, fallbackAngle = randomBetween(0, Math.PI * 2)) {
        if (source) {
          const vx = source.x ?? source.vx ?? 0;
          const vy = source.y ?? source.vy ?? 0;
          const speed = Math.hypot(vx, vy);

          if (speed > 0.0001) {
            return {
              x: vx / speed,
              y: vy / speed,
              angle: Math.atan2(vy, vx)
            };
          }

          if (typeof source.angle === "number") {
            return {
              x: Math.cos(source.angle),
              y: Math.sin(source.angle),
              angle: source.angle
            };
          }
        }

        return {
          x: Math.cos(fallbackAngle),
          y: Math.sin(fallbackAngle),
          angle: fallbackAngle
        };
      }

      // Devuelve el asteroide max subdivision count calculado a partir del estado y los parametros recibidos.
      getAsteroidMaxSubdivisionCount(radius) {
        if (!(radius > 0) || !(this.minAsteroidFragmentRadius > 0)) {
          return 0;
        }

        return Math.floor((radius * radius) / (this.minAsteroidFragmentRadius * this.minAsteroidFragmentRadius));
      }

      // Devuelve el asteroide fragment count calculado a partir del estado y los parametros recibidos.
      getAsteroidFragmentCount(radius, requestedSubdivisionCount) {
        const desiredCount = Math.max(2, Math.round(requestedSubdivisionCount));
        const maxAllowedCount = this.getAsteroidMaxSubdivisionCount(radius);

        if (maxAllowedCount < 2) {
          return 0;
        }

        return Math.min(desiredCount, maxAllowedCount);
      }

      // Devuelve el asteroide fragment radius calculado a partir del estado y los parametros recibidos.
      getAsteroidFragmentRadius(radius, subdivisionCount) {
        if (!(subdivisionCount > 0)) {
          return 0;
        }

        return radius / Math.sqrt(subdivisionCount);
      }

      // Devuelve el asteroide subdivision angles calculado a partir del estado y los parametros recibidos.
      getAsteroidSubdivisionAngles(fragmentCount, divisionAngle) {
        if (fragmentCount <= 1) {
          return [divisionAngle];
        }

        const totalArc = Math.min(
          Math.PI * 1.5,
          Math.max(Math.PI * 0.6, (fragmentCount - 1) * (Math.PI / 7.5))
        );
        const angleStep = totalArc / (fragmentCount - 1);
        const startAngle = divisionAngle - totalArc * 0.5;
        const angles = [];

        for (let i = 0; i < fragmentCount; i++) {
          angles.push(startAngle + angleStep * i);
        }

        return angles;
      }

      breakAsteroid(asteroid, {
        subdivisionCount = 2,
        ejectionSpeed = 0,
        divisionVector = null,
        coinSource = null,
        dropCoins = true
      } = {}) {
        if (!asteroid || asteroid.isRemoved) {
          return [];
        }

        const fragmentCount = this.getAsteroidFragmentCount(asteroid.radius, subdivisionCount);
        this.removeBody(asteroid);

        if (fragmentCount < 2) {
          audioDirector.onAsteroidBroken(asteroid, { fragmentCount: 0, terminal: true });
          this.emitAsteroidTerminalBreakParticles(asteroid, divisionVector);
          if (dropCoins) {
            this.spawnCoinFromAsteroid(asteroid, coinSource ?? divisionVector);
          }
          return [];
        }

        const childRadius = this.getAsteroidFragmentRadius(asteroid.radius, fragmentCount);
        if (childRadius < this.minAsteroidFragmentRadius) {
          audioDirector.onAsteroidBroken(asteroid, { fragmentCount: 0, terminal: true });
          this.emitAsteroidTerminalBreakParticles(asteroid, divisionVector);
          if (dropCoins) {
            this.spawnCoinFromAsteroid(asteroid, coinSource ?? divisionVector);
          }
          return [];
        }

        audioDirector.onAsteroidBroken(asteroid, { fragmentCount, terminal: false });

        const direction = this.resolveDirectionalVector(divisionVector, asteroid.angle);
        const angles = this.getAsteroidSubdivisionAngles(fragmentCount, direction.angle);
        const density = asteroid.mass / Math.max(1, asteroid.radius * asteroid.radius);
        const childMass = Math.max(0.6, density * childRadius * childRadius);
        const childHp = getAsteroidMaxHpFromRadius(childRadius);
        const separationRadius = Math.max(
          childRadius * 1.15,
          childRadius / Math.max(0.16, Math.sin(Math.PI / fragmentCount))
        );
        const fragments = [];

        for (let i = 0; i < angles.length; i++) {
          const angle = angles[i];
          const dirX = Math.cos(angle);
          const dirY = Math.sin(angle);
          const offsetJitter = childRadius * 0.08;

          const childAsteroid = this.acquireAsteroidBody({
            x: asteroid.x + dirX * separationRadius + randomBetween(-offsetJitter, offsetJitter),
            y: asteroid.y + dirY * separationRadius + randomBetween(-offsetJitter, offsetJitter),
            vx: asteroid.vx + dirX * ejectionSpeed,
            vy: asteroid.vy + dirY * ejectionSpeed,
            radius: childRadius,
            mass: childMass,
            angle: randomBetween(0, Math.PI * 2),
            angularVelocity: asteroid.angularVelocity + randomBetween(-1.6, 1.6),
            color: asteroid.color,
            bounciness: 0.0,
            isProcedural: asteroid.isProcedural,
            isFieldBody: asteroid.isFieldBody,
            kind: "asteroid",
            hp: childHp,
            maxHp: childHp
          });
          this.addBody(childAsteroid);
          fragments.push(childAsteroid);
        }

        return fragments;
      }
      // Gestiona emit el asteroide terminal break particles dentro del flujo principal del juego.
      emitAsteroidTerminalBreakParticles(asteroid, source = null) {
        if (!asteroid) {
          return;
        }

        const direction = this.resolveDirectionalVector(source, asteroid.angle);
        const asteroidSpeed = Math.hypot(asteroid.vx ?? 0, asteroid.vy ?? 0);

        this.particles?.emitExplosion({
          x: asteroid.x,
          y: asteroid.y,
          count: clamp(Math.round((asteroid.radius ?? 0) * 1.35), 8, 22),
          minLifetime: 0.3,
          maxLifetime: 0.95,
          color: asteroid.color ?? '#c8c8c8',
          colorVariance: 20,
          speed: Math.max(20, asteroidSpeed * 0.18 + 24),
          speedVariance: Math.max(10, (asteroid.radius ?? 0) * 0.8),
          baseVX: (asteroid.vx ?? 0) + direction.x * 4,
          baseVY: (asteroid.vy ?? 0) + direction.y * 4,
          radiusMin: 1.8,
          radiusMax: Math.max(3.4, Math.min(6.8, (asteroid.radius ?? 0) * 0.42)),
          ignoreBodyId: asteroid.id,
          ignoreDuration: 0.05
        });
      }

      // Genera el objetivo de monedas from el asteroide usando la configuracion y el contexto actuales.
      spawnCoinFromAsteroid(asteroid, source = null) {
        const direction = this.resolveDirectionalVector(source);
        const dirX = direction.x;
        const dirY = direction.y;
        const coinCount = randomInt(1, 5);

        for (let i = 0; i < coinCount; i++) {
          const perpX = -dirY;
          const perpY = dirX;
          const lateralKick = randomBetween(-28, 28);
          const forwardKick = randomBetween(-8, 12);
          const coinRadius = clamp(asteroid.radius * 0.22, 4.2, 6.2);
          const coinMass = Math.min(
            Math.max(0.018, asteroid.mass * 0.0022),
            asteroid.mass * 0.08,
            0.05
          );

          this.addBody(this.acquireCoinBody({
            x: asteroid.x + perpX * randomBetween(-asteroid.radius * 0.25, asteroid.radius * 0.25),
            y: asteroid.y + perpY * randomBetween(-asteroid.radius * 0.25, asteroid.radius * 0.25),
            vx: asteroid.vx + perpX * lateralKick + dirX * forwardKick,
            vy: asteroid.vy + perpY * lateralKick + dirY * forwardKick,
            angle: randomBetween(0, Math.PI * 2),
            angularVelocity: randomBetween(-3.5, 3.5),
            radius: coinRadius,
            colliderRadius: coinRadius + 1,
            mass: coinMass,
            value: 1,
            isProcedural: false,
            isFieldBody: false
          }));
        }
      }

      // Genera el objetivo de monedas from el objetivo de chatarra usando la configuracion y el contexto actuales.
      spawnCoinFromScrap(scrap, source = null) {
        const direction = this.resolveDirectionalVector(source, scrap.angle);
        const perpX = -direction.y;
        const perpY = direction.x;

        this.addBody(this.acquireCoinBody({
          x: scrap.x + perpX * randomBetween(-scrap.radius * 0.25, scrap.radius * 0.25),
          y: scrap.y + perpY * randomBetween(-scrap.radius * 0.25, scrap.radius * 0.25),
          vx: scrap.vx + direction.x * randomBetween(8, 20) + perpX * randomBetween(-14, 14),
          vy: scrap.vy + direction.y * randomBetween(8, 20) + perpY * randomBetween(-14, 14),
          angle: randomBetween(0, Math.PI * 2),
          angularVelocity: randomBetween(-3.2, 3.2),
          radius: 4.6,
          colliderRadius: 5.6,
          mass: 0.03,
          value: 1,
          isProcedural: false,
          isFieldBody: false
        }));
      }

      // Genera blue el objetivo de monedas burst usando la configuracion y el contexto actuales.
      spawnBlueCoinBurst(source, count = 1) {
        if (!source || !(count > 0)) {
          return 0;
        }

        for (let i = 0; i < count; i++) {
          this.addBody(this.acquireBlueCoinBody({
            x: source.x + randomBetween(-(source.radius ?? 10) * 0.4, (source.radius ?? 10) * 0.4),
            y: source.y + randomBetween(-(source.radius ?? 10) * 0.4, (source.radius ?? 10) * 0.4),
            vx: (source.vx ?? 0) + randomBetween(-36, 36),
            vy: (source.vy ?? 0) + randomBetween(-36, 36),
            angle: randomBetween(0, Math.PI * 2),
            angularVelocity: randomBetween(-3.8, 3.8),
            isProcedural: false,
            isFieldBody: false
          }));
        }

        return count;
      }

      // Genera el objetivo de chatarra fragments usando la configuracion y el contexto actuales.
      spawnScrapFragments(source, ejectionSpeed = 0, fragmentCount = 1) {
        if (!source || !(fragmentCount > 0)) {
          return 0;
        }

        const count = Math.max(1, Math.round(fragmentCount));
        const baseDirection = this.resolveDirectionalVector(source, source.angle ?? 0);
        const baseAngle = baseDirection.angle + randomBetween(-0.18, 0.18);
        const procedural = !!source.isProcedural;
        const fieldBody = !!source.isFieldBody;

        for (let i = 0; i < count; i++) {
          const angle = baseAngle + (i / count) * Math.PI * 2 + randomBetween(-0.34, 0.34);
          const dirX = Math.cos(angle);
          const dirY = Math.sin(angle);
          const speed = ejectionSpeed * randomBetween(0.72, 1.18);
          const spawnRadius = Math.max(4, (source.radius ?? 12) * 0.28);

          this.addBody(new ScrapBody({
            x: source.x + dirX * randomBetween(0, spawnRadius),
            y: source.y + dirY * randomBetween(0, spawnRadius),
            vx: (source.vx ?? 0) + dirX * speed,
            vy: (source.vy ?? 0) + dirY * speed,
            angle: randomBetween(0, Math.PI * 2),
            angularVelocity: randomBetween(-4.5, 4.5),
            color: source.color ?? "#b9bccb",
            accentColor: "rgba(255,255,255,0.3)",
            shapeIndex: randomInt(0, 3),
            hp: randomInt(1, 5),
            maxHp: 5,
            isProcedural: procedural,
            isFieldBody: fieldBody
          }));
        }

        return count;
      }

      // Gestiona destroy el objetivo de chatarra dentro del flujo principal del juego.
      destroyScrap(scrap, source = null) {
        if (!scrap || scrap.isRemoved) return;
        audioDirector.onScrapDestroyed(scrap);
        this.removeBody(scrap);
        this.spawnCoinFromScrap(scrap, source);
      }

      // Gestiona collect el objetivo de chatarra dentro del flujo principal del juego.
      collectScrap(ship, scrap) {
        if (!ship || !ship.isAlive || !scrap || scrap.isRemoved) return;
        audioDirector.onScrapCollected(ship, scrap);
        this.removeBody(scrap);
        if (ship.kind === "dragonfly" || ship.kind === "tarantula") {
          ship.hp = Math.min(ship.maxHp, ship.hp + 5);
        }
      }

      // Gestiona collect el objetivo de monedas dentro del flujo principal del juego.
      collectCoin(ship, coin) {
        if (!ship.isAlive) return;
        const value = Math.max(1, coin.value ?? 1);
        audioDirector.onCoinCollected(ship, coin, value);
        this.removeBody(coin);
        const interceptedStorage = typeof ship.handleCollectedCoin === "function" && ship.handleCollectedCoin(value, coin) === true;
        if (!interceptedStorage) {
          ship.credits += value;
          if (typeof ship.onCoinCollected === "function") {
            ship.onCoinCollected(value, coin);
          }
        }
        if (ship.kind === "tarantula") {
          ship.hp = Math.min(ship.maxHp, ship.hp + value * 15);
        }
      }

      // Actualiza la nave el objetivo de monedas pickup usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      updateShipCoinPickup(dt) {
        if (!this.grid) {
          return;
        }

        for (let i = 0; i < this.bodies.length; i++) {
          const ship = this.bodies[i];
          if (ship.isRemoved || !isShipLike(ship) || !ship.isAlive) {
            continue;
          }

          const shipReach = ship.colliderRadius ?? ship.radius ?? 0;
          if (!(shipReach > 0)) {
            continue;
          }

          const stamp = this.gravityQueryStamp++;
          this.grid.forEachNearbyUnique(ship.x, ship.y, shipReach + 8, stamp, (coin) => {
            if (coin.isRemoved || !isCoinLike(coin)) return;

            const reach = shipReach + (coin.colliderRadius ?? coin.radius ?? 0);
            const distSq = distanceSquared(ship.x, ship.y, coin.x, coin.y);

            if (distSq <= reach * reach) {
              this.collectCoin(ship, coin);
            }
          });
        }
      }

      // Gestiona la evasion de proyectiles el asteroide impact dentro del flujo principal del juego.
      handleProjectileAsteroidImpact(projectile, asteroid) {
        if (!projectile || projectile.isRemoved || projectile.hasImpacted) return;
        projectile.hasImpacted = true;
        projectile.isCollisionDisabled = true;
        this.removeBody(projectile);
        audioDirector.onProjectileImpact(projectile, asteroid);

        if (asteroid.isRemoved) return;

        this.damageBody(asteroid, projectile.damage ?? 1, projectile);
        if (asteroid.hp > 0 || asteroid.isRemoved) {
          return;
        }

        const projectileDirection = this.resolveDirectionalVector(projectile, projectile.angle);
        const requestedSubdivisionCount = randomInt(
          this.projectileAsteroidMinSubdivisions,
          this.projectileAsteroidMaxSubdivisions
        );

        this.breakAsteroid(asteroid, {
          subdivisionCount: requestedSubdivisionCount,
          ejectionSpeed: this.defaultAsteroidProjectileEjectionSpeed,
          divisionVector: {
            x: -projectileDirection.x,
            y: -projectileDirection.y
          },
          coinSource: projectile
        });
      }

      // Devuelve el asteroide las colisiones explosion chance calculado a partir del estado y los parametros recibidos.
      getAsteroidCollisionExplosionChance(impactSpeed) {
        const excessSpeed = impactSpeed - this.asteroidCollisionExplosionMinSpeed;
        if (!(excessSpeed > 0)) {
          return 0;
        }

        return clamp(
          excessSpeed * this.asteroidCollisionExplosionChancePerSpeed,
          0,
          1
        );
      }

      // Devuelve el asteroide las colisiones subdivision count calculado a partir del estado y los parametros recibidos.
      getAsteroidCollisionSubdivisionCount(radius) {
        const radiusT = clamp((radius - 13) / (40 - 13), 0, 1);
        const requestedCount = Math.round(
          lerp(
            this.asteroidCollisionMinSubdivisionCount,
            this.asteroidCollisionMaxSubdivisionCount,
            radiusT
          )
        );

        return clamp(
          requestedCount,
          this.asteroidCollisionMinSubdivisionCount,
          this.asteroidCollisionMaxSubdivisionCount
        );
      }

      // Devuelve el cuerpo linear momentum calculado a partir del estado y los parametros recibidos.
      getBodyLinearMomentum(body) {
        if (!body) {
          return { x: 0, y: 0 };
        }

        return {
          x: (body.mass ?? 0) * (body.vx ?? 0),
          y: (body.mass ?? 0) * (body.vy ?? 0)
        };
      }

      // Devuelve bodies linear momentum calculado a partir del estado y los parametros recibidos.
      getBodiesLinearMomentum(bodies) {
        let totalX = 0;
        let totalY = 0;

        if (!Array.isArray(bodies)) {
          return { x: 0, y: 0 };
        }

        for (let i = 0; i < bodies.length; i++) {
          const body = bodies[i];
          if (!body || body.isRemoved) {
            continue;
          }

          totalX += (body.mass ?? 0) * (body.vx ?? 0);
          totalY += (body.mass ?? 0) * (body.vy ?? 0);
        }

        return { x: totalX, y: totalY };
      }

      // Aplica linear momentum to el cuerpo dentro de esta parte de la logica.
      applyLinearMomentumToBody(body, momentumX, momentumY) {
        if (!body || body.isRemoved || !(body.mass > 0)) {
          return false;
        }

        body.vx += momentumX / body.mass;
        body.vy += momentumY / body.mass;
        return true;
      }

      // Gestiona explode el asteroide from las colisiones detailed dentro del flujo principal del juego.
      explodeAsteroidFromCollisionDetailed(asteroid, collider, impactSpeed, fallbackNormal = null, dropCoins = false) {
        if (!asteroid || asteroid.isRemoved || asteroid.kind !== "asteroid") {
          return {
            exploded: false,
            fragments: [],
            transferredMomentumX: 0,
            transferredMomentumY: 0
          };
        }

        const explosionChance = this.getAsteroidCollisionExplosionChance(impactSpeed);
        if (!(explosionChance > 0) || Math.random() >= explosionChance) {
          return {
            exploded: false,
            fragments: [],
            transferredMomentumX: 0,
            transferredMomentumY: 0
          };
        }

        const relativeVelocityX = asteroid.vx - (collider?.vx ?? 0);
        const relativeVelocityY = asteroid.vy - (collider?.vy ?? 0);
        let divisionVector = {
          x: -relativeVelocityX,
          y: -relativeVelocityY
        };

        if (Math.hypot(divisionVector.x, divisionVector.y) < 0.001 && fallbackNormal) {
          divisionVector = {
            x: fallbackNormal.x,
            y: fallbackNormal.y
          };
        }

        const originalMomentum = this.getBodyLinearMomentum(asteroid);
        const fragments = this.breakAsteroid(asteroid, {
          subdivisionCount: this.getAsteroidCollisionSubdivisionCount(asteroid.radius),
          ejectionSpeed: impactSpeed * randomBetween(
