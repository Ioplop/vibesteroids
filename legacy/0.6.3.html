    // Devuelve shop definition by la tecla calculado a partir del estado y los parametros recibidos.
    function getShopDefinitionByKey(key) {
      return shopCatalog.find((definition) => definition.key === key) ?? null;
    }

    // Devuelve available shop definitions calculado a partir del estado y los parametros recibidos.
    function getAvailableShopDefinitions(excludeKeys = []) {
      const exclude = new Set(excludeKeys);

      return shopCatalog.filter((definition) => {
        if (exclude.has(definition.key)) {
          return false;
        }

        if (definition.isAvailable && !definition.isAvailable(playerShip)) {
          return false;
        }

        return true;
      });
    }


    const merchantServiceCatalog = [
      {
        key: "fuel",
        title: "Bidon de combustible",
        getCost: () => 1,
        getDescription: () => "+30 s de combustible",
        isAvailable: (ship) => ship.fuel < ship.maxFuel - 0.001,
        apply: (ship) => {
          ship.fuel = Math.min(ship.maxFuel, ship.fuel + 30);
        }
      },
      {
        key: "ammo",
        title: "Caja de municion",
        getCost: () => 1,
        getDescription: () => "+200 municion",
        isAvailable: (ship) => ship.ammo < ship.maxAmmo - 0.001,
        apply: (ship) => {
          ship.ammo = Math.min(ship.maxAmmo, ship.ammo + 200);
        }
      },
      {
        key: "hp",
        title: "Parche de casco",
        getCost: () => 1,
        getDescription: (ship) => `+10% de vida (${ship.hp.toFixed(0)} -> ${Math.min(ship.maxHp, ship.hp + ship.maxHp * 0.1).toFixed(0)})`,
        isAvailable: (ship) => ship.hp < ship.maxHp - 0.001,
        apply: (ship) => {
          ship.hp = Math.min(ship.maxHp, ship.hp + ship.maxHp * 0.1);
        }
      }
    ];

    // Indica si el mercader ally cumple la condicion esperada para esta logica.
    function isMerchantAlly(station) {
      return !!station && factionSystem.getDisposition(playerShip.faction, station.faction) === "ally";
    }

    // Gestiona build el mercader service entry dentro del flujo principal del juego.
    function buildMerchantServiceEntry(definition, station) {
      return {
        kind: "service",
        key: definition.key,
        title: definition.title,
        description: definition.getDescription(playerShip),
        cost: isMerchantAlly(station) ? 0 : definition.getCost(playerShip),
        available: !definition.isAvailable || definition.isAvailable(playerShip)
      };
    }

    // Gestiona refresh shop entries dentro del flujo principal del juego.
    function refreshShopEntries() {
      const services = merchantServiceCatalog.map((definition) => buildMerchantServiceEntry(definition, shopState.station));
      const upgrades = shopState.offers.map((offer) => {
        const definition = getShopDefinitionByKey(offer.key);
        const isAvailable = !!definition && (!definition.isAvailable || definition.isAvailable(playerShip));
        return {
          kind: "upgrade",
          ...offer,
          available: isAvailable
        };
      });
      shopState.entries = [...services, ...upgrades];
    }

    // Gestiona build shop offer dentro del flujo principal del juego.
    function buildShopOffer(definition) {
      return {
        key: definition.key,
        title: definition.title,
        description: definition.getDescription(playerShip),
        cost: definition.getCost(playerShip)
      };
    }

    // Gestiona generate shop offer keys dentro del flujo principal del juego.
    function generateShopOfferKeys(count = 5, excludeKeys = [], preventKey = null) {
      let availableDefinitions = getAvailableShopDefinitions(excludeKeys);
      if (preventKey) {
        const withoutPreventKey = availableDefinitions.filter((definition) => definition.key !== preventKey);
        if (withoutPreventKey.length > 0) {
          availableDefinitions = withoutPreventKey;
        }
      }
      shuffleInPlace(availableDefinitions);
      return availableDefinitions.slice(0, Math.min(count, availableDefinitions.length)).map((definition) => definition.key);
    }

    // Gestiona ensure station shop inventory dentro del flujo principal del juego.
    function ensureStationShopInventory(station, count = 5) {
      if (!station) {
        return [];
      }

      const desiredCount = Math.max(0, count);
      const existingKeys = Array.isArray(station.shopOfferKeys)
        ? station.shopOfferKeys.filter((key, index, array) => {
            if (array.indexOf(key) !== index) {
              return false;
            }
            const definition = getShopDefinitionByKey(key);
            if (!definition) {
              return false;
            }
            return !definition.isAvailable || definition.isAvailable(playerShip);
          })
        : [];

      const missingCount = Math.max(0, desiredCount - existingKeys.length);
      const replacementKeys = missingCount > 0 ? generateShopOfferKeys(missingCount, existingKeys) : [];
      station.shopOfferKeys = [...existingKeys, ...replacementKeys].slice(0, desiredCount);
      return station.shopOfferKeys;
    }

    // Gestiona build shop offers from keys dentro del flujo principal del juego.
    function buildShopOffersFromKeys(offerKeys = []) {
      return offerKeys.map((key) => {
        const definition = getShopDefinitionByKey(key);
        return definition ? buildShopOffer(definition) : null;
      }).filter(Boolean);
    }

    // Sincroniza shop offers dentro de esta parte de la logica.
    function syncShopOffers(targetCount = 5, rerollIndex = -1, preventKey = null) {
      if (!shopState.station) {
        shopState.offers = [];
        return shopState.offers;
      }

      const station = shopState.station;
      const desiredCount = Math.max(1, targetCount);
      const offerKeys = [...ensureStationShopInventory(station, desiredCount)];

      if (rerollIndex >= 0) {
        while (offerKeys.length <= rerollIndex) {
          offerKeys.push(null);
        }

        const usedKeys = offerKeys.filter((key, index) => index !== rerollIndex && key != null);
        const replacementKeys = generateShopOfferKeys(1, usedKeys, preventKey ?? offerKeys[rerollIndex] ?? null);
        if (replacementKeys.length > 0) {
          offerKeys[rerollIndex] = replacementKeys[0];
        }
      }

      station.shopOfferKeys = offerKeys.filter((key, index, array) => !!getShopDefinitionByKey(key) && array.indexOf(key) === index).slice(0, desiredCount);
      shopState.offers = buildShopOffersFromKeys(station.shopOfferKeys);
      return shopState.offers;
    }

    // Gestiona generate shop offers dentro del flujo principal del juego.
    function generateShopOffers(count = 5) {
      if (!shopState.station) {
        return [];
      }
      return buildShopOffersFromKeys(ensureStationShopInventory(shopState.station, count));
    }

    // Gestiona refresh shop offers dentro del flujo principal del juego.
    function refreshShopOffers() {
      syncShopOffers(shopState.offers.length || shopState.station?.shopOfferKeys?.length || 5);
      if (shopState.isOpen) {
        refreshShopEntries();
      }
    }

    // Gestiona reroll shop offer dentro del flujo principal del juego.
    function rerollShopOffer(index) {
      const currentOffer = shopState.offers[index] ?? null;
      syncShopOffers(Math.max(shopState.offers.length, shopState.station?.shopOfferKeys?.length || 1), index, currentOffer?.key ?? null);
    }

    // Gestiona find los elementos cercanos station dentro del flujo principal del juego.
    function findNearbyStation() {
      if (!world.grid) {
        return null;
      }

      let nearestStation = null;
      let bestDistSq = Infinity;
      const queryRadius = 220;
      const stamp = world.gravityQueryStamp++;

      world.grid.forEachNearbyUnique(playerShip.x, playerShip.y, queryRadius, stamp, (body) => {
        if (body.isRemoved || body.kind !== "station") return;

        const interactionRadius = body.interactionRadius ?? (body.radius + 120);
        const distSq = distanceSquared(body.x, body.y, playerShip.x, playerShip.y);

        if (distSq <= interactionRadius * interactionRadius && distSq < bestDistSq) {
          nearestStation = body;
          bestDistSq = distSq;
        }
      });

      return nearestStation;
    }

    // Gestiona pick el cuerpo under cursor dentro del flujo principal del juego.
    function pickBodyUnderCursor(options = {}) {
      if (!world.grid) {
        return null;
      }

      const includePlayer = options.includePlayer ?? false;
      const includeProjectiles = options.includeProjectiles ?? false;
      const includeCoins = options.includeCoins ?? false;
      const pickRadius = options.pickRadius ?? 28;
      let bestBody = null;
      let bestScore = Infinity;
      const stamp = world.gravityQueryStamp++;

      world.grid.forEachNearbyUnique(mouse.worldX, mouse.worldY, pickRadius, stamp, (body) => {
        if (body.isRemoved) {
          return;
        }
        if (!includePlayer && body === playerShip) {
          return;
        }
        if (!includeProjectiles && body.kind === "projectile") {
          return;
        }
        if (!includeCoins && body.kind === "coin") {
          return;
        }

        const dx = mouse.worldX - body.x;
        const dy = mouse.worldY - body.y;
        const dist = Math.hypot(dx, dy);
        const allowed = body.radius + pickRadius;
        if (dist > allowed) {
          return;
        }

        const score = Math.max(0, dist - body.radius) - Math.min(body.radius, 32) * 0.12;
        if (score < bestScore) {
          bestScore = score;
          bestBody = body;
        }
      });

      return bestBody;
    }

    // Gestiona find el cuerpo under cursor dentro del flujo principal del juego.
    function findBodyUnderCursor() {
      return pickBodyUnderCursor();
    }

    // Gestiona find manipulable el cuerpo under cursor dentro del flujo principal del juego.
    function findManipulableBodyUnderCursor() {
      return pickBodyUnderCursor({ includePlayer: true, includeCoins: false, includeProjectiles: false, pickRadius: 34 });
    }

    // Gestiona open shop dentro del flujo principal del juego.
    function openShop(station) {
      if (!station || !playerShip.isAlive || world.isGameOver) {
        return;
      }

      if (factionSystem.getDisposition(playerShip.faction, station.faction) === "enemy") {
        world.lastMerchantRefusalTimer = 2.8;
        return;
      }

      shopState.isOpen = true;
      shopState.station = station;
      shopState.offers = generateShopOffers(5);
      refreshShopEntries();
      shopState.buttons = [];
      shopState.hoverIndex = -1;
      resetMenuScroll(shopState);
    }

    // Gestiona close shop dentro del flujo principal del juego.
    function closeShop() {
      shopState.isOpen = false;
      shopState.station = null;
      shopState.offers = [];
      shopState.entries = [];
      shopState.buttons = [];
      shopState.hoverIndex = -1;
      resetMenuScroll(shopState);
      canvas.style.cursor = "crosshair";
    }

    // Gestiona attempt purchase entry dentro del flujo principal del juego.
    function attemptPurchaseEntry(index) {
      if (!shopState.isOpen) return false;

      const entry = shopState.entries[index];
      if (!entry || entry.available === false) return false;
      if (playerShip.credits < entry.cost) return false;

      if (entry.kind === "service") {
        const definition = merchantServiceCatalog.find((service) => service.key === entry.key);
        if (!definition) return false;
        if (definition.isAvailable && !definition.isAvailable(playerShip)) return false;

        playerShip.credits -= entry.cost;
        definition.apply(playerShip);
        refreshShopEntries();
        return true;
      }

      const offerIndex = Math.max(0, index - merchantServiceCatalog.length);
      const offer = shopState.offers[offerIndex];
      if (!offer) return false;

      const definition = getShopDefinitionByKey(offer.key);
      if (!definition) return false;
      if (definition.isAvailable && !definition.isAvailable(playerShip)) return false;

      playerShip.credits -= offer.cost;
      definition.apply(playerShip);
      if (shopState.station?.faction && offer.cost > 0) {
        factionSystem.addRelation(playerShip.faction, shopState.station.faction, offer.cost / 10);
      }
      rerollShopOffer(offerIndex);
      refreshShopOffers();
      refreshShopEntries();
      return true;
    }

    // Gestiona menu hotkeys dentro del flujo principal del juego.
    function handleMenuHotkeys(e) {
      if (e.code === "KeyP") {
        if (testCheats.testMode) {
          return;
        }
        if (!shopState.isOpen && !factionMenuState.isOpen && !diagnosticsMenuState.isOpen && !world.isGameOver) {
          pauseState.manual = !pauseState.manual;
        }
        e.preventDefault();
        return;
      }

      if (e.code === "Tab") {
        if (shopState.isOpen || factionMenuState.isOpen) {
          e.preventDefault();
          return;
        }
        diagnosticsMenuState.isOpen = !diagnosticsMenuState.isOpen;
        pauseState.manual = false;
        resetMenuScroll(diagnosticsMenuState);
        e.preventDefault();
        return;
      }

      if (e.code === "KeyQ") {
        if (shopState.isOpen || diagnosticsMenuState.isOpen) {
          e.preventDefault();
          return;
        }
        factionMenuState.isOpen = !factionMenuState.isOpen;
        if (factionMenuState.isOpen) {
          pauseState.manual = false;
          resetMenuScroll(factionMenuState);
        }
        e.preventDefault();
        return;
      }

      if (e.code === "KeyE") {
        if (diagnosticsMenuState.isOpen) {
          e.preventDefault();
          return;
        }
        if (shopState.isOpen) {
          closeShop();
        } else if (!factionMenuState.isOpen) {
          const station = findNearbyStation();
          if (station && playerShip.isAlive) {
            openShop(station);
          }
        }

        e.preventDefault();
        return;
      }

      if (diagnosticsMenuState.isOpen && (e.key === "Escape" || e.code === "Tab")) {
        diagnosticsMenuState.isOpen = false;
        resetMenuScroll(diagnosticsMenuState);
        e.preventDefault();
        return;
      }

      if (factionMenuState.isOpen && (e.key === "Escape" || e.code === "KeyQ")) {
        factionMenuState.isOpen = false;
        resetMenuScroll(factionMenuState);
        e.preventDefault();
        return;
      }

      const activeScrollableMenu = getActiveScrollableMenu();
      if (activeScrollableMenu) {
        const lineStep = 52;
        const pageStep = Math.max(120, (activeScrollableMenu.viewport?.h || 0) - 48);
        if (e.key === "ArrowDown") {
          scrollMenu(activeScrollableMenu, lineStep);
          e.preventDefault();
          return;
        }
        if (e.key === "ArrowUp") {
          scrollMenu(activeScrollableMenu, -lineStep);
          e.preventDefault();
          return;
        }
        if (e.key === "PageDown") {
          scrollMenu(activeScrollableMenu, pageStep);
          e.preventDefault();
          return;
        }
        if (e.key === "PageUp") {
          scrollMenu(activeScrollableMenu, -pageStep);
          e.preventDefault();
          return;
        }
        if (e.key === "Home") {
          activeScrollableMenu.scrollOffset = 0;
          e.preventDefault();
          return;
        }
        if (e.key === "End") {
          activeScrollableMenu.scrollOffset = Math.max(0, activeScrollableMenu.maxScroll || 0);
          e.preventDefault();
          return;
        }
      }

      if (!shopState.isOpen) {
        return;
      }

      if (e.key === "Escape") {
        closeShop();
        e.preventDefault();
        return;
      }

      if (/^[1-8]$/.test(e.key)) {
        attemptPurchaseEntry(Number(e.key) - 1);
        e.preventDefault();
      }
    }

    // Devuelve el canvas pointer calculado a partir del estado y los parametros recibidos.
    function getCanvasPointer(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * (canvas.width / rect.width),
        y: (event.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    canvas.addEventListener("mousemove", (event) => {
      const pointer = getCanvasPointer(event);
      mouse.x = pointer.x;
      mouse.y = pointer.y;
      updateMouseWorld();

      if (!shopState.isOpen) {
        canvas.style.cursor = (factionMenuState.isOpen || diagnosticsMenuState.isOpen) ? "default" : "crosshair";
        return;
      }

      let hoverIndex = -1;

      for (let i = 0; i < shopState.buttons.length; i++) {
        const button = shopState.buttons[i];
        if (
          pointer.x >= button.x &&
          pointer.x <= button.x + button.w &&
          pointer.y >= button.y &&
          pointer.y <= button.y + button.h
        ) {
          hoverIndex = button.index;
          break;
        }
      }

      shopState.hoverIndex = hoverIndex;
      canvas.style.cursor = hoverIndex >= 0 ? "pointer" : "default";
    });

    canvas.addEventListener("mouseleave", () => {
      shopState.hoverIndex = -1;
      mouse.left = false;
      mouse.right = false;
      mouse.brakeLockTarget = null;
      canvas.style.cursor = "default";
    });

    canvas.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    canvas.addEventListener("wheel", (event) => {
      const activeScrollableMenu = getActiveScrollableMenu();
      if (!activeScrollableMenu) return;
      scrollMenu(activeScrollableMenu, event.deltaY);
      event.preventDefault();
    }, { passive: false });

    canvas.addEventListener("mousedown", (event) => {
      const pointer = getCanvasPointer(event);
      mouse.x = pointer.x;
      mouse.y = pointer.y;
      updateMouseWorld();

      if (!shopState.isOpen) {
        if (event.button === 0) {
          mouse.left = true;
          event.preventDefault();
        } else if (event.button === 2) {
          mouse.right = true;
          mouse.brakeLockTarget = findBodyUnderCursor();
          event.preventDefault();
        }
        return;
      }

      if (event.button !== 0) {
        event.preventDefault();
        return;
      }

      for (let i = 0; i < shopState.buttons.length; i++) {
        const button = shopState.buttons[i];
        if (
          pointer.x >= button.x &&
          pointer.x <= button.x + button.w &&
          pointer.y >= button.y &&
          pointer.y <= button.y + button.h
        ) {
          attemptPurchaseEntry(button.index);
          event.preventDefault();
          return;
        }
      }
    });

    window.addEventListener("mouseup", (event) => {
      if (event.button === 0) {
        mouse.left = false;
      } else if (event.button === 2) {
        mouse.right = false;
      }
    });

    // Gestiona fire la evasion de proyectiles dentro del flujo principal del juego.
    function fireProjectile(ship) {
      if (!ship.isAlive) {
        return false;
      }

      const shotCount = ship.projectilesPerShot;
      const ammoCost = ship.getAmmoCostPerShot();

      if (ship.ammo < ammoCost) {
        return false;
      }

      ship.ammo -= ammoCost;

      const projectileRadius = 3;
      const defaultMuzzleDistance = ship.radius + projectileRadius + 6;
      const centerOffset = (shotCount - 1) * 0.5;
      const projectileColor = ship.projectileColor ?? (ship.kind === "station" ? "#8ee7ff" : ship.color ?? "white");
      const closeSurfaceTarget = ship.combatTarget && !ship.combatTarget.isRemoved && !isShipLike(ship.combatTarget)
        ? ship.combatTarget
        : null;

      for (let i = 0; i < shotCount; i++) {
        const offset = (i - centerOffset) * ship.projectileSpread;
        const shotAngle = ship.angle + offset;
        const dirX = Math.cos(shotAngle);
        const dirY = Math.sin(shotAngle);
        let muzzleDistance = defaultMuzzleDistance;

        if (closeSurfaceTarget) {
          const relX = closeSurfaceTarget.x - ship.x;
          const relY = closeSurfaceTarget.y - ship.y;
          const targetAlong = relX * dirX + relY * dirY;
          const targetPerp = Math.abs(relX * dirY - relY * dirX);
          const targetRadius = Math.max(0, closeSurfaceTarget.colliderRadius ?? closeSurfaceTarget.radius ?? 0);

          if (targetRadius > 0 && targetAlong > 0 && targetPerp <= targetRadius) {
            const exitOffset = Math.sqrt(Math.max(0, targetRadius * targetRadius - targetPerp * targetPerp));
            const targetExitAlong = targetAlong + exitOffset;
            const maxSafeMuzzleDistance = Math.max(ship.radius + 1, targetExitAlong - projectileRadius - 1);
            muzzleDistance = Math.min(muzzleDistance, maxSafeMuzzleDistance);
          }
        }

        world.addBody(world.acquireProjectileBody({
          x: ship.x + dirX * muzzleDistance,
          y: ship.y + dirY * muzzleDistance,
          vx: ship.vx + dirX * ship.projectileSpeed,
          vy: ship.vy + dirY * ship.projectileSpeed,
          angle: shotAngle,
          radius: projectileRadius,
          mass: 0.08,
          color: projectileColor,
          owner: ship,
          faction: ship.faction ?? null,
          damage: ship.projectileDamage ?? 1,
          originX: ship.x,
          originY: ship.y,
          emitterVX: ship.vx,
          emitterVY: ship.vy,
          isProcedural: false,
          isFieldBody: false
        }));
      }

      return true;
    }

    // Actualiza el jugador weapons usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
    function updatePlayerWeapons(dt) {
      if (!playerShip.isAlive) {
        playerShip.timeUntilNextShot = 0;
        return;
      }

      if (!mouse.left || playerShip.fireRate <= 0) {
        playerShip.timeUntilNextShot = Math.max(playerShip.timeUntilNextShot - dt, 0);
        return;
      }

      playerShip.timeUntilNextShot = Math.max(playerShip.timeUntilNextShot - dt, -0.5);

      const shotInterval = 1 / playerShip.fireRate;
      let guard = 0;

      while (playerShip.timeUntilNextShot <= 0 && guard < 6) {
        if (!fireProjectile(playerShip)) {
          playerShip.timeUntilNextShot = Math.max(playerShip.timeUntilNextShot, 0);
          break;
        }

        playerShip.timeUntilNextShot += shotInterval;
        guard++;
      }
    }


    // Indica si npc shot likely safe cumple la condicion esperada para esta logica.
    function isNpcShotLikelySafe(station, target) {
      if (!station || !target || !station.aiWorld || !station.aiWorld.grid) {
        return true;
      }

      const dx = target.x - station.x;
      const dy = target.y - station.y;
      const targetDist = Math.hypot(dx, dy);
      if (!(targetDist > 0.001)) {
        return false;
      }

      const targetDirX = dx / targetDist;
      const targetDirY = dy / targetDist;
      const shotCount = Math.max(1, station.projectilesPerShot | 0);
      const centerOffset = (shotCount - 1) * 0.5;
      const spread = Math.max(0, station.projectileSpread || 0);
      const projectileSpeed = Math.max(1, station.projectileSpeed || 1);
      const muzzleDistance = station.radius + 9;
      const corridorRadius = Math.max(16, projectileSpeed * 0.015 + station.projectilesPerShot * 6 + 8);
      const endPadding = Math.max(24, target.radius + 14);
      const halfRange = targetDist * 0.5;
      const midX = station.x + targetDirX * halfRange;
      const midY = station.y + targetDirY * halfRange;
      const queryRange = halfRange + target.radius + corridorRadius + 64;
      const stamp = station.aiWorld.gravityQueryStamp++;
      let safe = true;

      station.aiWorld.grid.forEachNearbyUnique(midX, midY, queryRange, stamp, (body) => {
        if (body === station || body === target || body.isRemoved) return;
        if (!isShipLike(body)) return;
        if (!body.isAlive) return;

        const disposition = station.getDispositionTo(body.faction);
        if (disposition === "enemy") return;

        for (let pellet = 0; pellet < shotCount; pellet++) {
          const offset = (pellet - centerOffset) * spread;
          const shotAngle = station.angle + offset;
          const dirX = Math.cos(shotAngle);
          const dirY = Math.sin(shotAngle);
          const startX = station.x + dirX * muzzleDistance;
          const startY = station.y + dirY * muzzleDistance;
          const relX = body.x - startX;
          const relY = body.y - startY;
          const along = relX * dirX + relY * dirY;

          if (along <= 0 || along >= targetDist + endPadding) {
            continue;
          }

          const perp = Math.abs(relX * dirY - relY * dirX);
          const avoidRadius = body.radius + corridorRadius;

          if (!isShipLike(target)) {
            const targetRelX = target.x - startX;
            const targetRelY = target.y - startY;
            const targetAlong = targetRelX * dirX + targetRelY * dirY;
            const targetPerp = Math.abs(targetRelX * dirY - targetRelY * dirX);
            const targetRadius = Math.max(0, target.colliderRadius ?? target.radius ?? 0);

            if (targetRadius > 0 && targetPerp <= targetRadius && targetAlong > 0) {
              const impactOffset = Math.sqrt(Math.max(0, targetRadius * targetRadius - targetPerp * targetPerp));
              const targetEntryAlong = Math.max(0, targetAlong - impactOffset);
              if (along - avoidRadius >= targetEntryAlong) {
                continue;
              }
            }
          }

          if (perp <= avoidRadius) {
            safe = false;
            return false;
          }
        }

        if (!isShipLike(target)) {
          const keepout = target.radius + body.radius + 18;
          if (distanceSquared(body.x, body.y, target.x, target.y) <= keepout * keepout) {
            const targetToBodyAlong = (body.x - target.x) * targetDirX + (body.y - target.y) * targetDirY;
            if (targetToBodyAlong <= body.radius + 12) {
              safe = false;
              return false;
            }
          }
        }
      });

      return safe;
    }

    // Actualiza npc weapons usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
    function updateNpcWeapons(dt) {
      for (let i = 0; i < world.bodies.length; i++) {
        const ship = world.bodies[i];
        if (ship.isRemoved || !isArmedNpcShip(ship) || !ship.isAlive) {
          continue;
        }

        ship.timeUntilNextShot = Math.max(ship.timeUntilNextShot - dt, -0.35);

        const target = ship.combatTarget;
        if (!target || target.isRemoved || (!target.isAlive && isShipLike(target))) {
          continue;
        }

        const dx = target.x - ship.x;
        const dy = target.y - ship.y;
        const centerDist = Math.hypot(dx, dy);
        const surfaceDist = Math.max(0, centerDist - (target.colliderRadius ?? target.radius ?? 0));
        const range = ship.kind === "station"
          ? (ship.targetPreference === "enemy" ? ship.enemyWeaponRange : ship.weaponRange)
          : ship.weaponRange;
        const effectiveRangeDist = isShipLike(target) ? centerDist : surfaceDist;

        if (!(centerDist > 0.001) || effectiveRangeDist > range * 1.05) {
          continue;
        }

        const targetAngle = ship.combatAimAngle ?? Math.atan2(dy, dx);
        const angleError = Math.abs(wrapAngle(targetAngle - ship.angle));

        if (angleError > (ship.fireAngleTolerance ?? 0.22) || ship.fireRate <= 0) {
          continue;
        }

        if (!isNpcShotLikelySafe(ship, target)) {
          continue;
        }

        const shotInterval = 1 / ship.fireRate;
        let guard = 0;
        const burstLimit = ship.kind === "station" ? 2 : 1;

        while (ship.timeUntilNextShot <= 0 && guard < burstLimit) {
          if (!fireProjectile(ship)) {
            ship.timeUntilNextShot = Math.max(ship.timeUntilNextShot, 0);
            break;
          }

          ship.timeUntilNextShot += shotInterval;
          guard++;
        }
      }
    }

    // Actualiza tarantula diplomacy usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
    function updateTarantulaDiplomacy(dt) {
      if (!world.grid || !(dt > 0)) return;
      const nearbyFactions = new Set();

      for (let i = 0; i < world.bodies.length; i++) {
        const ship = world.bodies[i];
        if (ship.isRemoved || ship.kind !== "tarantula" || !ship.isAlive) {
          continue;
        }

        const stamp = world.gravityQueryStamp++;
        world.grid.forEachNearbyUnique(ship.x, ship.y, 200, stamp, (body) => {
          if (body.isRemoved || !isShipLike(body) || !body.isAlive || body === ship) return;
          if (!body.faction || body.faction === ship.faction) return;
          if (distanceSquared(ship.x, ship.y, body.x, body.y) <= 200 * 200) {
            nearbyFactions.add(body.faction);
          }
        });
      }

      for (const factionName of nearbyFactions) {
        factionSystem.addRelation("Tarántulas", factionName, dt);
      }
    }

    // Actualiza el planeta resupply usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
    function updatePlanetResupply(dt) {
      if (!playerShip.isAlive) {
        playerShip.isTouchingPlanet = false;
        playerShip.rechargeReady = false;
        playerShip.refuelTimer = 0;
        return;
      }

      let touchingPlanet = null;
      let bestDistSq = Infinity;
      const queryRadius = 1600;
      const stamp = world.gravityQueryStamp++;

      world.grid.forEachNearbyUnique(playerShip.x, playerShip.y, queryRadius, stamp, (body) => {
        if (body.isRemoved || body.kind !== "planet") return;

        const surfaceRange = body.radius + playerShip.radius + 6;
        const distSq = distanceSquared(body.x, body.y, playerShip.x, playerShip.y);

        if (distSq <= surfaceRange * surfaceRange && distSq < bestDistSq) {
          touchingPlanet = body;
          bestDistSq = distSq;
        }
      });

      playerShip.isTouchingPlanet = !!touchingPlanet;
      const needsRecharge =
        playerShip.fuel < playerShip.maxFuel - 0.001 ||
        playerShip.ammo < playerShip.maxAmmo - 0.001 ||
        playerShip.hp < playerShip.maxHp - 0.001;

      if (touchingPlanet) {
        const rechargeTickSeconds = Math.max(0.05, playerShip.refuelDelay);
        const rechargeMultiplier = dt / rechargeTickSeconds;
        const canHeal = playerShip.timeSinceLastDamage >= 2;
        playerShip.fuel = Math.min(playerShip.maxFuel, playerShip.fuel + 10 * rechargeMultiplier);
        playerShip.ammo = Math.min(playerShip.maxAmmo, playerShip.ammo + 10 * rechargeMultiplier);
        if (canHeal) {
          playerShip.hp = Math.min(playerShip.maxHp, playerShip.hp + 1 * rechargeMultiplier);
        }
        const needsFuel = playerShip.fuel < playerShip.maxFuel - 0.001;
        const needsAmmo = playerShip.ammo < playerShip.maxAmmo - 0.001;
        const needsHp = playerShip.hp < playerShip.maxHp - 0.001;
        const healingBlocked = needsHp && !canHeal;
        playerShip.refuelTimer = (needsFuel || needsAmmo || needsHp) ? rechargeTickSeconds : 0;
        playerShip.rechargeReady = !(needsFuel || needsAmmo || needsHp || healingBlocked);
        playerShip.healReady = canHeal;
      } else {
        playerShip.refuelTimer = 0;
        playerShip.rechargeReady = false;
        playerShip.healReady = false;
      }
    }

    // Actualiza el objetivo de monedas magnet usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
    function updateCoinMagnet(dt) {
      if (!world.grid) {
        return;
      }

      for (let i = 0; i < world.bodies.length; i++) {
        const ship = world.bodies[i];
        if (ship.isRemoved || !isShipLike(ship) || !ship.isAlive || ship.coinMagnetRadius <= 0) {
          continue;
        }

        const magnetRadius = ship.coinMagnetRadius;
        const magnetRadiusSq = magnetRadius * magnetRadius;
        const stamp = world.gravityQueryStamp++;

        world.grid.forEachNearbyUnique(ship.x, ship.y, magnetRadius, stamp, (body) => {
          if (body.isRemoved || body.kind !== "coin") return;

          const dx = ship.x - body.x;
          const dy = ship.y - body.y;
          const distSq = dx * dx + dy * dy;

          if (distSq < 1 || distSq > magnetRadiusSq) {
            return;
          }

          const dist = Math.sqrt(distSq);
          const t = 1 - dist / Math.max(1, magnetRadius);
          const pull = 4200 + magnetRadius * 4.8;
          const accel = pull * (1.2 + t * t * 8.8) / Math.max(10, dist * 0.34);
          const invDist = 1 / dist;

          body.vx += dx * invDist * accel * dt;
          body.vy += dy * invDist * accel * dt;
        });
      }
    }

    const camera = {
      x: 0,
      y: 0
    };

    const backgroundTransitionState = {
      color: null,
      targetBiomeId: null,
      lastTimestampMs: performance.now(),
      transitionDuration: 1.35
    };

    // Devuelve una copia segura del color base del bioma para la transicion visual del fondo.
    function getBiomeBackgroundColorRgb(biomeState) {
      const tint = biomeState?.discreteTintRgb ?? biomeState?.tintRgb ?? [0, 0, 0];
      return [
        clamp(Math.round(tint[0] ?? 0), 0, 255),
        clamp(Math.round(tint[1] ?? 0), 0, 255),
        clamp(Math.round(tint[2] ?? 0), 0, 255)
      ];
    }

    // Actualiza camera usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
    function updateCamera(dt) {
      const halfW = canvas.width * 0.5;
      const halfH = canvas.height * 0.5;
      const maxOffsetX = canvas.width * 0.22;
      const maxOffsetY = canvas.height * 0.22;
      const screenDX = mouse.x - halfW;
      const screenDY = mouse.y - halfH;
      const offsetX = clamp(screenDX * 0.42, -maxOffsetX, maxOffsetX);
      const offsetY = clamp(screenDY * 0.42, -maxOffsetY, maxOffsetY);
      const desiredX = playerShip.x - halfW + offsetX;
      const desiredY = playerShip.y - halfH + offsetY;
      const step = Math.max(1 / 240, dt || (1 / 60));
      const follow = 1 - Math.pow(0.0012, step);
      camera.x += (desiredX - camera.x) * follow;
      camera.y += (desiredY - camera.y) * follow;

      const marginX = 36;
      const marginY = 36;
      const minX = playerShip.x - (canvas.width - marginX);
      const maxX = playerShip.x - marginX;
      const minY = playerShip.y - (canvas.height - marginY);
      const maxY = playerShip.y - marginY;
      camera.x = clamp(camera.x, minX, maxX);
      camera.y = clamp(camera.y, minY, maxY);
      updateMouseWorld();
    }

    // Dibuja background en el contexto de render correspondiente.
    function drawBackground() {
      const biome = proceduralField?.getCurrentBiomeState?.() ?? getBiomeStateAtWorld(playerShip.x, playerShip.y);
      const nowMs = performance.now();
      const dt = clamp((nowMs - backgroundTransitionState.lastTimestampMs) / 1000, 0, 0.25);
      backgroundTransitionState.lastTimestampMs = nowMs;

      const targetColor = getBiomeBackgroundColorRgb(biome);
      if (!backgroundTransitionState.color) {
        backgroundTransitionState.color = [...targetColor];
        backgroundTransitionState.targetBiomeId = biome.id;
      } else {
        if (backgroundTransitionState.targetBiomeId !== biome.id) {
          backgroundTransitionState.targetBiomeId = biome.id;
        }

        const blend = 1 - Math.exp(-dt * (4.2 / Math.max(0.15, backgroundTransitionState.transitionDuration)));
        backgroundTransitionState.color[0] = lerp(backgroundTransitionState.color[0], targetColor[0], blend);
        backgroundTransitionState.color[1] = lerp(backgroundTransitionState.color[1], targetColor[1], blend);
        backgroundTransitionState.color[2] = lerp(backgroundTransitionState.color[2], targetColor[2], blend);
      }

      const color = backgroundTransitionState.color;
      ctx.fillStyle = `rgb(${Math.round(color[0])}, ${Math.round(color[1])}, ${Math.round(color[2])})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Dibuja el fondo estrellado y anima su parpadeo visual.
    function drawStars() {
      const left = camera.x;
      const top = camera.y;
      const right = camera.x + canvas.width;
      const bottom = camera.y + canvas.height;
      const time = performance.now() * 0.001;

      const step = 220;
      const startX = Math.floor(left / step) * step;
      const endX = Math.ceil(right / step) * step;
      const startY = Math.floor(top / step) * step;
      const endY = Math.ceil(bottom / step) * step;

      for (let y = startY; y <= endY; y += step) {
        for (let x = startX; x <= endX; x += step) {
          const seed = ((x * 73856093) ^ (y * 19349663)) >>> 0;
          const px = x + (seed % 170);
          const py = y + ((seed >> 8) % 170);
          const r = 1 + ((seed >> 16) % 2);
          const baseAlpha = 0.46 + ((seed >> 18) % 22) * 0.016;
          const twinkleAmplitude = 0.08 + ((seed >> 23) % 14) * 0.009;
          const twinkleSpeed = 2.4 + ((seed >> 27) % 9) * 0.45;
          const twinklePhase = (seed % 2048) * 0.0031;
          const alpha = clamp(
            baseAlpha + Math.sin(time * twinkleSpeed + twinklePhase) * twinkleAmplitude,
            0.22,
            1
          );

          ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(px - camera.x, py - camera.y, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    // Traza un rectangulo redondeado en el contexto de render correspondiente.
    function traceRoundedRect(x, y, width, height, radius) {
      const r = Math.max(0, Math.min(radius, width * 0.5, height * 0.5));
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.arcTo(x + width, y, x + width, y + r, r);
      ctx.lineTo(x + width, y + height - r);
      ctx.arcTo(x + width, y + height, x + width - r, y + height, r);
      ctx.lineTo(x + r, y + height);
      ctx.arcTo(x, y + height, x, y + height - r, r);
      ctx.lineTo(x, y + r);
      ctx.arcTo(x, y, x + r, y, r);
      ctx.closePath();
    }

    // Mezcla dos colores rgb usando el factor recibido.
    function mixRgbColor(a, b, t) {
      const clamped = clamp(t, 0, 1);
      const r = Math.round(lerp(a[0], b[0], clamped));
      const g = Math.round(lerp(a[1], b[1], clamped));
      const bl = Math.round(lerp(a[2], b[2], clamped));
      return `rgb(${r}, ${g}, ${bl})`;
    }

    // Dibuja texto con contorno para mejorar contraste en el hud.
    function drawHudText(text, x, y, options = {}) {
      ctx.save();
      ctx.font = options.font ?? "14px monospace";
      ctx.textAlign = options.align ?? "center";
      ctx.textBaseline = options.baseline ?? "middle";
      if (options.stroke !== false) {
        ctx.lineWidth = options.lineWidth ?? 3;
        ctx.strokeStyle = options.strokeStyle ?? "rgba(0,0,0,0.78)";
        ctx.strokeText(text, x, y);
      }
      ctx.fillStyle = options.fillStyle ?? "white";
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    // Devuelve la geometria base usada por el cluster de radar y recursos.
    function getHudRadarLayout() {
      const radarRadius = clamp(Math.min(canvas.width, canvas.height) * 0.11, 84, 126);
      const legendReserve = 22;
      return {
        radarRadius,
        centerX: canvas.width - 28 - radarRadius,
        centerY: canvas.height - 28 - legendReserve - radarRadius,
        sweepRadius: radarRadius - 10
      };
    }

    // Devuelve la geometria base usada por el cluster de recursos inferior izquierdo.
    function getHudResourceLayout() {
      const radarRadius = clamp(Math.min(canvas.width, canvas.height) * 0.11, 84, 126);
      const panelHeight = radarRadius * 2 - 8;
      const barWidth = clamp(radarRadius * 0.22, 18, 24);
      const barGap = 10;
      const widgetGap = 8;
      const widgetHeight = Math.max(30, (panelHeight - widgetGap * 3) / 4);
      const baseX = 20;
      const baseY = canvas.height - 28 - panelHeight;
      const fuelX = baseX;
      const hpX = fuelX + barWidth + barGap;
      const widgetX = hpX + barWidth + 18;
      const availableWidgetWidth = Math.max(64, canvas.width - widgetX - 28 - radarRadius * 2 - 28);
      const widgetWidth = Math.max(64, Math.min(availableWidgetWidth, 112));
      return {
        panelHeight,
        barWidth,
        barGap,
        widgetGap,
        widgetHeight,
        baseX,
        baseY,
        fuelX,
        hpX,
        widgetX,
        widgetWidth
      };
    }

    // Dibuja el icono de combustible en el contexto de render correspondiente.
    function drawFuelIcon(x, y, size, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(size, size);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, -0.58);
      ctx.bezierCurveTo(0.38, -0.18, 0.42, 0.18, 0.22, 0.48);
      ctx.bezierCurveTo(0.08, 0.72, -0.08, 0.72, -0.22, 0.48);
      ctx.bezierCurveTo(-0.42, 0.18, -0.38, -0.18, 0, -0.58);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Dibuja el icono de vida en el contexto de render correspondiente.
    function drawHealthIcon(x, y, size, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(1.6, size * 0.16);
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.52, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-size * 0.26, 0);
      ctx.lineTo(size * 0.26, 0);
      ctx.moveTo(0, -size * 0.26);
      ctx.lineTo(0, size * 0.26);
      ctx.stroke();
      ctx.restore();
    }

    // Dibuja un medidor vertical para recursos del jugador.
    function drawVerticalStatusBar(x, y, width, height, ratio, options = {}) {
      const clampedRatio = clamp(ratio, 0, 1);
      const radius = Math.min(width * 0.4, 10);
      const innerPad = 3;
      const innerX = x + innerPad;
      const innerY = y + innerPad;
      const innerWidth = width - innerPad * 2;
      const innerHeight = height - innerPad * 2;
      const fillHeight = innerHeight * clampedRatio;

      ctx.save();
      traceRoundedRect(x, y, width, height, radius + 1);
      ctx.fillStyle = options.outerFill ?? "rgba(0,0,0,0.52)";
      ctx.fill();
      traceRoundedRect(x + 0.5, y + 0.5, width - 1, height - 1, radius);
      ctx.strokeStyle = options.borderColor ?? "rgba(255,255,255,0.24)";
      ctx.lineWidth = 1.1;
      ctx.stroke();

      traceRoundedRect(innerX, innerY, innerWidth, innerHeight, Math.max(3, radius - 2));
      ctx.fillStyle = options.emptyColor ?? "rgba(255,255,255,0.08)";
      ctx.fill();

      if (fillHeight > 0.001) {
        ctx.save();
        traceRoundedRect(innerX, innerY, innerWidth, innerHeight, Math.max(3, radius - 2));
        ctx.clip();
        ctx.fillStyle = options.fillColor ?? "#6de4ff";
        ctx.fillRect(innerX, innerY + innerHeight - fillHeight, innerWidth, fillHeight);
        ctx.restore();
      }

      if (typeof options.drawIcon === "function") {
        options.drawIcon(x + width * 0.5, y - 12, 8);
      }

      if (options.text) {
        ctx.save();
        ctx.translate(x + width * 0.5, y + height * 0.5);
        ctx.rotate(-Math.PI * 0.5);
        drawHudText(options.text, 0, 0, {
          font: options.font ?? "bold 14px monospace",
          fillStyle: options.textColor ?? "#f5f7ff",
          strokeStyle: options.textStroke ?? "rgba(0,0,0,0.82)",
          lineWidth: 3.2
        });
        ctx.restore();
      }

      if (options.secondaryText) {
        drawHudText(options.secondaryText, x + width * 0.5, y + height + 12, {
          font: options.secondaryFont ?? "11px monospace",
          fillStyle: options.secondaryColor ?? "rgba(255,255,255,0.82)",
          strokeStyle: "rgba(0,0,0,0.72)",
          lineWidth: 2,
          baseline: "middle"
        });
      }

      ctx.restore();
    }

    // Dibuja una tarjeta compacta para recursos y mejoras del jugador.
    function drawHudCard(x, y, width, height, titleColor = "rgba(255,255,255,0.9)") {
      ctx.save();
      traceRoundedRect(x, y, width, height, 10);
      ctx.fillStyle = "rgba(0, 0, 0, 0.54)";
      ctx.fill();
      traceRoundedRect(x + 0.5, y + 0.5, width - 1, height - 1, 9.5);
      ctx.strokeStyle = "rgba(255,255,255,0.16)";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    // Dibuja el widget de municion del jugador.
    function drawAmmoWidget(x, y, width, height) {
      drawHudCard(x, y, width, height);
      const ammoRatio = playerShip.maxAmmo > 0 ? clamp(playerShip.ammo / playerShip.maxAmmo, 0, 1) : 1;
      const bulletCount = Math.max(2, Math.min(6, Math.round(2 + ammoRatio * 4)));
      const bulletSpacing = 8;
      const startX = x + 16;
      const bulletY = y + 12;

      ctx.save();
      for (let i = 0; i < bulletCount; i++) {
        const bx = startX + i * bulletSpacing;
        ctx.fillStyle = i < bulletCount * ammoRatio + 0.01 ? "#ffd45a" : "rgba(255,255,255,0.16)";
        ctx.strokeStyle = "rgba(0,0,0,0.5)";
        ctx.lineWidth = 0.8;
        traceRoundedRect(bx, bulletY - 5, 5.2, 11.2, 2.1);
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();

      drawHudText(`${Number.isFinite(playerShip.ammo) ? Math.floor(playerShip.ammo) : "∞"}`, x + width * 0.5, y + height * 0.55, {
        font: "bold 19px monospace",
        fillStyle: "#fff3bf"
      });
      drawHudText(`/${Number.isFinite(playerShip.maxAmmo) ? Math.floor(playerShip.maxAmmo) : "∞"}`, x + width * 0.5, y + height - 10, {
        font: "11px monospace",
        fillStyle: "rgba(255,255,255,0.8)",
        lineWidth: 2
      });
    }

    // Dibuja el widget de balas por disparo del jugador.
    function drawBurstWidget(x, y, width, height) {
      drawHudCard(x, y, width, height);
      const shipX = x + 18;
      const shipY = y + height * 0.5;
      const lineCount = clamp(Math.round(playerShip.projectilesPerShot), 1, 5);

      ctx.save();
      ctx.translate(shipX, shipY);
      ctx.strokeStyle = "rgba(255,255,255,0.92)";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(7, 0);
      ctx.lineTo(-5, -5.5);
      ctx.lineTo(-2.6, 0);
      ctx.lineTo(-5, 5.5);
      ctx.closePath();
      ctx.stroke();

      const muzzleX = 9.5;
      const fanStartX = 13.5;
      const fanEndX = 27.5;
      const spread = 10;
      for (let i = 0; i < lineCount; i++) {
        const t = lineCount === 1 ? 0.5 : i / (lineCount - 1);
        const yOffset = (t - 0.5) * spread;
        const startOffset = yOffset * 0.22;
        ctx.lineWidth = 1.15;
        ctx.beginPath();
        ctx.moveTo(muzzleX, 0);
        ctx.lineTo(fanStartX, startOffset);
        ctx.lineTo(fanEndX, yOffset);
        ctx.stroke();
      }
      ctx.restore();

      drawHudText(`${lineCount}`, x + width - 14, y + height - 12, {
        font: "bold 12px monospace",
        fillStyle: "rgba(255,255,255,0.72)",
        align: "right",
        lineWidth: 2
      });
    }

    // Dibuja el widget de blindaje del jugador.
    function drawShieldWidget(x, y, width, height) {
      drawHudCard(x, y, width, height);
      const shieldX = x + 28;
      const shieldY = y + height * 0.52;
      const crashThreshold = Math.round(playerShip.getCrashSpeedThreshold(world.shipCrashSpeed));

      ctx.save();
      ctx.translate(shieldX, shieldY);
      ctx.strokeStyle = "#8fd3ff";
      ctx.lineWidth = 1.7;
      ctx.beginPath();
      ctx.moveTo(0, -14);
      ctx.lineTo(11, -8);
      ctx.lineTo(9, 8);
      ctx.lineTo(0, 15);
      ctx.lineTo(-9, 8);
      ctx.lineTo(-11, -8);
      ctx.closePath();
      ctx.stroke();
      ctx.restore();

      drawHudText(`${crashThreshold}`, shieldX, shieldY + 1, {
        font: "bold 13px monospace",
        fillStyle: "#dff3ff"
      });

      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,0.56)";
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(x + width - 26, y + 12);
      ctx.lineTo(x + width - 38, y + 21);
      ctx.stroke();
      ctx.fillStyle = "#8b8f98";
      ctx.beginPath();
      ctx.arc(x + width - 20, y + 10, 4.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Dibuja el widget de creditos del jugador.
    function drawCreditWidget(x, y, width, height) {
      drawHudCard(x, y, width, height, "#ffd45a");
      const cx = x + 18;
      const cy = y + height * 0.5;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = "rgba(255,212,90,0.18)";
      ctx.strokeStyle = "#ffd45a";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(0, 0, 9.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      drawHudText("¤", 0, 1, {
        font: "bold 13px monospace",
        fillStyle: "#ffeeb6",
        strokeStyle: "rgba(0,0,0,0.56)",
        lineWidth: 2
      });
      ctx.restore();

      drawHudText(`${Math.trunc(playerShip.credits)}`, x + width * 0.63, y + height * 0.54, {
        font: "bold 14px monospace",
        fillStyle: "#ffe7a0"
      });

      if (playerShip.isTouchingPlanet) {
        drawHudText("↺", x + width - 12, y + 11, {
          font: "bold 13px monospace",
          fillStyle: playerShip.rechargeReady ? "#9dff9d" : "#ffd45a",

        });

    // Dibuja la advertencia de combustible bajo en el contexto de render correspondiente.
    function drawFuelWarning(x, y) {
      const pulse = 0.58 + 0.42 * (0.5 + 0.5 * Math.sin(performance.now() * 0.012));
      ctx.save();
      traceRoundedRect(x - 16, y - 12, 32, 20, 8);
      ctx.fillStyle = `rgba(255, 72, 72, ${0.34 + pulse * 0.28})`;
      ctx.fill();
      traceRoundedRect(x - 15.5, y - 11.5, 31, 19, 7.5);
      ctx.strokeStyle = `rgba(255, 230, 230, ${0.5 + pulse * 0.35})`;
      ctx.lineWidth = 1;
      ctx.stroke();
      drawHudText("LOW", x, y - 1, {
        font: "bold 11px monospace",
        fillStyle: pulse > 0.72 ? "#fff6f6" : "#2b0000",
        strokeStyle: pulse > 0.72 ? "rgba(0,0,0,0.64)" : "rgba(255,255,255,0.48)",
        lineWidth: 2
      });
      ctx.restore();
    }

    // Dibuja resource panel en el contexto de render correspondiente.
    function drawResourcePanel() {
      const { panelHeight: barHeight, baseY: barTop, barWidth, barGap, widgetGap, widgetHeight, fuelX, hpX, widgetX, widgetWidth } = getHudResourceLayout();

      const fuelRatio = playerShip.maxFuel > 0 ? clamp(playerShip.fuel / playerShip.maxFuel, 0, 1) : 0;
      const fuelFill = mixRgbColor([255, 74, 74], [82, 205, 255], fuelRatio);
      const fuelTextColor = fuelRatio > 0.56 ? "#04111a" : "#f4fbff";
      drawVerticalStatusBar(fuelX, barTop, barWidth, barHeight, fuelRatio, {
        fillColor: fuelFill,
        emptyColor: "rgba(14, 34, 52, 0.78)",
        borderColor: "rgba(132,205,255,0.48)",
        drawIcon: (x, y, size) => drawFuelIcon(x, y, size * 1.15, "#8ee5ff"),
        text: `${Math.max(0, playerShip.fuel).toFixed(0)}s`,
        textColor: fuelTextColor,
        textStroke: fuelRatio > 0.56 ? "rgba(255,255,255,0.55)" : "rgba(0,0,0,0.84)",
        secondaryText: `${Math.round(fuelRatio * 100)}%`,
        secondaryColor: "rgba(182, 227, 255, 0.84)"
      });

      const hpRatio = playerShip.maxHp > 0 ? clamp(playerShip.hp / playerShip.maxHp, 0, 1) : 0;
      drawVerticalStatusBar(hpX, barTop, barWidth, barHeight, hpRatio, {
        fillColor: "#55d17a",
        emptyColor: "rgba(96, 18, 18, 0.86)",
        borderColor: "rgba(112,255,166,0.46)",
        drawIcon: (x, y, size) => drawHealthIcon(x, y, size * 1.45, "#a8ffb7"),
        text: `${Math.max(0, Math.ceil(playerShip.hp))}`,
        textColor: "#f2fff4",
        textStroke: "rgba(0,0,0,0.84)",
        secondaryText: `${Math.round(hpRatio * 100)}%`,
        secondaryColor: "rgba(198, 255, 213, 0.82)"
      });

      if (fuelRatio < 0.1) {
        drawFuelWarning(fuelX + barWidth + 2, barTop - 12);
      }

      drawAmmoWidget(widgetX, barTop, widgetWidth, widgetHeight);
      drawBurstWidget(widgetX, barTop + (widgetHeight + widgetGap) * 1, widgetWidth, widgetHeight);
      drawShieldWidget(widgetX, barTop + (widgetHeight + widgetGap) * 2, widgetWidth, widgetHeight);
      drawCreditWidget(widgetX, barTop + (widgetHeight + widgetGap) * 3, widgetWidth, widgetHeight);
    }

    // Dibuja el frenado lock indicator en el contexto de render correspondiente.
    function drawBrakeLockIndicator() {
      const target = mouse.brakeLockTarget;
      if (!target || target.isRemoved) return;

      const sx = target.x - camera.x;
      const sy = target.y - camera.y;
      const r = target.radius + 10;

      if (sx + r < 0 || sy + r < 0 || sx - r > canvas.width || sy - r > canvas.height) {
        return;
      }

      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,0.45)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = "rgba(255,255,255,0.22)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(sx, sy, r + 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Devuelve el radar marker type calculado a partir del estado y los parametros recibidos.
    function getRadarMarkerType(body, radarDetailLevel) {
      if (!body || body.isRemoved) return null;
      if (body.kind === "planet") return "planet";
      if (body.kind === "station") return radarDetailLevel >= 1 ? "merchant" : null;
      if (body.kind === "tarantula") return radarDetailLevel >= 4 ? "tarantula" : "ship";
      if (body.kind === "asteroid") {
        if (body.radius >= 24) return radarDetailLevel >= 2 ? "asteroidLarge" : null;
        return radarDetailLevel >= 3 ? "asteroidSmall" : null;
      }
      if (body.kind === "scrap") return radarDetailLevel >= 5 ? "scrap" : null;
      if (body.kind === "coin" || body.kind === "upgrade" || body.kind === "service") {
        return radarDetailLevel >= 5 ? "coin" : null;
      }
      if (isShipLike(body)) return radarDetailLevel >= 4 ? "ship" : null;
      return null;
    }

    const RADAR_FACTION_COLORS = Object.freeze({
      jugador: "#ffffff",
      "Mercader Ambulante": "#7be9ff",
      Pulgas: "#ff8df5",
      Avispas: "#ffee58",
      "Libélulas": "#ff7676",
      Mineros: "#9ddc6f",
      Portanaves: "#ff9d2e",
      "Tarántulas": "#8a5bff"
    });

    // Devuelve el color de radar asociado a una faccion o cuerpo del juego.
    function getRadarFactionColor(body) {
      if (body?.faction && RADAR_FACTION_COLORS[body.faction]) return RADAR_FACTION_COLORS[body.faction];
      if (typeof body?.color === "string" && body.color) return body.color;
      return "#f5f7ff";
    }

    // Devuelve el radar marker el color calculado a partir del estado y los parametros recibidos.
    function getRadarMarkerColor(body, markerType) {
      if (markerType === "planet") return body?.color ?? "#9fd7ff";
      if (markerType === "merchant" || markerType === "tarantula" || markerType === "ship") {
        return getRadarFactionColor(body);
      }
      if (markerType === "asteroidLarge" || markerType === "asteroidSmall") return "#f2f5ff";
      if (markerType === "scrap") return "#ffffff";
      if (markerType === "coin") return "#ffd45a";
      return "#f5f7ff";
    }

    // Devuelve la escala de radar apropiada para una nave segun su tamano fisico.
    function getRadarShipMarkerSize(body, markerType) {
      if (!body || (markerType !== "ship" && markerType !== "merchant" && markerType !== "tarantula")) return 1;
      const colliderRadius = body.colliderRadius ?? body.radius ?? 12;
      const massRadius = body.mass > 0 ? Math.sqrt(body.mass) * 1.25 : colliderRadius;
      const effectiveSize = Math.max(colliderRadius, massRadius);
      const normalized = clamp((effectiveSize - 8) / (32 - 8), 0, 1);
      return 0.7 + normalized * (1.42 - 0.7);
    }

    // Dibuja el radar marker en el contexto de render correspondiente.
    function drawRadarMarker(x, y, markerType, color, size = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 1.35 * size;

      if (markerType === "planet") {
        ctx.beginPath();
        ctx.arc(0, 0, 4.6 * size, 0, Math.PI * 2);
        ctx.fill();
      } else if (markerType === "merchant") {
        ctx.beginPath();
        ctx.moveTo(0, -5.2 * size);
        ctx.lineTo(4.6 * size, 4.2 * size);
        ctx.lineTo(-4.6 * size, 4.2 * size);
        ctx.closePath();
        ctx.stroke();
      } else if (markerType === "tarantula") {
        ctx.beginPath();
        ctx.moveTo(0, -4.8 * size);
        ctx.lineTo(4.4 * size, 3.8 * size);
        ctx.lineTo(-4.4 * size, 3.8 * size);
        ctx.closePath();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-5.2 * size, -2.1 * size);
        ctx.lineTo(-2.8 * size, -0.8 * size);
        ctx.moveTo(-5.4 * size, 0.4 * size);
        ctx.lineTo(-2.8 * size, 1.2 * size);
        ctx.moveTo(5.2 * size, -2.1 * size);
        ctx.lineTo(2.8 * size, -0.8 * size);
        ctx.moveTo(5.4 * size, 0.4 * size);
        ctx.lineTo(2.8 * size, 1.2 * size);
        ctx.stroke();
      } else if (markerType === "ship") {
        ctx.beginPath();
        ctx.moveTo(0, -4.8 * size);
        ctx.lineTo(4.2 * size, 3.8 * size);
        ctx.lineTo(-4.2 * size, 3.8 * size);
        ctx.closePath();
        ctx.stroke();
      } else if (markerType === "asteroidLarge") {
        ctx.beginPath();
        ctx.arc(0, 0, 4.3 * size, 0, Math.PI * 2);
        ctx.stroke();
      } else if (markerType === "asteroidSmall") {
        ctx.beginPath();
        ctx.arc(0, 0, 2.9 * size, 0, Math.PI * 2);
        ctx.stroke();
      } else if (markerType === "scrap") {
        ctx.beginPath();
        ctx.arc(0, 0, 1.4 * size, 0, Math.PI * 2);
        ctx.fill();
      } else if (markerType === "coin") {
        ctx.beginPath();
        ctx.arc(0, 0, 1.6 * size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    // Dibuja los indicadores de filtro del radar.
    function drawRadarFilterPips(radarRadius, radarDetailLevel) {
      const count = clamp(Math.round(radarDetailLevel) + 1, 1, 6);
      const startX = radarRadius - 26;
      const y = -radarRadius + 18;
      ctx.save();
      for (let i = 0; i < count; i++) {
        ctx.beginPath();
        ctx.arc(startX + i * 7, y, 2.4, 0, Math.PI * 2);
        ctx.fillStyle = i === count - 1 ? "rgba(255,255,255,0.92)" : "rgba(255,255,255,0.46)";
        ctx.fill();
      }
      ctx.restore();
    }

    // Dibuja la leyenda compacta de contactos visibles del radar.
    function drawRadarLegend(legendCounts, radarRadius) {
      const entries = [
        ["planet", legendCounts.planet ?? 0],
        ["merchant", legendCounts.merchant ?? 0],
        ["tarantula", legendCounts.tarantula ?? 0],
        ["asteroidLarge", legendCounts.asteroidLarge ?? 0],
        ["asteroidSmall", legendCounts.asteroidSmall ?? 0],
        ["ship", legendCounts.ship ?? 0],
        ["scrap", legendCounts.scrap ?? 0],
        ["coin", legendCounts.coin ?? 0]
      ].filter((entry) => entry[1] > 0);

      if (!entries.length) return;

      const rowCapacity = 4;
      const rowHeight = 15;
      const totalRows = Math.ceil(entries.length / rowCapacity);
      const baseY = radarRadius + 14;

      entries.forEach(([markerType, count], index) => {
        const row = Math.floor(index / rowCapacity);
        const col = index % rowCapacity;
        const itemsInRow = Math.min(rowCapacity, entries.length - row * rowCapacity);
        const spacing = 34;
        const rowWidth = (itemsInRow - 1) * spacing;
        const x = -rowWidth * 0.5 + col * spacing;
        const y = baseY + row * rowHeight;
        const color = getRadarMarkerColor(null, markerType);
        drawRadarMarker(x - 7, y, markerType, color, 0.72);
        drawHudText(`${count}`, x + 4, y + 0.5, {
          font: "10px monospace",
          fillStyle: "rgba(255,255,255,0.84)",
          align: "left",
          lineWidth: 2,
          baseline: "middle"
        });
      });
    }

    // Dibuja el radar en el contexto de render correspondiente.
    function drawRadar() {
      const radarRange = playerShip.getRadarRange();
      const radarDetailLevel = playerShip.getRadarDetailLevel();
      const { radarRadius, centerX, centerY, sweepRadius } = getHudRadarLayout();
      const scale = sweepRadius / radarRange;
      const stamp = world.gravityQueryStamp++;
      const legendCounts = Object.create(null);

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
      ctx.beginPath();
      ctx.arc(0, 0, radarRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.24)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, sweepRadius * 0.5, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-sweepRadius, 0);
      ctx.lineTo(sweepRadius, 0);
      ctx.moveTo(0, -sweepRadius);
      ctx.lineTo(0, sweepRadius);
      ctx.stroke();

      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, sweepRadius, 0, Math.PI * 2);
      ctx.clip();

      world.grid.forEachNearbyUnique(playerShip.x, playerShip.y, radarRange, stamp, (body) => {
        if (!body || body.isRemoved || body === playerShip) return;
        const markerType = getRadarMarkerType(body, radarDetailLevel);
        if (!markerType) return;
        const dx = body.x - playerShip.x;
        const dy = body.y - playerShip.y;
        const distSq = dx * dx + dy * dy;
        const dist = Math.sqrt(distSq);
        if (markerType === "planet") {
          if (dist - (body.colliderRadius ?? body.radius ?? 0) > radarRange) return;
        } else if (distSq > radarRange * radarRange) {
          return;
        }
        const displayDist = markerType === "planet"
          ? Math.max(0, dist - Math.min(body.colliderRadius ?? body.radius ?? 0, radarRange * 0.92))
          : dist;
        const px = dist > 1e-6 ? dx / dist * displayDist * scale : 0;
        const py = dist > 1e-6 ? dy / dist * displayDist * scale : 0;
        const color = getRadarMarkerColor(body, markerType);
        const markerSize = getRadarShipMarkerSize(body, markerType);
        legendCounts[markerType] = (legendCounts[markerType] ?? 0) + 1;
        drawRadarMarker(px, py, markerType, color, markerSize);
      });

      ctx.restore();

      ctx.save();
      const rangeBadgeX = radarRadius - 18;
      const rangeBadgeY = -radarRadius - 16;
      ctx.translate(rangeBadgeX, rangeBadgeY);
      ctx.fillStyle = "rgba(6, 14, 18, 0.92)";
      ctx.strokeStyle = "rgba(255,255,255,0.28)";
      ctx.lineWidth = 1.2;
      traceRoundedRect(-20, -12, 40, 24, 9);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = "rgba(123,233,255,0.82)";
      ctx.lineWidth = 1.15;
      ctx.beginPath();
      ctx.arc(-8, -1.5, 3.5, Math.PI, Math.PI * 2);
      ctx.arc(-8, -1.5, 6.2, Math.PI, Math.PI * 2);
      ctx.stroke();
      drawHudText(`${Math.round(radarRange / 1000)}`, 7, 0.5, {
        font: "bold 13px monospace",
        fillStyle: "#f2fbff",
        lineWidth: 2.2
      });
      ctx.restore();

      drawRadarFilterPips(radarRadius, radarDetailLevel);
      drawRadarLegend(legendCounts, radarRadius);
      ctx.restore();
    }

    // Dibuja hud en el contexto de render correspondiente.

    function drawHUD() {
      const nearbyStation = findNearbyStation();
      const contextualBaseY = testCheats.testMode ? 190 : 150;
      let contextualLine = 0;

      ctx.save();
      ctx.fillStyle = "white";
      ctx.font = "16px monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("clic der acelerar", 20, 20);
      ctx.fillText("clic izq disparar", 20, 40);
      ctx.fillText("espacio frenar / igualar velocidad", 20, 60);
      ctx.fillText("mouse apuntar", 20, 80);
      ctx.fillText("E tienda en estacion", 20, 100);
      ctx.fillText("Q bandos", 20, 120);
      ctx.fillText("TAB sistema", 20, 140);

      if (testCheats.testMode) {
        ctx.fillStyle = "#7ddcff";
        ctx.fillText(`modo pruebas: ON | invulnerable ${testCheats.invincibility ? 'SI' : 'NO'} | spawns ${proceduralField.spawnsEnabled ? 'ON' : 'OFF'}`, 20, 160);
        if (testCheats.dragTarget && !testCheats.dragTarget.isRemoved) {
          ctx.fillText(`objeto sujeto con C: ${testCheats.dragTarget.kind}`, 20, 180);
        }
      }

      const drawContextLine = (message, color = "white") => {
        ctx.fillStyle = color;
        ctx.fillText(message, 20, contextualBaseY + contextualLine * 24);
        contextualLine++;
      };

      if (nearbyStation && playerShip.isAlive && !shopState.isOpen) {
        const relation = factionSystem.getRelation(playerShip.faction, nearbyStation.faction);
        const disposition = factionSystem.getDisposition(playerShip.faction, nearbyStation.faction);
        drawContextLine(
          disposition === "enemy"
            ? "mercader hostil: no vendera"
            : disposition === "ally"
              ? `mercader aliado: recursos gratis | relacion ${Math.round(relation)}`
              : `mercader cerca: pulsa E para comprar | relacion ${Math.round(relation)}`,
          disposition === "enemy" ? "#ff7575" : "#7ddcff"
        );
      }

      if (world.lastMerchantRefusalTimer > 0) {
        drawContextLine("los mercaderes ambulantes no venden a enemigos", "#ff7575");
      }

      if (playerShip.isTouchingPlanet && !playerShip.rechargeReady) {
        const missingFuel = Math.max(0, playerShip.maxFuel - playerShip.fuel) / 10;
        const missingAmmo = Math.max(0, playerShip.maxAmmo - playerShip.ammo) / 10;
        const missingHp = Math.max(0, playerShip.maxHp - playerShip.hp);
        const remainingSeconds = Math.max(missingFuel, missingAmmo, missingHp) * playerShip.refuelDelay;
        drawContextLine(`reabastecimiento continuo: ${remainingSeconds.toFixed(1)} s restantes`, "#ffd45a");
      } else if (playerShip.isTouchingPlanet && playerShip.rechargeReady) {
        drawContextLine("planeta: combustible, municion y vida completos", "#9dff9d");
      }

      if (!playerShip.isAlive) {
        drawContextLine("estado: nave destruida", "#ff6666");
      }

      ctx.restore();

      drawRadar();
      drawResourcePanel();
    }

    // Construye un resumen del estado no esencial para mostrarlo en el panel de diagnostico.
    function buildDiagnosticsSnapshot() {
      const counts = {
        totalBodies: 0,
        asteroids: 0,
        ships: 0,
        scrap: 0,
        coins: 0,
        blueCoins: 0,
        projectiles: 0,
        planets: 0,
        other: 0,
        player: 0,
        merchants: 0,
        merchantEscorts: 0,
        fleas: 0,
        waspsSmall: 0,
        waspsLarge: 0,
        dragonfliesSmall: 0,
        dragonfliesLarge: 0,
        miners: 0,
        carriers: 0,
        interceptors: 0,
        tarantulas: 0
      };

      for (let i = 0; i < world.bodies.length; i++) {
        const body = world.bodies[i];
        if (!body || body.isRemoved) continue;
        counts.totalBodies++;

        if (body.kind === "asteroid") {
          counts.asteroids++;
        } else if (body.kind === "scrap") {
          counts.scrap++;
        } else if (body.kind === "coin") {
          counts.coins++;
          if (body.isBlueCoin) {
            counts.blueCoins++;
          }
        } else if (body.kind === "projectile") {
          counts.projectiles++;
        } else if (body.kind === "planet") {
          counts.planets++;
        } else if (body.kind === "ship") {
          counts.ships++;
          counts.player++;
        } else if (body.kind === "station") {
          counts.ships++;
          counts.merchants++;
        } else if (body.kind === "merchantEscort") {
          counts.ships++;
          counts.merchantEscorts++;
        } else if (body.kind === "miner") {
          counts.ships++;
          counts.miners++;
        } else if (body.kind === "carrier") {
          counts.ships++;
          counts.carriers++;
        } else if (body.kind === "interceptor") {
          counts.ships++;
          counts.interceptors++;
        } else if (body.kind === "flea") {
          counts.ships++;
          counts.fleas++;
        } else if (body.kind === "wasp") {
          counts.ships++;
          if (body.hullClass === "large") {
            counts.waspsLarge++;
          } else {
            counts.waspsSmall++;
          }
        } else if (body.kind === "dragonfly") {
          counts.ships++;
          if (body.hullClass === "large") {
            counts.dragonfliesLarge++;
          } else {
            counts.dragonfliesSmall++;
          }
        } else if (body.kind === "tarantula") {
          counts.ships++;
          counts.tarantulas++;
        } else {
          counts.other++;
        }
      }

      return {
        player: {
          position: `(${playerShip.x.toFixed(1)}, ${playerShip.y.toFixed(1)})`,
          linearSpeed: Math.hypot(playerShip.vx, playerShip.vy),
          angularSpeed: playerShip.angularVelocity,
          headingDeg: ((playerShip.angle * 180 / Math.PI) % 360 + 360) % 360,

    // Dibuja shop overlay en el contexto de render correspondiente.
    function drawShopOverlay() {
      if (!shopState.isOpen) return;

      const panelWidth = Math.min(820, canvas.width - 40);
      const rowHeight = 62;
      const rowGap = 14;
      const entryCount = Math.max(1, shopState.entries.length);
      const desiredPanelHeight = 240 + entryCount * (rowHeight + rowGap);
      const panelHeight = Math.min(desiredPanelHeight, canvas.height - 40);
      const panelX = (canvas.width - panelWidth) * 0.5;
      const panelY = (canvas.height - panelHeight) * 0.5;

      const listX = panelX + 26;
      const listY = panelY + 188;
      const rowWidth = panelWidth - 66;
      const footerHeight = 28;
      const listViewportHeight = Math.max(72, panelHeight - (listY - panelY) - footerHeight);
      const totalListHeight = entryCount * rowHeight + Math.max(0, entryCount - 1) * rowGap;
      shopState.viewport = { x: listX, y: listY, w: rowWidth, h: listViewportHeight };
      shopState.maxScroll = Math.max(0, totalListHeight - listViewportHeight);
      clampMenuScroll(shopState);

      ctx.save();
      ctx.fillStyle = "rgba(0, 0, 0, 0.78)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(10, 18, 25, 0.94)";
      ctx.fillRect(panelX, panelY, panelWidth, panelHeight);
      ctx.strokeStyle = "rgba(125, 220, 255, 0.55)";
      ctx.lineWidth = 2;
      ctx.strokeRect(panelX, panelY, panelWidth, panelHeight);

      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillStyle = "#7ddcff";
      ctx.font = "bold 30px monospace";
      ctx.fillText("MERCADER AMBULANTE", panelX + 26, panelY + 24);

      ctx.font = "16px monospace";
      ctx.fillStyle = "white";
      ctx.fillText("La simulacion esta en pausa. Compra recursos y mejoras con creditos.", panelX + 26, panelY + 68);
      ctx.fillText("Haz clic o pulsa 1-8. E o ESC para salir.", panelX + 26, panelY + 92);

      ctx.textAlign = "right";
      ctx.fillStyle = "#ffd45a";
      ctx.fillText(`creditos: ${Math.trunc(playerShip.credits)}`, panelX + panelWidth - 26, panelY + 32);
      ctx.textAlign = "left";

      ctx.fillStyle = "rgba(255,255,255,0.82)";
      ctx.fillText(
        `arma ${Math.round(playerShip.projectileSpeed)} vel. | ${playerShip.fireRate.toFixed(2)}/s | ${playerShip.projectilesPerShot} balas/disparo | daño ${playerShip.projectileDamage}`,
        panelX + 26,
        panelY + 126
      );
      ctx.fillText(
        `casco ${playerShip.getCrashSpeedThreshold(world.shipCrashSpeed).toFixed(0)} choque | ${Math.floor(playerShip.maxAmmo)} mun. | ${playerShip.maxFuel.toFixed(0)} s combustible | empuje ${playerShip.thrustPower.toFixed(0)}`,
        panelX + 26,
        panelY + 150
      );

      shopState.buttons = [];

      ctx.save();
      ctx.beginPath();
      ctx.rect(listX, listY, rowWidth, listViewportHeight);
      ctx.clip();

      for (let i = 0; i < shopState.entries.length; i++) {
        const entry = shopState.entries[i];
        const rowY = listY - shopState.scrollOffset + i * (rowHeight + rowGap);
        const affordable = playerShip.credits >= entry.cost;
        const hovered = shopState.hoverIndex === i;
        const available = entry.available !== false;
        const isService = entry.kind === "service";

        if (rowY + rowHeight < listY || rowY > listY + listViewportHeight) {
          continue;
        }

        if (available && affordable) {
          ctx.fillStyle = isService ? "rgba(24, 52, 74, 0.9)" : "rgba(28, 58, 38, 0.9)";
        } else if (!available) {
          ctx.fillStyle = "rgba(34, 34, 40, 0.9)";
        } else {
          ctx.fillStyle = "rgba(56, 24, 24, 0.9)";
        }
        ctx.fillRect(listX, rowY, rowWidth, rowHeight);
        ctx.strokeStyle = hovered ? "rgba(255,255,255,0.9)" : "rgba(255,255,255,0.18)";
        ctx.lineWidth = hovered ? 2 : 1;
        ctx.strokeRect(listX, rowY, rowWidth, rowHeight);

        ctx.textAlign = "left";
        ctx.fillStyle = isService ? "#7ddcff" : "white";
        ctx.font = "bold 18px monospace";
        ctx.fillText(`${i + 1}. ${entry.title}`, listX + 16, rowY + 10);
        ctx.font = "15px monospace";
        ctx.fillStyle = "rgba(255,255,255,0.85)";
        ctx.fillText(entry.description, listX + 16, rowY + 36);

        ctx.textAlign = "right";
        ctx.fillStyle = entry.cost <= 0 ? "#9dff9d" : "#ffd45a";
        ctx.font = "bold 18px monospace";
        ctx.fillText(entry.cost <= 0 ? "gratis" : `${entry.cost} cr`, listX + rowWidth - 16, rowY + 10);
        ctx.font = "14px monospace";
        if (!available) {
          ctx.fillStyle = "rgba(255,255,255,0.45)";
          ctx.fillText("completo", listX + rowWidth - 16, rowY + 38);
        } else {
          ctx.fillStyle = affordable ? "#bfffbf" : "#ffb2b2";
          ctx.fillText(affordable ? "comprar" : "faltan creditos", listX + rowWidth - 16, rowY + 38);
        }

        shopState.buttons.push({
          index: i,
          x: listX,
          y: rowY,
          w: rowWidth,
          h: rowHeight
        });
      }

      ctx.restore();
      drawVerticalScrollbar(panelX + panelWidth - 18, listY, listViewportHeight, totalListHeight, shopState.scrollOffset, "rgba(125, 220, 255, 0.95)");

      if (shopState.maxScroll > 0) {
        ctx.textAlign = "right";
        ctx.font = "14px monospace";
        ctx.fillStyle = "rgba(255,255,255,0.65)";
        ctx.fillText("rueda / flechas para desplazar", panelX + panelWidth - 26, panelY + panelHeight - 18);
      }

      ctx.restore();
    }

    // Dibuja game over overlay en el contexto de render correspondiente.
    function drawGameOverOverlay() {
      if (playerShip.isAlive) return;

      ctx.save();
      ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ff6666";
      ctx.font = "bold 34px monospace";
      ctx.textAlign = "center";

    // Dibuja el estado interno en el contexto de render correspondiente.
    function draw() {
      drawBackground();
      drawStars();

      if (world.showGrid) {
        world.grid.draw(ctx, camera, canvas.width, canvas.height);
      }

      world.draw(ctx, camera, canvas.width, canvas.height);
      drawBrakeLockIndicator();
      drawHUD();
      drawDiagnosticsOverlay();
      drawFactionOverlay();
      drawShopOverlay();
      drawPauseOverlay();
      drawGameOverOverlay();
    }

    let lastTime = performance.now();

    // Gestiona tick simulation dentro del flujo principal del juego. Usa dt como delta de tiempo del frame.
    function tickSimulation(dt) {
      world.update(dt);

      if (!world.isGameOver) {
        testCheats.update(dt);
        factionSystem.update(dt);
        updateTarantulaDiplomacy(dt);
        updateCoinMagnet(dt);
        world.updateShipCoinPickup(dt);
        updatePlanetResupply(dt);
        updatePlayerWeapons(dt);
        updateNpcWeapons(dt);
        proceduralField.update(dt);
      }

      if (world.isGameOver && shopState.isOpen) {
        closeShop();
      }
    }

    // Gestiona game loop dentro del flujo principal del juego.
    function gameLoop(currentTime) {
      const rawDt = Math.max(1 / 240, (currentTime - lastTime) / 1000);
      lastTime = currentTime;

      performanceMonitor.frameDtMs = rawDt * 1000;
      performanceMonitor.smoothedFrameDt += (rawDt - performanceMonitor.smoothedFrameDt) * performanceMonitor.smoothing;
      performanceMonitor.fps = 1 / Math.max(1e-6, performanceMonitor.smoothedFrameDt);

      let dt = clamp(rawDt, 0, 0.05);

      if (!world.isGameOver && !isSimulationPaused()) {
        tickSimulation(dt);
      }

      updateCamera(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    window.__game = {
      world,
      playerShip,
      proceduralField,
      shopState,
      factionSystem,
      factionMenuState,
      diagnosticsMenuState,
      performanceMonitor,
      keys,
      testCheats,
      findNearbyStation,
      openShop,
      closeShop,
      attemptPurchaseEntry,
      fireProjectile,
      updateNpcWeapons,
      tickSimulation,
      // Devuelve counts calculado a partir del estado y los parametros recibidos.
      getCounts() {
        const countsByKind = {};
        for (const body of world.bodies) {
          countsByKind[body.kind] = (countsByKind[body.kind] ?? 0) + 1;
        }

        return {
          total: world.bodies.length,
          procedural: proceduralField.getProceduralCount(),
          stations: proceduralField.getStationCount(),
          merchantEscorts: proceduralField.getMerchantEscortCount(),
          fleas: proceduralField.getFleaCount(),
          wasps: proceduralField.getWaspCount(),
          dragonflies: proceduralField.getDragonflyCount(),
          miners: proceduralField.getMinerCount(),
          carriers: proceduralField.getCarrierCount(),
          tarantulas: proceduralField.getTarantulaCount(),
          ammo: playerShip.ammo,
          fuel: playerShip.fuel,
          credits: playerShip.credits,
          crashThreshold: playerShip.getCrashSpeedThreshold(world.shipCrashSpeed),
          kinds: countsByKind
        };
      }
    };

    updatePlanetResupply(0);
    updateCamera(1 / 60);
    updateMouseWorld();
    canvas.style.cursor = "crosshair";
    requestAnimationFrame(gameLoop);
  
  </script>
</body>
</html>
