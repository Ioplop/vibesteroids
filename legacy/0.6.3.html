      }

      // Devuelve el planeta la separacion respecto a la superficie la cobertura el rango calculado a partir del estado y los parametros recibidos.
      getPlanetSurfaceCoverageRange() {
        return this.getPlanetSurfaceStandOffMax() + 36;
      }

      // Consulta los elementos cercanos dentro del rango o contexto indicado.
      queryNearby(range, callback) {
        queryNearbyWithFrameCache(this, range, callback);
      }

      // Calcula y cachea la lectura espacial compartida del mercader para reutilizarla dentro del mismo tick.
      getPerceptionSnapshot() {
        const aiWorld = this.aiWorld;
        const frameId = aiWorld?.aiTickId ?? 0;
        const cached = this._stationPerceptionCache;
        if (cached && cached.refreshUntilTick >= frameId) {
          return cached;
        }

        const primaryRadius = this.hostSeekDistance;
        const fallbackRadius = this.hostSeekDistance * 1.6;
        const avoidanceSenseRadius = Math.max(this.planetSenseRadius, this.asteroidSenseRadius);
        const groupingRadius = 320;
        const combatQueryRange = Math.max(this.weaponRange, this.enemyWeaponRange);
        const coinSenseRadius = this.coinSenseRadius ?? 0;
        const scrapSenseRadius = this.scrapSenseRadius ?? 0;
        const maxRange = Math.max(1, fallbackRadius, avoidanceSenseRadius, groupingRadius, combatQueryRange, coinSenseRadius, scrapSenseRadius);

        const primaryRadiusSq = primaryRadius * primaryRadius;
        const fallbackRadiusSq = fallbackRadius * fallbackRadius;
        const avoidanceSenseRadiusSq = avoidanceSenseRadius * avoidanceSenseRadius;
        const groupingRadiusSq = groupingRadius * groupingRadius;
        const enemyWeaponRangeSq = this.enemyWeaponRange * this.enemyWeaponRange;
        const weaponRangeSq = this.weaponRange * this.weaponRange;
        const coinSenseRadiusSq = coinSenseRadius * coinSenseRadius;
        const scrapSenseRadiusSq = scrapSenseRadius * scrapSenseRadius;

        let bestPrimaryPlanet = null;
        let bestPrimaryScore = Infinity;
        let bestFallbackPlanet = null;
        let bestFallbackScore = Infinity;

        let avoidX = 0;
        let avoidY = 0;
        let extraAccel = 0;
        let hardPlanetThreat = false;

        let avgVX = 0;
        let avgVY = 0;
        let centerX = 0;
        let centerY = 0;
        let allyCount = 0;

        let bestEnemyTarget = null;
        let bestEnemyScore = Infinity;
        let bestEnemyAimAngle = this.angle;
        let bestEnemyDistance = Infinity;
        let bestAsteroidTarget = null;
        let bestAsteroidScore = Infinity;
        let bestAsteroidAimAngle = this.angle;
        let bestAsteroidDistance = Infinity;
        let bestCoin = null;
        let bestCoinScore = Infinity;
        let bestScrap = null;
        let bestScrapScore = Infinity;

        queryNearbyWithFrameCache(this, maxRange, (body) => {
          const dx = body.x - this.x;
          const dy = body.y - this.y;
          const distSq = dx * dx + dy * dy;
          if (!(distSq > 1e-6)) return;
          let dist = 0;

          if (body.kind === "planet" && distSq <= fallbackRadiusSq && !StationShip.isPlanetReservedByOther(body, this)) {
            dist = Math.sqrt(distSq);
            const desiredRadius = body.radius + this.preferredPlanetOffset;
            const radiusError = Math.abs(dist - desiredRadius);
            const speedMismatch = Math.hypot(this.vx - body.vx, this.vy - body.vy);
            const score = radiusError + dist * 0.028 + speedMismatch * 1.1;
            if (distSq <= primaryRadiusSq) {
              if (score < bestPrimaryScore) {
                bestPrimaryScore = score;
                bestPrimaryPlanet = body;
              }
            } else if (score < bestFallbackScore) {
              bestFallbackScore = score;
              bestFallbackPlanet = body;
            }
          }

          if (distSq <= avoidanceSenseRadiusSq && (body.kind === "planet" || body.kind === "asteroid")) {
            if (!dist) dist = Math.sqrt(distSq);
            const nx = -dx / dist;
            const ny = -dy / dist;
            const relVX = this.vx - body.vx;
            const relVY = this.vy - body.vy;
            const inwardSpeed = Math.max(0, -(relVX * nx + relVY * ny));
            let hardRadius;
            let softRadius;
            let baseStrength;
            let velocityWeight;
            let penetrationWeight;
            if (body.kind === "planet") {
              hardRadius = body.radius + this.radius + 104;
              softRadius = body.radius + Math.max(190, this.preferredPlanetOffset * 0.8);
              baseStrength = body === this.hostPlanet ? 80 : 92;
              velocityWeight = 1.65;
              penetrationWeight = 1.65;
            } else {
              hardRadius = body.radius + this.radius + 30;
              softRadius = body.radius + this.radius + 132;
              baseStrength = 34;
              velocityWeight = 1.1;
              penetrationWeight = 0.95;
            }
            if (dist < softRadius) {
              const band = Math.max(softRadius - hardRadius, 1);
              const closeness = clamp((softRadius - dist) / band, 0, 1);
              let strength = baseStrength * closeness * closeness + inwardSpeed * velocityWeight;
              if (dist < hardRadius) {
                strength += (hardRadius - dist) * penetrationWeight + (body.kind === "planet" ? 48 : 12);
                if (body.kind === "planet") hardPlanetThreat = true;
              }
              avoidX += nx * strength;
              avoidY += ny * strength;
              extraAccel = Math.max(extraAccel, strength);
            }
          }

          if (distSq <= groupingRadiusSq && isShipLike(body) && body.faction === this.faction && body.kind !== "merchantEscort") {
            if (!dist) dist = Math.sqrt(distSq);
            avgVX += body.vx;
            avgVY += body.vy;
            centerX += body.x;
            centerY += body.y;
            allyCount++;
          }

          const isEnemyShip = isShipLike(body) && body.isAlive && this.getDispositionTo(body.faction) === "enemy";
          if (isEnemyShip && distSq <= enemyWeaponRangeSq) {
            if (!dist) dist = Math.sqrt(distSq);
            const relVX = body.vx - this.vx;
            const relVY = body.vy - this.vy;
            const aim = computeInterceptAim(dx, dy, relVX, relVY, this.projectileSpeed, this.weaponAimLead, 2.0);
            const aimAngle = Math.atan2(aim.y, aim.x);
            const angleError = Math.abs(wrapAngle(aimAngle - this.angle));
            const score = dist + angleError * 36;
            if (score < bestEnemyScore) {
              bestEnemyScore = score;
              bestEnemyTarget = body;
              bestEnemyAimAngle = aimAngle;
              bestEnemyDistance = dist;
            }
          } else if (body.kind === "asteroid" && distSq <= weaponRangeSq) {
            if (!dist) dist = Math.sqrt(distSq);
            const relVX = body.vx - this.vx;
            const relVY = body.vy - this.vy;
            const aim = computeInterceptAim(dx, dy, relVX, relVY, this.projectileSpeed, this.weaponAimLead, 2.0);
            const aimAngle = Math.atan2(aim.y, aim.x);
            const angleError = Math.abs(wrapAngle(aimAngle - this.angle));
            const score = 240 + dist + angleError * 54;
            if (score < bestAsteroidScore) {
              bestAsteroidScore = score;
              bestAsteroidTarget = body;
              bestAsteroidAimAngle = aimAngle;
              bestAsteroidDistance = dist;
            }
          }

          if (body.kind === "coin" && distSq <= coinSenseRadiusSq) {
            if (!dist) dist = Math.sqrt(distSq);
            const score = dist + Math.hypot(body.vx - this.vx, body.vy - this.vy) * 0.2;
            if (score < bestCoinScore) {
              bestCoinScore = score;
              bestCoin = body;
            }
          }

          if (body.kind === "scrap" && distSq <= scrapSenseRadiusSq) {
            if (!dist) dist = Math.sqrt(distSq);
            const score = dist + Math.hypot(body.vx - this.vx, body.vy - this.vy) * 0.08;
            if (score < bestScrapScore) {
              bestScrapScore = score;
              bestScrap = body;
            }
          }
        });

        const grouping = allyCount <= 0 ? { x: 0, y: 0 } : (() => {
          const meanVX = avgVX / allyCount;
          const meanVY = avgVY / allyCount;
          const meanX = centerX / allyCount;
          const meanY = centerY / allyCount;
          const toCenterX = meanX - this.x;
          const toCenterY = meanY - this.y;
          return {
            x: (meanVX - this.vx) * 0.55 + toCenterX * 0.015,
            y: (meanVY - this.vy) * 0.55 + toCenterY * 0.015
          };
        })();

        const snapshot = {
          frameId,
          refreshUntilTick: frameId + this.perceptionRefreshTicks,
          bodies: this._nearbyQueryCache?.bodies ?? [],
          hostPlanet: bestPrimaryPlanet ?? bestFallbackPlanet ?? this.hostPlanet ?? null,
          avoidance: { x: avoidX, y: avoidY, extraAccel, hardPlanetThreat },
          grouping,
          combatEnemy: { target: bestEnemyTarget, score: bestEnemyScore, aimAngle: bestEnemyAimAngle, distance: bestEnemyDistance },
          combatAsteroid: { target: bestAsteroidTarget, score: bestAsteroidScore, aimAngle: bestAsteroidAimAngle, distance: bestAsteroidDistance },
          bestCoin,
          bestScrap
        };
        this._stationPerceptionCache = snapshot;
        return snapshot;
      }

      // Devuelve disposition to calculado a partir del estado y los parametros recibidos.
      getDispositionTo(factionName) {
        if (!factionSystem || !factionName) return "neutral";
        return factionSystem.getDisposition(this.faction, factionName);
      }

      // Selecciona el planeta anfitrion el planeta dentro de esta parte de la logica.
      chooseHostPlanet() {
        return this.getPerceptionSnapshot().hostPlanet;
      }

      // Calcula la evasion a partir del estado y los parametros disponibles.
      computeAvoidance() {
        return this.getPerceptionSnapshot().avoidance;
      }

      // Calcula ally grouping a partir del estado y los parametros disponibles.
      computeAllyGrouping() {
        return this.getPerceptionSnapshot().grouping;
      }

      // Actualiza el combate el objetivo usando el estado actual y los parametros recibidos.
      updateCombatTarget(ignoreAsteroids = false) {
        const snapshot = this.getPerceptionSnapshot();
        const enemyData = snapshot.combatEnemy;
        const asteroidData = snapshot.combatAsteroid;
        const chosen = enemyData.target && (ignoreAsteroids || !asteroidData.target || enemyData.score <= asteroidData.score)
          ? enemyData
          : (ignoreAsteroids ? { target: null, aimAngle: this.angle, distance: Infinity } : asteroidData);
        const bestTarget = chosen.target ?? null;
        this.combatTarget = bestTarget;
        this.combatAimAngle = chosen.aimAngle ?? this.angle;
        this.combatDistance = chosen.distance ?? Infinity;
        this.targetPreference = bestTarget ? (bestTarget.kind === "asteroid" ? "asteroid" : "enemy") : "asteroid";
        return bestTarget;
      }

      // Actualiza rescue el piloto automatico usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      updateRescueAutopilot(dt) {
        const player = this.aiPlayer;
        if (!player || !player.isAlive) {
          return;
        }

        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.max(0.001, Math.hypot(dx, dy));
        const nx = dx / dist;
        const ny = dy / dist;
        const desiredStandoff = Math.max(
          this.radius + player.radius + 18,
          Math.min(this.rescueApproachRadius, Math.max(82, this.interactionRadius * 0.62))
        );
        const approachSpeed = clamp(
          (dist - desiredStandoff) * 0.7,
          -22,
          Math.max(132, this.maxCruiseSpeed * 2.8)
        );
        let desiredVX = player.vx + nx * approachSpeed;
        let desiredVY = player.vy + ny * approachSpeed;

        if (dist < desiredStandoff + 8) {
          desiredVX = lerp(desiredVX, player.vx, 0.96);
          desiredVY = lerp(desiredVY, player.vy, 0.96);
        }

        const avoidance = this.computeAvoidance();
        let maxAccel = Math.max(this.maxPlanetMatchAcceleration * 1.3, this.maxThrustAcceleration * 1.55);
        if (avoidance.hardPlanetThreat) {
          maxAccel = Math.max(maxAccel, this.maxPlanetMatchAcceleration * 1.45);
        }

        const rawSteerX = (desiredVX - this.vx) * 2.35 + avoidance.x;
        const rawSteerY = (desiredVY - this.vy) * 2.35 + avoidance.y;
        maxAccel = Math.max(maxAccel, Math.min(this.maxPlanetMatchAcceleration * 1.5, this.maxThrustAcceleration + avoidance.extraAccel * 0.6));

        const steer = clampVectorMagnitude(rawSteerX, rawSteerY, maxAccel);
        this.applyThrustAcceleration(steer.x, steer.y, dt, { intensityScale: 0.88, countRate: 11, angleVariance: 0.72, speed: 34, speedVariance: 16, spawnRadiusScale: 0.78, colorVariance: 22 });
        this.isOrbitingPlanet = false;

        this.combatTarget = null;
        this.combatDistance = Infinity;
        this.targetPreference = "rescue";

        const faceX = Math.abs(rawSteerX) + Math.abs(rawSteerY) > 0.6 ? rawSteerX : dx;
        const faceY = Math.abs(rawSteerX) + Math.abs(rawSteerY) > 0.6 ? rawSteerY : dy;
        const targetAngle = Math.atan2(faceY, faceX);
        this.angle += wrapAngle(targetAngle - this.angle) * clamp(dt * 6.2, 0, 1);
        this.angularVelocity = 0;
      }

      // Registra el impacto de largo alcance el rango el impacto dentro de esta parte de la logica.
      registerLongRangeHit(projectile) {
        const impactSpeed = Math.hypot(projectile.vx, projectile.vy);
        if (!(impactSpeed > 0.001)) return;
        const dirX = projectile.vx / impactSpeed;
        const dirY = projectile.vy / impactSpeed;
        this.longRangeReactionX = -dirX * 280;
        this.longRangeReactionY = -dirY * 280;
        this.longRangeReactionTimer = 4.5;
      }

      // Actualiza el piloto automatico usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      updateAutopilot(dt) {
        if (!this.aiWorld) {
          return;
        }

        const surfaceCoverageRange = this.getPlanetSurfaceCoverageRange();
        this.weaponRange = Math.max(this.weaponRange, surfaceCoverageRange);
        this.coinMagnetRadius = Math.max(this.coinMagnetRadius, surfaceCoverageRange);
        this.asteroidSenseRadius = Math.max(this.asteroidSenseRadius, surfaceCoverageRange + 80);

        this.longRangeReactionTimer = Math.max(0, this.longRangeReactionTimer - dt);
        this.hostRetargetTimer -= dt;
        const hasHostPlanet = !!(this.hostPlanet && !this.hostPlanet.isRemoved);
        const shouldRetargetHost = !hasHostPlanet
          ? this.hostRetargetTimer <= 0
          : this.hostRetargetTimer <= 0 || distanceSquared(this.x, this.y, this.hostPlanet.x, this.hostPlanet.y) > this.hostSeekDistance * this.hostSeekDistance;

        if (shouldRetargetHost) {
          const nextHostPlanet = this.chooseHostPlanet();
          this.setHostPlanet(nextHostPlanet);
          this.hostRetargetTimer = nextHostPlanet ? randomBetween(0.3, 0.7) : randomBetween(0.55, 1.0);
        }

        this.updateCombatTarget(true);
        const nearbyEnemyCombat = !!(
          this.combatTarget &&
          this.targetPreference === "enemy" &&
          this.combatDistance <= this.enemySenseRadius
        );

        let desiredVX = this.vx;
        let desiredVY = this.vy;
        let maxAccel = this.maxThrustAcceleration;
        let orbiting = false;

        if (this.hostPlanet) {
          const host = this.hostPlanet;
          const dx = host.x - this.x;
          const dy = host.y - this.y;
          const dist = Math.max(0.001, Math.hypot(dx, dy));
          const nx = dx / dist;
          const ny = dy / dist;
          const tx = -ny * this.orbitDirection;
          const ty = nx * this.orbitDirection;
          const relativeVX = this.vx - host.vx;
          const relativeVY = this.vy - host.vy;
          const radialVelocity = relativeVX * nx + relativeVY * ny;
          const desiredRadius = host.radius + this.preferredPlanetOffset;
          const radiusError = dist - desiredRadius;
          const orbitSpeed = Math.sqrt((this.aiWorld.G * host.mass) / Math.max(dist, host.radius + 28)) * 0.92;
          let radialCorrection = clamp(radiusError * 0.18 - radialVelocity * 1.1, -34, 34);
          const tooCloseDistance = host.radius + this.radius + 112;

          if (dist < tooCloseDistance) {
            radialCorrection = -56 - Math.min(40, (tooCloseDistance - dist) * 0.4);
          }

          desiredVX = host.vx + tx * orbitSpeed + nx * radialCorrection;
          desiredVY = host.vy + ty * orbitSpeed + ny * radialCorrection;
          orbiting = Math.abs(radiusError) < this.preferredPlanetBand && Math.abs(radialVelocity) < 9 && dist > tooCloseDistance + 12;

          if (Math.hypot(this.vx - host.vx, this.vy - host.vy) > 16) {
            maxAccel = this.maxPlanetMatchAcceleration;
          }

          const desiredRelative = clampVectorMagnitude(
            desiredVX - host.vx,
            desiredVY - host.vy,
            orbiting ? Math.max(orbitSpeed * 1.18, 24) : this.maxCruiseSpeed
          );
          desiredVX = host.vx + desiredRelative.x;
          desiredVY = host.vy + desiredRelative.y;
        }

        const dispositionToPlayer = this.aiPlayer && this.aiPlayer.isAlive
          ? this.getDispositionTo(this.aiPlayer.faction)
          : "neutral";
        const rescueFuelThreshold = this.aiWorld?.merchantRescueFuelThreshold ?? 2;
        const shouldRescuePlayer = !!(
          this.aiPlayer &&
          this.aiPlayer.isAlive &&
          dispositionToPlayer !== "enemy" &&
          this.aiPlayer.fuel <= rescueFuelThreshold &&
          this.aiWorld?.merchantRescueStationId === this.id &&
          !nearbyEnemyCombat
        );

        if (shouldRescuePlayer) {
          this.updateRescueAutopilot(dt);
          return;
        }

        let enemyTarget = null;
        if (this.aiPlayer && this.aiPlayer.isAlive && dispositionToPlayer === "enemy") {
          const dx = this.aiPlayer.x - this.x;
          const dy = this.aiPlayer.y - this.y;
          const dist = Math.hypot(dx, dy);
          if (dist <= this.enemySenseRadius) {
            enemyTarget = this.aiPlayer;
            const desiredStandoff = this.enemyWeaponRange * 0.68;
            const nx = dx / Math.max(0.001, dist);
            const ny = dy / Math.max(0.001, dist);
            const tangentX = -ny * this.orbitDirection;
            const tangentY = nx * this.orbitDirection;
            const approach = clamp((dist - desiredStandoff) * 0.18, -34, 30);
            desiredVX = enemyTarget.vx + tangentX * 24 + nx * approach;
            desiredVY = enemyTarget.vy + tangentY * 24 + ny * approach;
            maxAccel = Math.max(maxAccel, 72);
          }
        } else if (this.aiPlayer && this.aiPlayer.isAlive && dispositionToPlayer === "ally") {
          const dx = this.aiPlayer.x - this.x;
          const dy = this.aiPlayer.y - this.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 900 && !orbiting) {
            const offsetAngle = Math.atan2(dy, dx) + this.orbitDirection * 0.9;
            const offsetDistance = 180 + (this.id % 3) * 40;
            const desiredX = this.aiPlayer.x - Math.cos(offsetAngle) * offsetDistance;
            const desiredY = this.aiPlayer.y - Math.sin(offsetAngle) * offsetDistance;
            desiredVX = this.aiPlayer.vx + (desiredX - this.x) * 0.2;
            desiredVY = this.aiPlayer.vy + (desiredY - this.y) * 0.2;
            maxAccel = Math.max(maxAccel, 56);
          }
        } else if (this.aiPlayer && this.aiPlayer.isAlive) {
          const dx = this.aiPlayer.x - this.x;
          const dy = this.aiPlayer.y - this.y;
          const dist = Math.hypot(dx, dy);

          if (dist < this.playerCourtesyRadius && !orbiting) {
            const t = clamp(1 - dist / this.playerCourtesyRadius, 0, 1);
            const matchStrength = dist < this.interactionRadius * 0.95
              ? 1
              : clamp(0.35 + t * 0.65, 0, 1);
            desiredVX = lerp(desiredVX, this.aiPlayer.vx, matchStrength);
            desiredVY = lerp(desiredVY, this.aiPlayer.vy, matchStrength);
            maxAccel = Math.max(this.maxCourtesyAcceleration, Math.min(this.maxPlanetMatchAcceleration, 30 + t * 14));
          }
        }

        if (!enemyTarget && !this.combatTarget && !orbiting && !this.hostPlanet) {
          if (!this.wanderAngle || Math.random() < dt * 0.35) {
            this.wanderAngle = randomBetween(0, Math.PI * 2);
          }

          const wanderSpeed = this.maxCruiseSpeed * 0.72;
          desiredVX = Math.cos(this.wanderAngle) * wanderSpeed;
          desiredVY = Math.sin(this.wanderAngle) * wanderSpeed;
          maxAccel = Math.max(maxAccel, this.maxThrustAcceleration * 0.82);
        }

        if (this.longRangeReactionTimer > 0) {
          desiredVX += this.longRangeReactionX * 0.18;
          desiredVY += this.longRangeReactionY * 0.18;
          maxAccel = Math.max(maxAccel, 74);
        }

        const grouping = this.computeAllyGrouping();
        desiredVX += grouping.x;
        desiredVY += grouping.y;

        const avoidance = this.computeAvoidance();

        if (avoidance.hardPlanetThreat) {
          orbiting = false;
          maxAccel = Math.max(maxAccel, this.maxPlanetMatchAcceleration);
        }

        const rawSteerX = (desiredVX - this.vx) * 2.1 + avoidance.x;
        const rawSteerY = (desiredVY - this.vy) * 2.1 + avoidance.y;
        maxAccel = Math.max(maxAccel, Math.min(this.maxPlanetMatchAcceleration, this.maxThrustAcceleration + avoidance.extraAccel * 0.55));

        const steer = clampVectorMagnitude(rawSteerX, rawSteerY, maxAccel);
        this.applyThrustAcceleration(steer.x, steer.y, dt, { intensityScale: 0.88, countRate: 11, angleVariance: 0.72, speed: 34, speedVariance: 16, spawnRadiusScale: 0.78, colorVariance: 22 });
        this.isOrbitingPlanet = orbiting;

        this.updateCombatTarget();

        let targetAngle = this.combatAimAngle;

        if (!this.combatTarget) {
          const faceVX = Math.abs(rawSteerX) + Math.abs(rawSteerY) > 0.6
            ? rawSteerX
            : desiredVX;
          const faceVY = Math.abs(rawSteerX) + Math.abs(rawSteerY) > 0.6
            ? rawSteerY
            : desiredVY;

          if (Math.hypot(faceVX, faceVY) > 0.001) {
            targetAngle = Math.atan2(faceVY, faceVX);
          } else {
            targetAngle = this.angle;
          }
        }

        this.angle += wrapAngle(targetAngle - this.angle) * clamp(dt * (this.combatTarget ? 7.5 : 4.5), 0, 1);
        this.angularVelocity = 0;
      }

      // Devuelve el umbral de impacto speed el umbral calculado a partir del estado y los parametros recibidos.
      getCrashSpeedThreshold(baseCrashSpeed) {
        return Math.max(baseCrashSpeed, 500);
      }

      // Actualiza el estado interno usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      update(dt) {
        this.updateAutopilot(dt);
        super.update(dt);
      }

      // Dibuja el estado interno en el contexto de render correspondiente.
      draw(ctx, camera) {
        const sx = this.x - camera.x;
        const sy = this.y - camera.y;

        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(this.angle);

        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(this.radius * 1.12, 0);
        ctx.lineTo(-this.radius * 0.6, -this.radius * 0.58);
        ctx.lineTo(-this.radius * 0.2, 0);
        ctx.lineTo(-this.radius * 0.6, this.radius * 0.58);
        ctx.closePath();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(-this.radius * 0.14, 0, this.radius * 0.38, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-this.radius * 0.9, -this.radius * 0.72);
        ctx.lineTo(-this.radius * 0.18, -this.radius * 0.26);
        ctx.moveTo(-this.radius * 0.9, this.radius * 0.72);
        ctx.lineTo(-this.radius * 0.18, this.radius * 0.26);
        ctx.stroke();

        ctx.fillStyle = "rgba(125, 220, 255, 0.2)";
        ctx.fillRect(-this.radius * 1.08, -this.radius * 0.2, this.radius * 0.22, this.radius * 0.4);
        ctx.fillRect(-this.radius * 0.18, -this.radius * 0.12, this.radius * 0.54, this.radius * 0.24);

        ctx.restore();
      }
    }

    class MerchantEscortShip extends BaseFactionShip {
      // Inicializa la instancia de MerchantEscortShip con las opciones y el estado base necesarios.
      constructor(options = {}) {
        super({
          radius: 10,
          colliderRadius: 10,
          mass: 6,
          color: options.color ?? "#8ee7ff",
          kind: "merchantEscort",
          thrustPower: 320,
          brakePower: 360,
          angularAccel: 3.6,
          angularBrakeAccel: 4.2,
          maxAimAngularSpeed: 4.25,
          fireRate: 3.4,
          projectileSpeed: 720,
          projectileSpread: 0,
          projectilesPerShot: 1,
          maxAmmo: Infinity,
          ammo: Infinity,
          faction: "Mercader Ambulante",
          maxHp: 9,
          hp: 9,
          coinMagnetRadius: 0,
          projectileDamage: 3,
          hullClass: "small",
          squadCruiseSpeed: 118,
          maxCruiseSpeed: 264,
          maxAcceleration: 372,
          enemySenseRadius: 1120,
          weaponRange: 560,
          projectileSenseRadius: 250,
          squadSenseRadius: 220,
          preferredSquadRadius: 48,
          personalSpace: 18,
          escortRadius: 0,
          escortBreakSpeed: 0,
          escortDistance: 0,
          fireAngleTolerance: 0.2,
          squadAlignmentWeight: 0.72,
          squadCohesionWeight: 0.8,
          squadSeparationWeight: 0.96,
          ...options
        });

        this.merchantSenseRadius = options.merchantSenseRadius ?? 2400;
        this.merchantDefenseRadius = options.merchantDefenseRadius ?? 980;
        this.merchantFollowDistance = options.merchantFollowDistance ?? 82;
        this.merchantSideDistance = options.merchantSideDistance ?? 64;
        this.merchantRetargetTimer = options.merchantRetargetTimer ?? 0;
        this.merchantTarget = null;
        this.assignedMerchantId = options.assignedMerchantId ?? null;
        this.projectileColor = options.projectileColor ?? this.color;
      }

      // Indica si el mercader el objetivo valid cumple la condicion esperada para esta logica.
      isMerchantTargetValid(target = this.merchantTarget) {
        return !!(
          target &&
          !target.isRemoved &&
          target.kind === "station" &&
          target.isAlive &&
          target.faction === this.faction
        );
      }

      // Actualiza el mercader el objetivo usando el estado actual y los parametros recibidos.
      setMerchantTarget(target) {
        if (!this.isMerchantTargetValid(target)) {
          this.merchantTarget = null;
          this.assignedMerchantId = null;
          this.squadId = 0;
          return null;
        }

        this.merchantTarget = target;
        this.assignedMerchantId = target.id;
        this.squadId = target.id;
        return this.merchantTarget;
      }

      // Selecciona el mercader el objetivo dentro de esta parte de la logica.
      chooseMerchantTarget() {
        let bestPrimaryMerchant = null;
        let bestPrimaryScore = Infinity;
        let bestFallbackMerchant = null;
        let bestFallbackScore = Infinity;
        const primaryRadius = this.merchantSenseRadius;
        const fallbackRadius = this.merchantSenseRadius * 1.6;

        this.queryNearby(fallbackRadius, (body) => {
          if (body.kind !== "station" || !body.isAlive || body.faction !== this.faction) {
            return;
          }

          const dx = body.x - this.x;
          const dy = body.y - this.y;
          const dist = Math.hypot(dx, dy);
          if (!(dist > 0.001) || dist > fallbackRadius) {
            return;
          }

          const speedMismatch = Math.hypot(body.vx - this.vx, body.vy - this.vy);
          const assignedBias = body.id === this.assignedMerchantId ? -120 : 0;
          const score = dist + speedMismatch * 0.4 + assignedBias;

          if (dist <= primaryRadius) {
            if (score < bestPrimaryScore) {
              bestPrimaryScore = score;
              bestPrimaryMerchant = body;
            }
            return;
          }

          if (score < bestFallbackScore) {
            bestFallbackScore = score;
            bestFallbackMerchant = body;
          }
        });

        return bestPrimaryMerchant ?? bestFallbackMerchant;
      }

      // Selecciona el objetivo defensivo el objetivo dentro de esta parte de la logica.
      chooseDefenseTarget() {
        let bestTarget = null;
        let bestScore = Infinity;
        const hasMerchant = this.isMerchantTargetValid();
        const enemySenseRadiusSq = this.enemySenseRadius * this.enemySenseRadius;
        const bodies = this.getPerceptionSnapshot().bodies;

        for (let i = 0; i < bodies.length; i++) {
          const body = bodies[i];
          if (!isShipLike(body) || !body.isAlive) continue;
          if (this.getDispositionTo(body.faction) !== "enemy") continue;

          const dx = body.x - this.x;
          const dy = body.y - this.y;
          const distSq = dx * dx + dy * dy;
          if (!(distSq > 1e-6) || distSq > enemySenseRadiusSq) continue;

          const dist = Math.sqrt(distSq);
          let merchantPenalty = 0;
          if (hasMerchant) {
            const merchantDist = Math.hypot(body.x - this.merchantTarget.x, body.y - this.merchantTarget.y);
            const merchantLimit = this.merchantDefenseRadius + this.merchantTarget.radius + body.radius;
            if (merchantDist > merchantLimit && dist > this.weaponRange * 0.95) continue;
            merchantPenalty = merchantDist * 0.42;
          }

          const relativeSpeed = Math.hypot(body.vx - this.vx, body.vy - this.vy);
          const score = dist + relativeSpeed * 0.16 + merchantPenalty;
          if (score < bestScore) {
            bestScore = score;
            bestTarget = body;
          }
        }

        this.combatTarget = bestTarget;
        this.combatDistance = bestTarget ? Math.hypot(bestTarget.x - this.x, bestTarget.y - this.y) : Infinity;
        return bestTarget;
      }

      // Calcula el mercader la escolta el vector a partir del estado y los parametros disponibles.
      computeMerchantEscortVector() {
        const merchant = this.merchantTarget;
        const merchantSpeed = Math.hypot(merchant.vx, merchant.vy);
        const heading = merchantSpeed > 12 ? Math.atan2(merchant.vy, merchant.vx) : merchant.angle;
        const laneSide = (this.id % 2 === 0 ? 1 : -1) * this.orbitDirection;
        const sideOffset = laneSide * (this.merchantSideDistance + this.formationLane * 12);
        const backOffset = merchant.radius + this.merchantFollowDistance + Math.abs(this.formationLane) * 10;
        const desiredX = merchant.x - Math.cos(heading) * backOffset + Math.cos(heading + Math.PI * 0.5) * sideOffset;
        const desiredY = merchant.y - Math.sin(heading) * backOffset + Math.sin(heading + Math.PI * 0.5) * sideOffset;
        return {
          desiredVX: merchant.vx + (desiredX - this.x) * 1.85,
          desiredVY: merchant.vy + (desiredY - this.y) * 1.85,
          desiredAngle: Math.atan2(merchant.y - this.y, merchant.x - this.x),
          effectiveMaxSpeed: Math.max(this.maxCruiseSpeed, merchantSpeed + 56)
        };
      }

      // Actualiza el piloto automatico usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      updateAutopilot(dt) {
        if (!this.aiWorld) return;

        this.merchantRetargetTimer -= dt;
        const maxMerchantDistance = this.merchantSenseRadius * 1.8;
        const hasMerchantTarget = this.isMerchantTargetValid();
        const shouldRetargetMerchant = !hasMerchantTarget
          ? this.merchantRetargetTimer <= 0
          : this.merchantRetargetTimer <= 0 || distanceSquared(this.x, this.y, this.merchantTarget.x, this.merchantTarget.y) > maxMerchantDistance * maxMerchantDistance;
        if (shouldRetargetMerchant) {
          const nextMerchantTarget = this.chooseMerchantTarget();
          this.setMerchantTarget(nextMerchantTarget);
          this.merchantRetargetTimer = nextMerchantTarget ? randomBetween(0.35, 0.7) : randomBetween(0.55, 1.0);
        }

        const squad = this.computeSquadState();
        const avoid = this.computeHazardAvoidance();
        const dodge = this.computeProjectileDodge(0.78);
        const enemy = this.chooseDefenseTarget();
        const hasMerchant = this.isMerchantTargetValid();
        let desiredVX = this.vx;
        let desiredVY = this.vy;
        let desiredAngle = this.angle;
        let desiredAngleRate = 0;
        let effectiveMaxSpeed = this.maxCruiseSpeed;

        if (enemy) {
          const dx = enemy.x - this.x;
          const dy = enemy.y - this.y;
          const dist = Math.max(0.001, Math.hypot(dx, dy));
          const nx = dx / dist;
          const ny = dy / dist;
          const tx = -ny * this.orbitDirection;
          const ty = nx * this.orbitDirection;
          const standoff = enemy.radius + 150 + Math.abs(this.formationLane) * 8;
          const approach = clamp((dist - standoff) * 1.24, -140, 150);
          let merchantBiasX = 0;
          let merchantBiasY = 0;

          if (hasMerchant) {
            merchantBiasX = (this.merchantTarget.x - this.x) * 0.34 + (this.merchantTarget.vx - this.vx) * 0.55;
            merchantBiasY = (this.merchantTarget.y - this.y) * 0.34 + (this.merchantTarget.vy - this.vy) * 0.55;
          }

          desiredVX = enemy.vx + nx * approach + tx * 78 + merchantBiasX;
          desiredVY = enemy.vy + ny * approach + ty * 78 + merchantBiasY;
          desiredAngle = this.updateCombatAim(enemy);
          desiredAngleRate = this.combatAimAngleRate ?? 0;
          effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, Math.hypot(enemy.vx, enemy.vy) + 120);
        } else if (hasMerchant) {
          const escort = this.computeMerchantEscortVector();
          desiredVX = escort.desiredVX;
          desiredVY = escort.desiredVY;
          desiredAngle = escort.desiredAngle;
          effectiveMaxSpeed = escort.effectiveMaxSpeed;
          this.combatTarget = null;
          this.combatDistance = Infinity;
          this.combatAimAngleRate = 0;
        } else {
          if (Math.random() < dt * 0.42) {
            this.wanderAngle += randomBetween(-0.5, 0.5);
          }

          desiredVX = squad.avgVX * 0.22 + Math.cos(this.wanderAngle) * this.squadCruiseSpeed;
          desiredVY = squad.avgVY * 0.22 + Math.sin(this.wanderAngle) * this.squadCruiseSpeed;
          desiredAngle = Math.atan2(desiredVY, desiredVX);
          effectiveMaxSpeed = this.maxCruiseSpeed * 0.9;
          this.combatTarget = null;
          this.combatDistance = Infinity;
          this.combatAimAngleRate = 0;
        }

        desiredVX += squad.x * 0.38 + avoid.x + dodge.x;
        desiredVY += squad.y * 0.38 + avoid.y + dodge.y;

        const steer = clampVectorMagnitude(
          (desiredVX - this.vx) * 3.2,
          (desiredVY - this.vy) * 3.2,
          this.maxAcceleration + avoid.extraAccel * 0.15
        );
        this.applyThrustAcceleration(steer.x, steer.y, dt, { intensityScale: 0.86, countRate: 10, angleVariance: 0.66, speed: 36, speedVariance: 16, spawnRadiusScale: 0.76, colorVariance: 18 });

        const velocity = clampVectorMagnitude(this.vx, this.vy, effectiveMaxSpeed);
        this.vx = velocity.x;
        this.vy = velocity.y;

        if (!enemy && Math.hypot(this.vx, this.vy) > 0.001) {
          desiredAngle = Math.atan2(this.vy, this.vx);
        }

        this.updateAimRotation(dt, desiredAngle, desiredAngleRate, enemy ? 4.8 : 4.2);
      }

      // Actualiza el estado interno usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      update(dt) {
        this.updateAutopilot(dt);
        super.update(dt);
      }

      // Dibuja el estado interno en el contexto de render correspondiente.
      draw(ctx, camera) {
        const sx = this.x - camera.x;
        const sy = this.y - camera.y;

        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(this.angle);
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 1.8;

        ctx.beginPath();
        ctx.moveTo(this.radius * 1.14, 0);
        ctx.lineTo(this.radius * 0.12, -this.radius * 0.46);
        ctx.lineTo(-this.radius * 0.84, -this.radius * 0.42);
        ctx.lineTo(-this.radius * 0.34, 0);
        ctx.lineTo(-this.radius * 0.84, this.radius * 0.42);
        ctx.lineTo(this.radius * 0.12, this.radius * 0.46);
        ctx.closePath();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-this.radius * 0.18, -this.radius * 0.72);
        ctx.lineTo(this.radius * 0.2, -this.radius * 0.12);
        ctx.moveTo(-this.radius * 0.18, this.radius * 0.72);
        ctx.lineTo(this.radius * 0.2, this.radius * 0.12);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(-this.radius * 0.08, 0, this.radius * 0.2, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
      }
    }

          const dx = target.x - this.x;
          const dy = target.y - this.y;

          const dx = coinTarget.x - this.x;

          desiredVX = coinTarget.vx + dx * 2.25;
          desiredVY = coinTarget.vy + dy * 2.25;
          targetAngle = Math.atan2(dy, dx);
          maxAccel = Math.max(maxAccel, 92);
          effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, 188);

          this.combatDistance = Infinity;
          this.combatAimAngleRate = 0;
        } else if (scrapTarget) {
          const dx = scrapTarget.x - this.x;
          const dy = scrapTarget.y - this.y;
          const dist = Math.max(0.001, Math.hypot(dx, dy));
          const nx = dx / dist;

          const desiredDistance = scrapTarget.radius + 140;
          const approach = clamp((dist - desiredDistance) * 0.24, -44, 58);
          desiredVX = scrapTarget.vx + nx * approach;
          desiredVY = scrapTarget.vy + ny * approach;
          targetAngle = this.updateCombatAim(scrapTarget);
          maxAccel = Math.max(maxAccel, 80);
          effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, 176);
          this.combatTarget = scrapTarget;
          this.combatDistance = dist;
          this.targetPreference = "scrap";
        } else {
          this.combatTarget = null;
          this.combatDistance = Infinity;
          this.combatAimAngleRate = 0;
          this.wanderRetargetTimer -= dt;
          if (this.wanderRetargetTimer <= 0 || Math.random() < dt * 0.16) {
            this.wanderRetargetTimer = randomBetween(1.8, 3.5);
            this.wanderAngle += randomBetween(-1.0, 1.0);
          }

          const wanderSpeed = this.maxCruiseSpeed * 0.7;
          desiredVX = Math.cos(this.wanderAngle) * wanderSpeed;

        desiredVX += grouping.x * 0.6;

        const rawSteerX = (desiredVX - this.vx) * 2.35 + avoidance.x * 1.2;
        const rawSteerY = (desiredVY - this.vy) * 2.35 + avoidance.y * 1.2;

        this.vx = velocity.x;
        this.vy = velocity.y;

        if (!this.combatTarget && !coinTarget && Math.hypot(this.vx, this.vy) > 0.001) {
          targetAngle = Math.atan2(this.vy, this.vx);
        }

        this.angle += wrapAngle(targetAngle - this.angle) * clamp(dt * (this.combatTarget ? 7.2 : 4.2), 0, 1);
        this.angularVelocity = 0;
      }

          return false;
        }

        const maxDistance = this.getAsteroidReservationDistanceLimit() + Math.max(0, asteroid.radius ?? 0);
        return distanceSquared(this.x, this.y, asteroid.x, asteroid.y) <= maxDistance * maxDistance;
      }

      // Devuelve cuantas reservas activas tiene un asteroide concreto.
      getAsteroidReservationCount(asteroid) {
        this.pruneInterceptorAsteroidReservations();
        return this.interceptorAsteroidReservations.get(asteroid)?.size ?? 0;
      }

      // Devuelve el asteroide reservado actualmente para un interceptor concreto.
      getReservedAsteroidForInterceptor(interceptor) {
        this.pruneInterceptorAsteroidReservations();
        for (const [asteroid, owners] of this.interceptorAsteroidReservations) {
          if (owners.has(interceptor)) {
            return asteroid;
          }
        }
        return null;
      }

      // Libera la reserva de un asteroide concreto, opcionalmente validando el interceptor esperado.
      releaseAsteroidReservation(asteroid, interceptor = null) {
        if (!asteroid) {
          return false;
        }

        const owners = this.interceptorAsteroidReservations.get(asteroid);
        if (!owners || owners.size <= 0) {
          return false;
        }

        if (!interceptor) {
          this.interceptorAsteroidReservations.delete(asteroid);
          return true;
        }

        if (!owners.has(interceptor)) {
          return false;
        }

        owners.delete(interceptor);
        if (owners.size <= 0) {
          this.interceptorAsteroidReservations.delete(asteroid);
        }
        return true;
      }

      // Libera cualquier asteroide reservado por un interceptor concreto.
      releaseAsteroidReservationsForInterceptor(interceptor, keepAsteroid = null) {
        if (!interceptor) {
          return;
        }

        for (const [asteroid, owners] of this.interceptorAsteroidReservations) {
          if (asteroid === keepAsteroid) {
            continue;
          }
          if (!owners.has(interceptor)) {
            continue;
          }

          owners.delete(interceptor);
          if (owners.size <= 0) {
            this.interceptorAsteroidReservations.delete(asteroid);
          }
        }
      }

      // Intenta reservar un asteroide para un interceptor del carrier respetando su cupo, salvo que se permita sobreasignar.
      tryReserveAsteroid(asteroid, interceptor, allowOverflow = false) {
        if (!asteroid || asteroid.isRemoved || asteroid.kind !== "asteroid" || !interceptor || interceptor.homeCarrier !== this) {
          return null;
        }

        this.pruneInterceptorAsteroidReservations();
        const capacity = this.getAsteroidReservationCapacity(asteroid);
        let owners = this.interceptorAsteroidReservations.get(asteroid);

        if (!owners) {
          owners = new Set();
          this.interceptorAsteroidReservations.set(asteroid, owners);
        }

        if (owners.has(interceptor)) {
          this.releaseAsteroidReservationsForInterceptor(interceptor, asteroid);
          return asteroid;
        }

        if (!allowOverflow && owners.size >= capacity) {
          return null;
        }

        this.releaseAsteroidReservationsForInterceptor(interceptor, asteroid);
        owners.add(interceptor);
        return asteroid;
      }

      // Selecciona un objetivo de mineria para un interceptor usando las reservas del carrier.
      chooseMiningTargetForInterceptor(interceptor) {

        }

        const currentReservation = this.getReservedAsteroidForInterceptor(interceptor);
        if (this.isAsteroidReservationValid(currentReservation)) {
          return currentReservation;
        }

        this.releaseAsteroidReservationsForInterceptor(interceptor);

        const bodies = this.getPerceptionSnapshot().bodies;
        const asteroidSenseRadius = this.getAsteroidReservationDistanceLimit();
        const asteroidSenseRadiusSq = asteroidSenseRadius * asteroidSenseRadius;
        let bestAvailableAsteroid = null;
        let bestAvailableScore = Infinity;
        let bestOverflowAsteroid = null;
        let bestOverflowScore = Infinity;

        for (let i = 0; i < bodies.length; i++) {
          const body = bodies[i];
          if (!this.isAsteroidReservationValid(body)) {
            continue;
          }

          const carrierDx = body.x - this.x;
          const carrierDy = body.y - this.y;
          const carrierDistSq = carrierDx * carrierDx + carrierDy * carrierDy;
          if (!(carrierDistSq > 0) || carrierDistSq > asteroidSenseRadiusSq) {
            continue;
          }

          const interceptorDx = body.x - interceptor.x;
          const interceptorDy = body.y - interceptor.y;
          const interceptorDist = Math.hypot(interceptorDx, interceptorDy);
          const carrierSurfaceDist = Math.max(0, Math.sqrt(carrierDistSq) - Math.max(0, body.radius ?? 0));
          const capacity = this.getAsteroidReservationCapacity(body);
          const reservationCount = this.getAsteroidReservationCount(body);
          const score = carrierSurfaceDist + reservationCount * 28 + interceptorDist * 0.12;

          if (reservationCount < capacity) {
            if (score < bestAvailableScore) {
              bestAvailableScore = score;
              bestAvailableAsteroid = body;
            }
          } else if (score < bestOverflowScore) {
            bestOverflowScore = score;
            bestOverflowAsteroid = body;
          }
        }

        if (bestAvailableAsteroid) {
          return this.tryReserveAsteroid(bestAvailableAsteroid, interceptor, false);
        }

        if (bestOverflowAsteroid) {
          return this.tryReserveAsteroid(bestOverflowAsteroid, interceptor, true);
        }

        return null;
      }

      // Devuelve la cantidad de interceptores activos calculada a partir del estado y los parametros recibidos.
      getActiveInterceptorCount() {
        this.pruneActiveInterceptors();
        return this.activeInterceptors.size;
      }

      // Devuelve la cantidad total de interceptores vinculados al carrier calculada a partir del estado y los parametros recibidos.
      getTotalInterceptorCount() {

      }

      // Registra que el carrier recogio monedas para fabricar mas interceptores.

      // Recupera un interceptor que regreso al carrier, transfiere su carga y lo vuelve a guardar reparado.

        interceptor._storedByCarrier = true;
        this.aiWorld.removeBody(interceptor);
        return true;
      }

        }

        this._carrierDestroyedHandled = true;
        this.pruneActiveInterceptors();
        this.setInterceptorOrder("dock", null);

        for (const interceptor of [...this.activeInterceptors]) {

            interceptor.markAbandoned(randomBetween(16, 26));
          }
        }
        this.activeInterceptors.clear();
        this.interceptorCoinReservations.clear();
        this.interceptorAsteroidReservations.clear();

        const storedCount = this.interceptorInventory;

          if (!spawned) {
            break;
          }
        }

      }

      // Actualiza el piloto automatico usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.

        this.pruneActiveInterceptors();

        this.isOrbitingPlanet = false;

        const snapshot = this.getPerceptionSnapshot();
        const miningTarget = snapshot.combatAsteroid?.target ?? null;
        const miningAimAngle = snapshot.combatAsteroid?.aimAngle ?? this.angle;
        const miningDistance = snapshot.combatAsteroid?.distance ?? Infinity;
        const enemyTarget = snapshot.combatEnemy?.target ?? null;
        const enemyDistance = snapshot.combatEnemy?.distance ?? Infinity;
        const coinTarget = this.chooseCoinTarget();
        const coinDistance = coinTarget ? Math.hypot(coinTarget.x - this.x, coinTarget.y - this.y) : Infinity;
        const shouldCollectCoin = !!coinTarget && (!miningTarget || coinDistance <= Math.max(this.coinMagnetRadius * 1.9, 320) || miningDistance <= (miningTarget.radius + this.asteroidApproachDistance + 120));
        const grouping = this.computeAllyGrouping();
        const avoidance = this.computeAvoidance();
        const attackTarget = enemyTarget && enemyDistance <= Math.max(this.enemySenseRadius, this.interceptorDefenseRadius) ? enemyTarget : null;

        if (attackTarget) {

        } else {

        if (this.shouldLaunchInterceptors() && this.interceptorInventory > 0) {
          this.interceptorLaunchAccumulator += dt * this.interceptorLaunchRate;

            this.interceptorLaunchAccumulator -= 1;
            launchGuard++;

        } else {
          this.interceptorLaunchAccumulator = Math.min(this.interceptorLaunchAccumulator, 0.5);
        }

        let desiredVX = this.vx;
        let desiredVY = this.vy;
        let targetAngle = this.angle;
        let maxAccel = this.maxThrustAcceleration;
        let effectiveMaxSpeed = this.maxCruiseSpeed;
        let activeCombatTarget = null;

        if (shouldCollectCoin) {
          const dx = coinTarget.x - this.x;
          const dy = coinTarget.y - this.y;
          desiredVX = coinTarget.vx + dx * 2.4;
          desiredVY = coinTarget.vy + dy * 2.4;
          targetAngle = Math.atan2(dy, dx);
          maxAccel = Math.max(maxAccel, 66);
          effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, 162);
          this.targetPreference = "coin";
          this.combatDistance = Infinity;
        } else if (miningTarget) {
          const dx = miningTarget.x - this.x;
          const dy = miningTarget.y - this.y;
          const dist = Math.max(0.001, Math.hypot(dx, dy));
          const nx = dx / dist;
          const ny = dy / dist;
          const desiredDistance = miningTarget.radius + this.asteroidApproachDistance;
          const approach = clamp((dist - desiredDistance) * 0.24, -34, 72);
          desiredVX = miningTarget.vx + nx * approach;
          desiredVY = miningTarget.vy + ny * approach;
          targetAngle = miningAimAngle;
          activeCombatTarget = miningTarget;
          this.combatDistance = miningDistance;
          this.targetPreference = "asteroid";
          maxAccel = Math.max(maxAccel, 60);
          effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, 156);
        } else if (attackTarget) {
          const dx = this.x - attackTarget.x;
          const dy = this.y - attackTarget.y;
          const dist = Math.max(0.001, Math.hypot(dx, dy));
          const nx = dx / dist;
          const ny = dy / dist;
          const tx = -ny * this.orbitDirection;
          const ty = nx * this.orbitDirection;
          const retreat = clamp((this.enemyStandoffDistance - dist) * 0.32, -24, 78);
          desiredVX = attackTarget.vx + nx * retreat + tx * 20;
          desiredVY = attackTarget.vy + ny * retreat + ty * 20;
          effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, Math.hypot(attackTarget.vx, attackTarget.vy) + 42);
          maxAccel = Math.max(maxAccel, 62);

          if (dist <= this.weaponRange * 0.82) {
            targetAngle = this.updateCombatAim(attackTarget);
            activeCombatTarget = attackTarget;
            this.combatDistance = dist;
            this.targetPreference = "enemy";
          } else {
            this.combatDistance = Infinity;
            this.targetPreference = "retreat";
            targetAngle = Math.atan2(attackTarget.y - this.y, attackTarget.x - this.x);
          }
        } else {
          this.combatDistance = Infinity;
          this.targetPreference = "wander";
          this.wanderRetargetTimer -= dt;
          if (this.wanderRetargetTimer <= 0 || Math.random() < dt * 0.14) {
            this.wanderRetargetTimer = randomBetween(2.4, 4.2);
            this.wanderAngle += randomBetween(-0.7, 0.7);
          }

          const wanderSpeed = this.maxCruiseSpeed * 0.62;
          desiredVX = Math.cos(this.wanderAngle) * wanderSpeed;
          desiredVY = Math.sin(this.wanderAngle) * wanderSpeed;
          targetAngle = Math.atan2(desiredVY, desiredVX);
        }

        this.combatTarget = activeCombatTarget;
        this.combatAimAngle = activeCombatTarget ? targetAngle : Math.atan2(desiredVY || Math.sin(this.angle), desiredVX || Math.cos(this.angle));
        this.combatAimAngleRate = activeCombatTarget ? (this.combatAimAngleRate ?? 0) : 0;

        if (this.longRangeReactionTimer > 0) {
          desiredVX += this.longRangeReactionX * 0.18;
          desiredVY += this.longRangeReactionY * 0.18;
          maxAccel = Math.max(maxAccel, 66);
        }

        desiredVX += grouping.x * 0.18;
        desiredVY += grouping.y * 0.18;

        const rawSteerX = (desiredVX - this.vx) * 2.0 + avoidance.x * 1.15;
        const rawSteerY = (desiredVY - this.vy) * 2.0 + avoidance.y * 1.15;
        maxAccel = Math.max(maxAccel, Math.min(this.maxPlanetMatchAcceleration, this.maxThrustAcceleration + avoidance.extraAccel * 0.54));

        const steer = clampVectorMagnitude(rawSteerX, rawSteerY, maxAccel);
        this.applyThrustAcceleration(steer.x, steer.y, dt, { intensityScale: 0.82, countRate: 10, angleVariance: 0.74, speed: 32, speedVariance: 15, spawnRadiusScale: 0.82, color: this.color, colorVariance: 16 });

        const velocity = clampVectorMagnitude(this.vx, this.vy, effectiveMaxSpeed);
        this.vx = velocity.x;
        this.vy = velocity.y;

        if (!activeCombatTarget && Math.hypot(this.vx, this.vy) > 0.001) {
          targetAngle = Math.atan2(this.vy, this.vx);
        }

        this.angle += wrapAngle(targetAngle - this.angle) * clamp(dt * (activeCombatTarget ? 3.6 : 2.2), 0, 1);
        this.angularVelocity = 0;
      }

      // Dibuja el estado interno en el contexto de render correspondiente.
      draw(ctx, camera) {
        const sx = this.x - camera.x;
        const sy = this.y - camera.y;

        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(this.angle);
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2.2;

        ctx.beginPath();
        ctx.moveTo(this.radius * 1.12, 0);
        ctx.lineTo(this.radius * 0.18, -this.radius * 0.56);
        ctx.lineTo(-this.radius * 0.66, -this.radius * 0.64);
        ctx.lineTo(-this.radius * 0.98, -this.radius * 0.26);
        ctx.lineTo(-this.radius * 0.98, this.radius * 0.26);
        ctx.lineTo(-this.radius * 0.66, this.radius * 0.64);
        ctx.lineTo(this.radius * 0.18, this.radius * 0.56);
        ctx.closePath();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-this.radius * 0.2, -this.radius * 0.76);
        ctx.lineTo(this.radius * 0.12, -this.radius * 0.16);
        ctx.moveTo(-this.radius * 0.2, this.radius * 0.76);
        ctx.lineTo(this.radius * 0.12, this.radius * 0.16);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(-this.radius * 0.04, 0, this.radius * 0.22, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-this.radius * 0.56, -this.radius * 0.2);
        ctx.lineTo(-this.radius * 0.3, -this.radius * 0.2);
        ctx.moveTo(-this.radius * 0.56, this.radius * 0.2);
        ctx.lineTo(-this.radius * 0.3, this.radius * 0.2);
        ctx.stroke();

        ctx.restore();
      }
    }

        }
        this.abandoned = true;
        this.returnSignal = false;
        this.homeCarrier = null;
        this.combatTarget = null;
        this.combatDistance = Infinity;
        this.combatAimAngleRate = 0;
        this.abandonTimer = Math.max(this.abandonTimer, duration);
      }

      // Libera cualquier moneda que este interceptor tuviera reservada en su carrier.
      releaseCarrierCoinReservations() {
        if (this.homeCarrier && typeof this.homeCarrier.releaseCoinReservationsForInterceptor === "function") {
          this.homeCarrier.releaseCoinReservationsForInterceptor(this);
        }
      }

      // Libera cualquier asteroide que este interceptor tuviera reservado en su carrier.
      releaseCarrierAsteroidReservations() {
        if (this.homeCarrier && typeof this.homeCarrier.releaseAsteroidReservationsForInterceptor === "function") {
          this.homeCarrier.releaseAsteroidReservationsForInterceptor(this);
        }
      }

      // Pide al carrier un objetivo de mineria respetando su sistema de reservas.
      chooseMiningTarget() {
        if (!this.isHomeCarrierValid() || typeof this.homeCarrier.chooseMiningTargetForInterceptor !== "function") {
          return null;
        }
        return this.homeCarrier.chooseMiningTargetForInterceptor(this);
      }

      // Selecciona una moneda libre o ya reservada para este interceptor usando el registro del carrier.
      chooseCoinTarget() {
        if (!(this.coinSenseRadius > 0) || !this.isHomeCarrierValid()) {
          return null;
        }

        const carrier = this.homeCarrier;
        const currentReservation = typeof carrier.getReservedCoinForInterceptor === "function"
          ? carrier.getReservedCoinForInterceptor(this)
          : null;
        if (currentReservation && !currentReservation.isRemoved) {
          return currentReservation;
        }

        const coinSenseRadiusSq = this.coinSenseRadius * this.coinSenseRadius;
        const bodies = this.getPerceptionSnapshot().bodies;
        let bestCoin = null;
        let bestScore = Infinity;

        for (let i = 0; i < bodies.length; i++) {
          const body = bodies[i];
          if (!body || body.isRemoved || body.kind !== "coin") {
            continue;
          }

          const dx = body.x - this.x;
          const dy = body.y - this.y;
          const distSq = dx * dx + dy * dy;
          if (!(distSq > 0) || distSq > coinSenseRadiusSq) {
            continue;
          }

          const owner = typeof carrier.getCoinReservationOwner === "function"
            ? carrier.getCoinReservationOwner(body)
            : null;
          if (owner && owner !== this) {
            continue;
          }

          const dist = Math.sqrt(distSq);
          const relSpeed = Math.hypot(body.vx - this.vx, body.vy - this.vy);
          const score = dist + relSpeed * 0.12 - Math.max(1, body.value ?? 1) * 16;
          if (score < bestScore) {
            bestScore = score;
            bestCoin = body;
          }
        }

        if (!bestCoin || typeof carrier.tryReserveCoin !== "function") {
          return null;
        }

        return carrier.tryReserveCoin(bestCoin, this);
      }

      // Actualiza los contactos prolongados con asteroides para habilitar un modo temporal de liberacion.
      updateAsteroidTrapState(dt) {
        const contactTimers = this._asteroidContactTimers instanceof Map
          ? this._asteroidContactTimers
          : new Map();
        this._asteroidContactTimers = contactTimers;

        const bodies = this.getPerceptionSnapshot().bodies;
        const touchedAsteroids = [];
        const contactPadding = 2.5;

        for (let i = 0; i < bodies.length; i++) {
          const body = bodies[i];
          if (!body || body.isRemoved || body.kind !== "asteroid") {
            continue;
          }

          const dx = body.x - this.x;
          const dy = body.y - this.y;
          const contactRange = this.colliderRadius + (body.colliderRadius ?? body.radius ?? 0) + contactPadding;
          if (dx * dx + dy * dy > contactRange * contactRange) {
            continue;
          }

          touchedAsteroids.push(body);
          contactTimers.set(body, (contactTimers.get(body) ?? 0) + dt);
        }

        for (const asteroid of [...contactTimers.keys()]) {
          if (!touchedAsteroids.includes(asteroid)) {
            contactTimers.delete(asteroid);
          }
        }

        const currentBreakoutTarget = this.breakoutAsteroid;
        if (currentBreakoutTarget && currentBreakoutTarget.isRemoved) {
          this.breakoutAsteroid = null;
        }

        if (this.breakoutAsteroid && touchedAsteroids.includes(this.breakoutAsteroid)) {
          return this.breakoutAsteroid;
        }

        let bestBreakoutAsteroid = null;
        let bestScore = Infinity;
        const carrier = this.isHomeCarrierValid() ? this.homeCarrier : null;

        for (let i = 0; i < touchedAsteroids.length; i++) {
          const asteroid = touchedAsteroids[i];
          const contactTime = contactTimers.get(asteroid) ?? 0;
          if (contactTime < this.asteroidTrapContactThreshold) {
            continue;
          }

          const referenceX = carrier ? carrier.x : this.x;
          const referenceY = carrier ? carrier.y : this.y;
          const distToCarrier = Math.hypot(asteroid.x - referenceX, asteroid.y - referenceY);
          const score = distToCarrier - Math.max(0, asteroid.radius ?? 0);
          if (score < bestScore) {
            bestScore = score;
            bestBreakoutAsteroid = asteroid;
          }
        }

        this.breakoutAsteroid = bestBreakoutAsteroid;
        return this.breakoutAsteroid;
      }

      // Indica si el interceptor debe entrar en modo de liberacion por contacto prolongado con asteroides.
      getBreakoutAsteroid(dt = 0) {
        if (!(dt > 0)) {
          return this.breakoutAsteroid && !this.breakoutAsteroid.isRemoved ? this.breakoutAsteroid : null;
        }
        return this.updateAsteroidTrapState(dt);
      }

      // Actualiza el piloto automatico usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      updateAutopilot(dt) {
        if (!this.aiWorld) {
          return;
        }

        if (!this.abandoned && !this.isHomeCarrierValid()) {
          this.markAbandoned(randomBetween(14, 22));
        }

        if (this.abandoned && this.abandonTimer > 0) {
          this.abandonTimer = Math.max(0, this.abandonTimer - dt);
          if (this.abandonTimer <= 0) {
            this.aiWorld.removeBody(this);
            return;
          }
        }

        const directive = this.getCarrierDirective();
        const breakoutAsteroid = this.abandoned ? null : this.getBreakoutAsteroid(dt);

        if (!this.abandoned && this.isHomeCarrierValid()) {
          this.returnSignal = directive.mode === "dock" || !!this.homeCarrier.interceptorReturnSignal;
        }

        if (this.abandoned || this.shouldReturnHome() || directive.mode !== "mine") {
          this.releaseCarrierCoinReservations();
          this.releaseCarrierAsteroidReservations();
        }

        const squad = this.computeSquadState();
        const avoid = this.computeHazardAvoidance();
        const dodge = this.computeProjectileDodge(1.12);
        let desiredVX = this.vx;
        let desiredVY = this.vy;
        let desiredAngle = this.angle;
        let desiredAngleRate = 0;
        let effectiveMaxSpeed = this.maxCruiseSpeed;

        if (this.abandoned) {
          if (Math.random() < dt * 0.72) {
            this.wanderAngle += randomBetween(-1.2, 1.2);
          }
          desiredVX = Math.cos(this.wanderAngle) * this.squadCruiseSpeed + squad.avgVX * 0.18;
          desiredVY = Math.sin(this.wanderAngle) * this.squadCruiseSpeed + squad.avgVY * 0.18;
          desiredAngle = Math.atan2(desiredVY, desiredVX);
          this.combatTarget = null;
          this.combatDistance = Infinity;
          this.combatAimAngleRate = 0;
        } else if (breakoutAsteroid) {
          const target = breakoutAsteroid;
          const dx = target.x - this.x;
          const dy = target.y - this.y;
          const dist = Math.max(0.001, Math.hypot(dx, dy));
          const nx = dx / dist;
          const ny = dy / dist;
          const tx = -ny * this.orbitDirection;
          const ty = nx * this.orbitDirection;
          const standoff = target.radius + 26;
          const approach = clamp((dist - standoff) * 1.65, -190, 170);
          desiredVX = target.vx + nx * approach + tx * 34;
          desiredVY = target.vy + ny * approach + ty * 34;
          desiredAngle = this.updateCombatAim(target);
          desiredAngleRate = this.combatAimAngleRate ?? 0;
          effectiveMaxSpeed = Math.max(this.maxCruiseSpeed * 0.72, Math.hypot(target.vx, target.vy) + 90);
        } else if (this.shouldReturnHome()) {
          const carrier = this.homeCarrier;
          const dx = carrier.x - this.x;
          const dy = carrier.y - this.y;
          const dist = Math.max(0.001, Math.hypot(dx, dy));
          const nx = dx / dist;
          const ny = dy / dist;
          const desiredDistance = Math.max(4, carrier.radius * 0.22);
          const approach = clamp((dist - desiredDistance) * 2.25, -40, 320);
          desiredVX = carrier.vx + nx * approach;
          desiredVY = carrier.vy + ny * approach;
          desiredAngle = Math.atan2(dy, dx);
          effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, Math.hypot(carrier.vx, carrier.vy) + 140);
          this.combatTarget = null;
          this.combatDistance = Infinity;
          this.combatAimAngleRate = 0;
        } else if (directive.mode === "attack" && directive.target) {
          const target = directive.target;
          const dx = target.x - this.x;
          const dy = target.y - this.y;
          const dist = Math.max(0.001, Math.hypot(dx, dy));
          const nx = dx / dist;
          const ny = dy / dist;
          const tx = -ny * this.orbitDirection;
          const ty = nx * this.orbitDirection;
          const standoff = target.radius + 26 + Math.abs(this.formationLane) * 3;
          const approach = clamp((dist - standoff) * 1.75, -220, 260);
          desiredVX = target.vx + nx * approach + tx * 165;
          desiredVY = target.vy + ny * approach + ty * 165;
          desiredAngle = this.updateCombatAim(target);
          desiredAngleRate = this.combatAimAngleRate ?? 0;
          effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, Math.hypot(target.vx, target.vy) + 165);
        } else if (directive.mode === "mine") {
          const coinTarget = this.hasCargo() ? null : this.chooseCoinTarget();
          const miningTarget = this.hasCargo() ? null : (this.chooseMiningTarget() ?? directive.target ?? null);
          if (coinTarget) {
            const dx = coinTarget.x - this.x;
            const dy = coinTarget.y - this.y;
            const dist = Math.max(0.001, Math.hypot(dx, dy));
            desiredVX = coinTarget.vx + (dx / dist) * clamp(dist * 3.0, 120, 380);
            desiredVY = coinTarget.vy + (dy / dist) * clamp(dist * 3.0, 120, 380);
            desiredAngle = Math.atan2(dy, dx);
            effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, Math.hypot(coinTarget.vx, coinTarget.vy) + 180);
            this.combatTarget = null;
            this.combatDistance = Infinity;
            this.combatAimAngleRate = 0;
          } else if (miningTarget) {
            const target = miningTarget;
            const dx = target.x - this.x;
            const dy = target.y - this.y;
            const dist = Math.max(0.001, Math.hypot(dx, dy));
            const nx = dx / dist;
            const ny = dy / dist;
            const tx = -ny * this.orbitDirection;
            const ty = nx * this.orbitDirection;
            const standoff = target.radius + 46 + Math.abs(this.formationLane) * 4;
            const approach = clamp((dist - standoff) * 1.9, -220, 280);
            desiredVX = target.vx + nx * approach + tx * 78;
            desiredVY = target.vy + ny * approach + ty * 78;
            desiredAngle = this.updateCombatAim(target);
            desiredAngleRate = this.combatAimAngleRate ?? 0;
            effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, Math.hypot(target.vx, target.vy) + 150);
          } else {
            const carrier = this.homeCarrier;
            const carrierSpeed = Math.hypot(carrier.vx, carrier.vy);
            const heading = carrierSpeed > 10 ? Math.atan2(carrier.vy, carrier.vx) : carrier.angle;
            const laneSign = (this.id % 2 === 0 ? 1 : -1) * this.orbitDirection;
            const sideOffset = laneSign * (carrier.radius * 0.78 + 20 + this.formationLane * 6);
            const backOffset = carrier.radius + 32 + Math.abs(this.formationLane) * 5;
            const desiredX = carrier.x - Math.cos(heading) * backOffset + Math.cos(heading + Math.PI * 0.5) * sideOffset;
            const desiredY = carrier.y - Math.sin(heading) * backOffset + Math.sin(heading + Math.PI * 0.5) * sideOffset;
            desiredVX = carrier.vx + (desiredX - this.x) * 2.6;
            desiredVY = carrier.vy + (desiredY - this.y) * 2.6;
            desiredAngle = Math.atan2(carrier.y - this.y, carrier.x - this.x);
            effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, carrierSpeed + 110);
            this.combatTarget = null;
            this.combatDistance = Infinity;
            this.combatAimAngleRate = 0;
          }
        } else {
          const carrier = this.homeCarrier;
          const carrierSpeed = Math.hypot(carrier.vx, carrier.vy);
          const heading = carrierSpeed > 10 ? Math.atan2(carrier.vy, carrier.vx) : carrier.angle;
          const laneSign = (this.id % 2 === 0 ? 1 : -1) * this.orbitDirection;
          const sideOffset = laneSign * (carrier.radius * 0.78 + 20 + this.formationLane * 6);
          const backOffset = carrier.radius + 32 + Math.abs(this.formationLane) * 5;
          const desiredX = carrier.x - Math.cos(heading) * backOffset + Math.cos(heading + Math.PI * 0.5) * sideOffset;
          const desiredY = carrier.y - Math.sin(heading) * backOffset + Math.sin(heading + Math.PI * 0.5) * sideOffset;
          desiredVX = carrier.vx + (desiredX - this.x) * 2.6;
          desiredVY = carrier.vy + (desiredY - this.y) * 2.6;
          desiredAngle = Math.atan2(carrier.y - this.y, carrier.x - this.x);
          effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, carrierSpeed + 110);
          this.combatTarget = null;
          this.combatDistance = Infinity;
          this.combatAimAngleRate = 0;
        }

        desiredVX += squad.x * 0.24 + avoid.x + dodge.x;
        desiredVY += squad.y * 0.24 + avoid.y + dodge.y;

        const steer = clampVectorMagnitude(
          (desiredVX - this.vx) * 3.8,
          (desiredVY - this.vy) * 3.8,
          this.maxAcceleration + avoid.extraAccel * 0.16
        );
        this.applyThrustAcceleration(steer.x, steer.y, dt, { intensityScale: 0.96, countRate: 12, angleVariance: 0.74, speed: 38, speedVariance: 18, spawnRadiusScale: 0.76, color: this.color, colorVariance: 14 });

        const velocity = clampVectorMagnitude(this.vx, this.vy, effectiveMaxSpeed);
        this.vx = velocity.x;
        this.vy = velocity.y;

        if (!this.combatTarget && Math.hypot(this.vx, this.vy) > 0.001) {
          desiredAngle = Math.atan2(this.vy, this.vx);
        }

        this.updateAimRotation(dt, desiredAngle, desiredAngleRate, this.combatTarget ? 5.0 : 4.4);
      }

      // Actualiza el estado interno usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      update(dt) {
        this.updateAutopilot(dt);
        super.update(dt);
      }

      // Dibuja el estado interno en el contexto de render correspondiente.
      draw(ctx, camera) {
        const sx = this.x - camera.x;
        const sy = this.y - camera.y;

        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(this.angle);
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 1.6;

        ctx.beginPath();
        ctx.moveTo(this.radius * 1.12, 0);
        ctx.lineTo(-this.radius * 0.6, -this.radius * 0.68);
        ctx.lineTo(-this.radius * 0.24, 0);
        ctx.lineTo(-this.radius * 0.6, this.radius * 0.68);
        ctx.closePath();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-this.radius * 0.18, -this.radius * 0.38);
        ctx.lineTo(this.radius * 0.32, 0);
        ctx.lineTo(-this.radius * 0.18, this.radius * 0.38);
        ctx.stroke();

        ctx.restore();
      }
    }

    class FleaShip extends Ship {
      // Inicializa la instancia de FleaShip con las opciones y el estado base necesarios.
      constructor(options = {}) {
        super({
          radius: 9,
          colliderRadius: 9,
          mass: 4,
          bounciness: 0.0,
          color: "#ff8df5",
          kind: "flea",
          exertsGravity: false,
          receivesGravity: true,
          thrustPower: 620,
          brakePower: 610,
          angularAccel: 0,
          angularBrakeAccel: 0,
          fireRate: 0,
          projectileSpeed: 0,
          projectileSpread: 0,
          projectilesPerShot: 0,
          maxAmmo: 0,
          ammo: 0,
          maxFuel: Infinity,
          fuel: Infinity,
          fuelBurnRate: 0,

          hp: 1,

          ...options
        });

        this.aiPlayer = options.aiPlayer ?? null;
        this.schoolId = options.schoolId ?? 0;
        this.schoolCruiseSpeed = options.schoolCruiseSpeed ?? randomBetween(150, 210);
        this.maxCruiseSpeed = options.maxCruiseSpeed ?? randomBetween(420, 540);
        this.maxAcceleration = options.maxAcceleration ?? randomBetween(1250, 1650);
        this.enemySenseRadius = options.enemySenseRadius ?? 720;
        this.coinSenseRadius = options.coinSenseRadius ?? 420;
        this.scrapSenseRadius = options.scrapSenseRadius ?? 360;
        this.projectileSenseRadius = options.projectileSenseRadius ?? 260;
        this.personalSpace = options.personalSpace ?? 14;
        this.schoolSenseRadius = options.schoolSenseRadius ?? 360;
        this.preferredSchoolRadius = options.preferredSchoolRadius ?? 22;
        this.orbitDirection = options.orbitDirection ?? (Math.random() < 0.5 ? -1 : 1);
        this.schoolPhase = options.schoolPhase ?? 0;
        this.wanderAngle = options.wanderAngle ?? randomBetween(0, Math.PI * 2);
        this.targetEnemy = null;
        this.targetCoin = null;
        this._fleaPerceptionCache = null;
        this.perceptionRefreshTicks = options.perceptionRefreshTicks ?? (1 + (this.id & 1));
      }

      // Consume el combustible dentro de esta parte de la logica. Usa dt como delta de tiempo del frame.
      consumeFuel(dt, rate = this.fuelBurnRate) {
        return Math.max(0, dt);
      }

      // Devuelve el umbral de impacto speed el umbral calculado a partir del estado y los parametros recibidos.
      getCrashSpeedThreshold(baseCrashSpeed) {

      // Actualiza aicontext usando el estado actual y los parametros recibidos.
      setAIContext(world, player) {

      // Consulta los elementos cercanos dentro del rango o contexto indicado.

      // Calcula y cachea la lectura compartida del enjambre de pulgas para reutilizarla dentro del mismo tick.
      getPerceptionSnapshot() {
        const aiWorld = this.aiWorld;
        const frameId = aiWorld?.aiTickId ?? 0;
        const cached = this._fleaPerceptionCache;
        if (cached && cached.refreshUntilTick >= frameId) {
          return cached;
        }

        const maxRange = Math.max(1, this.enemySenseRadius, this.coinSenseRadius, this.scrapSenseRadius, this.projectileSenseRadius, this.schoolSenseRadius);
        const enemySenseRadiusSq = this.enemySenseRadius * this.enemySenseRadius;
        const coinSenseRadiusSq = this.coinSenseRadius * this.coinSenseRadius;
        const scrapSenseRadiusSq = this.scrapSenseRadius * this.scrapSenseRadius;
        const projectileSenseRadiusSq = this.projectileSenseRadius * this.projectileSenseRadius;
        const schoolSenseRadiusSq = this.schoolSenseRadius * this.schoolSenseRadius;

        let bestEnemy = null;
        let bestEnemyScore = Infinity;
        let bestCoin = null;
        let bestCoinScore = Infinity;
        let bestScrap = null;
        let bestScrapScore = Infinity;
        let separationX = 0;
        let separationY = 0;
        let alignmentX = 0;
        let alignmentY = 0;
        let centerX = this.x;
        let centerY = this.y;

        let shellY = 0;

        let dodgeY = 0;

          if (!(distSq > 1e-6)) return;
          let dist = 0;

          if (distSq <= enemySenseRadiusSq && isShipLike(body) && body.isAlive && this.getDispositionTo(body.faction) === "enemy") {

            const forwardX = Math.cos(body.angle);
            const forwardY = Math.sin(body.angle);
            const dirX = dx / dist;

            const frontalBias = Math.max(0, dirX * forwardX + dirY * forwardY);
            const score = dist + frontalBias * 180;
            if (score < bestEnemyScore) {
              bestEnemyScore = score;
              bestEnemy = body;
            }
          }

          if (body.kind === "coin" && distSq <= coinSenseRadiusSq) {
            if (!dist) dist = Math.sqrt(distSq);
            const score = dist + Math.hypot(body.vx - this.vx, body.vy - this.vy) * 0.2;
            if (score < bestCoinScore) {
              bestCoinScore = score;
              bestCoin = body;
            }
          }

          if (body.kind === "scrap" && distSq <= scrapSenseRadiusSq) {
            if (!dist) dist = Math.sqrt(distSq);
            const score = dist + Math.hypot(body.vx - this.vx, body.vy - this.vy) * 0.08;
            if (score < bestScrapScore) {
              bestScrapScore = score;
              bestScrap = body;
            }
          }

          if (distSq <= schoolSenseRadiusSq && body.kind === "flea" && body.faction === this.faction && body.schoolId === this.schoolId) {
            if (!dist) dist = Math.sqrt(distSq);
            count++;
            alignmentX += body.vx;
            alignmentY += body.vy;
            centerX += body.x;
            centerY += body.y;
            const spacingError = dist - this.preferredSchoolRadius;
            shellX += (dx / dist) * spacingError;
            shellY += (dy / dist) * spacingError;
            if (dist < this.personalSpace) {
              const push = (this.personalSpace - dist) / this.personalSpace;
              separationX -= (dx / dist) * push * 520;
              separationY -= (dy / dist) * push * 520;
            }
          }

          if (body.kind === "projectile" && body.owner !== this && distSq <= projectileSenseRadiusSq && (!body.faction || this.getDispositionTo(body.faction) === "enemy")) {
            if (!dist) dist = Math.sqrt(distSq);
            const speedSq = body.vx * body.vx + body.vy * body.vy;
            if (speedSq > 1e-6) {
              const speed = Math.sqrt(speedSq);
              const dirX = body.vx / speed;
              const dirY = body.vy / speed;
              const toMeX = -dx / dist;
              const toMeY = -dy / dist;
              const closing = dirX * toMeX + dirY * toMeY;
              if (closing >= 0.55) {

                const panic = (1 - dist / this.projectileSenseRadius) * (0.7 + closing * 0.7);

        });

          x: 0,
          y: 0,
          members: 1,
          centerX: this.x,
          centerY: this.y,
          avgVX: this.vx,

        } : (() => {

            members: count,
            centerX: schoolCenterX,
            centerY: schoolCenterY,
            avgVX,
            avgVY,
            compactness
          };
        })();

        const snapshot = { frameId, refreshUntilTick: frameId + this.perceptionRefreshTicks, bestEnemy, bestCoin, bestScrap, schooling, dodge: { x: dodgeX, y: dodgeY } };
        this._fleaPerceptionCache = snapshot;
        return snapshot;
      }

      // Devuelve disposition to calculado a partir del estado y los parametros recibidos.
      getDispositionTo(factionName) {
        if (!factionSystem || !factionName) return "neutral";
        return factionSystem.getDisposition(this.faction, factionName);
      }

      // Selecciona el objetivo enemigo el objetivo dentro de esta parte de la logica.
      chooseEnemyTarget() {
        return this.getPerceptionSnapshot().bestEnemy;
      }

      // Selecciona el objetivo de monedas el objetivo dentro de esta parte de la logica.
