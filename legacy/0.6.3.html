    const canvas = document.getElementById("game");

    // Ajusta el tamano interno del canvas para que coincida con la ventana visible.
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    // Calcula el tiempo de intercepcion para apuntar a un objetivo en movimiento.
    function solveInterceptTime(relX, relY, relVX, relVY, projectileSpeed, maxLeadTime = 2.25) {
      const speed = Math.max(1, projectileSpeed);
      const a = relVX * relVX + relVY * relVY - speed * speed;
      const b = 2 * (relX * relVX + relY * relVY);
      const c = relX * relX + relY * relY;
      const EPS = 1e-6;

      if (c <= EPS) {
        return 0;
      }

      if (Math.abs(a) < EPS) {
        if (Math.abs(b) < EPS) {
          return clamp(Math.sqrt(c) / speed, 0, maxLeadTime);
        }
        const t = -c / b;
        return t > 0 ? clamp(t, 0, maxLeadTime) : null;
      }

      const discriminant = b * b - 4 * a * c;
      if (discriminant < 0) {
        return null;
      }

      const sqrtDiscriminant = Math.sqrt(discriminant);
      const t1 = (-b - sqrtDiscriminant) / (2 * a);
      const t2 = (-b + sqrtDiscriminant) / (2 * a);
      let bestTime = Infinity;

      if (t1 > EPS) bestTime = Math.min(bestTime, t1);
      if (t2 > EPS) bestTime = Math.min(bestTime, t2);

      if (!Number.isFinite(bestTime)) {
        return null;
      }

      return clamp(bestTime, 0, maxLeadTime);
    }

    // Calcula la direccion de disparo con anticipacion hacia un objetivo en movimiento.
    function computeInterceptAim(relX, relY, relVX, relVY, projectileSpeed, leadScale = 1, maxLeadTime = 2.25) {
      const effectiveScale = Math.max(0, leadScale);
      const interceptTime = solveInterceptTime(relX, relY, relVX, relVY, projectileSpeed, maxLeadTime);
      const fallbackTime = clamp(Math.hypot(relX, relY) / Math.max(40, projectileSpeed), 0, maxLeadTime);
      const leadTime = (interceptTime ?? fallbackTime) * effectiveScale;
      return {
        leadTime,
        x: relX + relVX * leadTime,
        y: relY + relVY * leadTime
      };
    }

    // Estima la velocidad angular aparente de un objetivo respecto a un observador.
    function computeAngularRate(x, y, vx, vy) {
      const denom = x * x + y * y;
      if (denom <= 1e-6) {
        return 0;
      }
      return clamp((x * vy - y * vx) / denom, -12, 12);
    }

    // Combina prediccion y correccion angular para mejorar la punteria de combate.
    function computeAdaptiveCombatAim(ship, target, maxLeadTime = 1.85) {
      const relX = target.x - ship.x;
      const relY = target.y - ship.y;
      const relVX = target.vx - ship.vx;
      const relVY = target.vy - ship.vy;
      const dist = Math.hypot(relX, relY);
      const directAngle = Math.atan2(relY, relX);
      const intercept = computeInterceptAim(relX, relY, relVX, relVY, ship.projectileSpeed, ship.weaponAimLead ?? 1, maxLeadTime);
      const interceptAngle = Math.atan2(intercept.y, intercept.x);
      const closeRange = Math.max(target.radius + ship.radius + 56, ship.aimLeadCloseRange ?? 180);
      const farRange = Math.max(closeRange + 1, ship.aimLeadFarRange ?? Math.min((ship.weaponRange ?? 700) * 0.82, closeRange + 620));
      const distanceBlend = clamp((dist - closeRange) / (farRange - closeRange), 0, 1);
      const turnBlend = clamp((ship.maxAimAngularSpeed ?? 4.2) / 4.6, 0.58, 1);
      const leadBlend = distanceBlend * turnBlend;
      const aimAngle = directAngle + wrapAngle(interceptAngle - directAngle) * leadBlend;
      const directAngleRate = computeAngularRate(relX, relY, relVX, relVY);
      const interceptAngleRate = computeAngularRate(intercept.x, intercept.y, relVX, relVY);
      const aimAngleRate = directAngleRate + (interceptAngleRate - directAngleRate) * leadBlend;

      return {
        relX,
        relY,
        relVX,
        relVY,
        dist,
        directAngle,
        interceptAngle,
        directAngleRate,
        interceptAngleRate,
        leadBlend,
        angle: aimAngle,
        angleRate: aimAngleRate,
        x: Math.cos(aimAngle),
        y: Math.sin(aimAngle)
      };
    }


    // Calcula la intensidad visual de la estela de una bala a partir de su dano.
    function computeProjectileTrailRate(damage = 1) {
      const normalizedDamage = clamp(Number.isFinite(damage) ? damage : 1, 1, 6);
      return 2 + normalizedDamage * 4;
    }

    // Calcula el rango minimo de vida de las particulas de bala para un dano dado.
    function computeProjectileTrailLifetimeMin(damage = 1) {
      const normalizedDamage = clamp(Number.isFinite(damage) ? damage : 1, 1, 6);
      return 0.04 + normalizedDamage * 0.015;
    }

    // Calcula el rango maximo de vida de las particulas de bala para un dano dado.
    function computeProjectileTrailLifetimeMax(damage = 1) {
      const normalizedDamage = clamp(Number.isFinite(damage) ? damage : 1, 1, 6);
      return 0.09 + normalizedDamage * 0.045;
    }

    // Calcula el rango minimo de radio de las particulas de bala para un dano dado.
    function computeProjectileTrailRadiusMin(damage = 1) {
      const normalizedDamage = clamp(Number.isFinite(damage) ? damage : 1, 1, 6);
      return 0.55 + normalizedDamage * 0.1;
    }

    // Calcula el rango maximo de radio de las particulas de bala para un dano dado.
    function computeProjectileTrailRadiusMax(damage = 1) {
      const normalizedDamage = clamp(Number.isFinite(damage) ? damage : 1, 1, 6);
      return 1.05 + normalizedDamage * 0.18;
    }

    const keys = {
      Space: false,
      KeyQ: false,

    // Crea y devuelve el controlador del modo de pruebas y sus atajos de depuracion.
    function createTestCheats() {
      return {
        testMode: false,
        invincibility: false,
        dragTarget: null,
        activationSequence: ["Digit8", "Digit0", "Digit8", "Digit0"],
        activationProgress: 0,
        // Sincroniza el estado global la bandera dentro de esta parte de la logica.
        syncGlobalFlag() {
          window.test_mode = this.testMode;
        },
        // Alterna el modo de pruebas mode dentro de esta parte de la logica.
        toggleTestMode() {
          this.testMode = !this.testMode;
          if (!this.testMode) {
            this.invincibility = false;
            this.dragTarget = null;
          }
          this.syncGlobalFlag();
        },
        // Gestiona la secuencia de activacion la secuencia dentro del flujo principal del juego.
        handleActivationSequence(event) {
          if (event.repeat) {
            return false;
          }

          const expectedCode = this.activationSequence[this.activationProgress];
          if (event.code === expectedCode) {
            this.activationProgress += 1;
            if (this.activationProgress >= this.activationSequence.length) {
              this.activationProgress = 0;
              this.toggleTestMode();
            }
            return true;
          }

          this.activationProgress = event.code === this.activationSequence[0] ? 1 : 0;
          return event.code === "Digit8" || event.code === "Digit0";
        },
        // Indica si el jugador invincible cumple la condicion esperada para esta logica.
        isPlayerInvincible() {
          return this.testMode && this.invincibility;
        },
        // Gestiona la tecla down dentro del flujo principal del juego.
        handleKeyDown(event) {
          if (!this.testMode || world.isGameOver) {
            return false;
          }

          if (event.repeat && event.code !== 'KeyC') {
            return this.isReservedTestHotkey(event.code);
          }

          if (event.code === 'KeyP') {
            this.spawnPlanetAtCursor();
            return true;
          }

          if (event.code === 'KeyO') {
            this.spawnAsteroidAtCursor();
            return true;
          }

          if (event.code === 'KeyI') {
            this.invincibility = !this.invincibility;
            if (this.invincibility) {
              playerShip.hp = playerShip.maxHp;
            }
            return true;
          }

          if (event.code === 'KeyM') {
            playerShip.credits += 1000;
            return true;
          }

          if (event.code === 'KeyZ') {
            this.clearScene();
            return true;
          }

          if (event.code === 'KeyX') {
            proceduralField.spawnsEnabled = !proceduralField.spawnsEnabled;
            proceduralField.spawnAccumulator = 0;
            return true;
          }

          if (this.handleShipSpawnKey(event)) {
            return true;
          }

          if (event.code === 'KeyC') {
            if (!this.dragTarget || this.dragTarget.isRemoved) {
              this.dragTarget = findManipulableBodyUnderCursor();
            }
            return true;
          }

          return false;
        },
        // Indica si la reserva el modo de pruebas el atajo cumple la condicion esperada para esta logica.
        isReservedTestHotkey(code) {
          return code === 'KeyP' ||
            code === 'KeyO' ||
            code === 'KeyI' ||
            code === 'KeyM' ||
            code === 'KeyZ' ||
            code === 'KeyX' ||
            code === 'Digit1' ||
            code === 'Digit2' ||
            code === 'Digit3' ||
            code === 'Digit4' ||
            code === 'Digit5' ||
            code === 'Digit6' ||
            code === 'Digit7';
        },
        // Gestiona la nave spawn la tecla dentro del flujo principal del juego.
        handleShipSpawnKey(event) {
          let spawnType = null;
          let hullClass = 'small';

          if (event.code === 'Digit1') {
            spawnType = event.shiftKey ? 'merchantEscort' : 'station';
          } else if (event.code === 'Digit2') {
            spawnType = 'miner';
          } else if (event.code === 'Digit3') {
            spawnType = 'flea';
          } else if (event.code === 'Digit4') {
            spawnType = 'dragonfly';
            hullClass = event.shiftKey ? 'large' : 'small';
          } else if (event.code === 'Digit5') {
            spawnType = 'wasp';
            hullClass = event.shiftKey ? 'large' : 'small';
          } else if (event.code === 'Digit6') {
            spawnType = 'tarantula';
          } else if (event.code === 'Digit7') {
            spawnType = 'carrier';
          }

          if (!spawnType) {
            return false;
          }

          this.spawnShipAtCursor(spawnType, hullClass);
          return true;
        },
        // Genera la nave at cursor usando la configuracion y el contexto actuales.
        spawnShipAtCursor(type, hullClass = 'small') {
          let spec = null;
          const uniqueGroupId = proceduralField.nextSchoolId++;

          if (type === 'station') {
            spec = proceduralField.createStationSpec();
          } else if (type === 'merchantEscort') {
            spec = proceduralField.createMerchantEscortSpec(0, 0, getFactionColor('merchant'));
          } else if (type === 'miner') {
            spec = proceduralField.createMinerSpec();
          } else if (type === 'flea') {
            spec = proceduralField.createFleaSpec(uniqueGroupId, 0, 0);
          } else if (type === 'dragonfly') {
            spec = proceduralField.createDragonflySpec(uniqueGroupId, hullClass, 0, 0);
          } else if (type === 'wasp') {
            spec = proceduralField.createWaspSpec(uniqueGroupId, hullClass, 0, 0);
          } else if (type === 'tarantula') {
            spec = proceduralField.createTarantulaSpec();
          } else if (type === 'carrier') {
            spec = proceduralField.createCarrierSpec();
          }

          if (!spec) {
            return null;
          }

          spec.vx = 0;
          spec.vy = 0;
          spec.angularVelocity = 0;
          const body = proceduralField.buildBody(mouse.worldX, mouse.worldY, spec);
          body.isProcedural = false;
          body.isFieldBody = false;
          world.addBody(body);
          return body;
        },
        // Gestiona la tecla up dentro del flujo principal del juego.
        handleKeyUp(event) {
          if (event.code === 'KeyC') {
            this.dragTarget = null;
            return true;
          }
          return false;
        },
        // Genera el planeta at cursor usando la configuracion y el contexto actuales.
        spawnPlanetAtCursor() {
          const spec = proceduralField.createPlanetSpec();
          spec.vx = 0;
          spec.vy = 0;
          spec.angularVelocity = 0;
          const body = proceduralField.buildBody(mouse.worldX, mouse.worldY, spec);
          body.isProcedural = false;
          body.isFieldBody = false;
          world.addBody(body);
          return body;
        },
        // Genera el asteroide at cursor usando la configuracion y el contexto actuales.
        spawnAsteroidAtCursor() {
          const spec = proceduralField.createAsteroidSpec();
          spec.vx = 0;
          spec.vy = 0;
          spec.angularVelocity = 0;
          const body = proceduralField.buildBody(mouse.worldX, mouse.worldY, spec);
          body.isProcedural = false;
          body.isFieldBody = false;
          world.addBody(body);
          return body;
        },
        // Limpia la escena dentro de esta parte de la logica.
        clearScene() {
          closeShop();
          factionMenuState.isOpen = false;
          mouse.brakeLockTarget = null;
          this.dragTarget = null;
          for (let i = world.bodies.length - 1; i >= 0; i--) {
            const body = world.bodies[i];
            if (body === playerShip || body.isRemoved) {
              continue;
            }
            world.removeBody(body);
          }
          world.particles?.clear();
          world.cleanupRemovedBodies();
          proceduralField.spawnAccumulator = 0;
          proceduralField.fleaSpawnCooldown = 0;
          proceduralField.waspSpawnCooldown = 0;
          proceduralField.dragonflySpawnCooldown = 0;
          proceduralField.minerSpawnCooldown = 0;
          proceduralField.carrierSpawnCooldown = 0;
        },
        // Actualiza el estado interno usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
        update(dt) {
          if (!this.testMode) {
            return;
          }

          if (this.invincibility && playerShip.isAlive) {
            playerShip.hp = playerShip.maxHp;
          }

          const target = this.dragTarget;
          if (!keys.KeyC || !target || target.isRemoved) {
            if (target && target.isRemoved) {
              this.dragTarget = null;
            }
            return;
          }

          const dx = mouse.worldX - target.x;
          const dy = mouse.worldY - target.y;
          const dist = Math.hypot(dx, dy);
          if (!(dist > 0.001)) {
            return;
          }

          const accelLimit = target.kind === 'planet' ? 320 : target.kind === 'asteroid' ? 760 : 980;
          const accel = clamp(dist * 4.2, 0, accelLimit);
          target.applyAcceleration((dx / dist) * accel, (dy / dist) * accel, dt);
          target.angularVelocity *= 0.96;
        }
      };
    }

    const testCheats = createTestCheats();

    const mouse = {
      x: canvas.width * 0.5,
      y: canvas.height * 0.5,
      worldX: 0,
      worldY: 0,
      left: false,
      right: false,
      brakeLockTarget: null

    // Actualiza el mouse el espacio del juego usando el estado actual y los parametros recibidos.
    function updateMouseWorld() {
      mouse.worldX = camera.x + mouse.x;
      mouse.worldY = camera.y + mouse.y;
    }

    // Devuelve la tecla de control la tecla calculado a partir del estado y los parametros recibidos.
    function getControlKey(event) {
      if (event.code === "Space") {
        return "Space";
      }

      if (event.code === "KeyQ") {
        return "KeyQ";
      }

      if (
        event.code === "KeyP" ||
        event.code === "KeyO" ||
        event.code === "KeyI" ||
        event.code === "KeyC" ||
        event.code === "KeyM" ||
        event.code === "KeyZ" ||
        event.code === "KeyX"
      ) {
        return event.code;
      }

      return event.key;
    }

    window.addEventListener("keydown", (e) => {
      if (testCheats.handleActivationSequence(e)) {
        e.preventDefault();
      }

      const key = getControlKey(e);
      const cheatHandled = testCheats.handleKeyDown(e);

      if (key in keys) {
        if (key === "Space" && !keys.Space) {
          mouse.brakeLockTarget = findBodyUnderCursor();
        }
        keys[key] = true;
        e.preventDefault();
      } else if (cheatHandled) {
        e.preventDefault();
      }

      if (!cheatHandled) {
        handleMenuHotkeys(e);
      }
    });

    window.addEventListener("keyup", (e) => {
      const key = getControlKey(e);

      if (key in keys) {
        keys[key] = false;
        if (key === "Space") {
          mouse.brakeLockTarget = null;
        }
        if (testCheats.handleKeyUp(e)) {
          e.preventDefault();
        } else {
          e.preventDefault();
        }
      }
    });

    window.addEventListener("blur", () => {
      for (const key in keys) {
        keys[key] = false;
      }
      mouse.left = false;
      mouse.right = false;
      mouse.brakeLockTarget = null;
      testCheats.activationProgress = 0;
      testCheats.dragTarget = null;
    });

    // Limita el estado interno dentro de esta parte de la logica.
    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    // Gestiona random between dentro del flujo principal del juego.
    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    // Devuelve un valor aleatorio triangular con sesgo hacia el modo indicado.
    function randomTriangular(min, max, mode) {
      if (!(max > min)) {
        return min;
      }

      const clampedMode = clamp(mode, min, max);
      const pivot = (clampedMode - min) / (max - min);
      const u = Math.random();

      if (u <= pivot) {
        return min + Math.sqrt(u * (max - min) * (clampedMode - min));
      }

      return max - Math.sqrt((1 - u) * (max - min) * (max - clampedMode));
    }

    // Gestiona random int dentro del flujo principal del juego.
    function randomInt(min, max) {
      return Math.floor(randomBetween(min, max + 1));
    }

    // Gestiona lerp dentro del flujo principal del juego.
    function lerp(a, b, t) {
      return a + (b - a) * t;

    // Aplica una curva suave de interpolacion en el rango [0, 1].
    function smoothNoiseCurve(t) {
      const clamped = clamp(t, 0, 1);
      return clamped * clamped * (3 - 2 * clamped);
    }

    // Convierte coordenadas enteras 2D en un valor pseudoaleatorio estable de 0 a 1.
    function hashCoord2D(ix, iy, seed = 0) {
      let h = (Math.imul(ix | 0, 374761393) ^ Math.imul(iy | 0, 668265263) ^ Math.imul(seed | 0, 1442695041)) >>> 0;
      h = (h ^ (h >>> 13)) >>> 0;
      h = Math.imul(h, 1274126177) >>> 0;
      h ^= h >>> 16;
      return (h >>> 0) / 4294967295;
    }

    // Muestrea ruido de valor 2D suave y persistente con el tamano de celda indicado.
    function sampleValueNoise2D(x, y, cellSize, seed = 0) {
      const safeCellSize = Math.max(1, cellSize);
      const gx = x / safeCellSize;
      const gy = y / safeCellSize;
      const ix = Math.floor(gx);
      const iy = Math.floor(gy);
      const fx = gx - ix;
      const fy = gy - iy;
      const sx = smoothNoiseCurve(fx);
      const sy = smoothNoiseCurve(fy);
      const n00 = hashCoord2D(ix, iy, seed);
      const n10 = hashCoord2D(ix + 1, iy, seed);
      const n01 = hashCoord2D(ix, iy + 1, seed);
      const n11 = hashCoord2D(ix + 1, iy + 1, seed);
      const nx0 = lerp(n00, n10, sx);
      const nx1 = lerp(n01, n11, sx);
      return lerp(nx0, nx1, sy);
    }

    const BIOME_SIZE_SCALE = 4.8;

    // Muestrea la senal continua de bioma para una posicion del mundo usando ruido 2D con domain warp.
    function sampleBiomeSignal2D(x, y) {
      const warpX = (sampleValueNoise2D(x + 4181, y - 2771, 26000 * BIOME_SIZE_SCALE, 11) - 0.5) * (8600 * BIOME_SIZE_SCALE);
      const warpY = (sampleValueNoise2D(x - 6917, y + 5449, 26000 * BIOME_SIZE_SCALE, 29) - 0.5) * (8600 * BIOME_SIZE_SCALE);
      const nx = x + warpX;
      const ny = y + warpY;
      const primary = sampleValueNoise2D(nx, ny, 15000 * BIOME_SIZE_SCALE, 53);
      const secondary = sampleValueNoise2D(nx + 8000 * BIOME_SIZE_SCALE, ny - 5000 * BIOME_SIZE_SCALE, 24000 * BIOME_SIZE_SCALE, 97);
      return clamp(primary * 0.72 + secondary * 0.28, 0, 1);
    }


    const BIOME_SIGNAL_REMAP_POINTS = [
      { input: 0.0, output: 0.0 },
      { input: 0.3209728266, output: 0.10 },
      { input: 0.4127802986, output: 0.29 },
      { input: 0.4929841800, output: 0.47 },
      { input: 0.5709075617, output: 0.65 },
      { input: 0.6642592586, output: 0.87 },
      { input: 1.0, output: 1.0 }
    ];

    // Remapea la senal cruda del bioma para repartir mejor las bandas sin perder persistencia espacial.
    function remapBiomeSignal(signal) {
      const clampedSignal = clamp(signal, 0, 1);
      for (let i = 1; i < BIOME_SIGNAL_REMAP_POINTS.length; i++) {
        const previous = BIOME_SIGNAL_REMAP_POINTS[i - 1];
        const current = BIOME_SIGNAL_REMAP_POINTS[i];
        if (clampedSignal <= current.input) {
          const range = Math.max(0.000001, current.input - previous.input);
          const t = clamp((clampedSignal - previous.input) / range, 0, 1);
          return lerp(previous.output, current.output, t);
        }
      }
      return BIOME_SIGNAL_REMAP_POINTS[BIOME_SIGNAL_REMAP_POINTS.length - 1].output;
    }

    // Devuelve el estado persistente del bioma para unas coordenadas del mundo.
    function getBiomeStateAtWorld(x, y) {
      const signal = remapBiomeSignal(sampleBiomeSignal2D(x, y));
      let discreteBand = BIOME_BANDS[0];
      for (let i = 1; i < BIOME_BANDS.length; i++) {
        const midpoint = (BIOME_BANDS[i - 1].pivot + BIOME_BANDS[i].pivot) * 0.5;
        if (signal >= midpoint) {
          discreteBand = BIOME_BANDS[i];
        } else {
          break;
        }
      }

      let lower = BIOME_BANDS[0];
      let upper = BIOME_BANDS[BIOME_BANDS.length - 1];
      for (let i = 0; i < BIOME_BANDS.length - 1; i++) {
        const a = BIOME_BANDS[i];
        const b = BIOME_BANDS[i + 1];
        if (signal <= b.pivot) {
          lower = a;
          upper = b;
          break;
        }
      }

      const range = Math.max(0.0001, upper.pivot - lower.pivot);
      const mixT = clamp((signal - lower.pivot) / range, 0, 1);
      const shade = 0.9 + (sampleValueNoise2D(x - 9000, y + 14000, 11000, 131) - 0.5) * 0.18;
      const tint = [
        Math.round(clamp(lerp(lower.tint[0], upper.tint[0], mixT) * shade, 0, 255)),
        Math.round(clamp(lerp(lower.tint[1], upper.tint[1], mixT) * shade, 0, 255)),
        Math.round(clamp(lerp(lower.tint[2], upper.tint[2], mixT) * shade, 0, 255))
      ];

      const discreteTint = [...discreteBand.tint];

      return {
        id: discreteBand.id,
        name: discreteBand.name,
        signal,
        tintRgb: tint,
        tintCss: `rgb(${tint[0]}, ${tint[1]}, ${tint[2]})`,
        discreteTintRgb: discreteTint,
        discreteTintCss: `rgb(${discreteTint[0]}, ${discreteTint[1]}, ${discreteTint[2]})`,
        profile: discreteBand.profile
      };
    }

    // Normaliza angle dentro de esta parte de la logica.
    function wrapAngle(angle) {
      const tau = Math.PI * 2;
      let wrapped = (angle + Math.PI) % tau;

      if (wrapped < 0) {
        wrapped += tau;
      }

      return wrapped - Math.PI;
    }

    // Limita el vector la magnitud dentro de esta parte de la logica.
    function clampVectorMagnitude(x, y, maxMagnitude) {
      const magnitude = Math.hypot(x, y);

      if (!(magnitude > maxMagnitude) || magnitude <= 0) {
        return { x, y, magnitude };
      }

      const scale = maxMagnitude / magnitude;
      return {
        x: x * scale,
        y: y * scale,
        magnitude: maxMagnitude
      };
    }

    function randomColor({
      minHue = 0,
      maxHue = 359,
      minSaturation = 55,
      maxSaturation = 95,
      minLightness = 45,
      maxLightness = 72
    } = {}) {
      const hue = randomInt(minHue, maxHue);
      const saturation = randomInt(minSaturation, maxSaturation);
      const lightness = randomInt(minLightness, maxLightness);
      return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
    }

    // Gestiona la distancia squared dentro del flujo principal del juego.
    function distanceSquared(ax, ay, bx, by) {
      const dx = bx - ax;
      const dy = by - ay;
      return dx * dx + dy * dy;
    }

    // Mezcla in place dentro de esta parte de la logica.
    function shuffleInPlace(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = array[i];
        array[i] = array[j];
        array[j] = tmp;
      }

      return array;
    }

    // Devuelve la faccion disposition calculado a partir del estado y los parametros recibidos.
    function getFactionDisposition(value) {
      if (value > 80) return "ally";
      if (value < 40) return "enemy";
      return "neutral";
    }

    // Devuelve el color base asociado a una faccion del juego.
    function getFactionColor(value) {
      const disposition = getFactionDisposition(value);
      if (disposition === "enemy") return "#ff7575";
      if (disposition === "ally") return "#ffffff";
      return "#b7b7b7";
    }

    const RADAR_DETAIL_LABELS = [
      "planetas + tarántulas",
      "+ mercaderes",
      "+ asteroides grandes",
      "+ asteroides pequeños",
      "+ otras naves",
      "+ restos"
    ];

    // Devuelve el radar el detalle label calculado a partir del estado y los parametros recibidos.
    function getRadarDetailLabel(level) {
      const clamped = clamp(Math.round(level ?? 0), 0, RADAR_DETAIL_LABELS.length - 1);
      return RADAR_DETAIL_LABELS[clamped];
    }

    // Devuelve el asteroide max la vida from radius calculado a partir del estado y los parametros recibidos.
    function getAsteroidMaxHpFromRadius(radius) {
      const baseRadius = 13;
      return Math.max(1, Math.ceil((radius / baseRadius) ** 2));
    }

    // Indica si la nave like cumple la condicion esperada para esta logica.
    function isShipLike(body) {
      return !!body && (
        body.kind === "ship" ||
        body.kind === "station" ||
        body.kind === "merchantEscort" ||
        body.kind === "flea" ||
        body.kind === "wasp" ||
        body.kind === "dragonfly" ||
        body.kind === "miner" ||
        body.kind === "tarantula" ||
        body.kind === "carrier" ||
        body.kind === "interceptor"
      );
    }

    // Indica si la nave kind cumple la condicion esperada para esta logica.
    function isShipKind(kind) {
      return kind === "ship" || kind === "station" || kind === "merchantEscort" || kind === "flea" || kind === "wasp" || kind === "dragonfly" || kind === "miner" || kind === "tarantula" || kind === "carrier" || kind === "interceptor";
    }

    // Indica si armed npc la nave cumple la condicion esperada para esta logica.
    function isArmedNpcShip(body) {
      return !!body && (body.kind === "station" || body.kind === "merchantEscort" || body.kind === "wasp" || body.kind === "dragonfly" || body.kind === "miner" || body.kind === "tarantula" || body.kind === "carrier" || body.kind === "interceptor");
    }

    // Indica si el objetivo de chatarra collector la nave cumple la condicion esperada para esta logica.
    function isScrapCollectorShip(body) {
      return !!body && ((body.kind === "dragonfly" || body.kind === "tarantula") && body.hp < body.maxHp - 0.01);
    }

    // Indica si el objetivo de chatarra breaker la nave cumple la condicion esperada para esta logica.
    function isScrapBreakerShip(body) {
      return !!body && (body.kind === "wasp" || body.kind === "miner");
    }

    // Reutiliza una consulta espacial amplia dentro del mismo tick de IA para reducir escaneos repetidos de grid.
    function queryNearbyWithFrameCache(actor, range, callback) {
      const aiWorld = actor?.aiWorld;
      if (!aiWorld || !aiWorld.grid || !(range > 0)) {
        return;
      }

      const frameId = aiWorld.aiTickId ?? 0;
      const cached = actor._nearbyQueryCache;
      if (cached && cached.frameId === frameId && cached.range >= range) {
        const rangeSq = range * range;
        const originX = actor.x;
        const originY = actor.y;
        const bodies = cached.bodies;

        for (let i = 0; i < bodies.length; i++) {
          const body = bodies[i];
          if (!body || body.isRemoved || body === actor) continue;
          const dx = body.x - originX;
          const dy = body.y - originY;
          if (dx * dx + dy * dy > rangeSq) continue;
          if (callback(body) === false) {
            return false;
          }
        }
        return true;
      }

      const bodies = [];
      const stamp = aiWorld.gravityQueryStamp++;
      aiWorld.grid.forEachNearbyUnique(actor.x, actor.y, range, stamp, (body) => {
        if (body === actor || body.isRemoved) return;
        bodies.push(body);
      });

      actor._nearbyQueryCache = {
        frameId,
        range,
        bodies
      };

      for (let i = 0; i < bodies.length; i++) {
        if (callback(bodies[i]) === false) {
          return false;
        }
      }

      return true;
    }


    const cssColorParseCache = new Map();

    // Gestiona hsl to los componentes RGB components dentro del flujo principal del juego.
    function hslToRgbComponents(h, s, l) {
      const hue = ((h % 360) + 360) % 360;
      const sat = clamp(s, 0, 100) / 100;
      const light = clamp(l, 0, 100) / 100;

      const chroma = (1 - Math.abs(2 * light - 1)) * sat;
      const segment = hue / 60;
      const x = chroma * (1 - Math.abs(segment % 2 - 1));
      let r1 = 0;
      let g1 = 0;
      let b1 = 0;

      if (segment >= 0 && segment < 1) {
        r1 = chroma;
        g1 = x;
      } else if (segment < 2) {
        r1 = x;
        g1 = chroma;
      } else if (segment < 3) {
        g1 = chroma;
        b1 = x;
      } else if (segment < 4) {
        g1 = x;
        b1 = chroma;
      } else if (segment < 5) {
        r1 = x;
        b1 = chroma;
      } else {
        r1 = chroma;
        b1 = x;
      }

      const match = light - chroma * 0.5;
      return {
        r: Math.round((r1 + match) * 255),
        g: Math.round((g1 + match) * 255),
        b: Math.round((b1 + match) * 255)
      };
    }

    // Convierte el color CSS el color dentro de esta parte de la logica.
    function parseCssColor(color) {
      const key = `${color ?? ''}`.trim().toLowerCase();
      if (cssColorParseCache.has(key)) {
        return cssColorParseCache.get(key);
      }

      let parsed = { r: 255, g: 255, b: 255 };

      if (/^#([0-9a-f]{3}){1,2}$/i.test(key)) {
        const hex = key.slice(1);
        if (hex.length === 3) {
          parsed = {
            r: parseInt(hex[0] + hex[0], 16),
            g: parseInt(hex[1] + hex[1], 16),
            b: parseInt(hex[2] + hex[2], 16)
          };
        } else {
          parsed = {
            r: parseInt(hex.slice(0, 2), 16),
            g: parseInt(hex.slice(2, 4), 16),
            b: parseInt(hex.slice(4, 6), 16)
          };
        }
      } else {
        const rgbMatch = key.match(/^rgba?\(([^)]+)\)$/i);
        if (rgbMatch) {
          const parts = rgbMatch[1].split(',').map((part) => parseFloat(part.trim()));
          parsed = {
            r: clamp(Math.round(parts[0] ?? 255), 0, 255),
            g: clamp(Math.round(parts[1] ?? 255), 0, 255),
            b: clamp(Math.round(parts[2] ?? 255), 0, 255)
          };
        } else {
          const hslMatch = key.match(/^hsla?\(([^)]+)\)$/i);
          if (hslMatch) {
            const parts = hslMatch[1].split(',').map((part) => part.trim());
            parsed = hslToRgbComponents(
              parseFloat(parts[0] ?? '0'),
              parseFloat((parts[1] ?? '0').replace('%', '')),
              parseFloat((parts[2] ?? '100').replace('%', ''))
            );
          }
        }
      }

      cssColorParseCache.set(key, parsed);
      return parsed;
    }

    // Ajusta el color CSS el color dentro de esta parte de la logica.
    function varyCssColor(color, variance = 0) {
      const base = parseCssColor(color);
      if (!(variance > 0)) {
        return `rgb(${base.r}, ${base.g}, ${base.b})`;
      }

      const channelVariance = Math.max(0, variance);
      return `rgb(${clamp(Math.round(base.r + randomBetween(-channelVariance, channelVariance)), 0, 255)}, ${clamp(Math.round(base.g + randomBetween(-channelVariance, channelVariance)), 0, 255)}, ${clamp(Math.round(base.b + randomBetween(-channelVariance, channelVariance)), 0, 255)})`;
    }

    class ParticleSystem {
      // Inicializa la instancia de ParticleSystem con las opciones y el estado base necesarios.
      constructor(world) {
        this.world = world;
        this.active = [];
        this.pool = [];
        this.maxActive = 3200;
      }

      // Limpia el estado interno dentro de esta parte de la logica.
      clear() {
        while (this.active.length > 0) {
          this.pool.push(this.active.pop());
        }
      }

      // Gestiona acquire dentro del flujo principal del juego.
      acquire() {
        return this.pool.pop() ?? {};
      }

      // Devuelve la cuenta activa count calculado a partir del estado y los parametros recibidos.
      getActiveCount() {
        return this.active.length;
      }

      // Devuelve la reserva count calculado a partir del estado y los parametros recibidos.
      getPoolCount() {
        return this.pool.length;
      }

      // Libera at dentro de esta parte de la logica.
      releaseAt(index) {
        const particle = this.active[index];
        const last = this.active.length - 1;
        this.active[index] = this.active[last];
        this.active.pop();
        this.pool.push(particle);
      }

      // Activa una particula del pool aplicando la configuracion visual y fisica recibida.
      spawnParticle(options = {}) {
        if (this.active.length >= this.maxActive) {
          return null;
        }

        const particle = this.acquire();
        particle.x = options.x ?? 0;
        particle.y = options.y ?? 0;
        particle.vx = options.vx ?? 0;
        particle.vy = options.vy ?? 0;
        particle.radius = Math.max(0.6, options.radius ?? 1.6);
        particle.age = 0;
        particle.lifetime = Math.max(0.05, options.lifetime ?? 0.35);
        particle.color = options.color ?? 'white';
        particle.ignoreBodyId = options.ignoreBodyId ?? 0;
        particle.ignoreDuration = Math.max(0, options.ignoreDuration ?? 0);
        particle.skipIntegrationFrames = Math.max(0, Math.floor(options.skipIntegrationFrames ?? 0));
        this.active.push(particle);
        return particle;
      }

      emitExplosion({
        x = 0,
        y = 0,
        count = 1,
        minLifetime = 0.2,
        maxLifetime = 0.75,
        color = '#ffffff',
        colorVariance = 0,
        speed = 42,
        speedVariance = 18,
        baseVX = 0,
        baseVY = 0,
        radiusMin = 1.2,
        radiusMax = 2.4,
        ignoreBodyId = 0,
        ignoreDuration = 0
      } = {}) {
        const total = Math.max(0, Math.round(count));
        for (let i = 0; i < total; i++) {
          const angle = randomBetween(0, Math.PI * 2);
          const particleSpeed = Math.max(0, speed + randomBetween(-speedVariance, speedVariance));
          this.spawnParticle({
            x,
            y,
            vx: baseVX + Math.cos(angle) * particleSpeed,
            vy: baseVY + Math.sin(angle) * particleSpeed,
            radius: randomBetween(radiusMin, radiusMax),
            lifetime: randomBetween(minLifetime, maxLifetime),
            color: varyCssColor(color, colorVariance),
            ignoreBodyId,
            ignoreDuration
          });
        }
      }

      emitSpawn({
        x = 0,
        y = 0,
        count = 1,
        minLifetime = 0.12,
        maxLifetime = 0.35,
        color = '#ffffff',
        colorVariance = 0,
        speed = 36,
        speedVariance = 14,
        angle = 0,
        angleVariance = 0.45,
        baseVX = 0,
        baseVY = 0,
        radiusMin = 1.0,
        radiusMax = 2.0,
        ignoreBodyId = 0,
        ignoreDuration = 0
      } = {}) {
        const total = Math.max(0, Math.round(count));
        for (let i = 0; i < total; i++) {
          const emitAngle = angle + randomBetween(-angleVariance, angleVariance);
          const particleSpeed = Math.max(0, speed + randomBetween(-speedVariance, speedVariance));
          this.spawnParticle({
            x,
            y,
            vx: baseVX + Math.cos(emitAngle) * particleSpeed,
            vy: baseVY + Math.sin(emitAngle) * particleSpeed,
            radius: randomBetween(radiusMin, radiusMax),
            lifetime: randomBetween(minLifetime, maxLifetime),
            color: varyCssColor(color, colorVariance),
            ignoreBodyId,
            ignoreDuration
          });
        }
      }

      // Actualiza el estado interno usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      update(dt) {
        if (!(dt > 0) || this.active.length === 0 || !this.world?.grid) {
          return;
        }

        for (let i = this.active.length - 1; i >= 0; i--) {
          const particle = this.active[i];
          particle.age += dt;
          if (particle.age >= particle.lifetime) {
            this.releaseAt(i);
            continue;
          }

          if ((particle.skipIntegrationFrames ?? 0) > 0) {
            particle.skipIntegrationFrames -= 1;
            continue;
          }

          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;

          const collisionStamp = this.world.gravityQueryStamp++;
          let collided = false;
          this.world.grid.forEachNearbyUnique(particle.x, particle.y, 2, collisionStamp, (body) => {
            if (body.isRemoved) return;
            if ((body.kind === 'projectile' || body.kind === 'coin' || body.kind === 'scrap') || body.kind === 'particle') return;
            if (particle.ignoreBodyId && body.id === particle.ignoreBodyId && particle.age <= particle.ignoreDuration) return;

            const dx = body.x - particle.x;
            const dy = body.y - particle.y;
            const colliderRadius = body.colliderRadius ?? body.radius ?? 0;
            if (dx * dx + dy * dy <= colliderRadius * colliderRadius) {
              collided = true;
              return false;
            }
          });

          if (collided) {
            this.releaseAt(i);
          }
        }
      }

      // Dibuja el estado interno en el contexto de render correspondiente.
      draw(ctx, camera, width, height) {
        if (this.active.length === 0) {
          return;
        }

        const margin = 32;
        const left = camera.x - margin;
        const right = camera.x + width + margin;
        const top = camera.y - margin;
        const bottom = camera.y + height + margin;

        ctx.save();
        for (let i = 0; i < this.active.length; i++) {
          const particle = this.active[i];
          if (
            particle.x + particle.radius < left ||
            particle.x - particle.radius > right ||
            particle.y + particle.radius < top ||
            particle.y - particle.radius > bottom
          ) {
            continue;
          }

          const alpha = clamp(1 - particle.age / Math.max(0.0001, particle.lifetime), 0, 1);
          if (alpha <= 0.001) {
            continue;
          }

          ctx.globalAlpha = alpha;
          ctx.fillStyle = particle.color;
          ctx.beginPath();
          ctx.arc(particle.x - camera.x, particle.y - camera.y, particle.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    class Renderable {
      draw(ctx, camera) {}
    }

    class SpatialGrid {
      // Inicializa la instancia de SpatialGrid con las opciones y el estado base necesarios.
      constructor(cellSize) {
        this.cellSize = cellSize;
        this.cells = new Map();
        this.rows = new Map();
        this.bucketPool = [];
        this.rowPool = [];
        this.activeBuckets = [];
        this.activeRows = [];
      }

      // Reserva o reutiliza un bucket para una celda concreta de la grid.
      acquireBucket(cx, cy, key = this.key(cx, cy)) {
        const bucket = this.bucketPool.pop() ?? [];
        bucket.length = 0;
        bucket._cx = cx;
        bucket._cy = cy;
        bucket._key = key;
        this.activeBuckets.push(bucket);
        return bucket;
      }

      // Reserva o reutiliza una fila para consultas mas rapidas por coordenada Y.
      acquireRow(cy) {
        const row = this.rowPool.pop() ?? new Map();
        row._cy = cy;
        this.activeRows.push(row);
        return row;
      }

      // Inserta un cuerpo usando solo su posicion central para consultas que no necesitan su radio.
      insertByCenter(body) {
        const cx = this.cellX(body.x);
        const cy = this.cellY(body.y);
        const key = this.key(cx, cy);
        let row = this.rows.get(cy);
        if (!row) {
          row = this.acquireRow(cy);
          this.rows.set(cy, row);
        }

        let bucket = row.get(cx);
        if (!bucket) {
          bucket = this.acquireBucket(cx, cy, key);
          row.set(cx, bucket);
          this.cells.set(key, bucket);
        }

        bucket.push(body);
      }

      // Limpia el estado interno dentro de esta parte de la logica.
      clear() {
        for (let i = 0; i < this.activeBuckets.length; i++) {
          const bucket = this.activeBuckets[i];
          bucket.length = 0;
          bucket._cx = 0;
          bucket._cy = 0;
          bucket._key = "";
          this.bucketPool.push(bucket);
        }

        for (let i = 0; i < this.activeRows.length; i++) {
          const row = this.activeRows[i];
          row.clear();
          row._cy = 0;
          this.rowPool.push(row);
        }

        this.activeBuckets.length = 0;
        this.activeRows.length = 0;
        this.cells.clear();
        this.rows.clear();
      }

      // Gestiona cell x dentro del flujo principal del juego.
      cellX(x) {
        return Math.floor(x / this.cellSize);
      }

      // Gestiona cell y dentro del flujo principal del juego.
      cellY(y) {
        return Math.floor(y / this.cellSize);
      }

      // Gestiona la tecla dentro del flujo principal del juego.
      key(cx, cy) {
        return `${cx},${cy}`;
      }

      // Gestiona insert dentro del flujo principal del juego.
      insert(body) {
        const r = body.colliderRadius;
        const minX = this.cellX(body.x - r);
        const maxX = this.cellX(body.x + r);
        const minY = this.cellY(body.y - r);
        const maxY = this.cellY(body.y + r);

        body._gridMinX = minX;
        body._gridMaxX = maxX;
        body._gridMinY = minY;
        body._gridMaxY = maxY;

        for (let cy = minY; cy <= maxY; cy++) {
          let row = this.rows.get(cy);
          if (!row) {
            row = this.acquireRow(cy);
            this.rows.set(cy, row);
          }

          for (let cx = minX; cx <= maxX; cx++) {
            const key = this.key(cx, cy);
            let bucket = row.get(cx);

            if (!bucket) {

            bucket.push(body);

      forEachNearbyUnique(x, y, radius, stamp, callback) {
        const minX = this.cellX(x - radius);
        const maxX = this.cellX(x + radius);
        const minY = this.cellY(y - radius);
        const maxY = this.cellY(y + radius);
        const cells = this.cells;

        for (let cy = minY; cy <= maxY; cy++) {
          for (let cx = minX; cx <= maxX; cx++) {
            const bucket = cells.get(this.key(cx, cy));
            if (!bucket) continue;

            for (let i = 0, count = bucket.length; i < count; i++) {
              const body = bucket[i];
              if (body._queryStamp === stamp) continue;
              body._queryStamp = stamp;
              if (callback(body) === false) {

        return true;

      // Recorre pares potencialmente colisionables dentro de la grid espacial.
      forEachCollisionPair(callback) {
        for (const bucket of this.cells.values()) {
          const cellX = bucket._cx;
          const cellY = bucket._cy;

          for (let i = 0; i < bucket.length; i++) {

            for (let j = i + 1; j < bucket.length; j++) {
              const b = bucket[j];
              const firstSharedCellX = a._gridMinX > b._gridMinX ? a._gridMinX : b._gridMinX;
              if (firstSharedCellX !== cellX) continue;
              const firstSharedCellY = a._gridMinY > b._gridMinY ? a._gridMinY : b._gridMinY;

        ctx.lineWidth = 1;

        const left = camera.x;
        const top = camera.y;
        const right = camera.x + width;
        const bottom = camera.y + height;

        const startX = Math.floor(left / this.cellSize) * this.cellSize;
        const endX = Math.ceil(right / this.cellSize) * this.cellSize;
        const startY = Math.floor(top / this.cellSize) * this.cellSize;

        for (let x = startX; x <= endX; x += this.cellSize) {

          ctx.moveTo(x - camera.x, 0);
          ctx.lineTo(x - camera.x, height);
          ctx.stroke();
        }

        for (let y = startY; y <= endY; y += this.cellSize) {
          ctx.beginPath();
          ctx.moveTo(0, y - camera.y);
          ctx.lineTo(width, y - camera.y);
          ctx.stroke();
        }

        let bestScrapBreak = null;

        let bestTarantulaCoin = null;
        let bestTarantulaCoinScore = Infinity;
        let bestTarantulaScrap = null;
        let bestTarantulaScrapScore = Infinity;
        let nearestTarantula = null;
        let nearestTarantulaDistance = Infinity;

        queryNearbyWithFrameCache(this, maxRange, (body) => {
          const dx = body.x - this.x;
          const dy = body.y - this.y;
          const distSq = dx * dx + dy * dy;
          if (!(distSq > 1e-6)) return;
          let dist = 0;

          if (distSq <= squadSenseRadiusSq && body.kind === this.kind && body.faction === this.faction && body.squadId === this.squadId) {
            dist = Math.sqrt(distSq);
            squadCount++;
            alignmentVX += body.vx;
            alignmentVY += body.vy;
            centerX += body.x;
            centerY += body.y;
            if (dist < this.personalSpace) {
              const push = (this.personalSpace - dist) / this.personalSpace;
              separationX -= (dx / dist) * push * 320;
              separationY -= (dy / dist) * push * 320;
            }
          }

          if (distSq <= hazardSenseRadiusSq && (body.kind === "planet" || body.kind === "asteroid")) {
            if (!dist) dist = Math.sqrt(distSq);
            const nx = -dx / dist;
            const ny = -dy / dist;
            const relVX = this.vx - body.vx;
            const relVY = this.vy - body.vy;
            const inwardSpeed = Math.max(0, -(relVX * nx + relVY * ny));
            const hardRadius = body.radius + this.radius + (body.kind === "planet" ? 64 : 22);
            const softRadius = hardRadius + (body.kind === "planet" ? 180 : 90);
            if (dist < softRadius) {
              const closeness = clamp((softRadius - dist) / Math.max(1, softRadius - hardRadius), 0, 1);
              let strength = (body.kind === "planet" ? 120 : 64) * closeness * closeness + inwardSpeed * (body.kind === "planet" ? 1.4 : 0.7);
              if (dist < hardRadius) {
                strength += (hardRadius - dist) * (body.kind === "planet" ? 2.6 : 1.4);
              }
              avoidX += nx * strength;
              avoidY += ny * strength;
              extraAccel = Math.max(extraAccel, strength);
            }
          }

          if (distSq <= projectileSenseRadiusSq && body.kind === "projectile" && body.owner !== this && (!body.faction || this.getDispositionTo(body.faction) === "enemy")) {
            if (!dist) dist = Math.sqrt(distSq);
            const speedSq = body.vx * body.vx + body.vy * body.vy;
            if (speedSq > 1e-6) {
              const speed = Math.sqrt(speedSq);
              const dirX = body.vx / speed;
              const dirY = body.vy / speed;
              const toMeX = -dx / dist;
              const toMeY = -dy / dist;
              const closing = dirX * toMeX + dirY * toMeY;
              if (closing >= 0.45) {
                const side = Math.sign(dirX * toMeY - dirY * toMeX) || (this.id % 2 === 0 ? 1 : -1);
                const panic = (1 - dist / this.projectileSenseRadius) * (0.7 + closing * 0.7);
                dodgeX += -dirY * side * panic * 320 - dirX * panic * 120;
                dodgeY += dirX * side * panic * 320 - dirY * panic * 120;
              }
            }
          }

          if (body.kind === "coin" && distSq <= coinSenseRadiusSq) {
            if (!dist) dist = Math.sqrt(distSq);
            const relSpeed = Math.hypot(body.vx - this.vx, body.vy - this.vy);
            const baseScore = dist + relSpeed * 0.12 - Math.max(1, body.value ?? 1) * 16;
            if (baseScore < bestCoinScore) {
              bestCoinScore = baseScore;
              bestCoin = body;
            }
            const tarantulaScore = dist + relSpeed * 0.08 - Math.max(1, body.value ?? 1) * 14;
            if (tarantulaScore < bestTarantulaCoinScore) {
              bestTarantulaCoinScore = tarantulaScore;
              bestTarantulaCoin = body;
            }
          }

          if (body.kind === "scrap" && distSq <= scrapSenseRadiusSq) {
            if (!dist) dist = Math.sqrt(distSq);
            const relSpeed = Math.hypot(body.vx - this.vx, body.vy - this.vy);
            const hp = Math.max(1, body.hp ?? 1);
            const collectScore = dist + relSpeed * 0.08 + hp * 6;
            if (collectScore < bestScrapCollectScore) {
              bestScrapCollectScore = collectScore;
              bestScrapCollect = body;
            }
            const breakScore = dist + relSpeed * 0.08 + hp * 18;
            if (breakScore < bestScrapBreakScore) {
              bestScrapBreakScore = breakScore;
              bestScrapBreak = body;
            }
            const tarantulaScore = dist + relSpeed * 0.06 + hp * 5;
            if (tarantulaScore < bestTarantulaScrapScore) {
              bestTarantulaScrapScore = tarantulaScore;
              bestTarantulaScrap = body;
            }
          }

          if (body.kind === "tarantula" && body !== this && distSq <= nearestTarantulaLimitSq) {
            if (!dist) dist = Math.sqrt(distSq);
            if (dist < nearestTarantulaDistance) {
              nearestTarantulaDistance = dist;
              nearestTarantula = body;
            }
          }

          if (distSq <= enemySenseRadiusSq && isShipLike(body) && body.isAlive && this.getDispositionTo(body.faction) === "enemy") {
            if (!dist) dist = Math.sqrt(distSq);
            const relativeSpeed = Math.hypot(body.vx - this.vx, body.vy - this.vy);
            const pulgaBias = body.faction === "Pulgas" ? -40 : 0;
            const score = dist + relativeSpeed * 0.18 + pulgaBias;
            if (score < bestEnemyScore) {
              bestEnemyScore = score;
              bestEnemy = body;
              bestEnemyDist = dist;
            }
          }
        });

        const avgVX = alignmentVX / squadCount;
        const avgVY = alignmentVY / squadCount;
        const squadCenterX = centerX / squadCount;
        const squadCenterY = centerY / squadCount;
        const toCenterX = squadCenterX - this.x;
        const toCenterY = squadCenterY - this.y;
        const centerDist = Math.hypot(toCenterX, toCenterY);
        const compactness = squadCount <= 1 ? 0 : clamp(1 - centerDist / Math.max(1, this.squadSenseRadius), 0, 1);

        const snapshot = {
          frameId,
          refreshUntilTick: frameId + this.perceptionRefreshTicks,
          bodies: this._nearbyQueryCache?.bodies ?? [],
          squad: {
            x: separationX * this.squadSeparationWeight + (avgVX - this.vx) * this.squadAlignmentWeight + toCenterX * this.squadCohesionWeight,
            y: separationY * this.squadSeparationWeight + (avgVY - this.vy) * this.squadAlignmentWeight + toCenterY * this.squadCohesionWeight,
            avgVX,
            avgVY,
            centerX: squadCenterX,
            centerY: squadCenterY,
            count: squadCount,
            compactness
          },
          hazard: { x: avoidX, y: avoidY, extraAccel },
          dodge: { x: dodgeX, y: dodgeY },
          bestEnemy,
          bestEnemyDistance: bestEnemy ? bestEnemyDist : Infinity,
          bestCoin,
          bestScrapCollect,
          bestScrapBreak,
          bestTarantulaCoin,
          bestTarantulaScrap,
          nearestTarantula,
          nearestTarantulaDistance
        };
        this._factionPerceptionCache = snapshot;
        return snapshot;
      }

      // Devuelve disposition to calculado a partir del estado y los parametros recibidos.
      getDispositionTo(factionName) {
        if (!factionSystem || !factionName) return "neutral";
        return factionSystem.getDisposition(this.faction, factionName);
      }

      // Devuelve el umbral de impacto speed el umbral calculado a partir del estado y los parametros recibidos.
      getCrashSpeedThreshold(baseCrashSpeed) {
        return Math.max(baseCrashSpeed, this.hullClass === "large" ? 260 : 200);
      }

      // Selecciona el objetivo de monedas el objetivo dentro de esta parte de la logica.
      chooseCoinTarget() {
        if (!(this.coinSenseRadius > 0)) {
          return null;
        }
        return this.getPerceptionSnapshot().bestCoin;
      }

      // Selecciona el objetivo de chatarra el objetivo dentro de esta parte de la logica.
      chooseScrapTarget(mode = "collect") {
        if (!(this.scrapSenseRadius > 0)) {
          return null;
        }
        const snapshot = this.getPerceptionSnapshot();
        return mode === "break" ? snapshot.bestScrapBreak : snapshot.bestScrapCollect;
      }

      // Selecciona el objetivo enemigo el objetivo dentro de esta parte de la logica.
      chooseEnemyTarget() {
        const snapshot = this.getPerceptionSnapshot();
        const bestTarget = snapshot.bestEnemy;
        this.combatTarget = bestTarget;
        this.combatDistance = snapshot.bestEnemyDistance;
        return bestTarget;
      }

      // Actualiza el combate la punteria usando el estado actual y los parametros recibidos.
      updateCombatAim(target) {
        if (!target || target.isRemoved || (isShipLike(target) && !target.isAlive)) {
          this.combatTarget = null;
          this.combatDistance = Infinity;
          this.combatAimAngleRate = 0;
          return this.angle;
        }

        const aim = computeAdaptiveCombatAim(this, target, 1.85);
        this.combatTarget = target;
        this.combatDistance = aim.dist;
        this.combatAimAngle = aim.angle;
        this.combatAimAngleRate = aim.angleRate;
        return this.combatAimAngle;
      }

      // Calcula el estado de escuadron state a partir del estado y los parametros disponibles.
      computeSquadState() {
        return this.getPerceptionSnapshot().squad;
      }

      // Calcula la evasion de riesgos la evasion a partir del estado y los parametros disponibles.
      computeHazardAvoidance() {
        return this.getPerceptionSnapshot().hazard;
      }

      // Calcula la evasion de proyectiles la esquiva a partir del estado y los parametros disponibles.
      computeProjectileDodge(multiplier = 1) {
        const dodge = this.getPerceptionSnapshot().dodge;
        if (multiplier === 1) {
          return dodge;
        }
        return { x: dodge.x * multiplier, y: dodge.y * multiplier };
      }

      // Indica si la escolta el jugador cumple la condicion esperada para esta logica.
      shouldEscortPlayer() {
        if (!this.aiPlayer || !this.aiPlayer.isAlive) return false;
        if (this.getDispositionTo(this.aiPlayer.faction) !== "ally") return false;
        if (distanceSquared(this.x, this.y, this.aiPlayer.x, this.aiPlayer.y) > this.escortRadius * this.escortRadius) return false;
        return Math.hypot(this.aiPlayer.vx, this.aiPlayer.vy) <= this.escortBreakSpeed;
      }

      // Calcula la escolta el vector a partir del estado y los parametros disponibles.
      computeEscortVector() {
        const target = this.aiPlayer;
        const speed = Math.hypot(target.vx, target.vy);
        const heading = speed > 12 ? Math.atan2(target.vy, target.vx) : target.angle;
        const sideOffset = (0.65 + this.formationLane * 0.12) * this.orbitDirection * 110;
        const backOffset = this.escortDistance + Math.abs(this.formationLane) * 18;
        const desiredX = target.x - Math.cos(heading) * backOffset + Math.cos(heading + Math.PI * 0.5) * sideOffset;
        const desiredY = target.y - Math.sin(heading) * backOffset + Math.sin(heading + Math.PI * 0.5) * sideOffset;
        return {
          desiredVX: target.vx + (desiredX - this.x) * 1.45,
          desiredVY: target.vy + (desiredY - this.y) * 1.45,
          desiredAngle: Math.atan2(target.y - this.y, target.x - this.x),
          effectiveMaxSpeed: Math.max(this.maxCruiseSpeed, speed + 40)
        };
      }

      // Actualiza la punteria la rotacion de apuntado usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      updateAimRotation(dt, targetAngle, targetAngleRate = 0, gain = 4.2) {
        const angleError = wrapAngle(targetAngle - this.angle);
        const feedForwardRate = clamp(targetAngleRate, -this.maxAimAngularSpeed * 0.96, this.maxAimAngularSpeed * 0.96);
        const desiredAngularVelocity = clamp(feedForwardRate + angleError * gain, -this.maxAimAngularSpeed, this.maxAimAngularSpeed);
        const angularVelocityError = desiredAngularVelocity - this.angularVelocity;
        const angularStep = clamp(angularVelocityError * 5.4, -this.angularAccel, this.angularAccel);
        this.angularVelocity += angularStep * dt;

        const ratePressure = clamp(Math.abs(feedForwardRate) / Math.max(0.001, this.maxAimAngularSpeed), 0, 1);
        const closeBrake = Math.max(0, 0.24 - Math.abs(angleError));
        const dampingStrength = 2.2 + (1 - ratePressure) * 1.2 + closeBrake * (3.6 - 2.2 * ratePressure);
        this.angularVelocity *= 1 / (1 + dt * dampingStrength);
      }
    }

      // Actualiza el piloto automatico usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      updateAutopilot(dt) {
        if (!this.aiWorld) return;

        const squad = this.computeSquadState();
        const avoid = this.computeHazardAvoidance();
        const dodge = this.computeProjectileDodge(0.5);
        const enemy = this.chooseEnemyTarget();
        const coinTarget = enemy ? null : this.chooseCoinTarget();
        const scrapTarget = enemy || coinTarget ? null : this.chooseScrapTarget("break");
        let desiredVX = this.vx;
        let desiredVY = this.vy;
        let desiredAngle = this.angle;
        let desiredAngleRate = 0;

        if (enemy) {
          const dx = enemy.x - this.x;
          const dy = enemy.y - this.y;
          const dist = Math.max(0.001, Math.hypot(dx, dy));
          const nx = dx / dist;
          const ny = dy / dist;
          const tx = -ny * this.orbitDirection;
          const ty = nx * this.orbitDirection;
          const standoff = enemy.radius + (this.hullClass === "large" ? 210 : 170) + Math.abs(this.formationLane) * 9;
          const approach = clamp((dist - standoff) * 1.18, -135, 150);

          desiredVX = enemy.vx + nx * approach + tx * tangent + squadBiasX;
          desiredVY = enemy.vy + ny * approach + ty * tangent + squadBiasY;
          desiredAngle = this.updateCombatAim(enemy);
          desiredAngleRate = this.combatAimAngleRate ?? 0;

        } else if (this.shouldEscortPlayer()) {

          desiredVX = escort.desiredVX;
          desiredVY = escort.desiredVY;
          desiredAngle = escort.desiredAngle;
          effectiveMaxSpeed = escort.effectiveMaxSpeed;
          this.combatTarget = null;
          this.combatDistance = Infinity;
          this.combatAimAngleRate = 0;

          const dx = coinTarget.x - this.x;
          const dy = coinTarget.y - this.y;
          const dist = Math.max(0.001, Math.hypot(dx, dy));
          const pull = clamp(dist * 1.75, 90, 240);
          desiredVX = coinTarget.vx + squad.avgVX * 0.25 + (dx / dist) * pull + (squad.centerX - this.x) * 0.42;
          desiredVY = coinTarget.vy + squad.avgVY * 0.25 + (dy / dist) * pull + (squad.centerY - this.y) * 0.42;
          desiredAngle = Math.atan2(dy, dx);
          effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, 210, Math.hypot(coinTarget.vx, coinTarget.vy) + 120);
          this.combatTarget = null;
          this.combatDistance = Infinity;
          this.combatAimAngleRate = 0;
        } else if (scrapTarget) {
          const dx = scrapTarget.x - this.x;
          const dy = scrapTarget.y - this.y;
          const dist = Math.max(0.001, Math.hypot(dx, dy));
          const nx = dx / dist;
          const ny = dy / dist;
          const tx = -ny * this.orbitDirection;
          const ty = nx * this.orbitDirection;
          const standoff = scrapTarget.radius + 155 + Math.abs(this.formationLane) * 7;
          const approach = clamp((dist - standoff) * 0.95, -120, 130);
          const squadBiasX = (squad.centerX - this.x) * 0.82 + (squad.avgVX - this.vx) * 0.28;
          const squadBiasY = (squad.centerY - this.y) * 0.82 + (squad.avgVY - this.vy) * 0.28;
          desiredVX = scrapTarget.vx + nx * approach + tx * 34 + squadBiasX;
          desiredVY = scrapTarget.vy + ny * approach + ty * 34 + squadBiasY;
          desiredAngle = this.updateCombatAim(scrapTarget);
          desiredAngleRate = this.combatAimAngleRate ?? 0;
          effectiveMaxSpeed = Math.max(this.maxCruiseSpeed, 220);
        } else {
          if (Math.random() < dt * 0.35) {
            this.wanderAngle += randomBetween(-0.35, 0.35);
          }
          desiredVX = squad.avgVX * 0.55 + Math.cos(this.wanderAngle) * this.squadCruiseSpeed + (squad.centerX - this.x) * 0.9;
          desiredVY = squad.avgVY * 0.55 + Math.sin(this.wanderAngle) * this.squadCruiseSpeed + (squad.centerY - this.y) * 0.9;
          desiredAngle = Math.atan2(desiredVY, desiredVX);
          this.combatTarget = null;
          this.combatDistance = Infinity;
          this.combatAimAngleRate = 0;
        }

        desiredVX += squad.x * 0.45 + avoid.x + dodge.x;
        desiredVY += squad.y * 0.45 + avoid.y + dodge.y;
        effectiveMaxSpeed = Math.max(effectiveMaxSpeed, Math.hypot(this.vx, this.vy));
        this.updateAimRotation(dt, desiredAngle, desiredAngleRate, this.hullClass === "large" ? 4.2 : 4.8);

        const faceX = Math.cos(this.angle);
        const faceY = Math.sin(this.angle);
        const desiredDeltaVX = desiredVX - this.vx;
        const desiredDeltaVY = desiredVY - this.vy;
        const forwardIntent = desiredDeltaVX * faceX + desiredDeltaVY * faceY;

        if (forwardIntent > 4) {
          const thrust = clamp(forwardIntent * 2.9, 0, this.thrustPower + avoid.extraAccel * 0.15);
          this.applyThrustAcceleration(faceX * thrust, faceY * thrust, dt, { intensityScale: 1.05, countRate: 15, angleVariance: 0.24, speed: 46, speedVariance: 18, spawnRadiusScale: 0.92, colorVariance: 16 });
        }

        const currentSpeed = Math.hypot(this.vx, this.vy);
        const desiredForwardSpeed = desiredVX * faceX + desiredVY * faceY;
        const currentForwardSpeed = this.vx * faceX + this.vy * faceY;
        const needsBrake = desiredForwardSpeed < currentForwardSpeed - 14 || Math.abs(wrapAngle(desiredAngle - this.angle)) > 1.1 || currentSpeed > effectiveMaxSpeed + 16;

        if (needsBrake && currentSpeed > 0.001) {
          const brakeStep = Math.min(this.getBrakePower() * dt, currentSpeed);
          this.vx -= (this.vx / currentSpeed) * brakeStep;
          this.vy -= (this.vy / currentSpeed) * brakeStep;
        }

        const velocity = clampVectorMagnitude(this.vx, this.vy, effectiveMaxSpeed);
        this.vx = velocity.x;
        this.vy = velocity.y;
      }

      // Actualiza el estado interno usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      update(dt) {
        this.updateAutopilot(dt);
        super.update(dt);
      }

      // Dibuja el estado interno en el contexto de render correspondiente.
      draw(ctx, camera) {
        const sx = this.x - camera.x;
        const sy = this.y - camera.y;

        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(this.angle);
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(this.radius * 1.15, 0);
        ctx.lineTo(-this.radius * 0.72, -this.radius * 0.62);
        ctx.lineTo(-this.radius * 0.3, 0);
        ctx.lineTo(-this.radius * 0.72, this.radius * 0.62);
        ctx.closePath();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-this.radius * 0.05, -this.radius * 0.74);
        ctx.lineTo(this.radius * 0.18, -this.radius * 0.08);
        ctx.moveTo(-this.radius * 0.05, this.radius * 0.74);
        ctx.lineTo(this.radius * 0.18, this.radius * 0.08);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-this.radius * 0.62, -this.radius * 0.28);
        ctx.lineTo(-this.radius * 0.18, -this.radius * 0.12);
        ctx.moveTo(-this.radius * 0.62, this.radius * 0.28);
        ctx.lineTo(-this.radius * 0.18, this.radius * 0.12);
        ctx.stroke();

        ctx.restore();
      }
    }

          const angularStep = clamp(angularVelocityError * 5.5, -this.angularAccel, this.angularAccel);
          this.angularVelocity += angularStep * dt;

          const smartDamping = 1 / (1 + dt * (2.6 + 6.5 * Math.max(0, 0.22 - Math.abs(angleError))));
          this.angularVelocity *= smartDamping;
        }

        if (mouse.right) {
          const thrustDt = this.consumeFuel(dt, this.fuelBurnRate);

          if (thrustDt > 0) {
            const ax = Math.cos(this.angle) * this.thrustPower;
            const ay = Math.sin(this.angle) * this.thrustPower;
            this.applyThrustAcceleration(ax, ay, thrustDt, { intensityScale: 1.1, countRate: 16, angleVariance: 0.22, speed: 68, speedVariance: 18, spawnRadiusScale: 0.96, color: '#8fe5ff', colorVariance: 18 });

          const matchBody = mouse.brakeLockTarget && !mouse.brakeLockTarget.isRemoved ? mouse.brakeLockTarget : null;
          const targetVX = matchBody ? matchBody.vx : 0;
          const targetVY = matchBody ? matchBody.vy : 0;
          const relVX = this.vx - targetVX;
          const relVY = this.vy - targetVY;
          const relSpeed = Math.hypot(relVX, relVY);

          if (relSpeed > 0) {
            const brakeDt = this.consumeFuel(dt, this.fuelBurnRate * 0.9);
            const brakeStep = this.getBrakePower() * brakeDt;

            if (brakeStep >= relSpeed) {
              this.vx = targetVX;
              this.vy = targetVY;
            } else if (brakeStep > 0) {
              this.vx -= (relVX / relSpeed) * brakeStep;
              this.vy -= (relVY / relSpeed) * brakeStep;
            }
          }

        }

        super.update(dt);
      }

          ctx.strokeStyle = `rgba(255,255,255,${glowAlpha})`;
          ctx.lineWidth = 5 + this.absorptionGlow * 4;
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, this.radius * 0.7, 0.2, Math.PI * 1.7);
        ctx.strokeStyle = "rgba(255,255,255,0.4)";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        if (this.absorptionGlow > 0.001) {
          const arcRadius = this.radius * (0.82 + this.absorptionGlow * 0.06);
          const arcSpan = Math.PI * (0.22 + this.absorptionGlow * 0.08);
          const baseAngle = performance.now() * 0.0013 + this.id * 0.37;

          ctx.beginPath();
          ctx.arc(0, 0, arcRadius, baseAngle, baseAngle + arcSpan);
          ctx.strokeStyle = "rgba(255,255,255,0.28)";
          ctx.lineWidth = 2.2;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(0, 0, arcRadius * 0.92, baseAngle + Math.PI * 0.9, baseAngle + Math.PI * 0.9 + arcSpan * 0.82);
          ctx.strokeStyle = "rgba(255,255,255,0.18)";
          ctx.lineWidth = 1.6;
          ctx.stroke();
        }

        ctx.restore();
      }

    class ProjectileBody extends PhysicalBody {
      // Inicializa la instancia de ProjectileBody con las opciones y el estado base necesarios.
      constructor(options = {}) {
        super({

        this.faction = options.faction ?? null;

        this.age = options.age ?? 0;
        this.factionTimeout = options.factionTimeout ?? 6;
        this.maxLifetime = options.maxLifetime ?? 10;
        this.maxTravelDistance = options.maxTravelDistance ?? 5000;
        this.maxTravelDistanceSq = this.maxTravelDistance * this.maxTravelDistance;
        this.originX = options.originX ?? this.x;
        this.originY = options.originY ?? this.y;
        this.hasImpacted = !!options.hasImpacted;
        this.shouldDespawn = false;
        this.trailAccumulator = options.trailAccumulator ?? 0;
        this.trailRate = options.trailRate ?? computeProjectileTrailRate(this.damage);
        this.trailLifetimeMin = options.trailLifetimeMin ?? computeProjectileTrailLifetimeMin(this.damage);
        this.trailLifetimeMax = options.trailLifetimeMax ?? computeProjectileTrailLifetimeMax(this.damage);
        this.trailRadiusMin = options.trailRadiusMin ?? computeProjectileTrailRadiusMin(this.damage);
        this.trailRadiusMax = options.trailRadiusMax ?? computeProjectileTrailRadiusMax(this.damage);
        this.emitterVX = options.emitterVX ?? options.owner?.vx ?? 0;
        this.emitterVY = options.emitterVY ?? options.owner?.vy ?? 0;
      }

      // Devuelve el vector visual del proyectil relativo a la velocidad del tirador al momento de disparar.
      getVisualMotionVector() {
        const visualVX = this.vx - (this.emitterVX ?? 0);
        const visualVY = this.vy - (this.emitterVY ?? 0);
        const visualSpeed = Math.hypot(visualVX, visualVY);

        if (visualSpeed > 1e-3) {
          return {
            vx: visualVX,
            vy: visualVY,
            speed: visualSpeed,
            dirX: visualVX / visualSpeed,
            dirY: visualVY / visualSpeed
          };
        }

        const absoluteSpeed = Math.hypot(this.vx, this.vy);
        if (absoluteSpeed > 1e-3) {
          return {
            vx: this.vx,
            vy: this.vy,
            speed: absoluteSpeed,
            dirX: this.vx / absoluteSpeed,
            dirY: this.vy / absoluteSpeed
          };
        }

        return {
          vx: 0,
          vy: 0,
          speed: 0,
          dirX: Math.cos(this.angle),
          dirY: Math.sin(this.angle)
        };
      }

      // Emite una estela de particulas proporcional al dano del proyectil.
      emitTrail(dt) {
        if (!(dt > 0) || typeof world === "undefined" || !world?.particles) {
          return;
        }

        const rate = Math.max(0, this.trailRate ?? computeProjectileTrailRate(this.damage));
        if (!(rate > 0)) {
          return;
        }

        const visualMotion = this.getVisualMotionVector();
        if (!(visualMotion.speed > 1e-3)) {
          return;
        }

        const normalizedDamage = clamp(Number.isFinite(this.damage) ? this.damage : 1, 1, 6);
        const dirX = visualMotion.dirX;
        const dirY = visualMotion.dirY;
        const perpX = -dirY;
        const perpY = dirX;
        const baseRadius = this.radius ?? 3;
        this.trailAccumulator = (this.trailAccumulator ?? 0) + dt * rate;
        const maxPerFrame = Math.max(1, Math.ceil(normalizedDamage));
        const emissionCount = Math.min(Math.floor(this.trailAccumulator), maxPerFrame);

        if (emissionCount < 1) {
          return;
        }

        this.trailAccumulator -= emissionCount;

        for (let emitted = 0; emitted < emissionCount; emitted++) {
          const anchorX = this.x;
          const anchorY = this.y;
          const backOffset = randomBetween(baseRadius * 0.9, baseRadius * 1.9);
          const lateralOffset = randomBetween(-baseRadius * 0.35, baseRadius * 0.35);
          const dragSpeed = randomBetween(18, 32 + normalizedDamage * 10);
          const driftSpeed = randomBetween(-10 - normalizedDamage * 2, 10 + normalizedDamage * 2);
          const emitterVX = this.emitterVX ?? 0;
          const emitterVY = this.emitterVY ?? 0;
          const retainedRelativeFactor = randomBetween(0.06, 0.18);
          world.particles.spawnParticle({
            x: anchorX - dirX * backOffset + perpX * lateralOffset,
            y: anchorY - dirY * backOffset + perpY * lateralOffset,
            vx: emitterVX + visualMotion.vx * retainedRelativeFactor - dirX * dragSpeed + perpX * driftSpeed,
            vy: emitterVY + visualMotion.vy * retainedRelativeFactor - dirY * dragSpeed + perpY * driftSpeed,
            radius: randomBetween(this.trailRadiusMin ?? computeProjectileTrailRadiusMin(normalizedDamage), this.trailRadiusMax ?? computeProjectileTrailRadiusMax(normalizedDamage)),
            lifetime: randomBetween(this.trailLifetimeMin ?? computeProjectileTrailLifetimeMin(normalizedDamage), this.trailLifetimeMax ?? computeProjectileTrailLifetimeMax(normalizedDamage)),
            color: this.color,
            ignoreBodyId: this.owner?.id ?? 0,
            ignoreDuration: 0.08,
            skipIntegrationFrames: 1
          });
        }
      }

      // Actualiza el estado interno usando el estado actual y los parametros recibidos. Usa dt como delta de tiempo del frame.
      update(dt) {
        this.age += dt;
        if (this.faction !== null && this.age >= this.factionTimeout) {
          this.faction = null;
        }
        super.update(dt);
        this.shouldDespawn = this.age >= this.maxLifetime || distanceSquared(this.x, this.y, this.originX, this.originY) >= this.maxTravelDistanceSq;
        if (!this.shouldDespawn) {
          this.emitTrail(dt);
        }
      }

      // Dibuja el estado interno en el contexto de render correspondiente.
      draw(ctx, camera) {
        const sx = this.x - camera.x;
        const sy = this.y - camera.y;
        const visualMotion = this.getVisualMotionVector();

        let dirX = visualMotion.dirX;
        let dirY = visualMotion.dirY;

        ctx.save();
        ctx.translate(sx, sy);

        ctx.beginPath();
        ctx.moveTo(-dirX * this.radius * 2.8, -dirY * this.radius * 2.8);
        ctx.lineTo(dirX * this.radius * 1.2, dirY * this.radius * 1.2);
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();

        ctx.restore();
      }
    }

    class StationShip extends Ship {

      // Gestiona on removed dentro del flujo principal del juego.
      onRemoved() {

      // Libera el planeta anfitrion el planeta dentro de esta parte de la logica.
      releaseHostPlanet() {
        if (this.hostPlanet) {
          const reservationKey = StationShip.getPlanetReservationKey(this.hostPlanet);
          if (reservationKey != null && StationShip.reservedHostPlanets.get(reservationKey) === this.id) {

            if (reservationKey != null) {

          return planet;

        if (!planet || planet.isRemoved) {

        }

        const reservationKey = StationShip.getPlanetReservationKey(planet);
        const ownerId = reservationKey != null
          ? StationShip.reservedHostPlanets.get(reservationKey)
          : null;

        if (ownerId != null && ownerId !== this.id) {
          return this.hostPlanet;

        this.releaseHostPlanet();
        if (reservationKey != null) {
          StationShip.reservedHostPlanets.set(reservationKey, this.id);

      // Consume el combustible dentro de esta parte de la logica. Usa dt como delta de tiempo del frame.
      consumeFuel(dt, rate = this.fuelBurnRate) {

      getCrashSpeedThreshold(baseCrashSpeed) {

      setAIContext(world, player) {

      // Devuelve el planeta la separacion respecto a la superficie stand off max calculado a partir del estado y los parametros recibidos.
      getPlanetSurfaceStandOffMax() {
